      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
        border-top:1px solid var(--line);padding-top:12px">
        <label style="display:flex;gap:8px;align-items:center;font-size:12.5px">
          <input type="checkbox" id="rc_deduct" ${r.deducted?'disabled checked':'checked'}> ตัดสต๊อกอัตโนมัติเมื่อบันทึก</label>
        <span style="font-size:12px;color:var(--ink-3)">
          ${isInvoice(r) ? 'เอกสารนี้ตั้งเป็นลูกหนี้ทั้งจำนวน เมื่อรับเงินให้ออกใบเสร็จรับเงินอ้างอิงเลขที่นี้'
            : r.pay.credit ? 'ติ๊กเครดิตไว้ ระบบจะตั้งเป็นลูกหนี้ให้ ตัดชำระได้ที่เมนูบัญชี/การเงิน'
                           : 'ไม่ได้ติ๊กเครดิต ระบบจะถือว่ารับเงินครบแล้วเมื่อบันทึก'}</span>
      </div>
    </div>`;

  /* ปุ่มทำงานทั้งหมดอยู่แถบซ้ายมือ เรียงตามลำดับการใช้งานจริง */
  /* ใบส่งมอบไม่ใช้กล่องรับชำระของใบเสร็จ — ถอดออกจาก DOM ไม่ให้ id ซ้ำ */
  if(isInvoice(r)){
    const host = $('#'+salesHost);
    if(host) host.querySelectorAll('.fs-hidden-pay').forEach(el=>el.remove());
  }

  mountActions(salesSide, salesHost, `
      <button class="btn primary" id="rcAddPart">+ ดึงอะไหล่จากสต๊อก</button>
      <button class="btn" id="rcAddLabor">+ ค่าบริการ</button>
      <button class="btn" id="rcAddFree">+ รายการอื่น ๆ</button>
      <button class="btn primary" id="rcSave" style="margin-top:6px">บันทึก${K.short.replace(' (ไม่มี VAT)','').replace(' + ใบกำกับภาษี','')}</button>
      <button class="btn" id="rcPrint">พิมพ์${K.title.split(' / ')[0]}</button>
      <button class="btn danger" id="rcClose">ปิดเอกสาร</button>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;text-align:center">
        ${inDb ? 'เอกสารนี้บันทึกแล้ว<br>แก้ไขได้และกดบันทึกซ้ำ' : 'ยังไม่ได้บันทึก'}
      </div>`);

  const sync = ()=>{
    r.date = $('#rc_date').value || today();
    r.quoteNo = $('#rc_ref').value.trim();
    r.name = $('#rc_name').value.trim();
    r.custType = $('#rc_ctype').value;
    r.addrText = $('#rc_addr').value.trim();
    r.taxId = $('#rc_taxId').value.trim();
    r.tel = $('#rc_tel').value.trim();
    r.email = $('#rc_email').value.trim();
    r.veh = r.veh || {};
    r.veh.freeText = $('#rc_veh').value.trim();
    const pl = $('#rc_plate').value.trim().split(/\s+/);
    r.veh.plateA = pl[0]||''; r.veh.plateB = pl.slice(1).join(' ');
    r.veh.mileage = $('#rc_mile').value.trim();
    if($('#rc_engine'))  r.veh.engineNo  = $('#rc_engine').value.trim();
    if($('#rc_chassis')) r.veh.chassisNo = $('#rc_chassis').value.trim();
    /* ใบส่งมอบไม่มีกล่องรับชำระ — ข้ามการเก็บค่าส่วนนี้ */
    if($('#p_cash')){
      r.pay.cashAmt     = $('#p_cash').checked     ? num($('#p_cashAmt').value)     : 0;
      r.pay.transferAmt = $('#p_transfer').checked ? num($('#p_transferAmt').value) : 0;
      r.pay.cardAmt     = $('#p_card') && $('#p_card').checked ? num($('#p_cardAmt').value) : 0;
      r.pay.days = num($('#p_days').value);
      r.pay.ref  = $('#p_ref').value.trim();
      if($('#p_cardRef')) r.pay.cardRef = $('#p_cardRef').value.trim();
    }
    const a = payAtIssue(r);
    r.pay.cash = a.cash > 0.004; r.pay.transfer = a.transfer > 0.004;
    r.pay.credit = a.remain > 0.004; r.pay.due = dueDate(r);
    if($('#rc_disc')) r.discount = num($('#rc_disc').value);
    if($('#rc_vat'))  r.vatMode  = $('#rc_vat').value;
    enforceVat(r);
    if($('#rc_wht'))  r.whtRate  = num($('#rc_wht').value);
    if($('#rc_by'))   r.receivedBy = $('#rc_by').value.trim();
    if($('#rc_warranty')) r.warranty = $('#rc_warranty').value;
    if($('#rc_credit'))   r.creditDays = num($('#rc_credit').value);
  };

  $$('[data-ri]').forEach(el=>{
    el.oninput = ()=>{ const it = r.items[+el.dataset.ri];
      it[el.dataset.k] = el.dataset.k==='name' ? el.value : num(el.value); };
    el.onchange = ()=>{ sync(); renderRecForm(); };
  });
  $$('[data-svc]').forEach(cb=>cb.onchange=()=>{
    sync(); r.items[+cb.dataset.svc].svc = cb.checked; renderRecForm();
  });
  $$('[data-rrm]').forEach(b=>b.onclick=()=>{ sync(); r.items.splice(+b.dataset.rrm,1); renderRecForm(); });
  ['rc_date','rc_ref','rc_name','rc_ctype','rc_addr','rc_taxId','rc_tel','rc_email','rc_veh','rc_plate','rc_mile',
   'rc_engine','rc_chassis','p_cardRef','p_days','p_ref','rc_disc','rc_vat','rc_wht','rc_by',
   'rc_warranty','rc_credit'].forEach(id=>{
    const el = $('#'+id); if(el) el.addEventListener('change', ()=>{ sync(); renderRecForm(); });
  });

  /* ติ๊กช่องทาง = เติมยอดคงเหลือให้ทันที · เอาติ๊กออก = ล้างยอดของช่องทางนั้น */
  /* ---------- รับชำระหลายช่องทางในใบเดียว ----------
     ช่องที่ผู้ใช้พิมพ์ล่าสุดถือเป็นหลัก ระบบลดยอดช่องทางอื่นให้พอดียอดสุทธิ */
  const PAY_FIELDS = [['p_cash','p_cashAmt'], ['p_transfer','p_transferAmt'], ['p_card','p_cardAmt']];
  const amtIds = PAY_FIELDS.map(x=>x[1]).filter(id=>$('#'+id));
  const readAmt = id => $('#'+id) ? num($('#'+id).value) : 0;
  const otherPaid = skip => amtIds.filter(x=>x!==skip).reduce((s,x)=>s+readAmt(x), 0);

  /* ทำให้ยอดรวมไม่เกินยอดสุทธิ โดยไม่แตะช่องที่กำลังแก้ */
  const balance = (keepId)=>{
    const total = recTotals(r).payable;
    const val = {}; amtIds.forEach(id=>val[id] = readAmt(id));
    let over = Math.round((amtIds.reduce((s,id)=>s+val[id],0) - total)*100)/100;
    if(over <= 0.004) return;
    /* ลดจากช่องทางอื่นก่อน เริ่มจากช่องล่างสุดขึ้นมา */
    for(const id of amtIds.slice().reverse()){
      if(id === keepId || over <= 0.004) continue;
      const cut = Math.min(val[id], over);
      val[id] = Math.round((val[id]-cut)*100)/100;
      over = Math.round((over-cut)*100)/100;
    }
    /* ถ้ายังเกิน แปลว่าช่องที่แก้เองมากกว่ายอดสุทธิ */
    if(over > 0.004 && keepId) val[keepId] = Math.max(0, Math.round((val[keepId]-over)*100)/100);
    amtIds.forEach(id=>{
      $('#'+id).value = val[id] ? val[id] : '';
      const cb = PAY_FIELDS.find(f=>f[1]===id)[0];
      if($('#'+cb)) $('#'+cb).checked = val[id] > 0.004;
    });
  };

  PAY_FIELDS.forEach(([cb, amt])=>{
    if(!$('#'+cb)) return;
    $('#'+cb).onchange = e=>{
      if(!e.target.checked){ $('#'+amt).value = ''; sync(); renderRecForm(); return; }
      const total = recTotals(r).payable;
      const left = Math.max(0, Math.round((total - otherPaid(amt))*100)/100);
      $('#'+amt).value = left ? left : '';
      if(!left){
        /* ยอดถูกช่องทางอื่นรับไปหมดแล้ว — ให้ผู้ใช้พิมพ์ยอดของช่องนี้ ระบบจะหักช่องอื่นให้เอง */
        toast('กรอกยอดที่รับทางช่องทางนี้ ระบบจะหักออกจากช่องทางอื่นให้อัตโนมัติ');
        $('#'+amt).focus();
        sync(); return;
      }
      sync(); renderRecForm();
    };
    if($('#'+amt)) $('#'+amt).onchange = ()=>{ balance(amt); sync(); renderRecForm(); };
  });

  $('#rcAddPart').onclick = ()=>{ sync(); pickRecPartModal(); };
  $('#rcAddLabor').onclick = ()=>{ sync();
    r.items.push({pid:null, code:'LAB', oem:'', name:'ค่าบริการ', unit:'รายการ', qty:1, price:0, svc:true});
    renderRecForm();
    const last = $$('[data-ri][data-k="price"]').slice(-1)[0]; if(last){ last.focus(); last.select(); }
    toast('เพิ่มบรรทัดค่าบริการแล้ว — กรอกจำนวนเงิน'); };
  $('#rcAddFree').onclick = ()=>{ sync();
    r.items.push({pid:null, code:'-', oem:'', name:'', unit:'รายการ', qty:1, price:0}); renderRecForm(); };

  $('#rcSave').onclick = ()=>{
    if(!requireLicense()) return;
    sync();
    if(!r.name) return toast('กรอกชื่อลูกค้าก่อนบันทึก');
    if(!r.items.length) return toast('เพิ่มรายการอย่างน้อยหนึ่งรายการ');
    const deduct = $('#rc_deduct').checked && !r.deducted;
    if(deduct){
      r.items.forEach(it=>{ if(it.pid){ const p=DB.products.find(x=>x.id===it.pid);
        if(p){ p.qty = Math.max(0, num(p.qty)-num(it.qty)); p.lastMove = r.date; } } });
      r.deducted = true;
    }
    /* บันทึกยอดที่รับจริงหน้าร้าน ส่วนที่เหลือตั้งเป็นลูกหนี้ */
    const tt = recTotals(r);
    const laterPaid = (r.payments||[]).filter(x=>!x.atIssue).reduce((s,x)=>s+num(x.amount), 0);
    const A2 = payAtIssue(r);
    if(A2.paid + laterPaid > tt.payable + 0.004)
      return toast(`ยอดที่รับรวมกัน ${money(A2.paid + laterPaid)} เกินยอดสุทธิ ${money(tt.payable)} — ตรวจสอบจำนวนเงินอีกครั้ง`);
    syncIssuePayments(r);
    /* ผูกกับทะเบียนลูกค้าก่อนบันทึก */
    const link = linkSalesCustomer(r);

    const store = salesStore(r);
    const i = store.findIndex(x=>x.id===r.id);
    const copy = JSON.parse(JSON.stringify(r));
    if(i>=0) store[i]=copy; else store.push(copy);
    const q = DB.quotes.find(x=>x.id===r.quoteId); if(q) q.status='billed';

    /* ใบเสร็จที่ออกจากใบส่งมอบ — ปิดยอดลูกหนี้ของใบส่งมอบต้นทาง */
    if(r.invId){
      const inv = DB.invoices.find(x=>x.id===r.invId);
      if(inv){
        inv.receiptId = copy.id; inv.receiptNo = copy.no;
        inv.payments = (inv.payments||[]).filter(p=>p.fromReceipt!==copy.id);
        const paid = paidOf(copy);
        if(paid > 0.004) inv.payments.push({id:uid(), date:copy.date, amount:paid,
          method:(num(copy.pay.transferAmt)>0?'เงินโอน':'เงินสด'),
          ref:'รับชำระตามใบเสร็จ '+copy.no, fromReceipt:copy.id});
      }
    }
    saveDB(); docView='paper'; renderRecForm(); renderStock();
    if(link && link.startsWith('created')) toast('เพิ่ม '+r.name+' เข้าทะเบียนลูกค้าแล้ว '+link.split(':')[1]);
    const A3 = payAtIssue(r);
    toast('บันทึก'+salesKind(r).title.split(' / ')[0]+' '+r.no+' แล้ว' + (deduct?' และตัดสต๊อกเรียบร้อย':'')
      + (A3.remain>0.004 ? ` · รับแล้ว ${money(A3.paid)} คงค้าง ${money(A3.remain)} ตั้งเป็นลูกหนี้` : ' · รับชำระครบถ้วน'));
  };
  $('#rcPrint').onclick = ()=>{ sync(); printReceipt(r); };
  if($('#rcLink')) $('#rcLink').onclick = ()=>{
    sync();
    const res = linkSalesCustomer(r);
    if(res === 'noname') return toast('กรอกชื่อลูกค้าก่อน');
    if(res === 'skipped') return;
    saveDB(); renderRecForm(); renderCustomer();
    toast(res.startsWith('created') ? 'เพิ่มเข้าทะเบียนลูกค้าแล้ว '+res.split(':')[1] : 'ผูกกับทะเบียนลูกค้าแล้ว');
  };
  $('#rcClose').onclick = ()=>{ sync();
    closeDraft(r, ['name','tel','email'], DB.receipts.some(x=>x.id===r.id), ()=>{ curRec=null; }, renderIncome); };
}

function pickRecPartModal(){
  const r = curRec;
  const key = {A:'pA',B:'pB',C:'pC'}[DB.shop.priceTier||'A'];
  const render = (kw='')=>{
    const list = DB.products.filter(p=>{ const q=kw.toLowerCase();
      return !q || [p.code,p.oem,p.name].some(v=>String(v).toLowerCase().includes(q)); });
    return `
      <div class="search" style="margin-bottom:12px"><input class="in" id="rpQ" placeholder="รหัส / OEM / ชื่ออะไหล่" value="${esc(kw)}"></div>
      <div class="tablewrap" style="max-height:52vh;border:1px solid var(--line);border-radius:6px">
        <table class="tbl"><thead><tr><th>รหัสสินค้า</th><th>OEM</th><th>ชื่อสินค้า</th>
          <th class="num">คงเหลือ</th><th class="num">ราคา ${DB.shop.priceTier||'A'}</th><th></th></tr></thead><tbody>
        ${list.length? list.map(p=>`<tr>
          <td>${tagHTML(p)}</td><td class="mono" style="font-size:12px;color:var(--ink-3)">${esc(p.oem||'-')}</td>
          <td>${esc(p.name)}</td><td class="num mono">${num(p.qty)}</td><td class="num mono">${money(p[key])}</td>
          <td style="text-align:right"><button class="btn sm primary" data-radd="${p.id}">เพิ่ม</button></td></tr>`).join('')
          : `<tr><td colspan="6" class="empty">ไม่พบอะไหล่ที่ค้นหา</td></tr>`}
        </tbody></table></div>`;
  };
  const bind = ()=>{
    $('#rpQ').oninput = e=>{ const v=e.target.value; $('#mBody').innerHTML = render(v);
      const el=$('#rpQ'); el.focus(); el.setSelectionRange(v.length,v.length); bind(); };
    $$('[data-radd]').forEach(b=>b.onclick=()=>{
      const p = DB.products.find(x=>x.id===b.dataset.radd);
      const ex = r.items.find(i=>i.pid===p.id);
      if(ex) ex.qty = num(ex.qty)+1;
      else r.items.push({pid:p.id, code:p.code, oem:p.oem, name:p.name, unit:p.unit, qty:1, price:num(p[key])});
      renderRecForm(); toast(`เพิ่ม ${p.code} แล้ว`);
    });
  };
  openModal('ดึงอะไหล่จากสต๊อก', render(''), [{label:'ปิด', cls:'btn primary', act:closeModal}]);
  bind();
}



/* =====================================================================
   หน้า 06 — บัญชี / การเงิน
   ===================================================================== */
let finTab = 'sales';        /* sales · ar · ap · pl */

/* ---- เอกสารขายที่ใช้คิดรายได้และลูกหนี้ ---- */
function salesDocs(){
  return DB.invoices.concat(DB.receipts.filter(r=>!r.invId));
}
/* ---- ตัวช่วยฝั่งลูกหนี้ (เอกสารขาย) ---- */
function arTotal(r){ return recTotals(r).payable; }
function arDue(r){ return Math.round((arTotal(r) - paidOf(r))*100)/100; }
function arDueDate(r){
  if(isInvoice(r)) return addDays(r.date, num(r.creditDays)||0);
  return r.pay.credit ? dueDate(r) : r.date;
}
/* ---- ตัวช่วยฝั่งเจ้าหนี้ (ใบซื้อ + ค่าใช้จ่าย) ---- */
function apTotal(p){ return apTotalOf(p); }
function apDue(p){ return apDueOf(p); }

function inRange(d, from, to){ return (!from || d >= from) && (!to || d <= to); }
let finRange = {from:'', to:''};

const FIN_TABS = [
  ['sales', '06.1', 'ยอดขาย'],
  ['ar',    '06.2', 'ลูกหนี้'],
  ['ap',    '06.3', 'เจ้าหนี้'],
  ['pl',    '06.4', 'กำไรขาดทุน']
];

function renderFinance(){
  if(!$('#finOuter')) return;
  const rs = salesDocs().filter(r=>inRange(r.date, finRange.from, finRange.to));
  const pOnly = DB.purchases.filter(p=>inRange(p.date, finRange.from, finRange.to));
  const eOnly = DB.expenses.filter(e=>inRange(e.date, finRange.from, finRange.to));
  const ps = pOnly.concat(eOnly);

  const sales   = rs.reduce((s,r)=>s+arTotal(r), 0);
  const salesIn = rs.reduce((s,r)=>s+paidOf(r), 0);
  const spend   = ps.reduce((s,p)=>s+apTotal(p), 0);

  /* ยอดค้างคิดจากทั้งระบบ ไม่จำกัดช่วงเวลา เพราะเป็นยอดคงค้างจริง ณ วันนี้ */
  const arOut = salesDocs().reduce((s,r)=>s+Math.max(0,arDue(r)), 0);
  const apOut = apAllDocs().reduce((s,p)=>s+Math.max(0,apDue(p)), 0);

  $('#finTabs').innerHTML = subtabBar('บัญชี / การเงิน', FIN_TABS, finTab,
    `<button class="btn" id="fnExp">ส่งออก CSV</button>`);
  $('#finOuter').innerHTML = `
    <div class="stat" style="margin-bottom:16px">
      <div><span>ยอดขาย</span><b>${money(sales)}</b></div>
      <div><span>รับชำระแล้ว</span><b style="color:var(--ok)">${money(salesIn)}</b></div>
      <div><span>รายจ่ายรวม</span><b>${money(spend)}</b></div>
      <div><span>ยอดลูกหนี้ค้างรับ</span><b style="color:${arOut>0.004?'var(--warn)':'var(--ink)'}">${money(arOut)}</b></div>
      <div><span>ยอดเจ้าหนี้ค้างจ่าย</span><b style="color:${apOut>0.004?'var(--danger)':'var(--ink)'}">${money(apOut)}</b></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="filterbar">
        <span class="hint">ช่วงเวลาที่แสดง</span>
        <input type="date" class="in mono" id="fnFrom" value="${finRange.from}" style="width:150px">
        <span class="hint">ถึง</span>
        <input type="date" class="in mono" id="fnTo" value="${finRange.to}" style="width:150px">
        <button class="btn sm" id="fnMonth">เดือนนี้</button>
        <button class="btn sm" id="fnYear">ปีนี้</button>
        <button class="btn sm" id="fnAll">ทั้งหมด</button>
        <div class="spacer"></div>
        <span class="hint">ใบเสร็จ ${rs.length} · ใบซื้อ ${pOnly.length} · ค่าใช้จ่าย ${eOnly.length} ฉบับ</span>
      </div>
    </div>

    <div id="finBody"></div>`;

  $$('#finTabs button[data-t]').forEach(b=>b.onclick=()=>{ finTab=b.dataset.t; renderFinance(); });
  $('#fnExp').onclick = ()=>exportFinanceCsv(rs, ps);
  $('#fnFrom').onchange = e=>{ finRange.from=e.target.value; renderFinance(); };
  $('#fnTo').onchange   = e=>{ finRange.to=e.target.value; renderFinance(); };
  $('#fnMonth').onclick = ()=>{ const d=new Date();
    finRange={from:iso(new Date(d.getFullYear(),d.getMonth(),1)), to:iso(new Date(d.getFullYear(),d.getMonth()+1,0))}; renderFinance(); };
  $('#fnYear').onclick  = ()=>{ const y=new Date().getFullYear();
    finRange={from:`${y}-01-01`, to:`${y}-12-31`}; renderFinance(); };
  $('#fnAll').onclick   = ()=>{ finRange={from:'',to:''}; renderFinance(); };

  if(finTab==='sales')    renderFinSales(rs, ps, pOnly, eOnly);
  else if(finTab==='ar')  renderFinSide('ar');
  else if(finTab==='ap')  renderFinSide('ap');
  else                    renderFinPL(rs, pOnly, eOnly);
}

/* =====================================================================
   06.1 ยอดขาย
   ===================================================================== */
let finSalesLimit = 60;      /* จำนวนแถวที่แสดงต่อครั้งในหน้ายอดขาย */

function renderFinSales(rs, ps, pOnly, eOnly){
  const allRows = rs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const rows = allRows.slice(0, finSalesLimit);
  const allBuys = ps.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const buyRows = allBuys.slice(0, finSalesLimit);
  $('#finBody').innerHTML = `
    <div class="card">
      <header><h2>รายการขาย</h2>
        <span class="hint">เรียงจากใหม่ไปเก่า · แสดง ${rows.length} จาก ${allRows.length} รายการ</span>
        <div class="spacer"></div>

        <table class="tbl">
          <thead><tr><th style="width:136px">เลขที่ใบเสร็จ</th><th style="width:110px">วันที่</th><th>ลูกค้า</th>
            <th style="width:110px" data-hide="sm">อ้างอิง</th><th class="num" style="width:100px">ก่อนภาษี</th>
            <th class="num" style="width:88px" data-hide="md">VAT</th><th class="num" style="width:92px" data-hide="md">หัก ณ ที่จ่าย</th>
            <th class="num" style="width:110px">สุทธิรับ</th><th class="num" style="width:104px">คงค้าง</th>
            <th style="width:118px">สถานะ</th></tr></thead>
          <tbody>
          ${rows.length? rows.map(r=>{ const t=recTotals(r), d=arDue(r); return `<tr>

            <td class="mono" style="font-size:12px;color:var(--ink-3)" data-hide="sm">${esc(r.quoteNo||'-')}</td>

            <td class="num mono" style="color:${d>0.004?'var(--danger)':'var(--ink-3)'}">${money(Math.max(0,d))}</td>
            <td>${stateChip(t.payable, paidOf(r))}</td></tr>`; }).join('')
          : `<tr><td colspan="10" class="empty">ไม่มีรายการขายในช่วงเวลานี้</td></tr>`}
          </tbody>
          ${rows.length?`<tfoot><tr style="background:#FAFBFC;font-weight:600">
            <td colspan="4" style="text-align:right">รวมทั้งช่วง ${allRows.length} รายการ</td>
            <td class="num mono">${money(rs.reduce((s,r)=>s+recTotals(r).net,0))}</td>
            <td class="num mono" data-hide="md">${money(rs.reduce((s,r)=>s+recTotals(r).vat,0))}</td>
            <td class="num mono" data-hide="md">${money(rs.reduce((s,r)=>s+recTotals(r).wht,0))}</td>
            <td class="num mono">${money(rs.reduce((s,r)=>s+arTotal(r),0))}</td>
            <td class="num mono">${money(rs.reduce((s,r)=>s+Math.max(0,arDue(r)),0))}</td><td></td></tr></tfoot>`:''}
        </table>
      </div>

    <div class="card">
      <header><h2>รายการซื้อและค่าใช้จ่าย</h2>
        <span class="hint">ต้นทุนสินค้าและค่าใช้จ่ายในช่วงเดียวกัน · แสดง ${buyRows.length} จาก ${allBuys.length} รายการ</span></header>
      <div class="tablewrap" style="max-height:320px;overflow:auto">
        <table class="tbl">
          <thead><tr><th style="width:136px">เลขที่</th><th style="width:110px">วันที่</th><th>ผู้ขาย / ผู้รับเงิน</th>
            <th style="width:126px">ประเภท</th><th class="num" style="width:100px">ก่อนภาษี</th>
            <th class="num" style="width:88px" data-hide="md">VAT</th><th class="num" style="width:110px">สุทธิจ่าย</th>
            <th class="num" style="width:104px">คงค้าง</th><th style="width:118px">สถานะ</th></tr></thead>
          <tbody>
          ${buyRows.length? buyRows.map(p=>{
            const ex=isExpenseDoc(p), t=ex?exTotals(p):poTotals(p), d=apDue(p); return `<tr>
            <td class="mono">${esc(p.no)}</td><td>${thDate(p.date)}</td><td>${esc(apPartyOf(p))}</td>
            <td style="font-size:12px">${ex? esc(catName(p.cat)) : 'ซื้อสินค้า'}</td>
            <td class="num mono">${money(t.net)}</td><td class="num mono" data-hide="md">${money(t.vat)}</td>
            <td class="num mono"><b>${money(t.payable)}</b></td>
            <td class="num mono" style="color:${d>0.004?'var(--danger)':'var(--ink-3)'}">${money(Math.max(0,d))}</td>
            <td>${stateChip(t.payable, paidOf(p))}</td></tr>`; }).join('')
          : `<tr><td colspan="9" class="empty">ไม่มีรายการซื้อหรือค่าใช้จ่ายในช่วงเวลานี้</td></tr>`}

  if($('#fnMoreSale')) $('#fnMoreSale').onclick = ()=>{ finSalesLimit += 120; renderFinance(); };
  if($('#fnLessSale')) $('#fnLessSale').onclick = ()=>{ finSalesLimit = 60; renderFinance(); };
}

/* =====================================================================
   06.2 ลูกหนี้ · 06.3 เจ้าหนี้
   ===================================================================== */
function renderFinSide(kind){
  const isAR = kind==='ar';
  const src  = isAR ? salesDocs() : apAllDocs();
  const totalOf = x => isAR ? arTotal(x) : apTotal(x);
  const dueOf   = x => isAR ? arDue(x)   : apDue(x);
  const dateOf  = x => isAR ? arDueDate(x) : apDueDate(x);
  const nameOf  = x => isAR ? (x.name||'-') : apPartyOf(x);
  const kindOf  = x => isAR ? (x.quoteNo? 'ใบเสร็จ · อ้าง '+x.quoteNo : 'ใบเสร็จ')
                            : (isExpenseDoc(x) ? catName(x.cat) : 'ซื้อสินค้า');

  const open   = src.filter(x=>dueOf(x) > 0.004).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
  const closed = src.filter(x=>dueOf(x) <= 0.004 && paidOf(x) > 0.004)
                    .sort((a,b)=>b.date.localeCompare(a.date));
  const sum   = open.reduce((s,x)=>s+dueOf(x), 0);
  const late  = open.filter(x=>daysBetween(today(), dateOf(x)) < 0);
  const lateSum = late.reduce((s,x)=>s+dueOf(x), 0);

  /* รวมยอดค้างต่อคู่ค้า */
  const m = {};
  open.forEach(x=>{ const k = nameOf(x); if(!m[k]) m[k]={name:k, amt:0, n:0}; m[k].amt += dueOf(x); m[k].n++; });
  const byParty = Object.values(m).sort((a,b)=>b.amt-a.amt);

  const title = isAR ? 'ลูกหนี้จากการขาย' : 'เจ้าหนี้การค้า';
  const label = isAR ? 'ยอดลูกหนี้ค้างรับ' : 'ยอดเจ้าหนี้ค้างจ่าย';

  $('#finBody').innerHTML = `
    <div class="stat" style="margin-bottom:16px">
      <div><span>${label}</span><b style="color:${sum>0.004?(isAR?'var(--warn)':'var(--danger)'):'var(--ink)'}">${money(sum)}</b></div>
      <div><span>จำนวนใบที่ค้าง</span><b>${open.length}</b></div>
      <div><span>เกินกำหนดชำระ</span><b style="color:${late.length?'var(--danger)':'var(--ink-3)'}">${late.length}</b></div>
      <div><span>ยอดที่เกินกำหนด</span><b style="color:${lateSum>0.004?'var(--danger)':'var(--ink-3)'}">${money(lateSum)}</b></div>
      <div><span>${isAR?'ลูกค้า':'ผู้ขาย/ผู้รับเงิน'}ที่ค้าง</span><b>${byParty.length}</b> ราย</div>
    </div>

    <div class="card">
      <header><h2>${title} — ที่ยังค้างชำระ</h2>
        <span class="hint">เรียงตามวันครบกำหนด</span>
        <div class="spacer"></div>
        <span class="chip ${sum>0.004?'max':'ok'}">คงค้างรวม ${money(sum)}</span></header>
      <div class="tablewrap">
        <table class="tbl">
          <thead><tr><th style="width:136px">เลขที่</th><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
            <th style="width:126px" data-hide="md">ประเภท</th><th style="width:112px">ครบกำหนด</th>
            <th class="num" style="width:104px">ยอดเต็ม</th><th class="num" style="width:104px" data-hide="sm">ชำระแล้ว</th>
            <th class="num" style="width:104px">คงค้าง</th><th style="width:112px"></th></tr></thead>
          <tbody>
          ${open.length? open.map(x=>{
            const tot=totalOf(x), pd=paidOf(x), du=dueOf(x), dd=dateOf(x);
            const overdue = daysBetween(today(), dd) < 0;
            return `<tr>
              <td class="mono">${esc(x.no)}</td>
              <td>${esc(nameOf(x))}
                <div class="paybar"><i style="width:${Math.min(100, tot>0? pd/tot*100 : 0)}%"></i></div></td>
              <td style="font-size:12px;color:var(--ink-2)" data-hide="md">${esc(kindOf(x))}</td>
              <td style="font-size:12.5px;color:${overdue?'var(--danger)':'var(--ink-2)'}">${thDate(dd)}
                ${overdue?`<br><span style="font-size:11px">เกิน ${Math.abs(daysBetween(today(), dd))} วัน</span>`:''}</td>
              <td class="num mono">${money(tot)}</td>
              <td class="num mono" data-hide="sm" style="color:${pd>0.004?'var(--ok)':'var(--ink-3)'}">${money(pd)}</td>
              <td class="num mono"><b style="color:var(--danger)">${money(du)}</b>
                <div style="margin-top:3px">${stateChip(tot, pd)}</div></td>
              <td style="text-align:right"><button class="btn sm primary" data-pay="${kind}:${x.id}">ชำระเงิน</button></td></tr>`;
          }).join('') : `<tr><td colspan="8" class="empty">ไม่มียอดค้างชำระ</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="ledger" style="margin-top:16px">
      <div class="card">
        <header><h2>สรุปตาม${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</h2><span class="hint">เรียงจากยอดค้างมากไปน้อย</span></header>
        <div class="tablewrap" style="max-height:300px;overflow:auto">
          <table class="tbl"><thead><tr><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
            <th class="num" style="width:80px">จำนวนใบ</th><th class="num" style="width:120px">ยอดค้าง</th></tr></thead><tbody>
          ${byParty.length? byParty.map(x=>`<tr><td>${esc(x.name)}</td>
            <td class="num mono">${x.n}</td><td class="num mono"><b>${money(x.amt)}</b></td></tr>`).join('')
            : `<tr><td colspan="3" class="empty">ไม่มียอดค้าง</td></tr>`}
          </tbody></table>
        </div>
      </div>

      <div class="card">
        <header><h2>${isAR?'ลูกหนี้':'เจ้าหนี้'}ที่ชำระแล้ว</h2><span class="hint">แสดง 15 รายการล่าสุด</span></header>
        <div class="tablewrap" style="max-height:300px;overflow:auto">
          <table class="tbl"><thead><tr><th style="width:132px">เลขที่</th><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
            <th style="width:106px">ชำระครบเมื่อ</th><th class="num" style="width:110px">จำนวนเงิน</th>
            <th style="width:100px"></th></tr></thead><tbody>
          ${closed.length? closed.slice(0,15).map(x=>{
            const last = (x.payments||[]).slice(-1)[0];
            return `<tr><td class="mono">${esc(x.no)}</td><td>${esc(nameOf(x))}</td>
              <td>${thDate(last? last.date : x.date)}</td>
              <td class="num mono">${money(paidOf(x))}</td>
              <td style="text-align:right"><button class="btn sm ghost" data-hist="${kind}:${x.id}">ดูการชำระ</button></td></tr>`;
          }).join('') : `<tr><td colspan="5" class="empty">ยังไม่มีรายการที่ชำระครบ</td></tr>`}
          </tbody></table>
        </div>
      </div>
    </div>`;

  $$('[data-pay]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.pay.split(':'); payModal(k, id); });
  $$('[data-hist]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.hist.split(':'); payHistoryModal(k, id); });
}

/* =====================================================================
   06.4 กำไรขาดทุน
   ===================================================================== */
function renderFinPL(rs, pOnly, eOnly){
  /* ใช้มูลค่าก่อนภาษีมูลค่าเพิ่ม เพราะ VAT ไม่ใช่รายได้หรือค่าใช้จ่ายของกิจการ */
  const revenue = rs.reduce((s,r)=>s+recTotals(r).net, 0);
  const cogs    = pOnly.reduce((s,p)=>s+poTotals(p).net, 0);
  const gross   = revenue - cogs;

  const opsCats = EXPENSE_CATS.filter(([k])=>k!=='asset');
  const opsByCat = {};
  opsCats.forEach(([k])=>opsByCat[k] = 0);
  let assetSum = 0;
  eOnly.forEach(e=>{
    const net = exTotals(e).net;
    if(e.cat === 'asset') assetSum += net;
    else opsByCat[e.cat] = (opsByCat[e.cat]||0) + net;
  });
  const opsTotal = Object.values(opsByCat).reduce((a,b)=>a+b, 0);
  const netProfit = gross - opsTotal;
  const pct = v => revenue > 0 ? (v/revenue*100).toFixed(1)+'%' : '—';

  /* แยกรายเดือน */
  const keys = [...new Set(rs.map(r=>r.date.slice(0,7))
    .concat(pOnly.map(p=>p.date.slice(0,7)))
    .concat(eOnly.map(e=>e.date.slice(0,7))))].sort();
  const monthRows = keys.map(k=>{
    const rv = rs.filter(r=>r.date.slice(0,7)===k).reduce((s,r)=>s+recTotals(r).net,0);
    const cg = pOnly.filter(p=>p.date.slice(0,7)===k).reduce((s,p)=>s+poTotals(p).net,0);
    const op = eOnly.filter(e=>e.date.slice(0,7)===k && e.cat!=='asset').reduce((s,e)=>s+exTotals(e).net,0);
    const [y,m] = k.split('-').map(Number);
    return {label:`${TH_MONTHS[m-1]} ${y+543}`, rv, cg, op, np: rv-cg-op};
  });

  const line = (label, amount, opt={}) => `
    <div class="taxrow" style="${opt.strong?'font-weight:700;font-size:14.5px;':''}${opt.indent?'padding-left:18px;':''}">
      <span>${label}${opt.pct!==false?` <span style="color:var(--ink-3);font-size:11.5px">${pct(Math.abs(amount))}</span>`:''}</span>
      <b style="${opt.color?`color:${opt.color};`:''}">${opt.minus?'−':''}${money(Math.abs(amount))}</b></div>`;

  $('#finBody').innerHTML = `
    <div class="ledger">
      <div class="card">
        <header><h2>งบกำไรขาดทุน</h2>
          <span class="hint">${finRange.from||finRange.to ? `${finRange.from?thDate(finRange.from):'เริ่มต้น'} ถึง ${finRange.to?thDate(finRange.to):'ปัจจุบัน'}` : 'ทั้งหมด'}</span></header>
        <div class="body">
          <div class="sec-title" style="margin-top:0">รายได้</div>
          ${line('รายได้จากการขายและบริการ', revenue, {pct:false})}

          <div class="sec-title">ต้นทุนขาย</div>
          ${line('ซื้อสินค้าและอะไหล่', cogs, {minus:true, indent:true})}
          <div class="taxsum" style="background:#F6F8F9;border:1px solid var(--line);margin-top:8px">
            <span><b>กำไรขั้นต้น</b></span>
            <b style="color:${gross>=0?'var(--ok)':'var(--danger)'}">${money(gross)} <span style="font-size:12px;font-weight:400;color:var(--ink-3)">${pct(gross)}</span></b>
          </div>

          <div class="sec-title">ค่าใช้จ่ายในการดำเนินงาน</div>
          ${opsCats.map(([k,l])=>line(l, opsByCat[k]||0, {minus:true, indent:true})).join('')}
          ${line('รวมค่าใช้จ่ายดำเนินงาน', opsTotal, {minus:true, strong:true})}

          <div class="taxsum" style="margin-top:12px;
            background:${netProfit>=0?'#E7F4EF':'#FCF1F0'};
            border:1px solid ${netProfit>=0?'#BFE3D6':'#EFCFCB'};
            color:${netProfit>=0?'var(--ok)':'var(--danger)'}">
            <span><b>${netProfit>=0?'กำไรสุทธิ':'ขาดทุนสุทธิ'} (ก่อนภาษีเงินได้)</b></span>
            <b>${money(Math.abs(netProfit))} <span style="font-size:12px;font-weight:400">${pct(netProfit)}</span></b>
          </div>

          ${assetSum > 0.004 ? `<div class="warn" style="margin-top:14px">
            <b>ไม่ได้นำการซื้อสินทรัพย์ ${money(assetSum)} บาท มารวมเป็นค่าใช้จ่าย</b><br>
            สินทรัพย์เป็นทรัพย์สินถาวร ต้องทยอยคิดเป็นค่าเสื่อมราคาตามอายุการใช้งาน ไม่หักเป็นค่าใช้จ่ายทั้งจำนวนในงวดเดียว
            ระบบยังไม่ได้คำนวณค่าเสื่อมราคาให้ ควรให้ผู้ทำบัญชีคำนวณเพิ่ม
          </div>` : ''}

          <div style="margin-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.8">
            ตัวเลขทั้งหมดเป็นมูลค่าก่อนภาษีมูลค่าเพิ่ม เพราะภาษีมูลค่าเพิ่มไม่ใช่รายได้หรือค่าใช้จ่ายของกิจการ<br>
            คำนวณตามเกณฑ์วันที่ของเอกสารที่บันทึกไว้ ไม่ว่าจะเก็บเงินหรือจ่ายเงินแล้วหรือยัง<br>
            งบนี้ใช้ดูภาพรวมการดำเนินงาน ไม่ใช่งบการเงินตามมาตรฐานบัญชี ควรให้ผู้ทำบัญชีจัดทำงบฉบับจริงเพื่อยื่นภาษี
          </div>
        </div>
      </div>

      <div class="card">
        <header><h2>แยกตามเดือน</h2><span class="hint">${monthRows.length} เดือน</span></header>
        <div class="tablewrap" style="max-height:420px;overflow:auto">
          <table class="tbl">
            <thead><tr><th>เดือน</th><th class="num" style="width:104px">รายได้</th>
              <th class="num" style="width:100px">ต้นทุนขาย</th><th class="num" style="width:104px" data-hide="sm">ค่าใช้จ่าย</th>
              <th class="num" style="width:110px">กำไรสุทธิ</th></tr></thead>
            <tbody>
            ${monthRows.length? monthRows.map(m=>`<tr>
              <td>${m.label}</td>
              <td class="num mono">${money(m.rv)}</td>
              <td class="num mono">${money(m.cg)}</td>
              <td class="num mono" data-hide="sm">${money(m.op)}</td>
              <td class="num mono"><b style="color:${m.np>=0?'var(--ok)':'var(--danger)'}">${money(m.np)}</b></td></tr>`).join('')
            : `<tr><td colspan="5" class="empty">ไม่มีข้อมูลในช่วงเวลานี้</td></tr>`}
            </tbody>
            ${monthRows.length?`<tfoot><tr style="background:#FAFBFC;font-weight:600">
              <td style="text-align:right">รวม</td>
              <td class="num mono">${money(revenue)}</td>
              <td class="num mono">${money(cogs)}</td>
              <td class="num mono" data-hide="sm">${money(opsTotal)}</td>
              <td class="num mono"><b style="color:${netProfit>=0?'var(--ok)':'var(--danger)'}">${money(netProfit)}</b></td></tr></tfoot>`:''}
          </table>
        </div>
        <div class="body" style="padding-top:0">
          <button class="btn sm" id="plPrint">พิมพ์งบกำไรขาดทุน</button>
        </div>
      </div>
    </div>`;

  $('#plPrint').onclick = ()=>printPL({revenue, cogs, gross, opsByCat, opsCats, opsTotal, netProfit, assetSum, monthRows});
}

function printPL(D){
  const pct = v => D.revenue > 0 ? (v/D.revenue*100).toFixed(1)+'%' : '—';
  const row = (label, amt, opt={}) => `<tr>
    <td${opt.indent?' style="padding-left:18px"':''}>${label}</td>
    <td style="text-align:right;width:56px;color:#555">${opt.nopct?'':pct(Math.abs(amt))}</td>

function findDoc(kind, id){
  if(kind==='ar') return DB.receipts.find(x=>x.id===id) || DB.invoices.find(x=>x.id===id);
  return DB.purchases.find(x=>x.id===id) || DB.expenses.find(x=>x.id===id);
}
/* เจ้าหนี้รวมทั้งใบซื้อสินค้าและค่าใช้จ่ายที่ยังไม่จ่าย */
const isExpenseDoc = x => !!x.cat && Array.isArray(x.items) && x.no && String(x.no).startsWith('EX-');
function apAllDocs(){ return DB.purchases.concat(DB.expenses); }
function apTotalOf(x){ return isExpenseDoc(x) ? exTotals(x).payable : poTotals(x).payable; }
function apDueOf(x){ return Math.round((apTotalOf(x) - paidOf(x))*100)/100; }
function apDueDate(x){ return isExpenseDoc(x) ? exDue(x) : poDue(x); }
function apPartyOf(x){ return isExpenseDoc(x) ? (x.payeeName||'-') : (x.vendorName||'-'); }
function payModal(kind, id){
  const doc = findDoc(kind, id);
  const tot = kind==='ar' ? arTotal(doc) : apTotal(doc);
  const paid = paidOf(doc), due = Math.round((tot-paid)*100)/100;
  const who = kind==='ar' ? (doc.name||'-') : (doc.vendorName||'-');
  openModal(kind==='ar' ? 'รับชำระจากลูกหนี้' : 'จ่ายชำระเจ้าหนี้', `
    <div style="margin-bottom:14px"><span class="tag">${esc(doc.no)}</span>
      <b style="margin-left:8px">${esc(who)}</b>
      <div style="color:var(--ink-3);font-size:12.5px;margin-top:5px">
        ยอดเต็ม ${money(tot)} · ชำระแล้ว ${money(paid)} · <b style="color:var(--danger)">คงค้าง ${money(due)}</b></div></div>
    <div class="grid g3">
      <div><label class="f">จำนวนเงินที่${kind==='ar'?'รับ':'จ่าย'}</label><input class="in mono" id="pmAmt" value="${due}" style="text-align:right"></div>
      <div><label class="f">วันที่</label><input type="date" class="in" id="pmDate" value="${today()}"></div>
      <div><label class="f">ช่องทาง</label>
        <select class="in" id="pmMethod">
          <option>เงินสด</option><option>เงินโอน</option><option>เช็ค</option><option>บัตรเครดิต</option><option>อื่น ๆ</option>
        </select></div>
    </div>
    <div style="margin-top:12px"><label class="f">เลขอ้างอิง / หมายเหตุ</label>
      <input class="in" id="pmRef" placeholder="เช่น เลขที่เช็ค ธนาคาร หรือเลขอ้างอิงการโอน"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn sm" id="pmFull">ชำระเต็มจำนวน</button>
      <button class="btn sm" id="pmHalf">ชำระครึ่งหนึ่ง</button>
    </div>
  `, [
    {label:'ยกเลิก', cls:'btn', act:closeModal},
    {label:'บันทึกการชำระ', cls:'btn primary', act:()=>{
      if(!requireLicense()) return closeModal();
      const amt = num($('#pmAmt').value);
      if(amt <= 0) return toast('ระบุจำนวนเงินมากกว่า 0');
      if(amt > due + 0.004) return toast('จำนวนเงินเกินยอดคงค้าง ('+money(due)+')');
      doc.payments = doc.payments || [];
      doc.payments.push({id:uid(), date:$('#pmDate').value||today(), amount:amt,
        method:$('#pmMethod').value, ref:$('#pmRef').value.trim()});
      saveDB(); closeModal(); renderFinance();
      const left = Math.round((tot - paidOf(doc))*100)/100;
      toast(left <= 0.004 ? `ชำระครบแล้ว — ${doc.no}` : `บันทึกการชำระ ${money(amt)} แล้ว · คงค้าง ${money(left)}`);
    }}
  ]);
  $('#pmFull').onclick = ()=>{ $('#pmAmt').value = due; };
  $('#pmHalf').onclick = ()=>{ $('#pmAmt').value = Math.round(due/2*100)/100; };
}

function payHistoryModal(kind, id){
  const doc = findDoc(kind, id);
  const tot = kind==='ar' ? arTotal(doc) : apTotal(doc);
  const list = doc.payments || [];
  openModal('ประวัติการชำระ — '+doc.no, `
    <div style="margin-bottom:12px;color:var(--ink-2);font-size:13px">
      ยอดเต็ม ${money(tot)} · ชำระแล้ว <b>${money(paidOf(doc))}</b> · คงค้าง ${money(Math.max(0, tot-paidOf(doc)))}</div>
    <div class="tablewrap" style="border:1px solid var(--line);border-radius:6px">
      <table class="tbl"><thead><tr><th style="width:120px">วันที่</th><th style="width:110px">ช่องทาง</th>
        <th>อ้างอิง</th><th class="num" style="width:110px">จำนวนเงิน</th><th style="width:50px"></th></tr></thead><tbody>
      ${list.length? list.map(p=>`<tr><td>${thDate(p.date)}</td><td>${esc(p.method||'-')}</td>
        <td style="font-size:12.5px;color:var(--ink-2)">${esc(p.ref||'-')}</td>
        <td class="num mono">${money(p.amount)}</td>
        <td style="text-align:center"><button class="btn sm ghost" data-pdel="${p.id}" title="ยกเลิกรายการนี้">✕</button></td></tr>`).join('')
      : `<tr><td colspan="5" class="empty">ยังไม่มีการชำระ</td></tr>`}
      </tbody></table>
    </div>`, [{label:'ปิด', cls:'btn primary', act:closeModal}]);
  $$('[data-pdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('ยกเลิกรายการชำระนี้? ยอดคงค้างจะกลับมาเพิ่ม')) return;
    doc.payments = doc.payments.filter(x=>x.id!==b.dataset.pdel);
    saveDB(); closeModal(); renderFinance(); toast('ยกเลิกรายการชำระแล้ว');
  });
}

function exportFinanceCsv(rs, ps){
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines = ['ประเภท,เลขที่,วันที่,คู่ค้า,ก่อนภาษี,VAT,หัก ณ ที่จ่าย,ยอดสุทธิ,ชำระแล้ว,คงค้าง,สถานะ'];
  rs.forEach(r=>{ const t=recTotals(r), pd=paidOf(r);
    lines.push(['ขาย',q(r.no),r.date,q(r.name||''),t.net,t.vat,t.wht,t.payable,pd,Math.max(0,arDue(r)),
      q(STATE_LABEL[payState(t.payable,pd)])].join(',')); });
  ps.forEach(p=>{ const ex=isExpenseDoc(p), t=ex?exTotals(p):poTotals(p), pd=paidOf(p);
    lines.push([ex?q('ค่าใช้จ่าย · '+catName(p.cat)):'ซื้อ', q(p.no), p.date, q(apPartyOf(p)),
      t.net,t.vat,t.wht,t.payable,pd,Math.max(0,apDue(p)),
      q(STATE_LABEL[payState(t.payable,pd)])].join(',')); });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `drivegolight-finance-${today()}.csv`; a.click();
  toast('ส่งออกไฟล์ CSV แล้ว');
}

  $('#s_logoPick').onclick = ()=> $('#s_logoFile').click();

    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const M = 320;
        const sc = Math.min(1, M/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        DB.shop.logo = cv.toDataURL('image/png');
        saveDB(); renderSettings(); paintRailLogo(); toast('บันทึกตราสัญลักษณ์แล้ว');
      };
      img.onerror = ()=> toast('ไฟล์รูปไม่ถูกต้อง');

      const raw = localStorage.getItem(BACKUP_KEY);

      DB.demoVersion = DEMO_VERSION;

      saveDB(); curQuote=null; curRec=null; curPo=null;
      go('settings'); toast('กู้คืนข้อมูลเดิมเรียบร้อยแล้ว');
    }catch(err){ toast('กู้คืนไม่สำเร็จ: '+err.message); }
  };

  };

    $$('[data-p2]').forEach(cb=>cb.onchange=()=>{

    renderBackupBanner();

  };
  $('#sImport').onclick = ()=> $('#sFile').click();
  $('#sFile').onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = async ()=>{
      try{
        const d = JSON.parse(rd.result);
        const errors = validateBackupShape(d);
        if(errors.length){
          const shown = errors.slice(0,8).map(x=>'· '+x).join('\n');
          const more = errors.length>8 ? `\n…และอีก ${errors.length-8} ข้อผิดพลาด` : '';
          alert(`ไฟล์สำรองข้อมูลไม่ถูกต้อง พบปัญหา ${errors.length} จุด:\n\n${shown}${more}\n\nยกเลิกการกู้คืนข้อมูล — กรุณาใช้ไฟล์สำรองที่ export จากโปรแกรมนี้เท่านั้น`);
          return;
        }
        if(!confirm(`กู้คืนข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่\n\nอะไหล่ ${d.products.length} รายการ · ลูกค้า ${(d.customers||[]).length} ราย · ใบเสนอราคา ${(d.quotes||[]).length} ฉบับ · ใบเสร็จ ${(d.receipts||[]).length} ฉบับ`)) return;
        DB = Object.assign({schemaVersion:SCHEMA_VERSION, shop:null,products:[],categories:[],customers:[],vendors:[],purchases:[],expenses:[],quotes:[],invoices:[],receipts:[],users:[],ignoredItems:[],seq:{q:0,r:0,c:0,p:0,v:0,e:0,iv:0,ivt:0},lastExportAt:null}, migrateDB(d));
        if(!DB.shop) DB.shop = Object.assign({}, DEFAULT_SHOP);
        await saveDB();
        $('#brandName').textContent = DB.shop.name;
        curQuote = null; curRec = null;
        go('settings');
        toast(DB.products.length > MAX_PRODUCTS
          ? `กู้คืนแล้ว แต่มีอะไหล่ ${DB.products.length.toLocaleString()} รายการ เกินขีดจำกัด ${MAX_PRODUCTS.toLocaleString()} — เพิ่มรายการใหม่ไม่ได้จนกว่าจะลบให้ต่ำกว่าขีดจำกัด`
          : 'กู้คืนข้อมูลเรียบร้อยแล้ว');
      }catch(err){ toast('ไฟล์ไม่ถูกต้อง: '+err.message); }
      finally{ e.target.value=''; }
    };
    rd.readAsText(file);
  };
}

function addrLine(a){
  const p=[];
  if(a.no) p.push(`${a.no}`);
  if(a.village) p.push(`${a.village}`);
  if(a.moo) p.push(`หมู่ ${a.moo}`);
  if(a.soi) p.push(`ซ.${a.soi}`);
  if(a.road) p.push(`ถ.${a.road}`);
  if(a.subdistrict) p.push(`แขวง/ต.${a.subdistrict}`);
  if(a.district) p.push(`เขต/อ.${a.district}`);
  if(a.province) p.push(a.province);
  if(a.zip) p.push(a.zip);
  return p.join(' ') || '-';
}

/* =====================================================================
   รายการค้างทำ — สินค้าในเอกสารที่ยังไม่ได้ลงทะเบียน
   ===================================================================== */
const normName = v => String(v||'').trim().replace(/\s+/g,' ').toLowerCase();

/* ค่าแรงและรายการบริการไม่นับ เพราะไม่ใช่สินค้าที่ต้องมีในสต๊อก */
function isPendingItem(it){
  return !it.pid && String(it.name||'').trim() !== '' && it.code !== 'LAB';
}
function isIgnoredItem(name){
  return (DB.ignoredItems||[]).includes(normName(name));
}
/* ใช้ตอนวาดตารางในเอกสาร — บอกว่าบรรทัดนี้ต้องเตือนหรือไม่ */
function pendMark(it){
  if(!isPendingItem(it) || isIgnoredItem(it.name)) return '';
  return `<span class="pend" title="ยังไม่ได้ลงทะเบียนในเมนูสินค้า — จัดการได้ที่ สินค้า › รายการค้างทำ">✱</span>`;
}

const PEND_SOURCES = [
  ['quotes',    'ใบเสนอราคา'],
  ['invoices',  'ใบส่งมอบงาน'],
  ['receipts',  'ใบเสร็จรับเงิน'],
  ['purchases', 'ใบซื้อสินค้า']
];
function pendingList(){
  const map = {};
  PEND_SOURCES.forEach(([field, label])=>{
    (DB[field]||[]).forEach(doc=>(doc.items||[]).forEach(it=>{
      if(!isPendingItem(it) || isIgnoredItem(it.name)) return;
      const key = normName(it.name);
      if(!map[key]) map[key] = {key, name:String(it.name).trim(), n:0, qty:0,
        unit:it.unit||'ชิ้น', price:num(it.price), lastDate:'', docs:[], sources:{}};
      const m = map[key];
      m.n++; m.qty += num(it.qty);
      m.sources[label] = (m.sources[label]||0) + 1;
      if(m.docs.length < 8) m.docs.push({no:doc.no, date:doc.date, label});
      if(!m.lastDate || doc.date > m.lastDate){
        m.lastDate = doc.date; m.price = num(it.price); m.unit = it.unit || m.unit;
        m.name = String(it.name).trim();
      }
    }));
  });
  return Object.values(map).sort((a,b)=> b.n - a.n || a.name.localeCompare(b.name,'th'));
}
function pendingCount(){ return pendingList().length; }

/* ผูกรายการในเอกสารเดิมเข้ากับสินค้าที่เพิ่งลงทะเบียน */
function linkPendingToProduct(key, prod){
  let n = 0;
  PEND_SOURCES.forEach(([field])=>{
    (DB[field]||[]).forEach(doc=>(doc.items||[]).forEach(it=>{
      if(isPendingItem(it) && normName(it.name) === key){
        it.pid = prod.id; it.code = prod.code; it.oem = prod.oem || ''; 
        if(!it.unit) it.unit = prod.unit;
        n++;
      }
    }));
  });
  return n;
}

function mountActions(sideId, formId, html){
  const side = $('#'+sideId);
  if(side){ side.innerHTML = `<div class="side-actions">${html}</div>`; return; }

function draftHasData(doc, fields){
  if(!doc) return false;
  if((doc.items||[]).some(it=>String(it.name||'').trim() || num(it.price)>0 || (it.pid && num(it.qty)>0))) return true;
  return fields.some(f=>{
    const v = f.split('.').reduce((o,k)=>o && o[k], doc);
    return typeof v === 'string' ? v.trim()!=='' : false;
  });
}
function closeDraft(doc, fields, saved, setNull, rerender){
  const dirty = draftHasData(doc, fields) && !saved;
  if(dirty && !confirm('ปิดเอกสารนี้โดยไม่บันทึก?\n\nข้อมูลที่กรอกไว้จะหายไป หากต้องการเก็บไว้ ให้กดยกเลิกแล้วกดบันทึกก่อน')) return false;
  setNull();
  rerender();
  toast('ปิดเอกสารแล้ว');
  return true;
}

  const st = licStatus();
  if(st.mode==='expired') go('license');
  else if(st.mode==='trial' && st.left<=3) toast(`ทดลองใช้เหลืออีก ${st.left} วัน — ต่ออายุได้ที่เมนูลิขสิทธิ์การใช้งาน`);
})();
</script>
