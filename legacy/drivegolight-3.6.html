<style>
:root{
  --ink:#16202B;
  --ink-2:#43535F;
  --ink-3:#7C8B96;
  --line:#D5DDE2;
  --line-2:#E9EEF1;
  --surface:#EFF2F4;
  --panel:#FFFFFF;
  --steel:#17607A;
  --steel-dk:#0E4356;
  --steel-soft:#E3EFF3;

  --brand-green:#37B554;
  --brand-yellow:#FFEF5B;

  --flag-min-bg:#F6D264;      /* ถึงจุดสั่งซื้อ (Min) */
  --flag-min-ink:#5E4400;
  --flag-max-bg:#F6B7B2;      /* เกิน Max */
  --flag-max-ink:#7E251D;
  --flag-dead-bg:#D9BE9C;     /* ไม่เคลื่อนไหว > 6 เดือน */
  --flag-dead-ink:#5F4222;

  --ok:#1D7A5F;
  --warn:#B4720B;
  --danger:#B3382C;
  --r:6px;
  --shadow:0 1px 2px rgba(22,32,43,.08), 0 8px 24px -16px rgba(22,32,43,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Thai',system-ui,'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  background:var(--surface); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono,input.mono,td.num,th.num{font-family:'IBM Plex Mono','IBM Plex Sans Thai',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--steel)}

/* ---------- โครงหน้าจอ ---------- */
.app{display:block;min-height:100vh}
.rail{
  background:var(--ink); color:#C9D6DE; padding:9px 16px; position:sticky; top:0; z-index:40; height:auto;
  display:flex; flex-direction:row; align-items:center; gap:5px;
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  box-shadow:0 2px 12px rgba(0,0,0,.22);
}
.rail::-webkit-scrollbar{display:none}
.rail .brand{display:flex;gap:9px;align-items:center;padding:0 16px 0 2px;border:0;margin:0;flex:none}
.rail .brand b{color:#fff;font-size:14.5px;letter-spacing:.2px;display:block;line-height:1.2}
.rail .brand span{font-size:10px;color:#8FA3B0;letter-spacing:.12em;text-transform:uppercase}
.rail .brand img.logo{width:34px;height:34px;flex:none;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rail .brand b{letter-spacing:-.1px}
.rail .brand b em{font-style:normal;color:var(--brand-green)}
.rail .brand .shop{display:block;font-size:11.5px;color:#8FA3B0;letter-spacing:0;text-transform:none;line-height:1.35;margin-top:2px}
.rail .foot a{color:#8FA3B0;text-decoration:none}
.rail .foot a:hover{color:#fff}
.memwarn{display:none}
.backupBanner{display:none;align-items:center;gap:14px;background:#FCF3E2;border-bottom:1px solid #EEDBB4;color:var(--warn);padding:9px 22px;font-size:12.5px}
.backupBanner.on{display:flex}
.backupBanner span{flex:1}
.backupBanner button{flex:none}
.licbadge{display:block;width:auto;text-align:left;border:0;border-radius:99px;padding:6px 12px;margin:0;
  cursor:pointer;font-size:0;line-height:1.3;white-space:nowrap;background:rgba(255,255,255,.08);color:#C9D6DE}
.licbadge:hover{background:rgba(255,255,255,.14)}
.licbadge b{display:inline;color:#fff;font-size:12px;margin:0}
.licbadge.trial{background:#3C4A16;color:#E5EFC4}
.licbadge.trial b{color:var(--brand-yellow)}
.licbadge.warn{background:#6B4A08;color:#FBE7BE}
.licbadge.warn b{color:#FFD469}
.licbadge.expired{background:#7A2018;color:#FBD7D3}
.licbadge.expired b{color:#FFB4AB}
.licbadge.active{background:#14432A;color:#BFE3CE}
.licbadge.active b{color:#6FE39A}
.pricebox{border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:#FAFCFD}

/* ⚠️ หมายเหตุความปลอดภัยสำหรับผู้พัฒนาที่มาต่อ (อ่านก่อนแตะโค้ดส่วนนี้):
   KEY_SALT, makeKey(), checkKey() ด้านล่างนี้คือระบบตรวจรหัสลิขสิทธิ์ที่ทำงาน
   "ฝั่ง client ล้วน ๆ" อยู่ในไฟล์ HTML นี้เอง ไม่มี server ตรวจสอบใด ๆ ทั้งสิ้น
   - ป้องกันผู้ใช้ทั่วไปที่ไม่ได้ตั้งใจหาทางเลี่ยงได้ในระดับหนึ่งเท่านั้น
   - ป้องกันคนที่รู้ JavaScript ไม่ได้ 100%: เปิด DevTools อ่านค่า KEY_SALT และ
     อัลกอริทึม enc32/fnv/checkKey แล้วคำนวณรหัสปลอมได้ หรือจะแก้ DB.lic.expires /
     เรียก licStatus() ตรง ๆ เพื่อบายพาสก็ทำได้เช่นกัน เพราะทุกอย่างอยู่ใน global
     scope ของหน้านี้ ตรวจสอบและแก้ไขได้จาก console โดยตรง
   ทั้งหมดนี้เป็น tradeoff ที่ยอมรับได้ตามแผนธุรกิจปัจจุบัน (แจกจ่ายเป็นไฟล์ HTML
   เดี่ยว ไม่มี backend) ไม่ต้องเปลี่ยนสถาปัตยกรรมตอนนี้ — แต่ถ้าอนาคตต้องการกัน
   การปลอมรหัสที่รัดกุมขึ้นจริง ๆ ต้องย้าย logic ตรวจรหัสไปไว้ฝั่ง server แทน */
const KEY_SALT   = 'DGL!drivebizbegin';
const KEY_EPOCH  = '2020-01-01';
const A32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // ตัดอักขระที่สับสน 0 1 I O ออก

function enc32(n, len){ let s=''; n=Math.abs(Math.floor(n)); for(let i=0;i<len;i++){ s=A32[n%32]+s; n=Math.floor(n/32); } return s; }
function dec32(s){ let n=0; for(const c of s){ const i=A32.indexOf(c); if(i<0) return -1; n=n*32+i; } return n; }
function fnv(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
const digitsOf = v => String(v||'').replace(/\D/g,'');

function makeKey(taxId, expIso){
  const p1 = enc32(daysBetween(KEY_EPOCH, expIso), 3);
  const p2 = enc32(fnv(digitsOf(taxId) + p1 + KEY_SALT), 5);
  const raw = p1 + p2;
  return 'DGL-' + raw.slice(0,4) + '-' + raw.slice(4,8);
}
function checkKey(key, taxId){
  let raw = String(key||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(raw.startsWith('DGL')) raw = raw.slice(3);
  if(raw.length !== 8) return null;
  const p1 = raw.slice(0,3), p2 = raw.slice(3,8);
  const d = dec32(p1); if(d < 0) return null;
  if(enc32(fnv(digitsOf(taxId) + p1 + KEY_SALT), 5) !== p2) return null;
  return addDays(KEY_EPOCH, d);
}

function licInit(){
  DB.lic = DB.lic || {};
  if(!DB.lic.installedAt) DB.lic.installedAt = today();
  if(!('key' in DB.lic)) DB.lic.key = '';
  if(!('expires' in DB.lic)) DB.lic.expires = '';
}
function licStatus(){
  const L = DB.lic || {};
  if(L.expires){
    const left = daysBetween(today(), L.expires);
    return left >= 0 ? {mode:'active', left, until:L.expires} : {mode:'expired', left:0, until:L.expires, wasLicensed:true};
  }
  const until = addDays(L.installedAt || today(), TRIAL_DAYS);
  const left = daysBetween(today(), until);
  return left >= 0 ? {mode:'trial', left, until} : {mode:'expired', left:0, until};
}

/* =====================================================================
   ที่เก็บข้อมูล — บันทึกแบบ 4 ชั้นเรียงลำดับความสำคัญ:
   1) window.storage — ที่เก็บของระบบ/โฮสต์ที่เปิดโปรแกรมอยู่ (ถ้ามี)
   2) IndexedDB — ในเบราว์เซอร์ (เขียนกลไกแบบ idb-keyval ฝังไว้ในไฟล์นี้เอง
      ไม่โหลดไลบรารีจากอินเทอร์เน็ต เพื่อให้ยังเป็นไฟล์เดี่ยวใช้งาน offline ได้)
   3) localStorage — ในเบราว์เซอร์
   4) หน่วยความจำชั่วคราว (mem) — ใช้เป็นทางเลือกสุดท้ายเท่านั้น ข้อมูลหายทันทีที่
      ปิด/รีโหลดหน้านี้

   store.get()/store.set() ไล่ลองทีละชั้นตามลำดับด้านบน หยุดที่ชั้นแรกที่ทำสำเร็จ
   แต่ละชั้นห่อด้วย try/catch แยกกัน ชั้นหนึ่งพังไม่กระทบชั้นอื่น
   ถ้าเขียนข้อมูลไม่ลงชั้นถาวรใดเลย (เหลือแค่ mem) จะแจ้งเตือนผู้ใช้ทันทีเสมอ
   ห้ามปล่อยให้ข้อมูลหายไปแบบเงียบ ๆ
   ===================================================================== */
const mem = {};

let pendingWrites = 0;         // จำนวนการเขียนข้อมูลที่ยังทำไม่เสร็จ ใช้กับ beforeunload

/* ---------- ตัวช่วย IndexedDB แบบย่อ สไตล์ idb-keyval — เขียนเองฝังในไฟล์ ไม่พึ่งเน็ต ---------- */
const idbkv = (() => {
  const DB_NAME = 'dgl_kv_store', STORE_NAME = 'kv';
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if(!window.indexedDB){ reject(new Error('indexedDB ไม่พร้อมใช้งาน')); return; }
      let req;
      try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ reject(e); return; }
      req.onupgradeneeded = () => { try{ req.result.createObjectStore(STORE_NAME); }catch(e){} };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('เปิด indexedDB ไม่สำเร็จ'));
      req.onblocked = () => reject(new Error('indexedDB ถูกบล็อก'));
    });
    return dbPromise;
  }
  function run(mode, fn){
    return openDB().then(db => new Promise((resolve, reject) => {
      let tx;
      try{ tx = db.transaction(STORE_NAME, mode); }catch(e){ reject(e); return; }
      const req = fn(tx.objectStore(STORE_NAME));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('ทำรายการ indexedDB ไม่สำเร็จ'));
    }));
  }
  return {
    get: (k) => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k))
  };
})();

async function detectStorage(){
  try{
    if(window.storage && typeof window.storage.set === 'function' && typeof window.storage.get === 'function'){
      await window.storage.set('__dgl_probe__', '1');
      const r = await window.storage.get('__dgl_probe__');
      if(r && r.value === '1') return 'host';
    }
  }catch(e){}
  try{
    await idbkv.set('__dgl_probe__', 1);
    const v = await idbkv.get('__dgl_probe__');
    if(v === 1) return 'indexeddb';
  }catch(e){}
  try{ localStorage.setItem('__dgl_probe__','1'); localStorage.removeItem('__dgl_probe__'); return 'browser'; }catch(e){}
  return 'memory';
}

function warnStorageFailure(){
  lastPersistOk = false;
  toast('บันทึกข้อมูลถาวรไม่สำเร็จ! ข้อมูลอยู่ในหน่วยความจำชั่วคราวเท่านั้น — สำรองข้อมูลเป็นไฟล์ JSON ทันที');
  try{
    alert('⚠ บันทึกข้อมูลถาวรไม่สำเร็จ (พื้นที่จัดเก็บอาจเต็มหรือถูกปิดกั้น)\n\n' +
      'การเปลี่ยนแปลงล่าสุดอยู่ในหน่วยความจำชั่วคราวเท่านั้น และจะหายไปทันทีที่ปิดหรือรีโหลดหน้านี้\n\n' +
      'กรุณากด "สำรองข้อมูลทั้งหมด (JSON)" ที่เมนูตั้งค่าร้านทันที เพื่อไม่ให้ข้อมูลสูญหาย');
  }catch(e){}
}

const store = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r && r.value) return JSON.parse(r.value); }catch(e){}
    try{ const v = await idbkv.get(k); if(v) return JSON.parse(v); }catch(e){}
    try{ const v = localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
    return (k in mem) ? mem[k] : null;
  },
  async set(k, v){
    mem[k] = v;
    const str = JSON.stringify(v);
    pendingWrites++;
    try{
      let ok = false;
      try{ await window.storage.set(k, str); ok = true; }catch(e){}
      if(!ok){ try{ await idbkv.set(k, str); ok = true; }catch(e){} }
      if(!ok){ try{ localStorage.setItem(k, str); ok = true; }catch(e){} }
      if(ok) lastPersistOk = true; else warnStorageFailure();
      return ok;
    } finally {
      pendingWrites--;
    }
  }
};

window.addEventListener('beforeunload', (e) => {
  if(pendingWrites > 0 || !lastPersistOk){
    e.preventDefault();
    e.returnValue = 'มีข้อมูลที่ยังบันทึกไม่เสร็จหรือบันทึกไม่สำเร็จ ต้องการปิดหน้านี้จริงหรือไม่?';
    return e.returnValue;
  }
});

/* ---------- schema version ของโครงสร้างข้อมูล DB — เพิ่มเลขใหม่ทุกครั้งที่แก้โครงสร้าง ---------- */
const SCHEMA_VERSION = 1;
/* คีย์คือ "เวอร์ชันปลายทาง" ของ migration แต่ละขั้น ฟังก์ชันรับ DB เก่าคืนค่า DB ที่แก้แล้ว
   เพิ่ม migration ใหม่ต่อท้ายเมื่ออัปเดตแอปในอนาคตแบบเปลี่ยนโครงสร้างข้อมูล ห้ามแก้ไขของเดิมที่ปล่อยไปแล้ว */
const DB_MIGRATIONS = {
  1: (d) => d   // ข้อมูลเก่าที่ยังไม่มี schemaVersion (v0) → v1: เริ่มนับเวอร์ชัน ไม่มีการเปลี่ยนโครงสร้าง
};
function migrateDB(d){
  let v = Number(d.schemaVersion) || 0;
  while(v < SCHEMA_VERSION){
    v++;
    const step = DB_MIGRATIONS[v];
    if(typeof step === 'function'){ d = step(d) || d; }
    d.schemaVersion = v;
  }
  return d;
}

/* ---------- ตรวจโครงสร้างไฟล์สำรองข้อมูลก่อนกู้คืนจริง — กันพังตอน render ทีหลัง ---------- */
function validateBackupShape(d){
  const errors = [];
  if(!d || typeof d !== 'object' || Array.isArray(d)){ errors.push('ไฟล์นี้ไม่ใช่ออบเจกต์ข้อมูลสำรองที่ถูกต้อง'); return errors; }

  if(d.shop !== undefined && d.shop !== null && typeof d.shop !== 'object')
    errors.push('shop ต้องเป็นออบเจกต์ข้อมูลร้าน');

  if(!Array.isArray(d.products)) errors.push('products ต้องเป็น array (พบ '+typeof d.products+')');
  else d.products.forEach((p,i)=>{
    if(!p || typeof p !== 'object'){ errors.push(`products[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!p.id) errors.push(`products[${i}] ไม่มี field "id"`);
    if(typeof p.code !== 'string') errors.push(`products[${i}] ไม่มี field "code" (รหัสสินค้า)`);
    if(typeof p.name !== 'string') errors.push(`products[${i}] ไม่มี field "name" (ชื่อสินค้า)`);
  });

  if(d.categories !== undefined && !Array.isArray(d.categories))
    errors.push('categories ต้องเป็น array (พบ '+typeof d.categories+')');

  if(!Array.isArray(d.customers)) errors.push('customers ต้องเป็น array (พบ '+typeof d.customers+')');
  else d.customers.forEach((c,i)=>{
    if(!c || typeof c !== 'object'){ errors.push(`customers[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!c.id) errors.push(`customers[${i}] ไม่มี field "id"`);

    if(!p.id) errors.push(`purchases[${i}] ไม่มี field "id"`);
    if(!Array.isArray(p.items)) errors.push(`purchases[${i}] ไม่มี field "items" (ต้องเป็น array)`);

  if(!Array.isArray(d.expenses)) errors.push('expenses ต้องเป็น array (พบ '+typeof d.expenses+')');
  else d.expenses.forEach((x,i)=>{
    if(!x || typeof x !== 'object'){ errors.push(`expenses[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!x.id) errors.push(`expenses[${i}] ไม่มี field "id"`);
    if(!Array.isArray(x.items)) errors.push(`expenses[${i}] ไม่มี field "items" (ต้องเป็น array)`);
  });

  if(!Array.isArray(d.quotes)) errors.push('quotes ต้องเป็น array (พบ '+typeof d.quotes+')');
  else d.quotes.forEach((q,i)=>{
    if(!q || typeof q !== 'object'){ errors.push(`quotes[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!q.id) errors.push(`quotes[${i}] ไม่มี field "id"`);
    if(!Array.isArray(q.items)) errors.push(`quotes[${i}] ไม่มี field "items" (ต้องเป็น array)`);
    if(!q.addr || typeof q.addr !== 'object') errors.push(`quotes[${i}] ไม่มี field "addr"`);
    if(!q.veh || typeof q.veh !== 'object') errors.push(`quotes[${i}] ไม่มี field "veh"`);
  });

  if(!Array.isArray(d.invoices)) errors.push('invoices ต้องเป็น array (พบ '+typeof d.invoices+')');
  else d.invoices.forEach((r,i)=>{
    if(!r || typeof r !== 'object'){ errors.push(`invoices[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!r.id) errors.push(`invoices[${i}] ไม่มี field "id"`);
    if(!Array.isArray(r.items)) errors.push(`invoices[${i}] ไม่มี field "items" (ต้องเป็น array)`);
    if(!r.addr || typeof r.addr !== 'object') errors.push(`invoices[${i}] ไม่มี field "addr"`);
    if(!r.veh || typeof r.veh !== 'object') errors.push(`invoices[${i}] ไม่มี field "veh"`);
  });

  if(!Array.isArray(d.receipts)) errors.push('receipts ต้องเป็น array (พบ '+typeof d.receipts+')');
  else d.receipts.forEach((r,i)=>{
    if(!r || typeof r !== 'object'){ errors.push(`receipts[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!r.id) errors.push(`receipts[${i}] ไม่มี field "id"`);
    if(!Array.isArray(r.items)) errors.push(`receipts[${i}] ไม่มี field "items" (ต้องเป็น array)`);
    if(!r.addr || typeof r.addr !== 'object') errors.push(`receipts[${i}] ไม่มี field "addr"`);
    if(!r.veh || typeof r.veh !== 'object') errors.push(`receipts[${i}] ไม่มี field "veh"`);
  });

  if(d.users !== undefined && !Array.isArray(d.users)) errors.push('users ต้องเป็น array (พบ '+typeof d.users+')');

  if(d.seq !== undefined && d.seq !== null && typeof d.seq !== 'object')
    errors.push('seq ต้องเป็นออบเจกต์ (พบ '+typeof d.seq+')');

  return errors;
}

/* =====================================================================
   นำเข้า / ส่งออกรายการสินค้าด้วยไฟล์ CSV (เปิดใน Excel ได้)
   ===================================================================== */
const PRODUCT_CSV_FIELDS = [
  {field:'code',     aliases:['รหัสสินค้า','code']},
  {field:'oem',      aliases:['รหัสอ้างอิง','oem']},
  {field:'name',     aliases:['ชื่อสินค้า','name']},
  {field:'cat',      aliases:['หมวดหมู่','หมวด','category','cat']},
  {field:'unit',     aliases:['หน่วยนับ','หน่วย','unit']},
  {field:'cost',     aliases:['ต้นทุน','cost']},
  {field:'pA',       aliases:['ราคาขายa','ราคาa','pa']},
  {field:'pB',       aliases:['ราคาขายb','ราคาb','pb']},
  {field:'pC',       aliases:['ราคาขายc','ราคาc','pc']},
  {field:'qty',      aliases:['คงเหลือ','qty']},
  {field:'min',      aliases:['min']},
  {field:'max',      aliases:['max']},
  {field:'lastMove', aliases:['วันที่เคลื่อนไหวล่าสุด','lastmove']}
];
function normHeader(h){ return String(h||'').replace(/\(.*?\)/g,'').trim().toLowerCase(); }
function mapCSVHeaders(headerRow){
  return headerRow.map(h=>{
    const n = normHeader(h);
    const hit = PRODUCT_CSV_FIELDS.find(f=>f.aliases.some(a=>normHeader(a)===n));
    return hit ? hit.field : null;
  });
}
function csvField(v){
  v = String(v??'');
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCSV(rows){ return rows.map(r=>r.map(csvField).join(',')).join('\r\n'); }
function parseCSV(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    }
    else if(c==='"') inQuotes=true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c==='\r'){ /* ข้ามไป จัดการที่ \n */ }
    else field+=c;
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
const CSV_HEADERS = ['รหัสสินค้า(อู่)','รหัสอ้างอิง(OEM)','ชื่อสินค้า','หมวดหมู่','หน่วยนับ','ต้นทุน',
  'ราคาขายA','ราคาขายB','ราคาขายC','คงเหลือ','Min','Max','วันที่เคลื่อนไหวล่าสุด(YYYY-MM-DD)'];

function exportProductsCsv(){
  const rows = [CSV_HEADERS].concat(DB.products.map(p=>
    [p.code, p.oem||'', p.name, p.cat||'', p.unit||'', p.cost, p.pA, p.pB, p.pC, p.qty, p.min, p.max, p.lastMove||'']));

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`drivegolight-สินค้า-${today()}.csv`; a.click();
  toast(`ส่งออก ${DB.products.length} รายการแล้ว`);
}
function handleProductCSVImport(e){
  const file = e.target.files[0]; if(!file) return;
  if(!requireLicense()){ e.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      let text = String(rd.result);
      if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
      const rows = parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));
      if(rows.length<2) throw new Error('ไม่พบข้อมูลในไฟล์');
      const fields = mapCSVHeaders(rows[0]);
      if(!fields.includes('code') || !fields.includes('name'))
        throw new Error('ไม่พบคอลัมน์ รหัสสินค้า หรือ ชื่อสินค้า — ใช้ฟอร์มที่ดาวน์โหลดจากปุ่ม ฟอร์ม Excel');
      let added=0, updated=0, skipped=0, full=false;
      const newCats=[];
      for(let i=1;i<rows.length;i++){
        const r = rows[i], rec = {};
        fields.forEach((f,idx)=>{ if(f) rec[f] = r[idx]!==undefined ? String(r[idx]).trim() : ''; });
        if(!rec.code || !rec.name){ skipped++; continue; }
        const prod = {
          code:rec.code, oem:rec.oem||'', name:rec.name, cat:rec.cat||'', unit:rec.unit||'ชิ้น',
          cost:num(rec.cost), pA:num(rec.pA), pB:num(rec.pB), pC:num(rec.pC),
          qty:num(rec.qty), min:num(rec.min), max:num(rec.max),
          lastMove: /^\d{4}-\d{2}-\d{2}$/.test(rec.lastMove) ? rec.lastMove : today()
        };
        if(prod.cat && !DB.categories.includes(prod.cat) && !newCats.includes(prod.cat)) newCats.push(prod.cat);
        const existing = DB.products.find(x=>x.code===prod.code);
        if(existing){ Object.assign(existing, prod, {id:existing.id}); updated++; }
        else {
          if(DB.products.length >= MAX_PRODUCTS){ skipped++; full=true; continue; }
          DB.products.push(Object.assign({id:uid()}, prod)); added++;
        }
      }
      if(newCats.length) DB.categories.push(...newCats);
      saveDB(); renderStock();
      toast(`นำเข้าเสร็จ — เพิ่มใหม่ ${added} · ปรับปรุง ${updated}`
        + (skipped? ` · ข้าม ${skipped} แถว` : '')
        + (full? ` (ทะเบียนเต็ม ${MAX_PRODUCTS.toLocaleString()} รายการ)` : '')
        + (newCats.length? ` · เพิ่มหมวดใหม่ ${newCats.length}` : ''));
    }catch(err){ toast('นำเข้าไม่สำเร็จ: '+err.message); }
    e.target.value='';
  };
  rd.readAsText(file, 'UTF-8');
}

/* =====================================================================
   ตัวกรองและแบ่งหน้าของรายการเอกสาร (ใช้ร่วมกันทุกเมนู)
   ===================================================================== */
const docFilters = {};
function docFilter(key){
  if(!docFilters[key]) docFilters[key] =
    {page:1, pageSize:5, mode:'all', date:'', from:'', to:'', months:[], year:+today().slice(0,4)};
  return docFilters[key];
}
function pageNumbers(cur, total){
  const out=[]; const range=(a,b)=>{ for(let i=a;i<=b;i++) out.push(i); };
  if(total<=7){ range(1,total); return out; }
  out.push(1);
  if(cur>3) out.push('…');
  range(Math.max(2,cur-1), Math.min(total-1,cur+1));
  if(cur<total-2) out.push('…');
  out.push(total);
  return out;
}
function applyDocFilter(key, arr){
  const f = docFilter(key);
  let list = arr.slice();
  if(f.mode==='today')      list = list.filter(x=>x.date===today());
  else if(f.mode==='date')  { if(f.date) list = list.filter(x=>x.date===f.date); }
  else if(f.mode==='range') {
    if(f.from) list = list.filter(x=>x.date>=f.from);
    if(f.to)   list = list.filter(x=>x.date<=f.to);
  }
  else if(f.mode==='month') {
    if(f.months.length) list = list.filter(x=>
      +x.date.slice(0,4)===f.year && f.months.includes(+x.date.slice(5,7)));
  }
  list = list.reverse();
  const totalPages = Math.max(1, Math.ceil(list.length/f.pageSize));
  if(f.page>totalPages) f.page = totalPages;
  if(f.page<1) f.page = 1;
  const start = (f.page-1)*f.pageSize;
  return {list, pageList:list.slice(start, start+f.pageSize), totalPages};
}
function docFilterBar(key, source){
  const f = docFilter(key);
  const yrs = source.map(x=>+x.date.slice(0,4));
  const curY = +today().slice(0,4);
  const minY = Math.min(curY-2, ...(yrs.length?yrs:[curY]));
  const maxY = Math.max(curY, ...(yrs.length?yrs:[curY]));
  const years=[]; for(let y=maxY;y>=minY;y--) years.push(y);
  const label = f.months.length
    ? f.months.slice().sort((a,b)=>a-b).map(m=>TH_MON_ABBR[m-1]).join(', ')
    : 'เลือกเดือน';
  return `
    <div class="filterbar">
      <span class="hint">แสดงเอกสาร</span>
      <div class="pill-tabs" data-fmode="${key}">${
        [['all','ทั้งหมด'],['today','วันนี้'],['date','วันที่กำหนด'],['range','ระหว่างวันที่'],['month','เลือกเดือน']]
        .map(([k,l])=>`<button data-m="${k}" aria-pressed="${f.mode===k}">${l}</button>`).join('')}</div>
      ${f.mode==='date'? `<input type="date" class="in mono" data-fdate="${key}" value="${f.date}" style="width:150px">` : ''}
      ${f.mode==='range'? `
        <span class="hint">ตั้งแต่</span><input type="date" class="in mono" data-ffrom="${key}" value="${f.from}" style="width:150px">
        <span class="hint">ถึง</span><input type="date" class="in mono" data-fto="${key}" value="${f.to}" style="width:150px">` : ''}
      ${f.mode==='month'? `
        <details class="mchk" data-fmonths="${key}">
          <summary class="btn sm">${esc(label)}</summary>
          <div class="mchk-panel">${TH_MONTHS.map((name,i)=>
            `<label><input type="checkbox" data-mn="${i+1}"${f.months.includes(i+1)?' checked':''}> ${name}</label>`).join('')}</div>
        </details>
        <span class="hint">ปี</span>
        <select class="in mono" data-fyear="${key}" style="width:100px">${
          years.map(y=>`<option value="${y}"${f.year===y?' selected':''}>${y+543}</option>`).join('')}</select>` : ''}
      ${f.mode!=='all'? `<button class="btn sm ghost" data-fclear="${key}">ล้างตัวกรอง</button>` : ''}
      <div class="spacer"></div>
      <span class="hint">แสดงต่อหน้า</span>
      <div class="pill-tabs" data-fsize="${key}">${[5,20,50].map(n=>
        `<button data-n="${n}" aria-pressed="${f.pageSize===n}">${n}</button>`).join('')}</div>
    </div>`;
}
function pagerBar(key, totalPages){
  const f = docFilter(key);
  if(totalPages<=1) return '';
  return `<div class="pager">
    <button class="btn sm ghost" data-fprev="${key}"${f.page<=1?' disabled':''}>‹ ก่อนหน้า</button>
    ${pageNumbers(f.page, totalPages).map(p=>p==='…'
      ? `<span class="hint" style="padding:0 4px">…</span>`
      : `<button class="btn sm ${p===f.page?'primary':'ghost'}" data-fpage="${key}:${p}">${p}</button>`).join('')}
    <button class="btn sm ghost" data-fnext="${key}"${f.page>=totalPages?' disabled':''}>ถัดไป ›</button>
  </div>`;
}
function bindDocFilter(key, rerender){
  const f = docFilter(key);
  const go = ()=>{ rerender(); };
  const bar = $(`[data-fmode="${key}"]`);
  if(bar) $$('button', bar).forEach(b=>b.onclick=()=>{ f.mode=b.dataset.m; f.page=1; go(); });
  const sz = $(`[data-fsize="${key}"]`);
  if(sz) $$('button', sz).forEach(b=>b.onclick=()=>{ f.pageSize=num(b.dataset.n); f.page=1; go(); });
  const d=$(`[data-fdate="${key}"]`);  if(d) d.onchange = e=>{ f.date=e.target.value; f.page=1; go(); };
  const fr=$(`[data-ffrom="${key}"]`); if(fr) fr.onchange = e=>{ f.from=e.target.value; f.page=1; go(); };
  const to=$(`[data-fto="${key}"]`);   if(to) to.onchange = e=>{ f.to=e.target.value; f.page=1; go(); };
  const yr=$(`[data-fyear="${key}"]`); if(yr) yr.onchange = e=>{ f.year=num(e.target.value); f.page=1; go(); };
  const mo=$(`[data-fmonths="${key}"]`);
  if(mo) $$('input[data-mn]', mo).forEach(cb=>cb.onchange=()=>{
    const mn = num(cb.dataset.mn);
    if(cb.checked){ if(!f.months.includes(mn)) f.months.push(mn); }
    else f.months = f.months.filter(x=>x!==mn);
    f.page=1;
    const open = mo.open; go();
    const again = $(`[data-fmonths="${key}"]`); if(again) again.open = open;
  });
  const cl=$(`[data-fclear="${key}"]`);
  if(cl) cl.onclick = ()=>{ Object.assign(f, {mode:'all', date:'', from:'', to:'', months:[], page:1}); go(); };
  const pv=$(`[data-fprev="${key}"]`); if(pv) pv.onclick = ()=>{ f.page=Math.max(1,f.page-1); go(); };
  const nx=$(`[data-fnext="${key}"]`); if(nx) nx.onclick = ()=>{ f.page=f.page+1; go(); };
  $$(`[data-fpage^="${key}:"]`).forEach(b=>b.onclick=()=>{ f.page=num(b.dataset.fpage.split(':')[1]); go(); });
}

/* ตัวสุ่มแบบกำหนดค่าเริ่มต้น เพื่อให้ข้อมูลตัวอย่างเหมือนเดิมทุกครั้งที่สร้าง */
function makeRand(seed){
  let x = seed >>> 0;
  return function(){ x = (Math.imul(x, 1103515245) + 12345) >>> 0; return x / 4294967296; };
}

const DEMO_VERSION = '2026-08-05-1y';

function buildDemoProducts(rand){
  const out = [];
  const used = new Set();
  let n = 0, guard = 0;
  while(out.length < DEMO_SIZE.products && guard++ < 5000){
    const t = PART_TEMPLATES[n % PART_TEMPLATES.length];
    const round = Math.floor(n / PART_TEMPLATES.length);
    const [cat, base, unit, cmin, cmax, prefix] = t;
    let name;
    if(prefix === 'TIR')      name = `${base} ${pick(TIRE_SIZES, round)}`;
    else if(prefix === 'BAT') name = `${base} ${pick(BAT_SPECS, round)}`;
    else                      name = `${base} ${pick(PART_MODELS, round)}`;
    if(used.has(name)) name += ` รุ่นที่ ${round+1}`;
    used.add(name);

    const cost = Math.round((num(cmin) + rand()*(num(cmax)-num(cmin))) / 5) * 5;
    const mA = 1.62 + rand()*0.5;                       /* อัตรากำไรระดับ A */
    const pA = Math.round(cost*mA/10)*10;
    const out_ = {
      id: uid(),
      code: `${prefix}-${String(101 + out.length).padStart(3,'0')}`,
      oem: `${String(10000 + Math.floor(rand()*89999))}-${String(Math.floor(rand()*9000)+1000)}`,
      name, cat, unit, cost,
      pA, pB: Math.round(pA*0.92/10)*10, pC: Math.round(pA*0.85/10)*10,
      qty:0, min:0, max:0, lastMove: today()
    };
    out.push(out_);
    n++;
  }

  /* กำหนดปริมาณและจุดเตือน ให้ครบทุกสถานะสีที่ระบบรองรับ
     ~14% ถึงจุดสั่งซื้อ · ~8% เกินระดับสูงสุด · ~10% ไม่เคลื่อนไหวเกิน 6 เดือน */
  out.forEach((p, i)=>{
    const mn = 2 + Math.floor(rand()*8);
    const mx = mn * (3 + Math.floor(rand()*4));
    p.min = mn; p.max = mx;
    const r = i % 25;
    if(r < 3)       p.qty = Math.max(0, mn - Math.floor(rand()*3));      /* ถึง Min */
    else if(r < 5)  p.qty = mx + 1 + Math.floor(rand()*8);               /* เกิน Max */
    else            p.qty = mn + 1 + Math.floor(rand()*(mx-mn));         /* ปกติ */

    const d = new Date();
    if(i % 10 === 7) d.setMonth(d.getMonth() - (6 + Math.floor(rand()*10)));   /* ค้างสต๊อก */
    else             d.setDate(d.getDate() - Math.floor(rand()*150));
    p.lastMove = iso(d);
  });
  return out;
}

  'บริษัท ไทยพาร์ท ซัพพลาย จำกัด','ร้านอะไหล่รุ่งเรืองยนต์','บริษัท ออโต้แบต จำกัด',
  'ห้างหุ้นส่วนจำกัด ยางไทยเจริญ','บริษัท เอ็มเอส ออยล์ จำกัด','ร้านกรองไทยอะไหล่ยนต์',
  'บริษัท ช่วงล่างสากล จำกัด','ห้างหุ้นส่วนจำกัด อิเล็คโทรพาร์ท','บริษัท เบรกโปร จำกัด',
  'ร้านสมชายอะไหล่เก่า-ใหม่'
];
const ROADS = ['พระราม 2','บางนา-ตราด','รามอินทรา','เพชรเกษม','สุขุมวิท','ลาดพร้าว','รัชดาภิเษก','กาญจนาภิเษก'];
const PLATE_L = ['กข','กค','งง','ฉก','ผต','บย','ขข','สท','ญย','ฆข'];

  ['Toyota','Hilux Revo 2.4 Prerunner'],['Toyota','Fortuner 2.8 V'],['Toyota','Vios 1.5 E'],
  ['Isuzu','D-Max Spark 1.9'],['Isuzu','MU-X 3.0'],['Honda','City 1.0 Turbo'],['Honda','CR-V 2.4'],
  ['Mitsubishi','Triton 2.4 GT'],['Nissan','Navara NP300'],['Mazda','2 Skyactiv'],
  ['Ford','Ranger Wildtrak'],['MG','ZS 1.5X'],['Suzuki','Carry 1.5'],['Hino','XZU720']
];

function buildDemoContacts(rand){
  const list = [];
  const addr = ()=>({no:String(10+Math.floor(rand()*280)), village:'', moo:String(1+Math.floor(rand()*12)),
    soi:'', road:pick(ROADS, Math.floor(rand()*100)), subdistrict:'บางมด', district:'จอมทอง',
    province:'กรุงเทพมหานคร', zip:'10150'});
  const tel = ()=>`0${8+Math.floor(rand()*2)}${Math.floor(rand()*10)}-${String(Math.floor(rand()*1000)).padStart(3,'0')}-${String(Math.floor(rand()*10000)).padStart(4,'0')}`;
  const taxId = ()=>String(Math.floor(rand()*9)+1)+String(Math.floor(rand()*1e12)).padStart(12,'0');

  /* ลูกค้า 20 ราย — บุคคลธรรมดา 14 · นิติบุคคล 6 */
  for(let i=0;i<DEMO_SIZE.customers;i++){
    const isCo = i >= CUST_PERSON.length;
    const nVeh = 1 + (isCo ? Math.floor(rand()*3) : (i % 4 === 0 ? 1 : 0));
    const vehicles = [];
    for(let k=0;k<nVeh;k++){
      const cm = pick(CAR_MODELS, i*2+k);
      vehicles.push({id:uid(), brand:cm[0], model:cm[1],
        year:String(2556 + Math.floor(rand()*12)), color:pick(COLORS, i+k),
        plateA:pick(PLATE_L, i+k), plateB:String(1000+Math.floor(rand()*8999)),
        plateProv:'กรุงเทพมหานคร',
        engineNo: pick(['2KD','1NZ','4D56','K24A','QR25','B15A'], i+k) + '-' + String(1000000+Math.floor(rand()*8999999)),
        chassisNo: 'MR0' + pick(['FR22G','HA8EH','KA3DH','CB1FS'], i+k) + String(10+Math.floor(rand()*89)) + 'L' + String(1000000+Math.floor(rand()*8999999)),
        mileage:String((20+Math.floor(rand()*280))*1000), lastService:''});
    }
    list.push({
      id:uid(), code:nextCustCode('customer'), kind:'customer',
      type: isCo ? 'company' : 'person',
      prefix: isCo ? '' : CUST_PERSON[i][0],
      firstName: isCo ? '' : CUST_PERSON[i][1],
      lastName:  isCo ? '' : CUST_PERSON[i][2],
      orgName:   isCo ? CUST_COMPANY[i - CUST_PERSON.length] : '',
      taxId: taxId(), addr: addr(), addrText:'',
      tel: tel(), tel2:'', email: isCo ? `contact${i}@company${i}.co.th` : (i%3===0 ? `cust${i}@example.com` : ''),
      note: isCo ? (i%2 ? 'หัก ณ ที่จ่าย 3% · เครดิต 30 วัน' : 'เครดิต 45 วัน · รถประจำบริษัท') : (i%4===0 ? 'ลูกค้าประจำ ระดับราคา B' : ''),
      creditDays:0, created:today(), vehicles
    });
  }

  /* ผู้ขาย 10 ราย */
  for(let i=0;i<DEMO_SIZE.vendors;i++){
    list.push({
      id:uid(), code:nextCustCode('vendor'), kind:'vendor', type:'company',
      prefix:'', firstName:'', lastName:'', orgName:VENDOR_NAMES[i],
      taxId: taxId(), addr: addr(), addrText:'',
      tel: `02-${String(Math.floor(rand()*900)+100)}-${String(Math.floor(rand()*9000)+1000)}`,
      tel2:'', email: i%2 ? `sales@vendor${i}.co.th` : '',
      note: pick(['ผู้ขายหลัก','รับของหน้าร้าน','ส่งของถึงอู่','ราคาดี ของครบ'], i),
      creditDays: pick([15,30,45,30,0], i), created:today(), vehicles:[]
    });
  }
  return list;
}

function seedDemo(){
  const rand = makeRand(20250804);
  DB.categories = seedCategories();
  DB.products = buildDemoProducts(rand);

  DB.seq.c = 0; DB.seq.v = 0;
  DB.customers = buildDemoContacts(rand);
  const vendors = DB.customers.filter(isVend);
  const custs   = DB.customers.filter(isCust);

  /* ---------- ใบซื้อ ---------- */
  DB.seq.p = 0; DB.purchases = [];
  for(let i=0;i<DEMO_SIZE.purchases;i++){
    const v = pick(vendors, i);
    const date = addDays(today(), -(362 - Math.floor(i*2.4)));
    const items = [];
    const nItem = 1 + Math.floor(rand()*3);
    for(let k=0;k<nItem;k++){
      const pr = DB.products[Math.floor(rand()*DB.products.length)];
      if(items.some(x=>x.pid===pr.id)) continue;
      items.push({pid:pr.id, code:pr.code, oem:pr.oem, name:pr.name, unit:pr.unit,
        qty:1+Math.floor(rand()*4), price:pr.cost});
    }
    if(i % 11 === 6){
      const free = pick(FREE_ITEMS, i+2);
      items.push({pid:null, code:'-', oem:'', name:free[0], unit:free[1], qty:2, price:Math.round(free[2]*0.62/5)*5});
    }
    const paidNow = i % 4 === 0;
    const terms = paidNow ? 'cash' : 'credit';
    const p = {id:uid(), no:`PO-${date.slice(0,4)}${date.slice(5,7)}-${String(i+1).padStart(3,'0')}`,
      date, invNo:'IV'+String(48000+i*13),
      vendorId:v.id, vendorName:custName(v), vendorTaxId:v.taxId, vendorTel:v.tel, vendorAddr:contactAddr(v),
      items, discount: i%6===0 ? 200 : 0, vatMode:'ex',
      terms, creditDays: num(v.creditDays)||30, note:'', received:true, payments:[],
      paidNow, payMethod: pick(['เงินสด','เงินโอน','บัตรเครดิต'], i), payRef:'', payDate:date};
    const t = poTotals(p);
    if(paidNow){
      p.payments.push({id:uid(), date, amount:t.payable, method:p.payMethod,
        ref:'ชำระเมื่อบันทึกใบซื้อ', atIssue:true});
    } else if(i % 3 === 1){
      p.payments.push({id:uid(), date:addDays(date, 10), amount:Math.round(t.payable*(0.3+rand()*0.4)*100)/100,
        method:'เงินโอน', ref:'โอนชำระบางส่วน'});
    } else if(i % 3 === 2){
      p.payments.push({id:uid(), date:addDays(date, num(v.creditDays)||30), amount:t.payable,
        method: rand()>0.5 ? 'เงินโอน' : 'เช็ค', ref:'ชำระครบตามกำหนด'});
    }
    DB.seq.p = i+1;
    DB.purchases.push(p);
  }

  /* ซื้อสต๊อกยางล็อตใหญ่หนึ่งครั้ง — ภาษีซื้อเดือนนั้นมากกว่าภาษีขาย
     จึงเกิดเครดิตภาษีซื้อยกไปหักในเดือนถัดไป */
  (function(){
    const v = pick(vendors, 3);
    const dd = new Date(); dd.setDate(12); dd.setMonth(dd.getMonth()-1);
    const date = iso(dd);
    const tires = DB.products.filter(p=>p.cat==='ยางและล้อ' && p.cost > 1500).slice(0, 2);
    if(!tires.length) return;
    const items = tires.map(pr=>({pid:pr.id, code:pr.code, oem:pr.oem, name:pr.name,
      unit:pr.unit, qty:30, price:pr.cost}));
    const p = {id:uid(), no:`PO-${date.slice(0,4)}${date.slice(5,7)}-${String(++DB.seq.p).padStart(3,'0')}`,
      date, invNo:'IV'+String(49500),
      vendorId:v.id, vendorName:custName(v), vendorTaxId:v.taxId, vendorTel:v.tel, vendorAddr:contactAddr(v),
      items, discount:0, vatMode:'ex', terms:'cash', creditDays:0,
      note:'สั่งยางล็อตใหญ่รับส่วนลดพิเศษ', received:true, payments:[],
      paidNow:true, payMethod:'เงินโอน', payRef:'โอนเต็มจำนวน', payDate:date};
    p.payments.push({id:uid(), date, amount:poTotals(p).payable, method:'เงินโอน',
      ref:'ชำระเมื่อบันทึกใบซื้อ', atIssue:true});
    DB.purchases.push(p);
  })();

  /* ---------- ค่าใช้จ่าย ---------- */
  DB.seq.e = 0; DB.expenses = [];
  const EX_PLAN = [
    ['rent',    'ค่าเช่าอาคารและลานจอดรถ',   15000, 5, 'monthly'],
    ['utility', 'ค่าไฟฟ้า',                   5800, 0, 'monthly'],
    ['utility', 'ค่าน้ำประปา',                 900, 0, 'monthly'],
    ['salary',  'เงินเดือนพนักงาน 3 คน',     38000, 0, 'monthly'],
    ['telecom', 'ค่าอินเทอร์เน็ตและโทรศัพท์',  1490, 0, 'monthly'],
    ['asset',   'เครื่องมือและอุปกรณ์',       38000, 0, 'once'],
    ['other',   'ค่าซ่อมบำรุงเครื่องมือ',      4500, 3, 'once']
  ];
  let exN = 0;
  for(let m=11;m>=0;m--){                      /* ย้อนหลัง 12 เดือน */
    const d = new Date(); d.setDate(5); d.setMonth(d.getMonth()-m);
    const date = iso(d);
    const ym = date.slice(0,4)+date.slice(5,7);
    EX_PLAN.forEach((plan,k)=>{
      const [cat, name, base, wht, freq] = plan;
      if(freq==='once' && m!==7) return;        /* รายการครั้งเดียวเกิดเดือนเดียว */
      const amt = Math.round(base * (0.9 + rand()*0.2) / 10) * 10;
      const vend = pick(vendors, k+m);
      const e = {id:uid(), no:`EX-${ym}-${String(++exN).padStart(3,'0')}`, date,
        cat, invNo: cat==='salary' ? '' : 'RC'+String(72000+exN*7),
        payeeId: (cat==='salary'||cat==='utility') ? null : vend.id,
        payeeName: cat==='salary' ? 'พนักงานประจำอู่'
                 : cat==='utility' ? (name.includes('ไฟ')? 'การไฟฟ้านครหลวง' : 'การประปานครหลวง')
                 : cat==='telecom' ? 'บริษัท ทรู คอร์ปอเรชั่น จำกัด (มหาชน)'
                 : cat==='rent'    ? 'นายเจริญ ผู้ให้เช่า'
                 : custName(vend),
        payeeTaxId: cat==='salary' ? '' : String(Math.floor(rand()*9)+1)+String(Math.floor(rand()*1e12)).padStart(12,'0'),
        payeeTel:'', payeeAddr:'',
        items:[{name, qty:1, price:amt}],
        discount:0, vatMode: (cat==='salary') ? 'none' : 'ex',
        whtRate: wht, terms: (m===0 && cat!=='salary') ? 'credit' : 'cash',
        creditDays:30, note:'', assetLife:5, payments:[],
        paidNow: !(m===0 && cat!=='salary'),
        payMethod: cat==='salary' ? 'เงินโอน' : pick(['เงินโอน','เงินสด','บัตรเครดิต'], k),
        payRef:'', payDate:date};
      const t = exTotals(e);
      if(e.paidNow)
        e.payments.push({id:uid(), date, amount:t.payable, method:e.payMethod,
          ref:'ชำระเมื่อบันทึกรายการ', atIssue:true});
      DB.seq.e = exN;
      DB.expenses.push(e);
    });
  }

  /* ---------- ใบเสนอราคาและใบเสร็จ ---------- */
  DB.seq.q = 0; DB.seq.r = 0; DB.quotes = []; DB.receipts = [];
  DB.invoices = []; DB.seq.iv = 0; DB.seq.ivt = 0;
  for(let i=0;i<DEMO_SIZE.sales;i++) makeSale(i);
  function makeSale(i){
    const c = pick(custs, i);
    const veh = (c.vehicles||[])[i % Math.max(1,(c.vehicles||[]).length)] || {};
    const date = addDays(today(), -(360 - Math.floor(i*1.5)));
    const ym = date.slice(0,4)+date.slice(5,7);
    const tier = pick(['A','B','C'], i);
    const tierKey = {A:'pA',B:'pB',C:'pC'}[tier];
    const items = [];
    const nPart = 1 + Math.floor(rand()*4);
    for(let k=0;k<nPart;k++){
      const pr = DB.products[Math.floor(rand()*DB.products.length)];
      if(items.some(x=>x.pid===pr.id)) continue;
      items.push({pid:pr.id, code:pr.code, oem:pr.oem, name:pr.name, unit:pr.unit,
        qty:1+Math.floor(rand()*3), price:num(pr[tierKey])});
    }
    const lb = pick(DEMO_LABOR, i);
    items.push({pid:null, code:'LAB', oem:'', name:lb[0], unit:'รายการ', qty:1, price:lb[1], svc:true});
    /* บางใบพิมพ์ชื่อของเองโดยไม่ได้ดึงจากทะเบียน — จะไปขึ้นในรายการค้างทำ */
    if(i % 9 === 4){
      const free = pick(FREE_ITEMS, i);
      items.push({pid:null, code:'-', oem:'', name:free[0], unit:free[1], qty:1+Math.floor(rand()*2), price:free[2]});
    }

    const q = {id:uid(), no:`QT-${ym}-${String(i+1).padStart(3,'0')}`, date, tier, status:'billed',
      custId:c.id, vehId:veh.id||null, custType:c.type, taxId:c.taxId, name:custName(c),
      addr:JSON.parse(JSON.stringify(c.addr)), tel:c.tel, tel2:'', email:c.email,
      veh:{brand:veh.brand||'', model:veh.model||'', year:veh.year||'', color:veh.color||'',
           plateA:veh.plateA||'', plateB:veh.plateB||'', plateProv:veh.plateProv||'',
        engineNo:veh.engineNo||'', chassisNo:veh.chassisNo||'', mileage:veh.mileage||''},
      complaints:[pick(DEMO_SYMPTOM, i), i%2? pick(DEMO_SYMPTOM, i+5) : '', i%3===0? pick(DEMO_SYMPTOM, i+9) : ''],
      findings:[pick(DEMO_FINDING, i), i%2? pick(DEMO_FINDING, i+4) : '', i%3===0? pick(DEMO_FINDING, i+8) : ''],
      items:JSON.parse(JSON.stringify(items)), discount: i%5===0 ? 150 : 0, vatMode:'ex',
      approver:custName(c), proposer: DB.shop.proposerName || 'ช่างใหญ่'};
    DB.seq.q = i+1;
    DB.quotes.push(q);

    const credit = i % 3 === 0;
    const split  = i % 7 === 3;          /* ลูกค้าจ่ายบางส่วนหน้าร้าน ที่เหลือเป็นเครดิต */
    const r = {id:uid(), no:`RC-${ym}-${String(i+1).padStart(3,'0')}`, date:addDays(date, 2),
      quoteId:q.id, quoteNo:q.no, custId:c.id, custType:c.type, taxId:c.taxId, name:custName(c),
      addr:JSON.parse(JSON.stringify(c.addr)), tel:c.tel, email:c.email,
      veh:JSON.parse(JSON.stringify(q.veh)), items:JSON.parse(JSON.stringify(items)),
      discount:q.discount, vatMode:'ex',
      whtRate: c.type==='company' ? 3 : 0,
      pay:{cash:false, cashAmt:0, transfer:false, transferAmt:0, credit:false, days:30, due:'', ref:''},
      receivedBy:'ฝ่ายการเงิน', deducted:true, payments:[]};
    const t = recTotals(r);
    if(split){                                   /* จ่ายเงินสดบางส่วน ที่เหลือเป็นเครดิต */
      r.pay.cashAmt = Math.round(t.payable*(0.3+rand()*0.3)/10)*10;
    } else if(!credit){                          /* รับครบหน้าร้าน */
      r.pay.cashAmt = t.payable;
    }                                            /* credit ล้วน = ไม่รับเงินวันนี้ */
    syncIssuePayments(r);
    if(credit && !split && i % 6 === 0){         /* เครดิตที่ตามเก็บได้บางส่วนภายหลัง */
      r.payments.push({id:uid(), date:addDays(r.date, 12), amount:Math.round(t.payable*0.5*100)/100,
        method:'เงินโอน', ref:'รับชำระบางส่วน'});
    }
    /* เส้นทางเอกสาร — ลูกค้านิติบุคคลบางส่วนออกใบส่งมอบ/ใบแจ้งหนี้ก่อน
       flow A ออกใบเสร็จตรง · flow B ผ่านใบส่งมอบแล้วเก็บเงินแล้ว · flow C ใบส่งมอบที่ยังไม่เก็บเงิน */
    const viaInv = c.type === 'company' && i % 3 !== 2;
    const unpaidInv = viaInv && i % 9 === 4;
    if(viaInv){
      const kind = (i % 4 === 1) ? 'IV' : 'IVT';
      const K = SALES_KINDS[kind];
      DB.seq[K.seq] = (DB.seq[K.seq]||0) + 1;
      const inv = {id:uid(), kind, no:`${K.prefix}-${ym}-${String(DB.seq[K.seq]).padStart(3,'0')}`,
        date:addDays(date, 1), quoteId:q.id, quoteNo:q.no, invId:null, invNo:'',
        custId:c.id, custType:c.type, taxId:c.taxId, name:custName(c),
        addr:JSON.parse(JSON.stringify(c.addr)), addrText:'', tel:c.tel, email:c.email,
        veh:JSON.parse(JSON.stringify(q.veh)), items:JSON.parse(JSON.stringify(items)),
        discount:q.discount, vatMode: kind==='IVT' ? 'ex' : 'none',
        whtRate:3, creditDays:30,
        warranty:'รับประกันงานซ่อม 3 เดือน หรือ 5,000 กิโลเมตร แล้วแต่อย่างใดถึงก่อน',
        pay:{cash:false, cashAmt:0, transfer:false, transferAmt:0, card:false, cardAmt:0, cardRef:'',
             credit:true, days:30, due:'', ref:''},
        receivedBy:'ช่างใหญ่', deducted:true, payments:[], receiptId:null, receiptNo:''};
      DB.invoices.push(inv);
      if(unpaidInv){ DB.seq.r = Math.max(DB.seq.r, i); return; }   /* ยังไม่เก็บเงิน */
      /* ใบเสร็จอ้างอิงใบส่งมอบ */
      Object.assign(r, {invId:inv.id, invNo:inv.no, vatMode:inv.vatMode, whtRate:inv.whtRate,
        warranty:inv.warranty, date:addDays(inv.date, 25)});
      r.payments = [];
      r.pay.cashAmt = 0; r.pay.transferAmt = recTotals(r).payable; r.pay.cardAmt = 0;
      syncIssuePayments(r);
      inv.receiptId = r.id; inv.receiptNo = r.no;
      inv.payments = [{id:uid(), date:r.date, amount:paidOf(r), method:'เงินโอน',
        ref:'รับชำระตามใบเสร็จ '+r.no, fromReceipt:r.id}];
    }
    DB.seq.r = i+1;
    DB.receipts.push(r);
  }
  DB.demoSeeded = true;
  DB.demoVersion = DEMO_VERSION;
}

/* ระบบยังว่างอยู่หรือไม่ — ใช้ตัดสินว่าควรเชิญให้สร้างข้อมูลทดสอบ */
function hasPreDemoBackup(){
  try{ return !!localStorage.getItem(BACKUP_KEY); }catch(e){ return false; }
}
function preDemoBackupDate(){
  try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)).savedAt; }catch(e){ return today(); }
}
function isSystemEmpty(){
  return !DB.quotes.length && !DB.receipts.length && !DB.purchases.length
      && !DB.expenses.length && !DB.invoices.length;
}
function demoInviteHtml(key){
  if(DB.demoSeeded || DB.demoDismissed || !isSystemEmpty()) return '';
  return `
    <div class="invite">
      <div class="txt"><b>ยังไม่มีข้อมูลในระบบ</b>
        ต้องการทดลองใช้งานก่อนหรือไม่ ระบบสร้างชุดข้อมูลทดสอบให้ได้ทันที

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> Math.random().toString(36).slice(2,10);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n=parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:0; };
const money = n => (Math.round(num(n)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
/* ใช้ค่าปี/เดือน/วันตามเวลาเครื่อง (local) ไม่ใช้ toISOString() เพราะ toISOString()
   แปลงเป็น UTC ก่อนเสมอ ซึ่งสำหรับเขตเวลาไทย (UTC+7) จะทำให้ได้วันที่ก่อนหน้า 1 วัน
   ทุกครั้งที่แปลงวันที่แบบ local-midnight กลับเป็นสตริง (พบบั๊กนี้ตอนตรวจสอบระบบ
   ออกรหัสลิขสิทธิ์ — ทำให้วันหมดอายุที่ถอดได้คลาดเคลื่อนไป 1 วันเสมอ) */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = ()=> iso(new Date());
const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                   "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_MON_ABBR = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function thDate(s){
  if(!s) return '-';
  const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return `${d.getDate()} ${TH_MON_ABBR[d.getMonth()]} ${d.getFullYear()+543}`;
}
/* วันที่แบบเต็ม — วัน เดือน ปี พ.ศ. ใช้บนเอกสาร */
function thDateLong(s){
  if(!s) return '-';
  const d = new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return `${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}

/* วันที่แบบย่อ วว/ดด/ปป สำหรับตารางที่มีคอลัมน์แคบ */
function numDate(s){
  if(!s) return '-';
  const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()+543).slice(-2)}`;
}
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+num(n)); return iso(d); }
function monthsSince(s){
  if(!s) return 999;
  const d=new Date(s+'T00:00:00'), n=new Date();
  return (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth()) - (n.getDate()<d.getDate()?1:0);
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
/* ช่องกรอกที่พิมพ์เองได้ พร้อมรายการแนะนำสูงสุด 8 รายการ
   ใช้กับยี่ห้อรถและจังหวัด ซึ่งมีรายการมาตรฐานแต่ต้องเผื่อค่าที่ไม่มีในรายการ */
const COMBO_MAX = 8;
function comboSuggest(src, kw){
  const q = String(kw||'').trim().toLowerCase();
  if(!q) return src.slice(0, COMBO_MAX);
  const starts = src.filter(v=>String(v).toLowerCase().startsWith(q));
  const has    = src.filter(v=>!starts.includes(v) && String(v).toLowerCase().includes(q));
  return starts.concat(has).slice(0, COMBO_MAX);
}
function comboInput(id, value, srcName, ph, cls, extra){
  const list = id+'_dl';
  return `<input class="${cls||'in'}" id="${id}" list="${list}" value="${esc(value||'')}"
      placeholder="${esc(ph||'')}" autocomplete="off" data-combo="${srcName}"${extra||''}>
    <datalist id="${list}">${comboSuggest(window[srcName]||[], value).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
}
/* ผูกให้รายการแนะนำเปลี่ยนตามที่พิมพ์ และจำกัดไว้ 8 รายการเสมอ */
function bindCombos(root){
  $$('[data-combo]', root || document).forEach(el=>{
    if(el._combo) return; el._combo = true;
    el.addEventListener('input', ()=>{
      const src = window[el.dataset.combo] || [];
      const dl = document.getElementById(el.id+'_dl');
      if(dl) dl.innerHTML = comboSuggest(src, el.value).map(v=>`<option value="${esc(v)}">`).join('');
    });
  });
}

function opts(list, sel, ph){
  return (ph!==undefined?`<option value="">${esc(ph)}</option>`:'') +
    list.map(v=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(v)}</option>`).join('');
}
function bahttext(n){
  n = Math.round(num(n)*100)/100;
  if(n===0) return "ศูนย์บาทถ้วน";
  const T=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], P=["","สิบ","ร้อย","พัน","หมื่น","แสน","ล้าน"];
  function chunk(s){
    let out=""; const L=s.length;
    for(let i=0;i<L;i++){
      const d=+s[i], pos=L-i-1;
      if(d===0) continue;
      if(pos===0 && d===1 && L>1) out+="เอ็ด";
      else if(pos===1 && d===1) out+="สิบ";
      else if(pos===1 && d===2) out+="ยี่สิบ";
      else out+=T[d]+P[pos];
    }
    return out;
  }
  function whole(s){
    s=String(s);
    if(s.length>6){ return whole(s.slice(0,s.length-6))+"ล้าน"+(+s.slice(-6)? chunk(s.slice(-6)) : ""); }
    return chunk(s);
  }
  const b=Math.floor(n), st=Math.round((n-b)*100);
  return (b?whole(b):"ศูนย์")+"บาท"+(st? chunk(String(st))+"สตางค์" : "ถ้วน");
}

function flagsOf(p){
  const f=[];
  if(num(p.qty) <= num(p.min)) f.push('min');
  if(num(p.qty) >  num(p.max)) f.push('max');
  if(monthsSince(p.lastMove) >= 6) f.push('dead');
  return f;
}
const FLAG_LABEL = {min:'ถึงจุดสั่งซื้อ (Min)', max:'เกินระดับสูงสุด (Max)', dead:'ไม่เคลื่อนไหว ≥ 6 เดือน'};
function tagHTML(p){
  const f = flagsOf(p);
  const cls = f.includes('min')?'min': f.includes('max')?'max': f.includes('dead')?'dead':'';
  const dots = f.length>1 ? `<span class="dots">${f.map(x=>`<span class="dot ${x}" title="${FLAG_LABEL[x]}"></span>`).join('')}</span>` : '';
  const title = f.length? f.map(x=>FLAG_LABEL[x]).join(' · ') : 'ปกติ';
  return `<span class="tag ${cls}" title="${title}">${esc(p.code)}</span>${dots}`;
}

  if(!$('#view-stocklist')) return;
  const list = DB.products.filter(p=>{
    const q = stockFilter.q.trim().toLowerCase();
    const hit = !q || [p.code,p.oem,p.name,p.cat].some(v=>String(v||'').toLowerCase().includes(q));
    if(!hit) return false;
    if(stockFilter.cat!=='all' && (p.cat||'')!==stockFilter.cat) return false;
    if(stockFilter.flag==='all') return true;
    return flagsOf(p).includes(stockFilter.flag);
  });
  const cnt = {min:0,max:0,dead:0};
  DB.products.forEach(p=>flagsOf(p).forEach(f=>cnt[f]++));
  const value = DB.products.reduce((s,p)=>s+num(p.qty)*num(p.cost),0);

  /* แบ่งหน้า — ตารางที่มีหลายพันแถวจะวาดช้าจนใช้งานไม่ทัน */
  const stkPages = Math.max(1, Math.ceil(list.length / stockFilter.pageSize));
  if(stockFilter.page > stkPages) stockFilter.page = stkPages;
  if(stockFilter.page < 1) stockFilter.page = 1;
  const stkStart = (stockFilter.page - 1) * stockFilter.pageSize;
  const pageList = list.slice(stkStart, stkStart + stockFilter.pageSize);

  $('#view-stocklist').innerHTML = `

    ${pendingCount() ? `<div class="pendbar">

        เป็นชื่อสินค้าที่พิมพ์ลงในเอกสารเองโดยไม่ได้ดึงจากทะเบียน จึงยังไม่ถูกตัดสต๊อกและไม่นับในมูลค่าสต๊อก</div>
      <button class="btn" id="stkGoPending">ไปจัดการ</button>

      <div><span>ถึงจุดสั่งซื้อ</span><b style="color:var(--warn)">${cnt.min}</b></div>
      <div><span>เกิน Max</span><b style="color:var(--danger)">${cnt.max}</b></div>
      <div><span>ไม่เคลื่อนไหว ≥6 เดือน</span><b style="color:var(--flag-dead-ink)">${cnt.dead}</b></div>
      ${colOn('cost')
        ? `<div><span>มูลค่าสต๊อกตามต้นทุน</span><b>${money(value)}</b></div>`
        : `<div><span>มูลค่าสต๊อก</span><b style="color:var(--ink-3);font-size:15px">ซ่อนไว้</b></div>`}
    </div>

    ${DB.products.length>=MAX_PRODUCTS*0.9 ? `<div style="margin-bottom:14px;padding:11px 15px;border-radius:6px;font-size:13px;line-height:1.7;
      background:${DB.products.length>=MAX_PRODUCTS?'#FCF1F0':'#FCF3E2'};border:1px solid ${DB.products.length>=MAX_PRODUCTS?'#EFCFCB':'#EEDBB4'};
      color:${DB.products.length>=MAX_PRODUCTS?'var(--danger)':'var(--warn)'}">
      ${DB.products.length>=MAX_PRODUCTS

        : `<b>ทะเบียนอะไหล่ใกล้เต็ม</b> — ใช้ไปแล้ว ${DB.products.length.toLocaleString()} จาก ${MAX_PRODUCTS.toLocaleString()} รายการ เหลืออีก ${(MAX_PRODUCTS-DB.products.length).toLocaleString()} รายการ`}
      </div>` : ''}

        </select>
        <div class="spacer"></div>
        ${colPickerHtml()}
        <button class="btn sm" id="stkPrint">พิมพ์รายการสต๊อก</button>
        <div class="legend">
          <span><i style="background:var(--flag-min-bg)"></i>ถึง Min</span>

            ${colOn('cost')?`<th class="num" style="width:92px" data-hide="sm">ต้นทุน</th>`:''}
            <th class="num" style="width:88px">ราคา A</th>
            ${colOn('pB')?`<th class="num" style="width:88px" data-hide="md">ราคา B</th>`:''}

    </div>
    <div class="sec-title">ราคา</div>
    <div class="grid g4">
      <div><label class="f">4. ต้นทุน</label><input class="in mono num" id="f_cost" value="${p.cost}"></div>
      <div><label class="f">5. ราคาขาย ระดับ A</label><input class="in mono" id="f_pA" value="${p.pA}"></div>

      <div><label class="f">ราคาขาย ระดับ C</label><input class="in mono" id="f_pC" value="${p.pC}"></div>
    </div>

      <div><label class="f">คงเหลือปัจจุบัน</label><input class="in mono" id="f_qty" value="${p.qty}"></div>

      <div><label class="f">Max — เกินระดับนี้ขึ้นสีแดงอ่อน</label><input class="in mono" id="f_max" value="${p.max}"></div>
      <div><label class="f">วันที่เคลื่อนไหวล่าสุด</label><input type="date" class="in" id="f_last" value="${p.lastMove||today()}"></div>
    </div>
  `, [
    id? {label:'ลบสินค้า', cls:'btn danger', act:()=>{ if(confirm('ลบสินค้านี้ออกจากระบบ?')){ DB.products=DB.products.filter(x=>x.id!==id); saveDB(); closeModal(); done(); toast('ลบสินค้าแล้ว'); } }} : null,
    {label:'ยกเลิก', cls:'btn', act:closeModal},
    {label:'บันทึก', cls:'btn primary', act:()=>{
      if(!requireLicense()) return closeModal();
      if(!id && DB.products.length >= MAX_PRODUCTS)
        return toast(`บันทึกอะไหล่ได้สูงสุด ${MAX_PRODUCTS.toLocaleString()} รายการ — ลบรายการที่เลิกใช้ก่อน`);
      const code=$('#f_code').value.trim(), name=$('#f_name').value.trim();
      if(!code||!name) return toast('กรอกรหัสสินค้าและชื่อสินค้าก่อน');
      const rec = {id: id||uid(), code, oem:$('#f_oem').value.trim(), name,
        cat: $('#f_cat').value==='__new__' ? (p.cat||'') : $('#f_cat').value,
        unit:$('#f_unit').value.trim()||'ชิ้น',

  /* เลือก “เพิ่มหมวดหมู่ใหม่” ในรายการดรอปดาวน์ */

    toast('เพิ่มหมวดหมู่ '+n+' แล้ว');
  };

/* =====================================================================
   ภาษีมูลค่าเพิ่ม — เครดิตภาษีซื้อยกไปเดือนถัดไป
   ===================================================================== */
function vatMonthKeys(){
  const ks = new Set();
  salesDocs().forEach(r=>ks.add(r.date.slice(0,7)));
  DB.purchases.forEach(p=>ks.add(p.date.slice(0,7)));
  DB.expenses.forEach(e=>ks.add(e.date.slice(0,7)));
  return [...ks].sort();
}
function vatOfMonth(k){
  const out = salesDocs().filter(r=>r.date.slice(0,7)===k).reduce((s,r)=>s+recTotals(r).vat, 0);
  const inn = DB.purchases.filter(p=>p.date.slice(0,7)===k).reduce((s,p)=>s+poTotals(p).vat, 0)
            + DB.expenses.filter(e=>e.date.slice(0,7)===k).reduce((s,e)=>s+exTotals(e).vat, 0);
  return {out:Math.round(out*100)/100, in:Math.round(inn*100)/100};
}
/* ไล่คำนวณทีละเดือนตามลำดับเวลา — เดือนใดภาษีซื้อมากกว่าภาษีขาย
   ส่วนเกินจะกลายเป็นเครดิตยกไปหักในเดือนถัดไป */
function vatChain(){
  let carry = 0;
  return vatMonthKeys().map(k=>{
    const v = vatOfMonth(k);
    const carryIn = carry;
    const net = Math.round((v.out - v.in - carryIn)*100)/100;
    const payable  = net > 0 ? net : 0;
    const carryOut = net < 0 ? -net : 0;
    carry = carryOut;
    return {key:k, out:v.out, in:v.in, carryIn, payable, carryOut};
  });
}
/* เครดิตที่ยกมา ณ ต้นงวดที่เลือก */
function vatCarryInto(fromKey){
  if(!fromKey) return 0;
  let carry = 0;
  vatChain().forEach(m=>{ if(m.key < fromKey) carry = m.carryOut; });
  return carry;
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return `${TH_MON_ABBR[m-1]} ${y+543}`;
}

/* =====================================================================
   หน้า 01 — หน้าแรก (สรุปภาพรวมกิจการ)

function homePeriod(){
  const d = new Date(), y = d.getFullYear();
  if(homeRange==='month') return {from:iso(new Date(y, d.getMonth(), 1)), to:iso(new Date(y, d.getMonth()+1, 0)),
                                  label:`${TH_MONTHS[d.getMonth()]} ${y+543}`};
  if(homeRange==='year')  return {from:`${y}-01-01`, to:`${y}-12-31`, label:`ปี ${y+543}`};
  return {from:'', to:'', label:'ทั้งหมด'};
}

const PREFIXES = ["นาย","นาง","นางสาว","ด.ช.","ด.ญ.","ว่าที่ ร.ต.","ร.ต.","ร.ท.","ร.อ.","พ.ต.","พ.ท.","พ.อ.","ดร.","อื่น ๆ"];

const KIND_CHIP  = {customer:'ok', vendor:'warn', both:'dead'};
function isCust(c){ return c.kind !== 'vendor'; }
function isVend(c){ return c.kind === 'vendor' || c.kind === 'both'; }
function vendorList(){ return DB.customers.filter(isVend); }
function contactAddr(c){ return c.addrText || (addrLine(c.addr)==='-' ? '' : addrLine(c.addr)); }

function nextCustCode(kind){
  DB.seq = DB.seq || {q:0,r:0,c:0,p:0,v:0};
  if(kind === 'vendor'){ DB.seq.v = (DB.seq.v||0)+1; return 'VEN-'+String(DB.seq.v).padStart(4,'0'); }
  DB.seq.c = (DB.seq.c||0)+1;
  return 'CUS-'+String(DB.seq.c).padStart(4,'0');
}
function custName(c){
  if(!c) return '';
  return c.type==='company' ? (c.orgName||'') : [c.prefix,c.firstName,c.lastName].filter(Boolean).join(' ');
}
function blankVehicle(){ return {id:uid(), brand:'', model:'', year:'', color:'',
  plateA:'', plateB:'', plateProv:'', engineNo:'', chassisNo:'', mileage:'', lastService:''}; }

/* หมายเลขเครื่องยนต์และตัวถังใช้ร่วมกันหลายที่ — รวมเป็นข้อความบรรทัดเดียว */
function vehIdLine(v){
  if(!v) return '';
  const a = [];
  if(String(v.engineNo||'').trim())  a.push('เลขเครื่องยนต์ ' + String(v.engineNo).trim());
  if(String(v.chassisNo||'').trim()) a.push('เลขตัวถัง ' + String(v.chassisNo).trim());
  return a.join(' · ');
}
function blankCustomer(kind){
  return {id:uid(), code:'', kind:kind||'customer', type:'person', prefix:'นาย', firstName:'', lastName:'', orgName:'', taxId:'',
    addr:{no:'',village:'',moo:'',soi:'',road:'',subdistrict:'',district:'',province:'',zip:''},
    addrText:'', tel:'', tel2:'', email:'', note:'', creditDays:0, created:today(), vehicles:[blankVehicle()]};
}
function plateOf(v){ return [v.plateA,v.plateB].filter(Boolean).join(' ') || '-'; }
function vendHistory(c){
  const ps = DB.purchases.filter(p=>p.vendorId===c.id);
  const spent = ps.reduce((s,p)=>s+poTotals(p).payable, 0);
  const owe = ps.reduce((s,p)=>s+Math.max(0, poTotals(p).payable - paidOf(p)), 0);
  const last = ps.map(p=>p.date).sort().slice(-1)[0] || '';
  return {purchases:ps, spent, owe, last};
}
function custHistory(c){
  const qs = DB.quotes.filter(q=>q.custId===c.id);
  const rs = salesDocs().filter(r=>r.custId===c.id ||
    DB.quotes.some(q=>q.id===r.quoteId && q.custId===c.id));
  const spent = rs.reduce((s,r)=>s+recTotals(r).payable,0);
  const owe = rs.reduce((s,r)=>s+Math.max(0, recTotals(r).payable - paidOf(r)), 0);
  const last = qs.map(q=>q.date).sort().slice(-1)[0] || '';
  return {quotes:qs, receipts:rs, spent, owe, last};
}

/* บันทึกลูกค้าที่กรอกในใบเสนอราคาเข้าทะเบียน */
function saveQuoteCustomer(){
  if(!requireLicense()) return;
  collectQuote();
  const q = curQuote;
  if(!q.name) return toast('กรอกชื่อลูกค้าก่อน');
  let c = q.custId ? DB.customers.find(x=>x.id===q.custId) : null;
  const isNew = !c;
  if(isNew){ c = blankCustomer('customer'); c.code = nextCustCode('customer'); c.vehicles = []; }
  c.type = q.custType; c.taxId = q.taxId; c.tel = q.tel; c.tel2 = q.tel2; c.email = q.email;
  c.addr = JSON.parse(JSON.stringify(q.addr));
  if(q.custType==='company'){ c.orgName = q.name; }
  else {
    const p = q.name.trim().split(/\s+/);
    const pre = PREFIXES.includes(p[0]) ? p.shift() : (c.prefix||'');
    c.prefix = pre; c.firstName = p.shift()||''; c.lastName = p.join(' ');
  }
  const V = q.veh;
  if(V.brand || V.model || V.plateB){
    let v = q.vehId ? (c.vehicles||[]).find(x=>x.id===q.vehId) : null;
    if(!v){ v = blankVehicle(); c.vehicles = c.vehicles||[]; c.vehicles.push(v); q.vehId = v.id; }
    Object.assign(v, {brand:V.brand, model:V.model, year:V.year, color:V.color,
      plateA:V.plateA, plateB:V.plateB, plateProv:V.plateProv,
      engineNo:V.engineNo||'', chassisNo:V.chassisNo||'',
      mileage:V.mileage, lastService:q.date});
  }
  if(isNew) DB.customers.push(c);
  q.custId = c.id;
  saveDB(); renderQuote();
  toast(isNew? 'เพิ่มลูกค้า '+c.code+' เข้าทะเบียนแล้ว' : 'ปรับปรุงข้อมูลลูกค้า '+c.code+' แล้ว');
}

function nextPoNo(){
  const d=new Date(), ym=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
  DB.seq.p = (DB.seq.p||0)+1;
  return `PO-${ym}-${String(DB.seq.p).padStart(3,'0')}`;
}

function blankPurchase(){
  return {id:uid(), no:nextPoNo(), date:today(), invNo:'',
    vendorId:null, vendorName:'', vendorTaxId:'', vendorTel:'', vendorAddr:'',
    items:[], discount:0, vatMode:'ex',
    terms:'credit', creditDays:30, note:'', received:false, payments:[],
    paidNow:false, payMethod:'เงินสด', payRef:'', payDate:''};
}
/* ยอดของใบซื้อ — ฝั่งซื้อไม่มีการหักภาษี ณ ที่จ่าย ยอดที่ต้องจ่ายจึงเท่ากับยอดรวมทั้งสิ้น */
function poTotals(p){
  const t = totalsOf(p);
  return Object.assign(t, {wht:0, payable: t.grand});
}
function poDue(p){ return p.terms==='credit' ? addDays(p.date, p.creditDays) : p.date; }

/* ช่องทางการชำระเงินที่ระบบรองรับ */
const PAY_METHODS = ['เงินสด', 'เงินโอน', 'บัตรเครดิต'];

/* จำนวนเงินที่ชำระไปแล้วจากเมนูบัญชี/การเงิน (ไม่นับที่บันทึกตอนออกเอกสาร) */
function laterPaidOf(doc){
  return Math.round((doc.payments||[]).filter(x=>!x.atIssue)
    .reduce((s,x)=>s+num(x.amount), 0) * 100) / 100;
}
/* ปรับรายการชำระให้ตรงกับสถานะ "ชำระเงินแล้ว" ของเอกสาร */
function syncDocPayment(doc, totalFn, label){
  const total = totalFn(doc);
  const later = laterPaidOf(doc);
  doc.payments = (doc.payments||[]).filter(x=>!x.atIssue);
  if(doc.paidNow){
    const amt = Math.round((total - later)*100)/100;
    if(amt > 0.004)
      doc.payments.unshift({id:uid(), date:doc.payDate||doc.date, amount:amt,
        method:doc.payMethod||'เงินสด', ref:doc.payRef||label, atIssue:true});
  }
  doc.terms = doc.paidNow ? 'cash' : 'credit';
  return doc;
}
const syncPoPayment = p => syncDocPayment(p, x=>poTotals(x).payable, 'ชำระเมื่อบันทึกใบซื้อ');
const syncExPayment = e => syncDocPayment(e, x=>exTotals(x).payable, 'ชำระเมื่อบันทึกรายการ');

function paidOf(doc){ return Math.round((doc.payments||[]).reduce((s,x)=>s+num(x.amount),0)*100)/100; }
function payState(total, paid){
  if(paid <= 0.004) return 'unpaid';
  return paid + 0.004 < total ? 'partial' : 'paid';
}
const STATE_LABEL = {unpaid:'ค้างชำระ', partial:'ตัดชำระบางส่วน', paid:'ชำระแล้ว'};
const STATE_CHIP  = {unpaid:'max', partial:'warn', paid:'ok'};
function stateChip(total, paid){
  const st = payState(total, paid);
  return `<span class="chip ${STATE_CHIP[st]}">${STATE_LABEL[st]}</span>`;
}

function collectPo(){
  const p = curPo; if(!$('#po_vname')) return;
  p.vendorName=$('#po_vname').value.trim(); p.vendorTaxId=$('#po_vtax').value.trim();
  p.vendorTel=$('#po_vtel').value.trim(); p.vendorAddr=$('#po_vaddr').value.trim();
  p.date=$('#po_date').value||today(); p.invNo=$('#po_inv').value.trim();
  p.paidNow = $('#po_paid').checked;
  if($('#po_method'))  p.payMethod = $('#po_method').value;
  if($('#po_payDate')) p.payDate   = $('#po_payDate').value;
  if($('#po_ref'))     p.payRef    = $('#po_ref').value.trim();
  if($('#po_days'))    p.creditDays = num($('#po_days').value)||0;
  p.terms = p.paidNow ? 'cash' : 'credit';
  p.note=$('#po_note').value.trim();
  const d=$('#po_discount'), v=$('#po_vatMode');
  if(d) p.discount=num(d.value); if(v) p.vatMode=v.value;
}

function savePoVendor(){
  if(!requireLicense()) return;
  collectPo();
  const p = curPo;
  if(!p.vendorName) return toast('กรอกชื่อผู้ขายก่อน');
  let v = p.vendorId ? DB.customers.find(x=>x.id===p.vendorId) : null;
  const isNew = !v;
  if(isNew){ v = blankCustomer('vendor'); v.code = nextCustCode('vendor'); v.vehicles = []; }
  if(v.kind === 'customer') v.kind = 'both';
  v.type = 'company';
  v.orgName = p.vendorName;
  Object.assign(v, {taxId:p.vendorTaxId, tel:p.vendorTel, addrText:p.vendorAddr,
    creditDays: p.terms==='credit' ? p.creditDays : num(v.creditDays)});
  if(isNew) DB.customers.push(v);
  p.vendorId = v.id;
  saveDB(); renderPoRecord();
  toast(isNew? 'เพิ่มผู้ขาย '+v.code+' เข้าทะเบียนแล้ว' : 'ปรับปรุงข้อมูลผู้ขาย '+v.code+' แล้ว');
}

function savePurchase(){
  if(!requireLicense()) return;
  collectPo();
  const p = curPo;
  if(!p.vendorName) return toast('กรอกชื่อผู้ขายก่อนบันทึก');
  if(!p.items.length) return toast('เพิ่มรายการสินค้าอย่างน้อยหนึ่งรายการ');
  if(p.items.some(it=>!String(it.name||'').trim())) return toast('กรอกชื่อรายการให้ครบทุกบรรทัด');

  const recv = $('#po_recv') && $('#po_recv').checked && !p.received;
  if(recv){
    p.items.forEach(it=>{ if(it.pid){ const x=DB.products.find(y=>y.id===it.pid);
      if(x){ x.qty = num(x.qty) + num(it.qty); x.lastMove = p.date; if(num(it.price)>0) x.cost = num(it.price); } } });
    p.received = true;
  }
  /* ติ๊กชำระเงินแล้ว = ตัดเจ้าหนี้ให้ทันที · ไม่ติ๊ก = ตั้งเป็นเจ้าหนี้ค้างชำระ */
  const t = poTotals(p);
  syncPoPayment(p);

  const i = DB.purchases.findIndex(x=>x.id===p.id);
  const copy = JSON.parse(JSON.stringify(p));
  if(i>=0) DB.purchases[i]=copy; else DB.purchases.push(copy);
  curPo = copy;
  saveDB(); renderExpense(); renderStock();
  const owe = Math.max(0, poTotals(copy).payable - paidOf(copy));
  toast('บันทึกใบซื้อ '+copy.no+' แล้ว' + (recv?' และรับเข้าสต๊อกเรียบร้อย':'')
    + (copy.paidNow && owe<=0.004 ? ` · ชำระด้วย${copy.payMethod||'เงินสด'}แล้ว ตัดเจ้าหนี้เรียบร้อย`
      : ` · ตั้งเป็นเจ้าหนี้ค้างจ่าย ${money(owe)}`));
}

function nextExNo(){
  const d=new Date(), ym=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
  DB.seq.e = (DB.seq.e||0)+1;
  return `EX-${ym}-${String(DB.seq.e).padStart(3,'0')}`;
}
function blankExpense(cat){
  return {id:uid(), no:nextExNo(), date:today(), cat:cat||'rent', invNo:'',
    payeeId:null, payeeName:'', payeeTaxId:'', payeeTel:'', payeeAddr:'',
    items:[{name:'', qty:1, price:0}], discount:0, vatMode:'none',
    whtRate:catWht(cat||'rent'), terms:'cash', creditDays:30, note:'',
    assetLife:5, payments:[], paidNow:true, payMethod:'เงินสด', payRef:'', payDate:''};
}
/* ค่าใช้จ่ายมีการหักภาษี ณ ที่จ่าย เพราะอู่เป็นผู้จ่ายเงินและมีหน้าที่หักนำส่ง */
function exTotals(e){
  const t = totalsOf(e);
  const wht = Math.round(t.net * num(e.whtRate)) / 100;
  return Object.assign(t, {wht, payable: Math.round((t.grand - wht)*100)/100});
}
function exDue(e){ return e.terms==='credit' ? addDays(e.date, e.creditDays) : e.date; }
function exOutstanding(e){ return Math.round((exTotals(e).payable - paidOf(e))*100)/100; }

  e.date=$('#ex_date').value||today();     e.invNo=$('#ex_inv').value.trim();
  e.paidNow = $('#ex_paid').checked;
  if($('#ex_method'))  e.payMethod = $('#ex_method').value;
  if($('#ex_payDate')) e.payDate   = $('#ex_payDate').value;
  if($('#ex_ref'))     e.payRef    = $('#ex_ref').value.trim();
  if($('#ex_days'))    e.creditDays = num($('#ex_days').value)||0;
  e.terms = e.paidNow ? 'cash' : 'credit';
  e.note=$('#ex_note').value.trim();
  if($('#ex_life')) e.assetLife = num($('#ex_life').value)||5;
  const d=$('#ex_discount'), v=$('#ex_vatMode'), w=$('#ex_wht');

function saveExpense(){
  if(!requireLicense()) return;
  collectEx();
  const e = curEx;
  if(!e.payeeName) return toast('กรอกชื่อผู้รับเงินก่อนบันทึก');
  if(!e.items.some(it=>String(it.name||'').trim() && num(it.price)>0))
    return toast('กรอกรายละเอียดและจำนวนเงินอย่างน้อยหนึ่งบรรทัด');
  e.items = e.items.filter(it=>String(it.name||'').trim() || num(it.price)>0);

  const t = exTotals(e);
  syncExPayment(e);

  const i = DB.expenses.findIndex(x=>x.id===e.id);
  const copy = JSON.parse(JSON.stringify(e));
  if(i>=0) DB.expenses[i]=copy; else DB.expenses.push(copy);
  curEx = copy;
  saveDB(); renderExpense();
  const owe = Math.max(0, exTotals(copy).payable - paidOf(copy));
  toast('บันทึก '+copy.no+' แล้ว'
    + (copy.paidNow && owe<=0.004 ? ` · จ่ายด้วย${copy.payMethod||'เงินสด'}แล้ว` : ` · ตั้งเป็นเจ้าหนี้ค้างจ่าย ${money(owe)}`)
    + (t.wht>0.004 ? ` · หักภาษี ณ ที่จ่ายไว้ ${money(t.wht)}` : ''));
}

const FINDING_LINES = 3;
const QUOTE_ROWS = 8;      /* จำนวนบรรทัดในตารางรายการของใบเสนอราคาที่พิมพ์ */
/* เอกสารรุ่นก่อนเก็บช่องตรวจพบไว้ 10 ช่อง — ย่อให้เหลือ 3 บรรทัดโดยไม่ทิ้งข้อความเดิม */
function normFindings(arr){
  const filled = (arr||[]).map(x=>String(x||'').trim()).filter(Boolean);
  const out = filled.slice(0, FINDING_LINES);
  if(filled.length > FINDING_LINES)
    out[FINDING_LINES-1] = filled.slice(FINDING_LINES-1).join(' · ');
  while(out.length < FINDING_LINES) out.push('');
  return out;
}

function collectQuote(){

  q.custType=$('#q_custType').value; q.taxId=$('#q_taxId').value.trim(); q.name=$('#q_name').value.trim();
  ['no','village','moo','soi','road','subdistrict','district','province','zip'].forEach(k=>q.addr[k]=$('#a_'+k).value.trim());
  q.tel=$('#q_tel').value.trim(); q.tel2=$('#q_tel2').value.trim(); q.email=$('#q_email').value.trim();
  ['brand','model','year','color','plateA','plateB','plateProv','engineNo','chassisNo','mileage']
    .forEach(k=>{ const el=$('#v_'+k); if(el) q.veh[k]=el.value.trim(); });
  q.complaints=q.complaints.map((_,i)=>$('#c_'+i).value.trim());
  q.findings=q.findings.map((_,i)=>$('#d_'+i).value.trim());
  q.proposer=$('#q_proposer').value.trim(); q.approver=$('#q_approver').value.trim(); q.date=$('#q_date').value||today();
  const d=$('#q_discount'), v=$('#q_vatMode');
  if(d) q.discount=num(d.value); if(v) q.vatMode=v.value;
}
function repriceItems(){
  const key = {A:'pA',B:'pB',C:'pC'}[curQuote.tier];
  curQuote.items.forEach(it=>{ if(it.pid){ const p=DB.products.find(x=>x.id===it.pid); if(p) it.price=num(p[key]); } });
}
function totalsOf(q){
  const sub = q.items.reduce((s,it)=>s+num(it.qty)*num(it.price),0);
  const disc = num(q.discount);
  const base = Math.max(0, sub - disc);
  const rate = num(DB.shop.vatRate)/100;
  let net=base, vat=0, grand=base;
  if(q.vatMode==='ex'){ vat = base*rate; grand = base+vat; }
  else if(q.vatMode==='in'){ net = base/(1+rate); vat = base-net; grand = base; }
  return {sub, disc, base, net:Math.round(net*100)/100, vat:Math.round(vat*100)/100, grand:Math.round(grand*100)/100};
}

       party:'ได้รับเงินจาก', signer:'ผู้รับเงิน', payer:'ผู้จ่ายเงิน / ผู้รับรถ',

       party:'ส่งมอบงานและแจ้งหนี้แก่', signer:'ผู้ส่งมอบงาน', payer:'ผู้รับมอบงาน',
       totalLabel:'ยอดสุทธิที่ต้องชำระ', vat:'none', short:'ใบส่งมอบ (ไม่มี VAT)'},
  IVT:{title:'ใบส่งมอบงาน / ใบแจ้งหนี้ / ใบกำกับภาษี', en:'DELIVERY NOTE / INVOICE / TAX INVOICE',
       prefix:'IVT', seq:'ivt', store:'invoices',

       totalLabel:'ยอดสุทธิที่ต้องชำระ', vat:'ex', short:'ใบส่งมอบ + ใบกำกับภาษี'}
};
const salesKind  = d => SALES_KINDS[d && d.kind ? d.kind : 'RC'];
const salesStore = d => DB[salesKind(d).store];
const isInvoice  = d => !!d && (d.kind === 'IV' || d.kind === 'IVT');

function nextSalesNo(kind){
  const K = SALES_KINDS[kind], d = new Date();
  const ym = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
  DB.seq[K.seq] = (DB.seq[K.seq]||0)+1;
  return `${K.prefix}-${ym}-${String(DB.seq[K.seq]).padStart(3,'0')}`;
}
/* ภาษีมูลค่าเพิ่มถูกกำหนดตามชนิดเอกสาร — IV ไม่มีเสมอ · IVT มีเสมอ */
function enforceVat(d){
  const v = salesKind(d).vat;
  if(v !== 'free') d.vatMode = v;
  return d;
}

function docMissing(d){
  const m = [];
  if(!d.custId)                        m.push('ยังไม่ได้ผูกกับทะเบียนลูกค้า');
  if(!String(d.name||'').trim())       m.push('ไม่มีชื่อลูกค้า');
  if(!String(d.taxId||'').trim() && (d.custType==='company' || d.kind==='IVT'))
                                       m.push('ไม่มีเลขประจำตัวผู้เสียภาษี');
  if(!String(d.addrText||'').trim() && addrLine(d.addr||{})==='-') m.push('ไม่มีที่อยู่');
  return m;
}
function missChip(d){
  const m = docMissing(d);
  return m.length ? `<span class="chip warn" title="${esc(m.join(' · '))}">ข้อมูลไม่ครบ</span>` : '';
}

function linkSalesCustomer(d){
  if(d.custId && DB.customers.some(c=>c.id===d.custId)) return 'ok';
  const nm = normName(d.name);
  if(!nm) return 'noname';
  const hit = DB.customers.find(c=>isCust(c) && normName(custName(c)) === nm);
  if(hit){ d.custId = hit.id; return 'matched'; }

/* บรรทัดใดเป็นค่าแรง/ค่าบริการ — ใช้เป็นฐานคำนวณภาษีหัก ณ ที่จ่าย */
function isServiceItem(it){
  if(it.svc !== undefined) return !!it.svc;
  return it.code === 'LAB';          /* เอกสารรุ่นก่อนใช้รหัส LAB แทนค่าแรง */
}
/* ฐานภาษีหัก ณ ที่จ่าย = มูลค่าค่าแรงก่อนภาษีมูลค่าเพิ่ม หลังเฉลี่ยส่วนลดแล้ว */
function whtBaseOf(r){
  const sub = r.items.reduce((s,it)=>s+num(it.qty)*num(it.price), 0);
  const svc = r.items.filter(isServiceItem).reduce((s,it)=>s+num(it.qty)*num(it.price), 0);
  if(svc <= 0 || sub <= 0) return 0;
  const share = svc / sub;                       /* เฉลี่ยส่วนลดตามสัดส่วน */
  let base = Math.max(0, svc - num(r.discount) * share);
  if(r.vatMode === 'in') base = base / (1 + num(DB.shop.vatRate)/100);
  return Math.round(base*100)/100;
}
function recTotals(r){
  const t = totalsOf(r);
  const whtBase = whtBaseOf(r);
  const wht = Math.round(whtBase * num(r.whtRate)) / 100;
  return Object.assign(t, {whtBase, wht, payable: Math.round((t.grand - wht)*100)/100});
}
function dueDate(r){
  if(isInvoice(r)) return addDays(r.date, num(r.creditDays)||0);
  return r.pay.credit ? addDays(r.date, r.pay.days) : '';
}

/* ---------- การแบ่งชำระ ณ วันที่ออกใบเสร็จ ----------
   pay.cashAmt / pay.transferAmt = จำนวนที่รับจริงหน้าร้าน
   ส่วนที่เหลือจากยอดสุทธิ ถือเป็นเครดิต (ลูกหนี้) โดยอัตโนมัติ */
function payAtIssue(r){
  const p = r.pay || {};
  const total = recTotals(r).payable;
  /* เอกสารรุ่นก่อนเก็บแค่การติ๊ก ไม่มีจำนวนเงิน — ตีความให้เหมือนเดิม */
  if(p.cashAmt === undefined && p.transferAmt === undefined){
    if(p.credit) return {cash:0, transfer:0, card:0, paid:0, remain:total};
    const cash = p.cash ? total : 0;
    const tr   = (!p.cash && p.transfer) ? total : 0;
    return {cash, transfer:tr, card:0, paid:cash+tr, remain:0};
  }
  let cash = Math.max(0, num(p.cashAmt));
  let tr   = Math.max(0, num(p.transferAmt));
  let card = Math.max(0, num(p.cardAmt));
  /* กันกรอกเกินยอด — ตัดตามลำดับ เงินสด · เงินโอน · บัตรเครดิต */
  if(cash > total) cash = total;
  if(cash + tr > total) tr = Math.max(0, total - cash);
  if(cash + tr + card > total) card = Math.max(0, total - cash - tr);
  const paid = Math.round((cash + tr + card)*100)/100;
  return {cash, transfer:tr, card, paid, remain: Math.round((total - paid)*100)/100};
}
function syncIssuePayments(r){
  const a = payAtIssue(r);
  r.payments = (r.payments || []).filter(x=>!x.atIssue);   /* เขียนทับเฉพาะรายการ ณ วันออกใบ */
  if(a.cash > 0.004)
    r.payments.unshift({id:uid(), date:r.date, amount:a.cash, method:'เงินสด', ref:'รับชำระเมื่อออกใบเสร็จ', atIssue:true});
  if(a.transfer > 0.004)
    r.payments.unshift({id:uid(), date:r.date, amount:a.transfer, method:'เงินโอน',
      ref:(r.pay.ref||'รับชำระเมื่อออกใบเสร็จ'), atIssue:true});
  if(a.card > 0.004)
    r.payments.unshift({id:uid(), date:r.date, amount:a.card, method:'บัตรเครดิต',
      ref:(r.pay.cardRef||'รับชำระเมื่อออกใบเสร็จ'), atIssue:true});
  r.pay.credit = a.remain > 0.004;
  r.pay.cash = a.cash > 0.004;
  r.pay.transfer = a.transfer > 0.004;
  r.pay.card = a.card > 0.004;
  r.pay.due = dueDate(r);
  return a;
}

function payLabel(r){
  const A = payAtIssue(r), a = [];
  if(A.cash > 0.004)     a.push(`เงินสด ${money(A.cash)}`);
  if(A.transfer > 0.004) a.push(`เงินโอน ${money(A.transfer)}`);
  if(A.card > 0.004)     a.push(`บัตรเครดิต ${money(A.card)}`);
  if(A.remain > 0.004)   a.push(`เครดิต ${money(A.remain)} · ครบ ${thDate(addDays(r.date, r.pay.days))}`);
  return a.join(' · ') || '-';
}

function renderPaperView(doc, hostId, sideId, opt){
  const host = $('#'+hostId); if(!host) return;
  host.innerHTML = `
    <div class="paperbar">
      <b>${esc(opt.title)}</b> เลขที่ <b class="mono">${esc(doc.no)}</b>
      <span>· นี่คือหน้าตาเอกสารจริงที่จะพิมพ์ออกมา</span>
      <div class="spacer"></div>
      <span style="font-size:12px;color:var(--ink-3)">ต้องการแก้ไขข้อมูล กดปุ่ม “แก้ไขเอกสาร” ที่แถบซ้าย</span>
    </div>
    <div class="paperview">${opt.html}</div>`;
  mountActions(sideId, hostId, `
      <button class="btn primary" id="pvEdit"><span class="tap">✎</span> แก้ไขเอกสาร</button>
      <button class="btn" id="pvPrint">พิมพ์เอกสาร</button>
      ${opt.extra||''}
      ${opt.newDoc ? '<button class="btn newdoc" id="pvNew"><span class="tap">👆</span> + เปิดเอกสารใหม่</button>' : ''}
      <button class="btn danger" id="pvClose">ปิดเอกสาร</button>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;text-align:center">
        บันทึกแล้ว<br>${thDateLong(doc.date)}</div>`);
  $('#pvEdit').onclick  = ()=>{ docView='form'; opt.rerender(); };
  $('#pvPrint').onclick = opt.print;
  $('#pvClose').onclick = ()=>{ docView='form'; opt.close(); };
  if($('#pvNew')) $('#pvNew').onclick = ()=>{ docView='form'; opt.newDoc(); };
  if(opt.bindExtra) opt.bindExtra();
}

          <div>${K.payer}</div></div>
