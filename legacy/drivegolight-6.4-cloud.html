/* =====================================================================
   การยกเลิกเอกสาร — เก็บใบไว้ในระบบแต่ตัดผลทางบัญชีและสต๊อกออก
   ===================================================================== */
function isVoid(d){ return !!(d && d.void); }
function live(arr){ return (arr||[]).filter(d=>!d.void); }
function livePurchases(){ return live(DB.purchases); }
function liveExpenses(){ return live(DB.expenses); }
function voidChip(d){
  return isVoid(d) ? `<span class="chip void" title="ยกเลิกเมื่อ ${thDateTime(d.void.at)} โดย ${esc(d.void.by)}${
    d.void.reason? ' · '+esc(d.void.reason):''}">ยกเลิกแล้ว</span>` : '';
}
/* คลังเอกสารของแต่ละชนิด */
const VOID_STORES = {
  quote:    ()=>DB.quotes,
  invoice:  ()=>DB.invoices,
  receipt:  ()=>DB.receipts,
  billnote: ()=>(DB.billnotes = DB.billnotes || []),
  purchase: ()=>DB.purchases,
  expense:  ()=>DB.expenses
};
/* คลังข้อมูลของเอกสารแต่ละชนิด ใช้ตอนบันทึกเฉพาะส่วนที่เปลี่ยน */
const VOID_COL = {quote:'quotes', invoice:'invoices', receipt:'receipts',
                  billnote:'billnotes', purchase:'purchases', expense:'expenses'};
const VOID_LABEL = {
  quote:'ใบเสนอราคา', invoice:'ใบส่งมอบงาน / ใบแจ้งหนี้', receipt:'ใบเสร็จรับเงิน',
  billnote:'ใบวางบิล', purchase:'ใบซื้อสินค้า', expense:'รายการค่าใช้จ่าย'
};
/* เมนูย่อยที่คุมสิทธิ์ของเอกสารแต่ละชนิด — ใช้กับด่านยกเลิก กู้คืน คัดลอก และพิมพ์
   รวมไว้ที่เดียวเพื่อไม่ให้ด่านของแต่ละหน้าหลุดกันเอง */
const VOID_PERM = {quote:['income','quote'], invoice:['income','invoice'], receipt:['income','receipt'],
                   billnote:['income','billing'], purchase:['expense','purchase'], expense:['expense','expense']};
function blockDocEdit(kind){
  const t = VOID_PERM[kind]; if(!t) return false;
  return blockEdit(t[0], t[1], VOID_LABEL[kind] || 'เอกสาร');
}
function blockDocExport(kind){
  const t = VOID_PERM[kind]; if(!t) return false;
  return blockExportTab(t[0], t[1]);
}
/* เอกสารที่ยกเลิกแล้วห้ามบันทึกทับ — ต้องกู้คืนก่อน */
function blockIfVoid(kind, id){
  const d = voidFind(kind, id);
  if(d && d.void){ toast(`เอกสาร ${d.no} ถูกยกเลิกไปแล้ว แก้ไขไม่ได้ — กดปุ่ม “คัดลอกใบใหม่” ที่รายการเอกสารเพื่อออกใบใหม่แทน`); return true; }
  return false;
}
function voidFind(kind, id){ return (VOID_STORES[kind] ? VOID_STORES[kind]() : []).find(x=>x.id===id); }

/* เหตุผลที่ยกเลิกไม่ได้ — คืนข้อความ หรือ '' ถ้ายกเลิกได้ */
function voidBlockReason(kind, d){
  if(kind==='quote'){
    const inv = DB.invoices.find(x=>x.quoteId===d.id && !isVoid(x));
    if(inv) return `ใบนี้ออกใบส่งมอบ ${inv.no} ไปแล้ว — ยกเลิกใบส่งมอบก่อน`;
    const rc = DB.receipts.find(x=>x.quoteId===d.id && !isVoid(x));
    if(rc) return `ใบนี้ออกใบเสร็จ ${rc.no} ไปแล้ว — ยกเลิกใบเสร็จก่อน`;
  }
  if(kind==='invoice'){
    const rc = DB.receipts.find(x=>x.invId===d.id && !isVoid(x));
    if(rc) return `ใบนี้ออกใบเสร็จ ${rc.no} ไปแล้ว — ยกเลิกใบเสร็จก่อน`;
  }
  if(kind==='invoice' || kind==='receipt'){
    const bn = (DB.billnotes||[]).find(b=>!isVoid(b) && (b.invIds||[]).includes(d.id));
    if(bn) return `ใบนี้ถูกรวมอยู่ในใบวางบิล ${bn.no} — เอาออกจากใบวางบิลก่อน`;
  }
  /* ใบซื้อที่รับของเข้าสต๊อกแล้วยกเลิกไม่ได้
     เพราะของอาจถูกขายหรือเบิกออกไปแล้ว การตัดคืนจะทำให้สต๊อกเพี้ยนโดยไม่มีใครรู้
     ถ้าจำนวนไม่ตรงกับของจริง ให้ไปนับแล้วปรับยอดที่หน้า 05.5 ซึ่งบันทึกเหตุผลไว้ทุกครั้ง */
  if(kind==='purchase' && d.received){
    return 'ใบซื้อนี้รับของเข้าสต๊อกไปแล้ว จึงยกเลิกไม่ได้ — ถ้าจำนวนไม่ตรงกับของจริง ให้ไปปรับที่เมนู 05.5 ตรวจนับสต๊อก';
  }
  return '';
}

/* คืน/ตัดสต๊อกกลับตามชนิดเอกสาร */
/* ปรับสต๊อกให้ตรงกับเอกสารขายฉบับที่กำลังบันทึก —
   คืนของตามยอดที่บันทึกไว้เดิมก่อน แล้วหักตามยอดใหม่ (แก้แล้วบันทึกซ้ำได้ไม่เพี้ยน) */
/* ---------- ยอดที่ลงสต๊อกไปจริงของเอกสารหนึ่งใบ ----------
   เก็บไว้ในตัวเอกสาร (stockApplied) เพื่อให้ย้อนกลับได้ตรงเป๊ะทุกครั้ง
   ไม่ว่าผู้ใช้จะแก้จำนวนในเอกสารไปแล้วกี่รอบ */
function appliedStock(doc, fallbackFlag){
  if(Array.isArray(doc.stockApplied)) return doc.stockApplied;
  /* เอกสารรุ่นก่อนที่ยังไม่มีข้อมูลนี้ — อนุมานจากรายการในเอกสาร */
  if(!fallbackFlag) return [];
  return (doc.items||[]).filter(it=>it.pid)
    .map(it=>({pid:it.pid, qty:num(it.qty), cogs:num(it.cogs), cost:num(it.price)}));
}
/* ใบขาย (ใบส่งมอบ/ใบเสร็จ) — คืนของยอดเดิมแล้วหักตามยอดใหม่ */
function syncSalesStock(doc, wantDeduct){
  appliedStock(doc, doc.deducted).forEach(a=>{
    const p = DB.products.find(x=>x.id===a.pid); if(!p) return;
    lotReturn(p, num(a.qty), num(a.cogs) || num(a.qty)*num(p.cost));
  });
  const applied = [];
  let cut = 0;
  if(wantDeduct){
    (doc.items||[]).forEach(it=>{ if(!it.pid) return;
      const p = DB.products.find(x=>x.id===it.pid); if(!p) return;
      it.cogs = lotConsume(p, num(it.qty)); p.lastMove = doc.date;
      applied.push({pid:it.pid, qty:num(it.qty), cogs:num(it.cogs)});
      cut += num(it.qty);
    });
  }
  doc.stockApplied = applied;
  doc.deducted = applied.length > 0;
  return cut;
}
/* ใบซื้อ — ตัดของยอดเดิมออกแล้วรับเข้าตามยอดใหม่ */
function syncPoStock(doc, wantReceive){
  appliedStock(doc, doc.received).forEach(a=>{
    const p = DB.products.find(x=>x.id===a.pid); if(!p) return;
    lotConsume(p, num(a.qty));
  });
  const applied = [];
  let got = 0;
  if(wantReceive){
    (doc.items||[]).forEach(it=>{ if(!it.pid) return;
      const p = DB.products.find(x=>x.id===it.pid); if(!p) return;
      lotAdd(p, num(it.qty), num(it.price)>0 ? num(it.price) : num(p.cost), doc.date);
      p.lastMove = doc.date; if(num(it.price)>0) p.cost = num(it.price);
      applied.push({pid:it.pid, qty:num(it.qty), cost:num(it.price)});
      got += num(it.qty);
    });
  }
  doc.stockApplied = applied;
  doc.received = applied.length > 0;
  return got;
}

function voidReverseStock(kind, d, restore){
  let n = 0;
  if((kind==='invoice' || kind==='receipt') && d.deducted){
    appliedStock(d, true).forEach(a=>{
      const p = DB.products.find(x=>x.id===a.pid); if(!p) return;
      if(restore) a.cogs = lotConsume(p, num(a.qty));
      else lotReturn(p, num(a.qty), num(a.cogs) || num(a.qty)*num(p.cost));
      p.lastMove = today(); n += num(a.qty);
    });
  }
  if(kind==='purchase' && d.received){
    appliedStock(d, true).forEach(a=>{
      const p = DB.products.find(x=>x.id===a.pid); if(!p) return;
      if(restore) lotAdd(p, num(a.qty), num(a.cost)>0?num(a.cost):num(p.cost), d.date);
      else lotConsume(p, num(a.qty));
      p.lastMove = today(); n += num(a.qty);
    });
  }
  return n;
}

/* หน้าต่างยืนยันการยกเลิกเอกสาร */

      และ<b>ไม่ถูกนับ</b>ในยอดขาย ลูกหนี้ เจ้าหนี้ ภาษี และงบกำไรขาดทุนอีกต่อไป
      ${stockNote? '<br>'+stockNote : ''}
      ${paid > 0.004? `<br><span style="color:var(--warn)">ใบนี้มีการชำระเงินแล้ว ${money(paid)} — ประวัติการชำระจะถูกเก็บไว้แต่ไม่นับในยอดใด ๆ</span>` : ''}
    </p>
    <label class="f">เหตุผลที่ยกเลิก</label>
    <input class="in" id="vdReason" placeholder="เช่น ลูกค้ายกเลิกงาน · ออกเอกสารผิด · ออกใบใหม่แทน">
    <div class="hint" style="margin-top:8px">เอกสารหมวด 03 ที่ยกเลิกแล้ว<b>กู้คืนไม่ได้</b>
      หากต้องออกใหม่ ให้กดปุ่ม “คัดลอกใบใหม่” ที่รายการเอกสาร ระบบจะออกเลขที่ใหม่ให้
      โดยยังอ้างอิงใบเสนอราคาเดิม</div>`,
  [
    {label:'ไม่ยกเลิก', cls:'btn', act:closeModal},
    {label:'ยืนยันยกเลิกเอกสาร', cls:'btn danger', act:()=>{
      const reason = $('#vdReason').value.trim();
      const n = voidReverseStock(kind, d, false);
      /* ใบเสร็จที่อ้างอิงใบส่งมอบ — ปลดการปิดยอดของใบส่งมอบต้นทาง */
      if(kind==='receipt' && d.invId){
        const inv = DB.invoices.find(x=>x.id===d.invId);
        if(inv){ inv.receiptId = null; inv.receiptNo = '';
          inv.payments = (inv.payments||[]).filter(x=>x.fromReceipt !== d.id); }
      }
      if((kind==='invoice'||kind==='receipt') && d.quoteId){
        const q = DB.quotes.find(x=>x.id===d.quoteId); if(q) q.status = 'open';
      }
      d.void = {at:new Date().toISOString(), by:userLabel(), reason};
      saveSome(VOID_COL[kind], 'invoices', 'quotes', 'products');
      closeModal(); renderStock();
      if(after) after();
      savedPop(`ยกเลิกเอกสาร ${d.no} แล้ว` + (n? ` · ปรับสต๊อก ${n} ชิ้น` : ''));
    }}
  ]);
}

/* นำเอกสารที่ยกเลิกกลับมาใช้ */
async function unvoidDoc(kind, id, after){
  const d = voidFind(kind, id); if(!d || !d.void) return;
  if(blockDocEdit(kind)) return;
  if(!await confirmPop(`นำเอกสาร ${d.no} กลับมาใช้?\n\nยอดของใบนี้จะกลับไปนับในยอดขาย ลูกหนี้ เจ้าหนี้ ภาษี และสต๊อกตามเดิม`)) return;
  const n = voidReverseStock(kind, d, true);
  if(kind==='receipt' && d.invId){
    const inv = DB.invoices.find(x=>x.id===d.invId);
    if(inv && !inv.receiptNo){ inv.receiptId = d.id; inv.receiptNo = d.no; }
  }
  delete d.void;
  saveSome(VOID_COL[kind], 'invoices', 'products'); renderStock();
  if(after) after();
  savedPop(`นำเอกสาร ${d.no} กลับมาใช้แล้ว` + (n? ` · ปรับสต๊อก ${n} ชิ้น` : ''));
}

/* ผูกปุ่มยกเลิก/กู้คืนของหน้าทะเบียนเอกสาร */
function bindVoidButtons(rerender){
  $$('[data-void]').forEach(b=>b.onclick=()=>{
    const [k,id] = b.dataset.void.split(':'); voidDocModal(k, id, rerender);
  });
  $$('[data-unvoid]').forEach(b=>b.onclick=()=>{
    const [k,id] = b.dataset.unvoid.split(':'); unvoidDoc(k, id, rerender);
  });
  $$('[data-copydoc]').forEach(b=>b.onclick=()=>{
    const [k,id] = b.dataset.copydoc.split(':'); copyVoidedDoc(k, id, rerender);
  });
}

/* =====================================================================
   คัดลอกเอกสารหมวด 03 ที่ยกเลิกแล้วเป็นใบใหม่
   ---------------------------------------------------------------------
   ใบที่ยกเลิกแล้วกู้คืนไม่ได้ เพราะยอดขาย ภาษี และสต๊อกถูกปรับกลับไปแล้ว
   การกู้คืนจึงเสี่ยงทำให้ตัวเลขย้อนหลังเพี้ยน  ใบใหม่จะได้เลขที่ใหม่
   แต่ยังอ้างอิงใบเสนอราคาเดิม ทำให้ตามรอยกลับไปได้ว่ามาจากงานไหน
   ===================================================================== */
async function copyVoidedDoc(kind, id, after){
  const d = voidFind(kind, id);
  if(!d) return;
  if(!requireLicense()) return;
  const EDIT = {quote:['income','quote','ใบเสนอราคา'], invoice:['income','invoice','ใบส่งมอบ'],
                receipt:['income','receipt','ใบเสร็จ'], billnote:['income','billing','ใบวางบิล']}[kind];
  if(EDIT && blockEdit(EDIT[0], EDIT[1], EDIT[2])) return;

  const c = JSON.parse(JSON.stringify(d));
  delete c.void; delete c.edits;
  c.id = uid();
  c.date = today();
  c.payments = [];

  if(kind === 'quote'){
    c.no = nextNo('q');
    c.status = 'open';
  } else if(kind === 'billnote'){
    c.no = nextBillNo();
  } else {
    c.no = nextSalesNo(c.kind || (kind==='invoice' ? 'IV' : 'RC'));
    /* ใบใหม่ยังไม่เคยแตะสต๊อกและยังไม่เคยรับเงิน — ต้องล้างร่องรอยของใบเดิมทิ้ง */
    c.deducted = false;
    c.stockApplied = [];
    c.receiptId = null; c.receiptNo = '';
    /* ถ้าใบส่งมอบต้นทางถูกยกเลิกไปด้วย ก็ตัดการอ้างอิงนั้นทิ้ง เหลือแต่ใบเสนอราคา */
    if(c.invId){
      const iv = (DB.invoices||[]).find(x=>x.id===c.invId);
      if(!iv || isVoid(iv)){ c.invId = null; c.invNo = ''; }
    }
  }

  const ref = c.quoteNo ? `\n\nใบใหม่ยังอ้างอิงใบเสนอราคา ${c.quoteNo} เหมือนเดิม` : '';
  const ok = await confirmPop(
    `คัดลอก ${d.no} เป็นใบใหม่?\n\n` +
    `ระบบจะเปิดฟอร์มใบใหม่เลขที่ ${c.no} พร้อมรายการและข้อมูลลูกค้าชุดเดิมให้แก้ไข` + ref +
    `\n\nยังไม่บันทึกจนกว่าจะกดปุ่มบันทึกเอง` +
    (kind==='quote' ? '' : `\nสต๊อกและการรับเงินก็ยังไม่ถูกแตะจนกว่าจะบันทึก`) +
    `\nใบเดิมยังถูกยกเลิกไว้เหมือนเดิม`);
  if(!ok) return;

  /* เปิดเป็นฟอร์มที่ยังไม่บันทึก — ผู้ใช้ต้องแก้รายการก่อนแล้วค่อยกดบันทึกเอง
     ถ้าบันทึกให้เลยจะกลายเป็นเอกสารจริงทั้งที่ยังไม่ได้ตรวจ และเกิดใบขยะถ้าเปลี่ยนใจ */
  if(kind === 'quote'){
    curQuote = c; docView = 'form'; incomeTab = 'quote'; renderIncome();
  } else if(kind === 'billnote'){
    curBill = c; renderBilling();
  } else {
    curRec = c; docView = 'form';
    incomeTab = (kind === 'invoice') ? 'invoice' : 'receipt';
    renderIncome();
  }
  toast(`คัดลอกเป็นใบใหม่ ${c.no} แล้ว — ตรวจและแก้ไขให้เรียบร้อย แล้วกดบันทึก`);
}

function findDoc(kind, id){
  if(kind==='ar') return DB.receipts.find(x=>x.id===id) || DB.invoices.find(x=>x.id===id);
  return DB.purchases.find(x=>x.id===id) || DB.expenses.find(x=>x.id===id);
}
/* เจ้าหนี้รวมทั้งใบซื้อสินค้าและค่าใช้จ่ายที่ยังไม่จ่าย */
const isExpenseDoc = x => !!x.cat && Array.isArray(x.items) && x.no && String(x.no).startsWith('EX-');
function apAllDocs(){ return livePurchases().concat(liveExpenses()); }
function apTotalOf(x){ return isExpenseDoc(x) ? exTotals(x).payable : poTotals(x).payable; }
function apDueOf(x){ return Math.round((apTotalOf(x) - paidOf(x))*100)/100; }
function apDueDate(x){ return isExpenseDoc(x) ? exDue(x) : poDue(x); }
function apPartyOf(x){ return isExpenseDoc(x) ? (x.payeeName||'-') : (x.vendorName||'-'); }
function payModal(kind, id){
  const doc = findDoc(kind, id);
  const tot = kind==='ar' ? arTotal(doc) : apTotal(doc);
  const paid = paidOf(doc), due = Math.round((tot-paid)*100)/100;
  const who = kind==='ar' ? (doc.name||'-') : (doc.vendorName||'-');
  openModal(kind==='ar' ? 'รับชำระจากลูกหนี้' : 'จ่ายชำระเจ้าหนี้', `
    <div style="margin-bottom:14px"><span class="tag">${esc(doc.no)}</span>
      <b style="margin-left:8px">${esc(who)}</b>
      <div style="color:var(--ink-3);font-size:12.5px;margin-top:5px">
        ยอดเต็ม ${money(tot)} · ชำระแล้ว ${money(paid)} · <b style="color:var(--danger)">คงค้าง ${money(due)}</b></div></div>
    <div class="grid g3">
      <div><label class="f">จำนวนเงินที่${kind==='ar'?'รับ':'จ่าย'}</label><input class="in mono" id="pmAmt" value="${due}" style="text-align:right"></div>
      <div><label class="f">วันที่</label><input type="date" class="in" id="pmDate" value="${today()}"></div>
      <div><label class="f">ช่องทาง</label>
        <select class="in" id="pmMethod">
          <option>เงินสด</option><option>เงินโอน</option><option>เช็ค</option><option>บัตรเครดิต</option><option>อื่น ๆ</option>
        </select></div>
    </div>
    <div style="margin-top:12px"><label class="f">เลขอ้างอิง / หมายเหตุ</label>
      <input class="in" id="pmRef" placeholder="เช่น เลขที่เช็ค ธนาคาร หรือเลขอ้างอิงการโอน"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn sm" id="pmFull">ชำระเต็มจำนวน</button>
      <button class="btn sm" id="pmHalf">ชำระครึ่งหนึ่ง</button>
    </div>
  `, [
    {label:'ยกเลิก', cls:'btn', act:closeModal},
    {label:'บันทึกการชำระ', cls:'btn primary', act:()=>{
      if(!requireLicense()) return closeModal();
      if(blockEdit('finance', kind, kind==='ar'?'การรับชำระ':'การจ่ายชำระ')) return closeModal();
      const amt = num($('#pmAmt').value);
      if(amt <= 0) return toast('ระบุจำนวนเงินมากกว่า 0');
      if(amt > due + 0.004) return toast('จำนวนเงินเกินยอดคงค้าง ('+money(due)+')');
      doc.payments = doc.payments || [];
      doc.payments.push({id:uid(), date:$('#pmDate').value||today(), amount:amt,
        method:$('#pmMethod').value, ref:$('#pmRef').value.trim()});
      saveSome('receipts','invoices','purchases','expenses'); closeModal(); renderFinance();
      const left = Math.round((tot - paidOf(doc))*100)/100;
      toast(left <= 0.004 ? `ชำระครบแล้ว — ${doc.no}` : `บันทึกการชำระ ${money(amt)} แล้ว · คงค้าง ${money(left)}`);
    }}
  ]);
  $('#pmFull').onclick = ()=>{ $('#pmAmt').value = due; };
  $('#pmHalf').onclick = ()=>{ $('#pmAmt').value = Math.round(due/2*100)/100; };
}

/* 06.2 ลูกหนี้ / 06.3 เจ้าหนี้ — ส่งออกเฉพาะข้อมูลของหน้านั้น ไม่ลากยอดขายทั้งร้านติดไปด้วย */
function exportFinSideCsv(kind){
  const isAR = kind === 'ar';
  const src  = isAR ? salesDocs() : apAllDocs();
  const totalOf = x => isAR ? arTotal(x)   : apTotal(x);
  const dueOf   = x => isAR ? arDue(x)     : apDue(x);
  const dateOf  = x => isAR ? arDueDate(x) : apDueDate(x);
  const nameOf  = x => isAR ? (x.name||'-'): apPartyOf(x);
  const kindOf  = x => isAR ? (x.quoteNo ? 'ใบเสร็จ · อ้าง '+x.quoteNo : 'ใบเสร็จ')
                            : (isExpenseDoc(x) ? catName(x.cat) : 'ซื้อสินค้า');
  /* ใช้คำค้นเดียวกับที่เห็นบนหน้าจอ แต่ส่งออกทุกหน้า ไม่ใช่เฉพาะหน้าที่เปิดอยู่ */
  const kw  = (finQ||'').trim().toLowerCase();
  const hit = x => !kw || `${x.no} ${nameOf(x)}`.toLowerCase().includes(kw);
  const open   = src.filter(x=>dueOf(x) > 0.004 && hit(x)).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
  const closed = src.filter(x=>dueOf(x) <= 0.004 && paidOf(x) > 0.004 && hit(x)).sort((a,b)=>b.date.localeCompare(a.date));

  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const who = isAR ? 'ลูกค้า' : 'ผู้ขาย / ผู้รับเงิน';
  const lines = [`สถานะ,เลขที่,วันที่,${who},ประเภท,ครบกำหนด,เกินกำหนด (วัน),ยอดเต็ม,ชำระแล้ว,คงค้าง`];
  const row = (x, st)=>{
    const d = daysBetween(today(), dateOf(x));
    lines.push([q(st), q(x.no), x.date, q(nameOf(x)), q(kindOf(x)), dateOf(x),
      (dueOf(x) > 0.004 && d < 0) ? -d : 0,
      totalOf(x), paidOf(x), Math.max(0, dueOf(x))].join(','));
  };
  open.forEach(x=>row(x, 'ค้างชำระ'));
  closed.forEach(x=>row(x, 'ชำระครบแล้ว'));

  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `drivegolight-${isAR?'ลูกหนี้':'เจ้าหนี้'}-${today()}.csv`; a.click();
  toast(`ส่งออก${isAR?'ลูกหนี้':'เจ้าหนี้'} ${open.length+closed.length} รายการแล้ว`);
}

function exportFinanceCsv(rs, ps){
  if(blockExportTab('finance', finTab)) return;
  /* ส่งออกให้ตรงกับหน้าที่เปิดอยู่ — อยู่หน้าลูกหนี้ได้ลูกหนี้ อยู่หน้าเจ้าหนี้ได้เจ้าหนี้ */
  if(finTab === 'ar' || finTab === 'ap') return exportFinSideCsv(finTab);
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines = ['ประเภท,เลขที่,วันที่,คู่ค้า,ก่อนภาษี,VAT,หัก ณ ที่จ่าย,ยอดสุทธิ,ชำระแล้ว,คงค้าง,สถานะ'];
  rs.forEach(r=>{ const t=recTotals(r), pd=paidOf(r);
    lines.push(['ขาย',q(r.no),r.date,q(r.name||''),t.net,t.vat,t.wht,t.payable,pd,Math.max(0,arDue(r)),
      q(STATE_LABEL[payState(t.payable,pd)])].join(',')); });
  ps.forEach(p=>{ const ex=isExpenseDoc(p), t=ex?exTotals(p):poTotals(p), pd=paidOf(p);
    lines.push([ex?q('ค่าใช้จ่าย · '+catName(p.cat)):'ซื้อ', q(p.no), p.date, q(apPartyOf(p)),
      t.net,t.vat,t.wht,t.payable,pd,Math.max(0,apDue(p)),
      q(STATE_LABEL[payState(t.payable,pd)])].join(',')); });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `drivegolight-finance-${today()}.csv`; a.click();
  toast('ส่งออกไฟล์ CSV แล้ว');
}

/* สรุปสิทธิ์ของผู้ใช้หนึ่งคนเป็นข้อความสั้น ๆ สำหรับแสดงในตาราง */
function permSummary(u){
  const on = PERMS.filter(([k])=>u.perms[k]);
  if(!on.length) return '<span style="color:var(--ink-3)">ไม่ได้ให้สิทธิ์เมนูใดเลย</span>';
  if(on.length === PERMS.length) return '<span class="chip ok">ทุกเมนู</span>';
  return on.map(([k,l])=>{
    const tabs = subTabsOf(k);
    const has = u.perms.tabs && Object.keys(u.perms.tabs).some(x=>x.startsWith(k+'.'));
    const n = tabs ? (has ? tabs.filter(([tk])=>u.perms.tabs[k+'.'+tk]).length : tabs.length) : 0;
    const partial = tabs && n < tabs.length;
    return `<span class="chip" style="margin:1px 3px 1px 0">${esc(l)}${partial?` <b>${n}/${tabs.length}</b>`:''}</span>`;
  }).join('');
}

    if(blockEdit('settings','staff','ข้อมูลผู้ใช้งาน')) return;
    if((DB.users||[]).length >= MAX_USERS) return toast(`เพิ่มผู้ใช้งานได้สูงสุด ${MAX_USERS} คน`);
    userEditModal(null);
  };
  $$('[data-uedit]').forEach(b=>b.onclick=()=>{
    if(blockEdit('settings','staff','ข้อมูลผู้ใช้งาน')) return;
    userEditModal(b.dataset.uedit);
  });
  $$('[data-udel]').forEach(b=>b.onclick=async ()=>{
    if(blockEdit('settings','staff','ข้อมูลผู้ใช้งาน')) return;
    const u = (DB.users||[]).find(x=>x.id===b.dataset.udel); if(!u) return;
    if(!await confirmPop(`ลบผู้ใช้งาน ${u.name||u.code}?\n\nพนักงานคนนี้จะเข้าใช้งานด้วยรหัสเดิมไม่ได้อีก ผู้ใช้คนอื่นไม่ถูกกระทบ`)) return;
    DB.users = DB.users.filter(x=>x.id!==u.id);
    if(CURRENT_USER && CURRENT_USER.id === u.id) CURRENT_USER = null;
    saveMeta(); renderSettings(); applyPerms();
    savedPop('ลบผู้ใช้ '+(u.name||u.code)+' แล้ว');
  });
}

    </div>

    <div class="sec-title">รหัสสำหรับเข้าใช้งาน</div>

      พนักงานใช้สองค่านี้เข้าระบบที่ปุ่มมุมขวาบน — ตั้งรหัสผ่านเองก็ได้ หรือกดปุ่มให้ระบบสุ่มให้ก็ได้</div>
    <div class="grid g4" style="align-items:end">

      <div><label class="f">รหัสผ่าน</label>

      <div style="display:flex;align-items:flex-end">
        <button class="btn" id="ue_regen" type="button" style="width:100%">🎲 สุ่มรหัสผ่านให้ใหม่</button></div>

    <div class="sec-title">สิทธิ์การเห็นข้อมูลสำคัญ</div>
    <div class="permblk" style="border-color:var(--warn)">
      <label class="mainrow">
        <input type="checkbox" data-ecost ${u.perms.cost!==false?'checked':''}>
        <b>เห็นต้นทุนสินค้า / ราคาซื้อ</b>
      </label>
      <div style="font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.7">
        ว่าง = ซ่อนต้นทุนจากพนักงานคนนี้<b>ทุกหน้าที่แสดงต้นทุน</b> ทั้งทะเบียนสินค้า มูลค่าสต๊อก
        หน้าต่างดึงสินค้า ใบเคลม เอกสารที่พิมพ์ออกมา และรายการซื้อในหน้าบัญชี
        รวมถึง<b>ปิดเมนู 06.4 กำไรขาดทุน</b>ให้อัตโนมัติ เพราะเป็นรายงานต้นทุนโดยตรง<br>
        <span style="color:var(--ink-3)">เมนู 04 ซื้อสินค้า ยังต้องกรอกราคาซื้อในการทำงาน
        หากไม่ต้องการให้เห็นราคาซื้อเลย ให้เอาติ๊กเมนู 04 ออกด้วย</span></div>
    </div>
    <div class="permblk">
      <label class="mainrow">
        <input type="checkbox" data-ehome ${u.perms.homeReport!==false?'checked':''}>
        <b>เห็นรายงานสรุปในหน้าแรก</b>
      </label>
      <div style="font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.7">
        ว่าง = หน้าแรกของพนักงานคนนี้จะเหลือแค่<b>การ์ดเมนูใช้งาน</b>
        ไม่เห็นยอดขาย ลูกหนี้ เจ้าหนี้ ภาษี และสรุปอื่น ๆ</div>
    </div>

    <div class="sec-title">เมนูที่ให้ใช้งานได้</div>
    <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.7">
      ติ๊กทีละช่องในตารางของแต่ละหมวด — <b>ดูได้</b> เข้าหน้านั้นได้ ·
      <b>แก้ไขได้</b> เพิ่ม แก้ ลบ และบันทึกได้ ·
      <b>พิมพ์หรือส่งออกข้อมูลได้</b> พิมพ์ทะเบียนทั้งชุดหรือดาวน์โหลดเป็นไฟล์ได้<br>
      <span style="color:var(--ink-3)">ไม่ติ๊กช่องแก้ไข = เปิดดูอย่างเดียว ·
      การดึงสินค้าเข้าเอกสารขายแล้วสต๊อกลดตามปกติ ไม่นับเป็นการแก้ทะเบียนสินค้า
      พนักงานที่ดูสต๊อกได้อย่างเดียวจึงยังออกใบเสร็จได้ ·
      การพิมพ์เอกสารรายใบ เช่น ใบเสร็จของลูกค้า ทำได้เสมอตามสิทธิ์เมนู</span></div>
    ${PERMS.map(([k,l])=>{
      const tabs = subTabsOf(k);
      const legacyOnly = (u.perms.sub||{})[k] || '';
      const hasTabs = u.perms.tabs && Object.keys(u.perms.tabs).some(x=>x.startsWith(k+'.'));
      const on = tk => hasTabs ? !!u.perms.tabs[k+'.'+tk] : legacyOnly ? legacyOnly===tk : true;
      return `<div class="permblk${u.perms[k]?'':' off'}">
        <label class="mainrow">
          <input type="checkbox" data-ep="${k}" ${u.perms[k]?'checked':''}>
          <b>${l}</b>
          ${tabs?`<span class="cnt">${tabs.length} เมนูย่อย</span>
            <span class="quick">
              <button class="btn sm ghost" data-eall="${k}" type="button">ทั้งหมด</button>
              <button class="btn sm ghost" data-enone="${k}" type="button">ไม่เลือก</button>
            </span>`:''}
        </label>
        ${tabs?`<div class="subgrid">
          <table class="permtbl">
            <thead><tr>
              <th>เมนูย่อย</th>
              <th class="c">ดูได้</th>
              <th class="c">แก้ไขได้</th>
              <th class="c">พิมพ์หรือส่งออกข้อมูลได้</th>
            </tr></thead>
            <tbody>
            ${tabs.map(([tk,no,tl])=>{
              const canOpen = on(tk);
              const canEd = (u.perms.editTabs||{})[k+'.'+tk] !== false;
              const canEx = (u.perms.exportTabs||{})[k+'.'+tk] !== undefined
                          ? u.perms.exportTabs[k+'.'+tk] !== false
                          : u.perms.exportData !== false;
              const off = u.perms[k] ? '' : ' disabled';
              const off2 = (u.perms[k] && canOpen) ? '' : ' disabled';
              return `<tr>
                <td><span class="mono" style="font-size:11px;color:var(--ink-3)">${no}</span> ${esc(tl)}</td>
                <td class="c"><input type="checkbox" data-ept="${k}.${tk}" ${canOpen?'checked':''}${off}></td>
                <td class="c"><input type="checkbox" data-epe="${k}.${tk}" ${canEd?'checked':''}${off2}
                    title="ให้เพิ่ม แก้ ลบ และบันทึกข้อมูลในเมนูนี้ได้"></td>
                <td class="c"><input type="checkbox" data-epx="${k}.${tk}" ${canEx?'checked':''}${off2}
                    title="ให้พิมพ์ทะเบียนทั้งชุดหรือดาวน์โหลดข้อมูลเป็นไฟล์ได้"></td>
              </tr>`;
            }).join('')}
            </tbody>
          </table>
        </div>`:''}
      </div>`;
    }).join('')}
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.7">
      หน้าแรกเปิดให้ทุกคนเห็นเสมอ · สิทธิ์ตั้งค่าร้านครอบคลุมถึงการแก้ข้อมูลผู้ใช้และลิขสิทธิ์
      จึงควรให้เฉพาะผู้ที่ไว้ใจได้</div>`;

  const bind = ()=>{
    $('#ue_regen').onclick = ()=>{ $('#ue_pass').value = genPass();
      toast('สุ่มรหัสผ่านใหม่ให้แล้ว — อย่าลืมกดบันทึก'); };
    $('#ue_start').onchange = e=>{ $('#ue_startTh').textContent = e.target.value
      ? '· ตรงกับ '+thDate(e.target.value) : '· เลือกเป็นปี ค.ศ.'; };
    /* ช่องแก้ไขจะติ๊กได้ต่อเมื่อเข้าดูเมนูนั้นได้ก่อน — กันตั้งค่าที่ขัดกันเอง */
    const syncEd = scope=>{
      $$('[data-epe],[data-epx]', scope || document).forEach(ed=>{
        const row = ed.closest('tr');
        const open = row.querySelector('[data-ept]');
        const menuOn = !open.disabled;
        ed.disabled = !(menuOn && open.checked);
        if(ed.disabled) ed.checked = false;
      });
    };
    $$('[data-ep]').forEach(cb=>cb.onchange=()=>{
      u.perms[cb.dataset.ep] = cb.checked;
      const box = cb.closest('.permblk');
      box.classList.toggle('off', !cb.checked);
      $$(`[data-ept^="${cb.dataset.ep}."]`, box).forEach(x=>x.disabled = !cb.checked);
      syncEd(box);
    });
    $$('[data-ept]').forEach(cb=>cb.onchange=()=>syncEd(cb.closest('.permblk')));
    $$('[data-eall]').forEach(b=>b.onclick=()=>{
      const box = b.closest('.permblk');
      $$(`[data-ept^="${b.dataset.eall}."]`).forEach(x=>{ if(!x.disabled) x.checked = true; });
      syncEd(box);
    });
    $$('[data-enone]').forEach(b=>b.onclick=()=>{
      const box = b.closest('.permblk');
      $$(`[data-ept^="${b.dataset.enone}."]`).forEach(x=>{ if(!x.disabled) x.checked = false; });
      syncEd(box);
    });
    syncEd();
  };

  openModal(orig ? 'แก้ไขผู้ใช้งาน '+u.code : 'เพิ่มผู้ใช้งานใหม่', body(), [
    orig ? {label:'ลบผู้ใช้', cls:'btn danger', act:async ()=>{
      if(!await confirmPop(`ลบผู้ใช้งาน ${u.name||u.code}?\n\nพนักงานคนนี้จะเข้าใช้งานด้วยรหัสเดิมไม่ได้อีก`)) return;
      DB.users = DB.users.filter(x=>x.id!==id);
      if(CURRENT_USER && CURRENT_USER.id === id) CURRENT_USER = null;
      saveMeta(); closeModal(); renderSettings(); applyPerms();
      savedPop('ลบผู้ใช้ '+(u.name||u.code)+' แล้ว');
    }} : null,
    {label:'ยกเลิก', cls:'btn', act:closeModal},
    {label:'บันทึกผู้ใช้งาน', cls:'btn primary', act:()=>{
      u.name = $('#ue_name').value.trim();
      if(!u.name) return toast('กรอกชื่อพนักงานก่อนบันทึก');
      const pw = $('#ue_pass').value.trim().toUpperCase();
      if(pw.length < 4) return toast('รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร');
      if((DB.users||[]).some(x=>x.id!==u.id && String(x.pass).toUpperCase()===pw))
        return toast('รหัสผ่านนี้ซ้ำกับพนักงานคนอื่น — ตั้งใหม่หรือกดสุ่ม');
      u.pass = pw;
      u.active  = $('#ue_active').checked;
      u.role    = $('#ue_role').value.trim();
      u.tel     = $('#ue_tel').value.trim();
      u.email   = $('#ue_email').value.trim();
      u.idCard  = $('#ue_idcard').value.trim();
      u.startDate = $('#ue_start').value;
      u.note    = $('#ue_note').value.trim();
      $$('[data-ep]').forEach(el=> u.perms[el.dataset.ep] = el.checked);
      const pc = $('[data-ecost]'); if(pc) u.perms.cost = pc.checked;
      const ph = $('[data-ehome]'); if(ph) u.perms.homeReport = ph.checked;
      u.perms.tabs = {};
      $$('[data-ept]').forEach(el=> u.perms.tabs[el.dataset.ept] = el.checked);
      u.perms.editTabs = {};
      $$('[data-epe]').forEach(el=> u.perms.editTabs[el.dataset.epe] = el.checked);
      u.perms.exportTabs = {};
      $$('[data-epx]').forEach(el=> u.perms.exportTabs[el.dataset.epx] = el.checked);
      delete u.perms.exportData;          /* ย้ายมาอยู่ในตารางรายเมนูย่อยแล้ว */
      delete u.perms.sub;
      DB.users = DB.users || [];
      const i = DB.users.findIndex(x=>x.id===u.id);
      if(i >= 0) DB.users[i] = u;
      else {
        if(DB.users.length >= MAX_USERS) return toast(`เพิ่มผู้ใช้งานได้สูงสุด ${MAX_USERS} คน`);
        /* ออกรหัสใหม่อีกครั้งเผื่อมีคนอื่นถูกเพิ่มระหว่างที่เปิดหน้าต่างนี้ค้างไว้ */
        if(DB.users.some(x=>x.code === u.code)) u.code = genUserCode();
        DB.users.push(u);
      }
      saveMeta(); closeModal(); renderSettings(); applyPerms();
      savedPop((i>=0?'บันทึกผู้ใช้ ':'เพิ่มผู้ใช้ ')+u.code+' แล้ว — แจ้งรหัสผ่าน '+u.pass+' ให้พนักงาน');
    }}
  ].filter(Boolean));
  $('#scrim .modal').classList.add('wide');
  bind();
}

/* อ่านไฟล์แล้วแปลงเป็นแถวข้อมูล — จับคู่หัวคอลัมน์ตามลำดับของแบบฟอร์ม */
function parseContactCSV(text, map, headers){
  const rows = parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));
  if(rows.length < 2) throw new Error('ไฟล์ไม่มีข้อมูล หรือมีแต่หัวคอลัมน์');
  const head = rows[0].map(normHeader);
  const want = headers.map(normHeader);
  /* ยอมให้สลับลำดับคอลัมน์ได้ โดยจับจากชื่อหัวคอลัมน์ */
  const idx = want.map(w=>head.indexOf(w));
  const useOrder = idx.filter(i=>i>=0).length < Math.min(3, want.length);
  return rows.slice(1).map(r=>{
    const o = {};
    map.forEach((f,i)=>{ const j = useOrder ? i : (idx[i] >= 0 ? idx[i] : i); o[f] = String(r[j] || '').trim(); });
    return o;
  });
}

/* หาผู้ติดต่อเดิม — ไล่จากรหัส เลขผู้เสียภาษี แล้วชื่อเต็ม */
function findContact(kind, rec, nameStr){
  const pool = DB.customers.filter(c=>(kind==='vendor') ? isVend(c) : isCust(c));
  if(rec.code)  { const h = pool.find(c=>c.code && c.code === rec.code); if(h) return h; }
  if(rec.taxId) { const h = pool.find(c=>c.taxId && c.taxId === rec.taxId); if(h) return h; }
  if(nameStr)   { const h = pool.find(c=>normName(custName(c)) === normName(nameStr)); if(h) return h; }
  return null;
}
function recName(rec){
  return rec.type === 'นิติบุคคล' || rec.orgName
    ? String(rec.orgName || '').trim()
    : [rec.firstName, rec.lastName].filter(Boolean).join(' ').trim();
}

/* ตรวจไฟล์แล้วสรุปผลก่อนนำเข้าจริง */
function planContactImport(kind, recs){
  const seen = {};
  const plan = {add:[], update:[], skip:[], vehAdd:0};
  recs.forEach((rec, i)=>{
    const nm = recName(rec);
    if(!nm){ plan.skip.push({row:i+2, why:'ไม่มีชื่อ'}); return; }
    const key = (rec.code || rec.taxId || normName(nm));
    const hit = findContact(kind, rec, nm);
    const bucket = seen[key];
    if(bucket){ bucket.recs.push(rec); if(kind==='customer' && rec.v_plateB) plan.vehAdd++; return; }
    const entry = {key, name:nm, rec, recs:[rec], existing:hit};
    seen[key] = entry;
    (hit ? plan.update : plan.add).push(entry);
    if(kind==='customer' && rec.v_plateB) plan.vehAdd++;
  });
  return plan;
}

/* เขียนข้อมูลจากแถวลงในผู้ติดต่อหนึ่งราย */
function applyContactRec(c, rec, kind){
  c.type = rec.type === 'นิติบุคคล' ? 'company' : 'person';
  if(kind === 'vendor'){ c.orgName = rec.orgName || ''; }
  else if(c.type === 'company'){ c.orgName = rec.orgName || ''; c.firstName=''; c.lastName=''; }
  else { c.prefix = rec.prefix || 'นาย'; c.firstName = rec.firstName || ''; c.lastName = rec.lastName || ''; c.orgName=''; }
  ['taxId','tel','tel2','email','note'].forEach(f=>{ if(rec[f]) c[f] = rec[f]; });
  if(rec.creditDays) c.creditDays = num(rec.creditDays);
  c.addr = c.addr || {};
  [['a_no','no'],['a_village','village'],['a_moo','moo'],['a_soi','soi'],['a_road','road'],
   ['a_subdistrict','subdistrict'],['a_district','district'],['a_province','province'],['a_zip','zip']]
   .forEach(([src,dst])=>{ if(rec[src]) c.addr[dst] = rec[src]; });
}
function applyVehicle(c, rec){
  if(!rec.v_plateB && !rec.v_brand && !rec.v_chassisNo) return false;
  c.vehicles = c.vehicles || [];
  const same = c.vehicles.find(v=>
    (rec.v_chassisNo && v.chassisNo === rec.v_chassisNo) ||
    (rec.v_plateB && v.plateA === rec.v_plateA && v.plateB === rec.v_plateB));
  const v = same || blankVehicle();
  Object.assign(v, {brand:rec.v_brand||v.brand, model:rec.v_model||v.model, year:rec.v_year||v.year,
    color:rec.v_color||v.color, plateA:rec.v_plateA||v.plateA, plateB:rec.v_plateB||v.plateB,
    plateProv:rec.v_plateProv||v.plateProv, engineNo:rec.v_engineNo||v.engineNo,
    chassisNo:rec.v_chassisNo||v.chassisNo, mileage:rec.v_mileage||v.mileage});
  if(!same){
    /* แถวรถว่างเปล่าที่ระบบใส่ให้ตอนสร้างผู้ติดต่อ ให้ใช้แถวนั้นแทนการเพิ่มใหม่ */
    const blank = c.vehicles.find(x=>!x.brand && !x.plateB && !x.chassisNo);
    if(blank) Object.assign(blank, v); else c.vehicles.push(v);
  }
  return !same;
}

      const file = e.target.files[0]; if(!file) return;
      const rd = new FileReader();
      rd.onload = ()=>{ try{ handler(String(rd.result).replace(/^\ufeff/,'')); }
                        catch(err){ toast('นำเข้าไม่สำเร็จ: '+err.message); }
                        f.value=''; };
      rd.readAsText(file, 'UTF-8');
    };
    f.click();
  };
  const on = (id, fn)=>{ const b = $('#'+id); if(b) b.onclick = fn; };

  on('impProdDl',  exportProductsCsv);
  on('impProdTpl', downloadProductTemplate);
  on('impProdUp',  ()=>{
    /* สร้างช่องเลือกไฟล์ชั่วคราว แล้วส่งต่อให้ตัวนำเข้าตัวเดียวกับหน้า 05 */
    const f = document.createElement('input');
    f.type = 'file'; f.accept = '.csv,text/csv';
    f.onchange = handleProductCSVImport;
    f.click();
  });

  on('impCustDl',  exportCustomersCsv);
  on('impCustTpl', custTemplate);
  on('impCustUp',  ()=>pick(t=>contactImportModal('customer', parseContactCSV(t, CUST_FIELD_MAP, CUST_CSV_HEADERS))));

  on('impVendDl',  exportVendorsCsv);
  on('impVendTpl', vendTemplate);
  on('impVendUp',  ()=>pick(t=>contactImportModal('vendor', parseContactCSV(t, VEND_FIELD_MAP, VEND_CSV_HEADERS))));
}

/* ---------- ผูกปุ่มของหน้าตั้งค่าร้านและพนักงาน ---------- */
function bindShopSettings(){
  /* ด่านสิทธิ์ของหมวด 07 — คิดตามแท็บที่เปิดอยู่ เพราะทั้งสามแท็บใช้ตัวผูกปุ่มตัวเดียวกัน
     ช่องติ๊ก "แก้ไขได้" ของ 07.1/07.2/07.3 ในหน้าสิทธิ์จึงมีผลจริงตั้งแต่ตรงนี้ */
  const setSub = settingsTab === 'import' ? 'import' : settingsTab === 'staff' ? 'staff' : 'shop';
  const blockSet = what => blockEdit('settings', setSub, what || 'การตั้งค่า');

  if($('#s_qrPick')) $('#s_qrPick').onclick = ()=>{ if(blockSet('ข้อมูลร้าน')) return; $('#s_qrFile').click(); };
  if($('#s_qrDel')) $('#s_qrDel').onclick = async ()=>{
    if(blockSet('ข้อมูลร้าน')) return;
    if(!await confirmPop('ลบรูป QR โอนเงิน?')) return;
    delete DB.shop.bankQR; saveMeta(); renderSettings(); toast('ลบรูป QR แล้ว');
  };
  if($('#s_qrFile')) $('#s_qrFile').onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 8*1024*1024){ e.target.value=''; return toast('ไฟล์ใหญ่เกินไป เลือกรูปที่เล็กกว่า 8 MB'); }
    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        /* QR ต้องขอบคมถึงสแกนได้ — เก็บเป็น PNG และไม่ย่อจนเสียราย ละเอียด */
        const M = 380;
        const sc = Math.min(1, M/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx = cv.getContext('2d');
        cx.imageSmoothingEnabled = sc < 1;      /* ย่อให้เนียน แต่ไม่ขยาย */
        cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
        cx.drawImage(img, 0, 0, w, h);
        const data = cv.toDataURL('image/png');
        if(JSON.stringify(DB).length + data.length > STORE_CAP)
          return toast('พื้นที่เก็บข้อมูลไม่พอ — ลบรูปสินค้าที่ไม่จำเป็นออกก่อน');
        DB.shop.bankQR = data;
        saveMeta(); renderSettings();
        toast(`บันทึกรูป QR แล้ว · ${Math.round(data.length/1024)} KB`);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
    e.target.value = '';
  };
  if($('#s_logoPick')) $('#s_logoPick').onclick = ()=>{ if(blockSet('ข้อมูลร้าน')) return; $('#s_logoFile').click(); };
  if($('#s_logoFile')) $('#s_logoFile').onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 8*1024*1024) { e.target.value=''; return toast('ไฟล์ใหญ่เกินไป เลือกรูปที่เล็กกว่า 8 MB'); }
    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const M = 320;
        const sc = Math.min(1, M/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        DB.shop.logo = cv.toDataURL('image/png');
        saveMeta(); renderSettings(); paintRailLogo(); toast('บันทึกตราสัญลักษณ์แล้ว');
      };
      img.onerror = ()=> toast('ไฟล์รูปไม่ถูกต้อง');
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
    e.target.value='';
  };
  if($('#s_logoDel')) $('#s_logoDel').onclick = async ()=>{
    if(blockSet('ข้อมูลร้าน')) return;
    if(!await confirmPop('ลบตราสัญลักษณ์ออกจากหัวเอกสาร?')) return;
    DB.shop.logo=''; saveMeta(); renderSettings(); paintRailLogo(); toast('ลบตราสัญลักษณ์แล้ว');
  };
  bindDemoInvite('settings', renderSettings);
  if($('#sRestore')) $('#sRestore').onclick = async ()=>{
    if(blockSet('ข้อมูลในระบบ')) return;
    if(!await confirmPop('นำข้อมูลก่อนถูกทับกลับมา?\n\nชุดข้อมูลทดสอบที่แสดงอยู่ขณะนี้จะถูกแทนที่ด้วยข้อมูลเดิมของเครื่อง')) return;
    try{
      const raw = localStorage.getItem(BACKUP_KEY);
      const d = JSON.parse(raw).db;
      DB = Object.assign({shop:null,products:[],categories:[],customers:[],vendors:[],purchases:[],
        quotes:[],receipts:[],users:[],seq:{q:0,r:0,c:0,p:0,v:0}}, d);
      if(!DB.shop) DB.shop = Object.assign({}, DEFAULT_SHOP);
      if(!DB.categories || !DB.categories.length) DB.categories = seedCategories();
      DB.products.forEach(p=>{ if(p.cat===undefined) p.cat=''; });
      DB.customers.forEach(c=>{ if(!c.kind) c.kind='customer'; });
      DB.demoSeeded = false; DB.demoReplaced = false; DB.demoDismissed = true;
      DB.demoVersion = DEMO_VERSION;
      localStorage.removeItem(BACKUP_KEY);
      saveDB(); curQuote=null; curRec=null; curPo=null;
      go('settings'); toast('กู้คืนข้อมูลเดิมเรียบร้อยแล้ว');
    }catch(err){ toast('กู้คืนไม่สำเร็จ: '+err.message); }
  };
  if($('#sDemo')) $('#sDemo').onclick = async ()=>{
    if(blockSet('ข้อมูลในระบบ')) return;
    if(!await confirmPop(`สร้างข้อมูลทดสอบชุดใหม่?\n\nสินค้า ${DEMO_SIZE.products} รายการ · ลูกค้า ${DEMO_SIZE.customers} ราย · ผู้ขาย ${DEMO_SIZE.vendors} ราย\nใบซื้อ ${DEMO_SIZE.purchases} ฉบับ · ใบเสนอราคา ${DEMO_SIZE.sales} ฉบับ · ใบเสร็จ ${DEMO_SIZE.sales} ฉบับ\n\nข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ — หากมีข้อมูลจริงอยู่ ให้สำรองเป็นไฟล์ก่อน`)) return;
    seedDemo(); saveDB(); renderSettings();
    toast(`สร้างข้อมูลทดสอบแล้ว — สินค้า ${DEMO_SIZE.products} รายการ · ผู้ติดต่อ ${DEMO_SIZE.customers+DEMO_SIZE.vendors} ราย · เอกสาร ${DEMO_SIZE.purchases+DEMO_SIZE.sales*2} ฉบับ`);
  };
  if($('#sClear')) $('#sClear').onclick = async ()=>{
    if(blockSet('ข้อมูลในระบบ')) return;
    if(!await confirmPop('ล้างข้อมูลทั้งหมดออกจากระบบ?\n\nสินค้า ผู้ติดต่อ ใบซื้อ ใบเสนอราคา และใบเสร็จทั้งหมดจะถูกลบ\nการตั้งค่าร้าน ผู้ใช้งาน และลิขสิทธิ์จะยังอยู่')) return;
    if(!await confirmPop('ยืนยันอีกครั้ง — การลบนี้ย้อนกลับไม่ได้ หากยังไม่ได้สำรองข้อมูล ให้กดยกเลิกแล้วสำรองก่อน')) return;
    clearDemo(); saveDB(); renderSettings();
    toast('ล้างข้อมูลเรียบร้อย พร้อมเริ่มบันทึกข้อมูลจริง');
  };
  const addUser = ()=>{
    DB.users = DB.users || [];
    if(DB.users.length >= MAX_USERS) return toast(`เพิ่มผู้ใช้งานได้สูงสุด ${MAX_USERS} คน`);
    const u = blankUser();
    if(blockSet('ข้อมูลผู้ใช้งาน')) return;
    u.name = 'พนักงานคนที่ ' + (DB.users.length + 1);
    DB.users.push(u);
    settingsUserId = u.id;
    saveMeta(); renderSettings();
    savedPop('เพิ่มผู้ใช้ '+u.code+' แล้ว — ตั้งชื่อและเลือกเมนูที่ให้ใช้ได้ด้านล่าง');
  };
  if($('#uAdd'))      $('#uAdd').onclick = addUser;
  if($('#uAddEmpty')) $('#uAddEmpty').onclick = addUser;
  $$('[data-upick]').forEach(b=>b.onclick=()=>{ settingsUserId = b.dataset.upick; renderSettings(); });
  const u0 = curSettingsUser();
  if(u0){
    /* ทุกช่องในแผงนี้แก้สิทธิ์ของผู้ใช้ได้โดยตรง ถ้าไม่มีสิทธิ์แก้ต้องคืนค่าเดิมแล้วหยุด */
    const saveUser = ()=>{ saveMeta(); applyPerms(); };
    const blockUser = ()=>{ if(!blockSet('ข้อมูลผู้ใช้งาน')) return false; renderSettings(); return true; };
    if($('#u_name2')) $('#u_name2').onchange   = e=>{ if(blockUser()) return; u0.name = e.target.value.trim(); saveUser(); toast('บันทึกชื่อผู้ใช้แล้ว'); };
    if($('#u_active2')) $('#u_active2').onchange = e=>{ if(blockUser()) return; u0.active = e.target.checked; saveUser(); renderSettings();
      toast(u0.active ? 'เปิดให้ผู้ใช้รายนี้เข้าใช้งาน' : 'ปิดการเข้าใช้งานของผู้ใช้รายนี้'); };
    $$('[data-p2]').forEach(cb=>cb.onchange=()=>{
      if(blockUser()) return;
      u0.perms[cb.dataset.p2] = cb.checked;
      if(!cb.checked && u0.perms.sub) delete u0.perms.sub[cb.dataset.p2];
      saveUser(); renderSettings();
      toast((cb.checked?'เปิดสิทธิ์ ':'ปิดสิทธิ์ ') + (PERMS.find(p=>p[0]===cb.dataset.p2)||[])[1]);
    });
    $$('[data-pc2]').forEach(cb=>cb.onchange=()=>{
      if(blockUser()) return;
      u0.perms.cost = cb.checked;
      saveUser();
      toast(cb.checked ? 'เปิดสิทธิ์เห็นต้นทุนสินค้า' : 'ซ่อนต้นทุนสินค้าจากผู้ใช้รายนี้แล้ว');
    });
    if($('#uPermSave')) $('#uPermSave').onclick = ()=>{
      if(blockUser()) return;
      saveUser();
      toast('บันทึกสิทธิ์ผู้ใช้เรียบร้อย — กลับมาแก้ไขได้เสมอ');
    };
    /* บันทึกชุดติ๊กเมนูย่อยของเมนูหนึ่งลง perms.tabs (เลิกใช้รูปแบบเก่า) */
    const saveTabsOf = k=>{
      if(blockUser()) return;
      u0.perms.tabs = u0.perms.tabs || {};
      $$(`[data-pt2^="${k}."]`).forEach(el=> u0.perms.tabs[el.dataset.pt2] = el.checked);
      if(u0.perms.sub) delete u0.perms.sub[k];
      saveUser();
    };
    $$('[data-pt2]').forEach(cb=>cb.onchange=()=>{
      const k = cb.dataset.pt2.split('.')[0];
      saveTabsOf(k);
      const [, no, tl] = (subTabsOf(k)||[]).find(x=>x[0]===cb.dataset.pt2.split('.')[1]) || [];
      toast((cb.checked?'เปิดสิทธิ์ ':'ปิดสิทธิ์ ') + (no||'') + ' ' + (tl||''));
    });
    $$('[data-all2]').forEach(b=>b.onclick=()=>{
      $$(`[data-pt2^="${b.dataset.all2}."]`).forEach(el=>el.checked=true);
      saveTabsOf(b.dataset.all2); toast('เปิดสิทธิ์ทุกเมนูย่อย');
    });
    $$('[data-none2]').forEach(b=>b.onclick=()=>{
      $$(`[data-pt2^="${b.dataset.none2}."]`).forEach(el=>el.checked=false);
      saveTabsOf(b.dataset.none2); toast('ปิดสิทธิ์ทุกเมนูย่อยของเมนูนี้');

    $$('[data-sub2]').forEach(sel=>sel.onchange=()=>{
      if(blockUser()) return;
      const k = sel.dataset.sub2;
      u0.perms.sub = u0.perms.sub || {};
      if(sel.value) u0.perms.sub[k] = sel.value; else delete u0.perms.sub[k];
      saveUser(); renderSettings();
      const t = (subTabsOf(k)||[]).find(x=>x[0]===sel.value);
      toast(sel.value ? `จำกัดเมนู${(PERMS.find(p=>p[0]===k)||[])[1]} ไว้ที่ ${t[1]} ${t[2]}`
                      : `เปิดเมนู${(PERMS.find(p=>p[0]===k)||[])[1]} ได้ทุกเมนูย่อย`);
    });
    if($('#uRegen')) $('#uRegen').onclick = ()=>{ if(blockUser()) return; u0.pass = genPass(); saveMeta(); renderSettings();

    if($('#uDel')) $('#uDel').onclick = async ()=>{
      if(blockSet('ข้อมูลผู้ใช้งาน')) return;

      DB.users = (DB.users||[]).filter(x=>x.id!==u0.id);
      if(CURRENT_USER && CURRENT_USER.id === u0.id) CURRENT_USER = null;
      settingsUserId = (DB.users[0]||{}).id || null;
      saveMeta(); renderSettings(); applyPerms(); savedPop('ลบผู้ใช้ '+(u0.name||u0.code)+' แล้ว');

  if($('#sSave')) $('#sSave').onclick = ()=>{

    Object.assign(DB.shop,{name:$('#s_name').value,taxId:$('#s_taxId').value,addr:$('#s_addr').value,
      tel:$('#s_tel').value,tel2:$('#s_tel2').value,
      /* ยอมรับค่า 0 = ไม่คิด VAT — ใช้ 7 เฉพาะตอนช่องว่างหรือกรอกไม่เป็นตัวเลข */
      vatRate:$('#s_vat').value.trim()==='' || isNaN(+$('#s_vat').value) ? 7 : Math.max(0, num($('#s_vat').value)),
      priceTier:$('#s_tier').value,
      bankName:$('#s_bankName').value.trim(), bankAcc:$('#s_bankAcc').value.trim(), bankHolder:$('#s_bankHolder').value.trim(),
      ownerPass:$('#s_ownerPass').value.trim(), proposerName:$('#s_proposer').value.trim()});
    saveMeta(); $('#brandName').textContent=DB.shop.name; toast('บันทึกการตั้งค่าแล้ว');
  };
  if($('#sExport')) $('#sExport').onclick = async ()=>{
    if(blockExportTab('settings','shop')) return;
    toast('กำลังรวบรวมข้อมูลและคลังรูป…');
    const payload = Object.assign({}, DB, { _piclib: await PICDB.all() });
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`drivegolight-backup-${today()}.json`; a.click();
    toast('สำรองข้อมูลเรียบร้อย เก็บไฟล์ไว้ในที่ปลอดภัย');
  };
  if($('#sImport')) $('#sImport').onclick = ()=>{ if(blockSet('ข้อมูลในระบบ')) return; $('#sFile').click(); };
  if($('#sFile')) $('#sFile').onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = async ()=>{
      try{
        const d = JSON.parse(rd.result);
        if(!d || !Array.isArray(d.products)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
        if(d._piclib){
          for(const [k,v] of Object.entries(d._piclib)) await PICDB.set(k, v);
          delete d._piclib;
        }
        if(!await confirmPop(`กู้คืนข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่\n\nอะไหล่ ${d.products.length} รายการ · ลูกค้า ${(d.customers||[]).length} ราย · ใบเสนอราคา ${(d.quotes||[]).length} ฉบับ · ใบเสร็จ ${(d.receipts||[]).length} ฉบับ`)) return;
        DB = Object.assign({shop:null,products:[],customers:[],quotes:[],receipts:[],seq:{q:0,r:0,c:0}}, d);
        if(!DB.shop) DB.shop = Object.assign({}, DEFAULT_SHOP);
        await saveDB();
        $('#brandName').textContent = DB.shop.name;
        curQuote = null; curRec = null;
        go('settings');
        toast(DB.products.length > MAX_PRODUCTS
          ? `กู้คืนแล้ว แต่มีอะไหล่ ${DB.products.length.toLocaleString()} รายการ เกินขีดจำกัด ${MAX_PRODUCTS.toLocaleString()} — เพิ่มรายการใหม่ไม่ได้จนกว่าจะลบให้ต่ำกว่าขีดจำกัด`
          : 'กู้คืนข้อมูลเรียบร้อยแล้ว');
      }catch(err){ toast('ไฟล์ไม่ถูกต้อง: '+err.message); }
      e.target.value='';
    };
    rd.readAsText(file);
  };
}

  /* ---- ฟอร์มขอรหัสทดลองใช้ฟรี ---- */
  const trRead = ()=>({
    shop:$('#tr_shop').value.trim(), taxId:digitsOf($('#tr_tax').value), prov:$('#tr_prov').value.trim(),
    name:$('#tr_name').value.trim(), tel:$('#tr_tel').value.trim(), email:$('#tr_email').value.trim(),
    line:$('#tr_line').value.trim(), staff:$('#tr_staff').value.trim(), src:$('#tr_src').value.trim()
  });
  const trValid = d=>{
    if(!d.shop)  return 'กรอกชื่ออู่ / กิจการ';
    if(d.taxId.length!==13) return 'กรอกเลขประจำตัวผู้เสียภาษี 13 หลัก';
    if(!d.name)  return 'กรอกชื่อผู้ติดต่อ';
    if(!d.tel)   return 'กรอกเบอร์โทรศัพท์';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return 'กรอกอีเมลให้ถูกต้อง';
    return '';
  };
  const trText = d=>[
    `ขอรับรหัสทดลองใช้ฟรี ${TRIAL_DAYS} วัน — ${APP.name} v${APP.version}`,
    '',
    `ชื่ออู่ / กิจการ: ${d.shop}`,
    `เลขประจำตัวผู้เสียภาษี: ${d.taxId}`,
    `จังหวัด: ${d.prov||'-'}`,
    `ผู้ติดต่อ: ${d.name}`,
    `โทรศัพท์: ${d.tel}`,
    `อีเมล: ${d.email}`,
    `LINE ID: ${d.line||'-'}`,
    `จำนวนช่าง/พนักงาน: ${d.staff||'-'}`,
    `รู้จักจาก: ${d.src||'-'}`,
    '',
    `วันที่ขอ: ${thDate(today())}`
  ].join('\n');
  const trSave = (d, sent)=>{
    DB.lic.trialReq = Object.assign({}, d, {sentAt: sent ? today() : (DB.lic.trialReq||{}).sentAt||''});
    saveMeta();
  };
  $('#tr_copy').onclick = async ()=>{
    const d = trRead(); const err = trValid(d); if(err) return toast(err);
    trSave(d, false);
    try{ await navigator.clipboard.writeText(trText(d)); toast('คัดลอกข้อความคำขอแล้ว ส่งได้ทาง LINE / อีเมล / เว็บไซต์ '+APP.site); }
    catch(e){ prompt('คัดลอกข้อความด้านล่างเพื่อส่งคำขอ', trText(d)); }
  };
  $('#tr_send').onclick = ()=>{
    const d = trRead(); const err = trValid(d); if(err) return toast(err);
    trSave(d, true);
    const subj = encodeURIComponent(`ขอรหัสทดลองใช้ฟรี ${TRIAL_DAYS} วัน — ${d.shop} (${d.taxId})`);
    const body = encodeURIComponent(trText(d));
    const to = APP.trialEmail || '';
    window.location.href = `mailto:${to}?subject=${subj}&body=${body}`;
    $('#tr_status').textContent = 'ส่งคำขอล่าสุดเมื่อ '+thDate(today())+' · รอรับรหัสทางอีเมล/โทรศัพท์ที่แจ้งไว้';
    const chip = document.querySelector('#trialCard header .chip'); if(chip){ chip.className='chip ok'; chip.textContent='ส่งคำขอแล้ว'; }
    toast('เปิดอีเมลคำขอแล้ว — หากอีเมลไม่เปิด กดปุ่มคัดลอกข้อความแล้วส่งทางช่องทางอื่นได้');
  };

  $('#lic_go').onclick = ()=>{
    const key = $('#lic_key').value.trim();
    if(!key) return toast('กรอกรหัสลิขสิทธิ์ก่อน');
    if(digitsOf(DB.shop.taxId).length < 13) return toast('กรอกเลขประจำตัวผู้เสียภาษี 13 หลักในเมนูตั้งค่าร้านก่อน');
    const exp = checkKey(key, DB.shop.taxId);
    if(!exp) return toast('รหัสไม่ถูกต้อง หรือไม่ตรงกับเลขประจำตัวผู้เสียภาษีของอู่');
    if(daysBetween(today(), exp) < 0) return toast('รหัสนี้หมดอายุแล้วเมื่อ '+thDate(exp));
    DB.lic.key = 'DGL-'+String(key).toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/^DGL/,'').replace(/(.{4})(.{4})/,'$1-$2');
    DB.lic.expires = exp;
    DB.lic.taxId = digitsOf(DB.shop.taxId);
    saveMeta(); renderLicense(); paintLicBadge();
    toast('เปิดใช้งานเรียบร้อย ใช้งานได้ถึง '+thDate(exp));
  };
  $('#lic_key').addEventListener('input', e=>{
    let v = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,'');
    if(v.startsWith('DGL')) v = v.slice(3);
    v = v.slice(0,8);
    e.target.value = 'DGL-' + (v.length>4 ? v.slice(0,4)+'-'+v.slice(4) : v);
  });
}

function paintLicBadge(){
  const st = licStatus(), el = $('#licBadge');
  if(!el) return;
  const cls = st.mode==='active' ? (st.left<=30?'warn':'active') : st.mode==='trial' ? (st.left<=3?'warn':'trial') : 'expired';
  const txt = st.mode==='trial'   ? `<b>ทดลองใช้ เหลือ ${st.left} วัน</b>ครบกำหนด ${thDate(st.until)} · กดเพื่อต่ออายุ`
            : st.mode==='active'  ? `<b>ลิขสิทธิ์ใช้งานได้</b>ถึง ${thDate(st.until)} (อีก ${st.left} วัน)`

  el.innerHTML = txt;

function addrLine(a){
  const p=[];
  if(a.no) p.push(`${a.no}`);
  if(a.village) p.push(`${a.village}`);
  if(a.moo) p.push(`หมู่ ${a.moo}`);
  if(a.soi) p.push(`ซ.${a.soi}`);
  if(a.road) p.push(`ถ.${a.road}`);
  if(a.subdistrict) p.push(`แขวง/ต.${a.subdistrict}`);
  if(a.district) p.push(`เขต/อ.${a.district}`);
  if(a.province) p.push(a.province);
  if(a.zip) p.push(a.zip);
  return p.join(' ') || '-';
}

function docSaved(d){
  if(!d || !d.id) return true;
  return [DB.quotes, DB.invoices, DB.receipts, DB.purchases, DB.expenses,
          DB.billnotes, DB.claims, DB.counts]
    .some(a => (a||[]).some(x => x.id === d.id));
}
function doPrint(html, doc){
  if(doc && isVoid(doc)) html = String(html).replace('<div class="paper">',
    '<div class="paper"><div class="voidstamp">ยกเลิก</div>');
  else if(doc && !docSaved(doc)) html = String(html).replace('<div class="paper">',
    '<div class="paper"><div class="draftstamp">ยังไม่บันทึก</div>');
  $('#printroot').innerHTML = html; window.print();
}

  jobcard:      'ใบรับรถ / ใบสั่งงานซ่อม',
  quote:        'ใบเสนอราคา / ใบอนุมัติซ่อม',
  receipt_full: 'ใบเสร็จรับเงิน — มีภาษีมูลค่าเพิ่ม + หัก ณ ที่จ่าย',
  receipt_wht:  'ใบเสร็จรับเงิน — ไม่มีภาษีมูลค่าเพิ่ม แต่มีหัก ณ ที่จ่าย',
  receipt_non:  'ใบเสร็จรับเงิน — NON-TAX (ไม่มีรายการภาษี)',
  purchase:     'ใบบันทึกซื้อสินค้า',
  expense:      'ใบบันทึกค่าใช้จ่าย'
};
/* ชื่อเก่าที่อาจถูกเรียกจากที่อื่น */
const FORM_KIND_ALIAS = {receipt:'receipt_full'};

/* ประเภทภาษีของใบเสร็จ: full = VAT+WHT · wht = ไม่มี VAT มี WHT · non = ไม่มีภาษีเลย */
function recTaxKind(r){
  if(r.taxKind) return r.taxKind;
  if(r.vatMode !== 'none') return 'full';
  return num(r.whtRate) > 0 ? 'wht' : 'non';
}

      หัวกระดาษจะใช้ชื่ออู่ ที่อยู่ และตราสัญลักษณ์ตามที่ตั้งค่าไว้</p>

function bankLine(opts){
  opts = opts || {};

  return `<div style="margin-top:6px;padding:5px 8px;border:1px solid #999;border-radius:4px;
      background:#F6F7F8;font-size:11px;line-height:1.7">

      </div>
      ${qr?`<img src="${qr}" alt="QR โอนเงิน" style="width:64px;height:64px;flex:none;

  </div>`;
}

  const cats = [...new Set(list.map(p=>p.cat||'ไม่ระบุหมวด'))];
  return cats.length === 1 ? cats[0] : `${cats.length} หมวดหมู่`;
}

  };
  const body = ()=>{
    const n = listOf().length;
    return `
      <div class="grid g2">

function exportCountSheetCsv(list, showSys){
  if(blockExportTab('stock','list')) return;
  if(!list.length) return toast('ไม่มีสินค้าในหมวดที่เลือก');
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const head = ['ลำดับ','รหัสสินค้า','ชื่อสินค้า','หมวดหมู่','หน่วย']
    .concat(showSys?['จำนวนที่ระบบมี']:[])
    .concat(['นับได้จริง','ผลต่าง','หมายเหตุ']);
  const lines = [head.join(',')];
  list.forEach((p,i)=>{
    const row = [i+1, q(p.code), q(p.name), q(p.cat||''), q(p.unit||'')]
      .concat(showSys?[num(p.qty)]:[])
      .concat(['','','']);          /* เว้นว่างไว้ให้กรอก */
    lines.push(row.join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `drivegolight-ใบตรวจนับ-${today()}.csv`; a.click();
  toast(`ส่งออกใบตรวจนับ ${list.length} รายการแล้ว — เปิดด้วย Excel ได้เลย`);
}

/* =====================================================================
   รายการค้างทำ — สินค้าในเอกสารที่ยังไม่ได้ลงทะเบียน
   ===================================================================== */
const normName = v => String(v||'').trim().replace(/\s+/g,' ').toLowerCase();

/* ค่าแรงและรายการบริการไม่นับ เพราะไม่ใช่สินค้าที่ต้องมีในสต๊อก */
function isPendingItem(it){
  return !it.pid && String(it.name||'').trim() !== '' && it.code !== 'LAB';
}
function isIgnoredItem(name){
  return (DB.ignoredItems||[]).includes(normName(name));
}
/* ใช้ตอนวาดตารางในเอกสาร — บอกว่าบรรทัดนี้ต้องเตือนหรือไม่ */
function pendMark(it){
  if(!isPendingItem(it) || isIgnoredItem(it.name)) return '';
  return `<span class="pend" title="ยังไม่ได้ลงทะเบียนในเมนูสินค้า — จัดการได้ที่ สินค้า › รายการค้างทำ">✱</span>`;
}

const PEND_SOURCES = [
  ['quotes',    'ใบเสนอราคา'],
  ['invoices',  'ใบส่งมอบงาน'],
  ['receipts',  'ใบเสร็จรับเงิน'],
  ['purchases', 'ใบซื้อสินค้า']
];
function pendingList(){
  const map = {};
  PEND_SOURCES.forEach(([field, label])=>{
    live(DB[field]).forEach(doc=>(doc.items||[]).forEach(it=>{
      if(!isPendingItem(it) || isIgnoredItem(it.name)) return;
      const key = normName(it.name);
      if(!map[key]) map[key] = {key, name:String(it.name).trim(), n:0, qty:0,
        unit:it.unit||'ชิ้น', price:num(it.price), lastDate:'', docs:[], sources:{}};
      const m = map[key];
      m.n++; m.qty += num(it.qty);
      m.sources[label] = (m.sources[label]||0) + 1;
      if(m.docs.length < 8) m.docs.push({no:doc.no, date:doc.date, label});
      if(!m.lastDate || doc.date > m.lastDate){
        m.lastDate = doc.date; m.price = num(it.price); m.unit = it.unit || m.unit;
        m.name = String(it.name).trim();
      }
    }));
  });
  /* เรียงตามเอกสารล่าสุดที่พบชื่อนั้น ของที่เพิ่งพิมพ์เข้ามาจะได้ขึ้นบนสุด
     จะได้รู้ทันทีว่าที่เพิ่งทำไปยังไม่ได้ลงทะเบียน ไม่ใช่ไปจมอยู่ท้ายรายการ */
  const lastOf = x => (x.docs||[]).reduce((m,d)=> d.date > m ? d.date : m, '');
  return Object.values(map).sort((a,b)=>
    lastOf(b).localeCompare(lastOf(a)) || b.n - a.n || a.name.localeCompare(b.name,'th'));
}
function pendingCount(){ return pendingList().length; }

/* ผูกรายการในเอกสารเดิมเข้ากับสินค้าที่เพิ่งลงทะเบียน */
function linkPendingToProduct(key, prod){
  let n = 0;
  PEND_SOURCES.forEach(([field])=>{
    (DB[field]||[]).forEach(doc=>(doc.items||[]).forEach(it=>{
      if(isPendingItem(it) && normName(it.name) === key){
        it.pid = prod.id; it.code = prod.code; it.oem = prod.oem || ''; 
        if(!it.unit) it.unit = prod.unit;
        n++;
      }
    }));
  });
  return n;
}

/* เอกสารร่างมีข้อมูลที่ยังไม่ได้บันทึกหรือไม่ */
/* วางแถบปุ่มทำงานไว้ที่แถบซ้ายมือ ถ้าไม่มีให้วางไว้เหนือแบบฟอร์มแทน */
function mountActions(sideId, formId, html){
  const side = $('#'+sideId);
  if(side){ side.innerHTML = `<div class="side-actions">${html}</div>`; return; }
  const form = $('#'+formId);
  if(form) form.insertAdjacentHTML('afterbegin', `<div class="fs-bar">${html}</div>`);
}

function draftHasData(doc, fields){
  if(!doc) return false;
  if((doc.items||[]).some(it=>String(it.name||'').trim() || num(it.price)>0 || (it.pid && num(it.qty)>0))) return true;
  return fields.some(f=>{
    const v = f.split('.').reduce((o,k)=>o && o[k], doc);
    return typeof v === 'string' ? v.trim()!=='' : false;
  });
}
async function closeDraft(doc, fields, saved, setNull, rerender){
  const dirty = draftHasData(doc, fields) && !saved;
  if(dirty && !await confirmPop('ปิดเอกสารนี้โดยไม่บันทึก?\n\nข้อมูลที่กรอกไว้จะหายไป หากต้องการเก็บไว้ ให้กดยกเลิกแล้วกดบันทึกก่อน')) return false;
  setNull();
  rerender();
  toast('ปิดเอกสารแล้ว');
  return true;
}
/* การ์ดว่างที่แสดงแทนแบบฟอร์มเมื่อยังไม่ได้เปิดเอกสาร */
/* หัวบล็อกของฟอร์มกรอกข้อมูล — ปิดบล็อกก่อนหน้าแล้วเปิดบล็อกใหม่สลับสี */
/* เลื่อนหน้าจอไปที่ฟอร์มของเอกสาร ครั้งเดียวต่อการเปิดหนึ่งใบ
   (ฟอร์มวาดใหม่ทุกจังหวะพิมพ์ — ห้ามเลื่อนซ้ำระหว่างกรอก) */
/* เอกสารของหน้านี้ถูกปิดแล้ว — เลิกจำ เพื่อให้การเปิดครั้งถัดไปเลื่อนเสมอ */
function focusFormRelease(sel){
  if(String(focusFormOnce.mem||'').startsWith(sel + ':')) focusFormOnce.mem = '';
}
function focusFormOnce(sel, docId){
  const k = sel + ':' + (docId || '');
  if(focusFormOnce.mem === k) return;
  focusFormOnce.mem = k;
  let stop = false;
  const cancel = ()=>{ stop = true; };
  addEventListener('touchstart', cancel, {passive:true, once:true});
  addEventListener('wheel', cancel, {passive:true, once:true});
  /* เลื่อนเป็นชุดหลายจังหวะ — เครื่องช้าที่วาดฟอร์มไม่ทันรอบแรก
     จะถูกเก็บตกรอบถัดไป จนกว่าฟอร์มขึ้นบนจอจริง */
  [80, 300, 700, 1200].forEach(t=>setTimeout(()=>{
    if(stop) return;
    const el = $(sel); if(!el) return;
    const top = el.getBoundingClientRect().top;
    if(top > 140 || top < -40) el.scrollIntoView({block:'start'});
  }, t));
}

/* รหัสอัตโนมัติ: DG + เวลา+สุ่ม รวม 10 หลัก (ชุดอักขระ Code 39) */
function genBarcode(){
  const t = Date.now().toString(36).toUpperCase().slice(-6);
  const r = Math.floor(Math.random()*1296).toString(36).toUpperCase().padStart(2,'0');
  return ('DG' + t + r).replace(/[^A-Z0-9]/g,'0');
}

/* ตารางแท่ง Code 39 — 1=แท่ง/ช่องหนา 0=บาง เรียง แท่ง,ช่อง สลับกัน 9 ส่วน */
const C39 = {'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001',
'5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100',
'A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000',
'F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100',
'K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010',
'P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110',
'U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000',
'Z':'011010000','-':'010000101','.':'110000100',' ':'011000100','*':'010010100'};
function barcodeSVG(text, w, h){
  const t = '*' + String(text).toUpperCase().replace(/[^A-Z0-9\-\. ]/g,'') + '*';
  let bars = [];
  for(const ch of t){
    const p = C39[ch]; if(!p) continue;
    for(let i=0;i<9;i++) bars.push({bar: i%2===0, wide: p[i]==='1'});
    bars.push({bar:false, wide:false});           /* ช่องคั่นตัวอักษร */
  }
  bars.pop();
  const narrow = 1, wide = 2.6;
  const total = bars.reduce((s,b)=>s+(b.wide?wide:narrow),0);
  const k = w/total;
  let x = 0, rects = '';
  bars.forEach(b=>{
    const bw = (b.wide?wide:narrow)*k;
    if(b.bar) rects += `<rect x="${x.toFixed(2)}" y="0" width="${bw.toFixed(2)}" height="${h}"/>`;
    x += bw;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${rects}</svg>`;
}

/* หน้าต่างพิมพ์ฉลากบาร์โค้ด — เลือกจำนวนดวงแล้วสั่งพิมพ์ */

          </div>
        </div>

        ${blk(1,'ลูกค้าที่วางบิล','พิมพ์ชื่อเพื่อค้นหา — แสดงเฉพาะลูกค้าที่มีใบค้างชำระ')}
        <div class="grid g2">
          <div style="position:relative"><label class="f">ลูกค้าที่วางบิล</label>
            <input class="in" id="bn_cust" value="${esc(bn.name||'')}"
              placeholder="พิมพ์ชื่อลูกค้า แล้วเลือกจากรายการ" autocomplete="off"
              style="font-size:16px;font-weight:600;padding:10px 12px">
            <div class="custdrop" id="bnCustDrop"></div>
            <div class="hint" style="font-size:11.5px;margin-top:3px;color:${curKey?'var(--ok)':'var(--ink-3)'}">
              ${curKey ? `เลือกแล้ว — มีใบค้าง ${pool.length} ใบ` : (custs.length? `ลูกค้าที่มีใบค้างทั้งหมด ${custs.length} ราย` : 'ยังไม่มีลูกค้าที่ค้างชำระ')}</div></div>
          <div><label class="f">ผู้วางบิล</label>
            <input class="in" id="bn_by" value="${esc(bn.byWhom)}" placeholder="ชื่อผู้นำเอกสารไปวางบิล"></div>
        </div>

        ${blk(2,'ใบส่งมอบ / ใบแจ้งหนี้ที่รวมในบิลนี้','ติ๊กเลือกใบที่จะแจ้งเก็บ')}
        ${curKey ? `
        <div class="fs-wrap"><table class="fs-t">
          <thead><tr><th style="width:36px"></th><th style="width:150px">เลขที่</th>
            <th style="width:104px">วันที่</th><th style="width:112px">ครบกำหนด</th>
            <th class="num">ยอดเอกสาร</th><th class="num" style="width:120px">ค้างชำระ</th></tr></thead>
          <tbody>
          ${pool.length ? pool.map(v=>{
            const t = recTotals(v), owe = t.payable - paidOf(v);
            const on = (bn.invIds||[]).includes(v.id);
            return `<tr>
              <td style="text-align:center"><input type="checkbox" data-bninv="${v.id}" ${on?'checked':''}></td>
              <td class="mono">${esc(v.no)}</td><td>${thDate(v.date)}</td>
              <td>${thDate(addDays(v.date, num(v.creditDays)))}</td>
              <td class="num mono" style="text-align:right;padding-right:8px">${money(t.payable)}</td>
              <td class="num mono" style="text-align:right;padding-right:8px;color:${owe>0.004?'var(--warn)':'var(--ok)'}">${money(owe)}</td></tr>`;
          }).join('') : `<tr><td colspan="6" class="empty">ลูกค้ารายนี้ไม่มีใบค้างชำระ</td></tr>`}
          </tbody>
          <tfoot><tr><td colspan="5" style="text-align:right"><b>รวมยอดวางบิล (${(bn.invIds||[]).length} ใบ)</b></td>
            <td class="num mono" style="text-align:right;padding-right:8px"><b>${money(total)}</b></td></tr></tfoot>
        </table></div>` : `<div class="hint" style="padding:14px 4px">เลือกลูกค้าก่อน แล้วรายการใบค้างชำระจะแสดงที่นี่</div>`}

        ${blk(3,'หมายเหตุ')}
        <div class="grid"><div>
          <input class="in" id="bn_note" value="${esc(bn.note)}"
            placeholder="เช่น รับเช็คทุกวันศุกร์ เวลา 9:00–12:00 น. ที่แผนกการเงิน"></div></div>
        ${blkEnd()}

        <div class="fs-bottom">
          <span class="note-left">${inDb
            ? 'เอกสารนี้บันทึกแล้ว — แก้ไขได้และกดบันทึกซ้ำ'
            : 'เลือกลูกค้าและติ๊กใบที่จะวางบิลแล้วกดบันทึกได้เลย'}</span>
          <button class="btn primary" id="bnSaveB">บันทึกใบวางบิล</button>
          <button class="btn" id="bnPrintB">พิมพ์ใบวางบิล</button>
          <button class="btn danger" id="bnCloseB">ปิดเอกสาร</button>
        </div>
      </div>
    </div>`;

  mountActions('incSide', 'bnForm', `
      <button class="btn primary" id="bnSave">บันทึกใบวางบิล</button>
      <button class="btn" id="bnPrint">พิมพ์ใบวางบิล</button>
      <button class="btn danger" id="bnClose">ปิดเอกสาร</button>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;text-align:center">
        ${inDb ? 'เอกสารนี้บันทึกแล้ว' : 'ยังไม่ได้บันทึก'}${lastEditNote(bn)}
      </div>`);

  /* ปุ่มท้ายฟอร์มทำงานเหมือนปุ่มแถบบน */
  [['bnSaveB','bnSave'],['bnPrintB','bnPrint'],['bnCloseB','bnClose']].forEach(([b,t])=>{
    if($('#'+b)) $('#'+b).onclick = ()=>{ const el = $('#'+t); if(el) el.click(); };
  });
  const sync = ()=>{
    bn.date = $('#bn_date').value || today();
    bn.dueDate = $('#bn_due').value || '';
    bn.byWhom = $('#bn_by').value.trim();
    bn.note = $('#bn_note').value.trim();
  };
  ['bn_date','bn_due','bn_by','bn_note'].forEach(id=>{
    const el = $('#'+id); if(el) el.onchange = sync;
  });
  /* รายการแนะนำชื่อลูกค้า — panel ของระบบเอง แสดงชื่อเต็มพร้อมจำนวนใบค้าง */
  const pickCust = (hit)=>{
    sync();
    const k = hit.custId || ('name:'+(hit.name||''));
    if(k === curKey){ const d=$('#bnCustDrop'); if(d) d.classList.remove('on'); return; }
    if(hit.custId){
      bn.custId = hit.custId;
      const c = DB.customers.find(x=>x.id===hit.custId);
      bn.name = c ? custName(c) : hit.name;
      if(c){ bn.taxId = c.taxId||''; bn.addr = contactAddr(c); }
    } else { bn.custId = null; bn.name = hit.name; }
    bn.invIds = [];
    renderBillForm();
  };
  const custMatches = ()=>{
    const t = $('#bn_cust').value.trim().toLowerCase();
    return custs.filter(c=>!t || (c.name||'').toLowerCase().includes(t));
  };
  const drawCustDrop = ()=>{
    const L = custMatches();
    const host = $('#bnCustDrop'); if(!host) return;
    host.innerHTML = L.length
      ? L.map((c,i)=>`<button type="button" data-bnc="${i}">
          <b>${esc(c.name||'ไม่ระบุชื่อ')}</b><span>ค้าง ${c.list.length} ใบ</span></button>`).join('')
      : `<div style="padding:13px 15px;color:var(--ink-3);font-size:13px">${
          custs.length? 'ไม่พบลูกค้าชื่อนี้ในรายการค้างชำระ' : 'ยังไม่มีลูกค้าที่ค้างชำระ'}</div>`;
    host.classList.add('on');
    /* ใช้ mousedown เพื่อให้ทันก่อนช่องกรอกเสีย focus */
    $$('#bnCustDrop [data-bnc]').forEach(b=>b.onmousedown = e=>{ e.preventDefault(); pickCust(L[+b.dataset.bnc]); });
  };
  $('#bn_cust').onfocus = drawCustDrop;
  $('#bn_cust').oninput = drawCustDrop;
  $('#bn_cust').onblur  = ()=>setTimeout(()=>{ const d=$('#bnCustDrop'); if(d) d.classList.remove('on'); }, 150);
  $('#bn_cust').onkeydown = e=>{
    if(e.key === 'Enter'){ e.preventDefault(); const L = custMatches(); if(L.length) pickCust(L[0]); }
    if(e.key === 'Escape'){ const d=$('#bnCustDrop'); if(d) d.classList.remove('on'); }
  };
  $$('[data-bninv]').forEach(cb=>cb.onchange = ()=>{
    sync();
    const id = cb.dataset.bninv;
    bn.invIds = bn.invIds || [];
    if(cb.checked){ if(!bn.invIds.includes(id)) bn.invIds.push(id); }
    else bn.invIds = bn.invIds.filter(x=>x!==id);
    renderBillForm();
  });
  $('#bnPrint').onclick = ()=>{ sync(); printBillnote(bn); };
  $('#bnClose').onclick = async ()=>{
    sync();
    if(!inDb && bn.invIds.length){
      if(!await confirmPop('ปิดเอกสารนี้โดยไม่บันทึก?')) return;
    }
    curBill = null; renderBilling();
  };
  $('#bnSave').onclick = ()=>{
    if(!requireLicense()) return;
    if(blockEdit('income','billing','ใบวางบิล')) return;
    sync();
    if(blockIfVoid('billnote', bn.id)) return;
    if(!bn.name && !bn.custId) return toast('เลือกลูกค้าก่อนบันทึก');
    if(!(bn.invIds||[]).length) return toast('ติ๊กเลือกใบที่จะวางบิลอย่างน้อยหนึ่งใบ');
    stampEdit(bn);
    bn.total = billTotal(bn);
    const copy = JSON.parse(JSON.stringify(bn));
    const i = (DB.billnotes||[]).findIndex(x=>x.id===bn.id);
    if(i>=0) DB.billnotes[i] = copy; else (DB.billnotes = DB.billnotes||[]).push(copy);
    saveSome('billnotes'); renderBillForm();
    toast(`บันทึกใบวางบิล ${bn.no} · ${bn.invIds.length} ใบ · ${money(bn.total)}`);
  };
}

  return `<div class="paper">

      ${bn.taxId?`<div class="kv"><b>เลขประจำตัวผู้เสียภาษี:</b><span class="mono">${esc(bn.taxId)}</span></div>`:''}

    <table class="doc">

      ${Array.from({length:Math.max(0, 8 - rows.length)}).map(()=>

    </table>

    <div style="font-size:11.5px;margin-top:6px">จำนวนเงิน (ตัวอักษร) <b>${bahttext(total)}</b></div>
    ${bankLine()}
    ${bn.note ? `<div class="box"><h4>หมายเหตุ</h4>

      <div><div class="line"></div>ผู้รับวางบิล<br><span style="font-size:11px">วันที่ ......../......../........</span></div>

      เมื่อชำระเงินแล้วทางอู่จะออกใบเสร็จรับเงินให้เป็นหลักฐาน</div>

/* ---------- ใบเคลมสินค้า ---------- */
let curClaim = null;

function nextClaimNo(side){
  const S = CLAIM_SIDE[side||'customer'];
  const d = new Date();
  const ym = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
  DB.seq[S.seq] = (DB.seq[S.seq]||0) + 1;
  return `${S.prefix}-${ym}-${String(DB.seq[S.seq]).padStart(3,'0')}`;
}
function blankClaim(side){
  side = side === 'vendor' ? 'vendor' : 'customer';
  return {id:uid(), no:nextClaimNo(side), date:today(), side:side,
    kind: side === 'vendor' ? 'defect' : 'warranty',
    custId:null, name:'', tel:'',
    veh:{brand:'',model:'',plateA:'',plateB:'',plateProv:'',mileage:'',engineNo:'',chassisNo:''},
    refNo:'', reason:'', note:'', items:[], byWhom:'', deducted:false};
}
function claimKind(c){ const L = claimKindList(c); return L.find(k=>k[0]===(c&&c.kind)) || L[0]; }
function claimQty(c){ return (c.items||[]).reduce((s,it)=>s+num(it.qty), 0); }
function claimCost(c){ return (c.items||[]).reduce((s,it)=>s+num(it.qty)*num(it.cost), 0); }

function renderClaim(side){
  side = side === 'vendor' ? 'vendor' : 'customer';
  const S = CLAIM_SIDE[side];
  if(!$('#'+S.view)) return;
  if(!curClaim) focusFormRelease('#clForm');

  const all = (DB.claims || []).filter(c=>claimSideOf(c) === side);
  const thisMonth = all.filter(c=>c.date.slice(0,7) === today().slice(0,7));
  /* ตัวกรองและการแบ่งหน้าใช้กุญแจตามหมวดย่อย (claim / vclaim)
     สองหน้านี้จึงจำตัวกรองของตัวเองแยกกัน ไม่กวนกันเวลาสลับแท็บ */
  const key = S.tab;
  const R = applyDocFilter(key, all);
  $('#'+S.view).innerHTML = `
    <div class="pagehead"><h2>${esc(S.title)}</h2></div>
    <div class="stat" style="margin-bottom:16px">
      <div><span>ใบเคลมทั้งหมด</span><b>${all.length}</b></div>
      <div><span>เดือนนี้</span><b>${thisMonth.length}</b></div>
      <div><span>${side==='vendor'?'จำนวนชิ้นที่ส่งคืน':'จำนวนชิ้นที่จ่ายออก'}</span><b>${all.reduce((s,c)=>s+claimQty(c),0)}</b></div>
      <div><span>มูลค่าตามต้นทุน</span><b style="color:${all.length?'var(--warn)':'var(--ink)'}">${costMoney(all.reduce((s,c)=>s+claimCost(c),0))}</b></div>
    </div>

    <div class="card">
      <header>${canEditTab('stock',S.tab)? `<button class="btn sm newdoc" id="clNew">+ เปิดเอกสารใหม่</button>` : ``}
        <span class="hint">${all.length} ฉบับ</span>
        <div class="spacer"></div>
        ${docSearchBox(key, 'ค้นหา เลขที่ / ชื่อ'+esc(S.party))}</header>
      ${docFilterBar(key, all)}
      ${pagerBar(key, R.totalPages, 'top')}
      <div class="tablewrap">
        <table class="tbl rtbl"><thead><tr>
          <th style="width:134px">เลขที่</th><th style="width:104px">วันที่</th>
          <th style="width:170px">ประเภท</th><th>${esc(S.party)} / รายละเอียด</th>
          <th class="num" style="width:80px">ชิ้น</th>${canCost()?'<th class="num" style="width:110px">มูลค่าต้นทุน</th>':''}
          <th style="width:150px"></th></tr></thead><tbody>
        ${R.pageList.length ? R.pageList.map(c=>`<tr class="${isVoid(c)?'voided':''}">
          <td class="mono" data-f="no">${esc(c.no)} ${voidChip(c)}</td><td data-f="date">${thDate(c.date)}</td>
          <td style="font-size:12.5px" data-f="kind">${esc(claimKind(c)[1])}</td>
          <td data-f="name">${esc(c.name || '-')}
            ${c.reason?`<div style="font-size:11.5px;color:var(--ink-3)">${esc(c.reason)}</div>`:''}</td>
          <td class="num mono" data-f="total">${claimQty(c)} ชิ้น</td>
          ${canCost()?`<td class="num mono" data-f="dueamt">${money(claimCost(c))}</td>`:''}
          <td data-f="act" style="text-align:right;white-space:nowrap">
            <button class="btn sm ghost" data-clopen="${c.id}">เปิด</button>
            ${canExportTab('stock',S.tab)? `<button class="btn sm ghost" data-clprint="${c.id}">พิมพ์</button>`:''}
            ${canEditTab('stock',S.tab)
              ? (isVoid(c) ? '' : `<button class="btn sm ghost" data-cldel="${c.id}">ยกเลิก</button>`)
              : ''}</td></tr>`).join('')
          : `<tr><td colspan="${canCost()?7:6}" class="empty">${all.length
              ? 'ไม่พบเอกสารตามเงื่อนไขที่เลือก'
              : 'ยังไม่มีใบเคลม — กด “+ เปิดเอกสารใหม่” เพื่อบันทึกใบแรก'}</td></tr>`}
        </tbody></table>
      </div>
      ${pagerBar(key, R.totalPages, 'bottom')}
      <div class="body" style="padding-top:0">
        <div class="note">
          <b>${esc(S.title)} ใช้เมื่อไร</b><br>
          ${side === 'vendor'
            ? `ใช้บันทึกการส่งอะไหล่ชำรุดหรือผิดรุ่นคืนให้ร้านที่ซื้อมา
               เช่น ของเสียตั้งแต่แกะกล่อง ส่งผิดรหัส หรือเสียหายระหว่างขนส่ง<br>
               เมื่อบันทึกแล้ว <b>ระบบตัดสต๊อกจริง</b> เพราะของออกจากร้านไปแล้ว
               พอผู้ขายส่งของใหม่มาให้ ให้เปิด <b>ใบซื้อ</b> รับเข้าตามปกติ ต้นทุนจะได้ถูกต้อง`
            : `ใช้บันทึกการจ่ายอะไหล่ออกจากสต๊อกโดยไม่ได้เก็บเงินจากลูกค้า
               เช่น เคลมประกันงานซ่อมของอู่เอง ของเสียจากโรงงาน หรือของชำรุดในร้าน<br>
               เมื่อบันทึกแล้ว <b>ระบบตัดสต๊อกจริง</b> แต่ไม่นับเป็นรายได้ เพราะไม่มีเงินเข้า
               จึงไม่กระทบยอดขาย ภาษีขาย และลูกหนี้`}
        </div>
      </div>
    </div>`;

  if($('#clNew')) $('#clNew').onclick = ()=>{ curClaim = blankClaim(side); renderClaim(side); toast('เปิด'+S.title+'ใหม่'); };
  $$('[data-clopen]').forEach(b=>b.onclick=()=>{
    curClaim = JSON.parse(JSON.stringify(DB.claims.find(x=>x.id===b.dataset.clopen)));
    renderClaim(side);
  });
  $$('[data-clprint]').forEach(b=>b.onclick=()=>printClaim(DB.claims.find(x=>x.id===b.dataset.clprint)));
  /* ยกเลิกแทนการลบ — เอกสารยังอยู่ให้ตรวจย้อนหลังได้ แต่สต๊อกถูกคืนกลับ
     ตรงกับวิธีของเอกสารหมวด 03 และ 04 ที่ไม่ลบทิ้งเหมือนกัน */
  $$('[data-cldel]').forEach(b=>b.onclick=async ()=>{
    const c = DB.claims.find(x=>x.id===b.dataset.cldel);
    if(isVoid(c)) return;
    const ok = await confirmPop(`ยกเลิก${CLAIM_SIDE[claimSideOf(c)].title} ${c.no}?\n\n` +
      'เอกสารจะยังอยู่ในระบบและเปิดดูย้อนหลังได้ แต่จะถูกทำเครื่องหมายว่ายกเลิก\n' +
      'สต๊อกที่ตัดไปแล้วจะถูกคืนกลับให้อัตโนมัติ');
    if(!ok) return;
    if(c.deducted) c.items.forEach(it=>{ if(it.pid){
      const p = DB.products.find(x=>x.id===it.pid);
      if(p) lotReturn(p, num(it.qty), num(it.cogs)||num(it.qty)*num(it.cost));
    }});
    c.deducted = false;
    c.void = {at:new Date().toISOString(), by:userLabel(), reason:''};
    saveSome('claims','products'); renderClaim(side); renderStock();
    savedPop(`ยกเลิก ${c.no} แล้ว — คืนสต๊อกกลับให้เรียบร้อย`);
  });

  bindDocFilter(key, ()=>renderClaim(side));

  /* ---- หน้าต่างเอกสาร ---- */
  if(curClaim){
    docwinOpen(CLAIM_SIDE[claimSideOf(curClaim)].title, 'เลขที่ '+curClaim.no);
    $('#dwBody').innerHTML = `<div id="clForm"></div>`;
    renderClaimForm();
  } else if(stockTab==='claim' || stockTab==='vclaim') docwinClose();
}

          <tfoot><tr><td colspan="3" style="text-align:right"><b>รวม</b></td>
            <td class="num mono"><b>${claimQty(c)}</b></td><td></td>
            <td class="num mono" style="text-align:right;padding-right:8px"><b>${money(claimCost(c))}</b></td>
            <td></td></tr></tfoot>
        </table></div>

        ${blk(4,'เหตุผลและผู้อนุมัติ')}
        <div class="grid g4">
          <div style="grid-column:span 3"><label class="f">เหตุผลในการเคลม</label>
            <input class="in" id="cl_reason" value="${esc(c.reason)}" placeholder="เช่น ผ้าเบรกสึกผิดปกติภายในระยะรับประกัน"></div>
          <div><label class="f">ผู้อนุมัติ</label>
            <input class="in" id="cl_by" value="${esc(c.byWhom)}" placeholder="ชื่อผู้อนุมัติ"></div>
          <div style="grid-column:span 4"><label class="f">หมายเหตุเพิ่มเติม</label>
            <input class="in" id="cl_note" value="${esc(c.note)}"></div>

        <div style="margin-top:14px;padding:11px 14px;background:${c.deducted?'#EDF7F2':'#FCF3E2'};
          border:1px solid ${c.deducted?'#BFE3D6':'#EEDBB4'};border-radius:8px;font-size:13px;line-height:1.7">
          ${c.deducted
            ? '<b style="color:var(--ok)">ตัดสต๊อกไปแล้ว</b> — แก้ไขจำนวนแล้วกดบันทึกซ้ำ ระบบจะปรับสต๊อกตามส่วนต่างให้'
            : '<b style="color:var(--warn)">ยังไม่ได้ตัดสต๊อก</b> — เมื่อกดบันทึก ระบบจะหักจำนวนออกจากสินค้าคงคลังทันที'}
        </div>
        ${blkEnd()}
        <div class="fs-bottom">
          <span class="note-left">${inDb
            ? 'เอกสารนี้บันทึกแล้ว — แก้ไขไม่ได้ ถ้าผิดให้ยกเลิกแล้วเปิดใบใหม่'
            : 'กรอกข้อมูลครบแล้วกดบันทึกได้เลย'}</span>
          <button class="btn primary" id="clSaveB"${inDb?' disabled':''}>บันทึกใบเคลม</button>
          <button class="btn" id="clPrintB">พิมพ์ใบเคลมสินค้า</button>
