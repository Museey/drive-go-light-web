const APP = { name:'DriveGoLight!', version:'6.4', site:'www.drivebizbegin.com', trialEmail:'' /* ใส่อีเมลรับคำขอรหัสทดลองใช้ เช่น 'support@drivebizbegin.com' */ };

/* =====================================================================
   ระบบทดลองใช้และลิขสิทธิ์รายปี
   ===================================================================== */
const TRIAL_DAYS   = 30;
const MAX_PRODUCTS = 3000;      /* ขีดจำกัดทะเบียนอะไหล่ */
const PRICE_YEAR = 3600;
const VAT_RATE   = 0.07;        /* ภาษีมูลค่าเพิ่ม 7% (ค่าบริการยังไม่รวม VAT) */
const PRICE_VAT  = Math.round(PRICE_YEAR*VAT_RATE*100)/100;
const KEY_SALT   = 'DGL!drivebizbegin';
const KEY_EPOCH  = '2020-01-01';
const A32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // ตัดอักขระที่สับสน 0 1 I O ออก

function enc32(n, len){ let s=''; n=Math.abs(Math.floor(n)); for(let i=0;i<len;i++){ s=A32[n%32]+s; n=Math.floor(n/32); } return s; }
function dec32(s){ let n=0; for(const c of s){ const i=A32.indexOf(c); if(i<0) return -1; n=n*32+i; } return n; }
function fnv(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
const digitsOf = v => String(v||'').replace(/\D/g,'');

/* =====================================================================
   ระบบต้นทุน FIFO — สินค้าแต่ละตัวเก็บชั้นล็อตรับเข้า p.lots = [{q,c,d}]
   เรียงเก่า→ใหม่ · ตัดขายจากล็อตเก่าสุดก่อน · p.qty = ผลรวมล็อตเสมอ
   ไฟล์ข้อมูลเก่าไม่มีล็อต ระบบสร้างล็อตตั้งต้นจากยอดคงเหลือ×ทุนเดิมให้เอง
   ===================================================================== */
function lotsOf(p){
  if(!Array.isArray(p.lots)){
    p.lots = num(p.qty) > 0 ? [{q:num(p.qty), c:num(p.cost)||0, d:p.lastMove||today()}] : [];
  }
  return p.lots;
}
function lotSync(p){ p.qty = lotsOf(p).reduce((s,l)=>s+num(l.q),0); }
function lotAdd(p, qty, cost, date){
  qty = num(qty); if(qty <= 0) return;
  lotsOf(p).push({q:qty, c:num(cost)||num(p.cost)||0, d:date||today()});
  lotSync(p);
}
/* ตัดออกแบบ FIFO — คืนต้นทุนรวมของจำนวนที่ตัด (ล็อตไม่พอใช้ทุนล่าสุดแทน) */
function lotConsume(p, qty){
  let need = num(qty), cost = 0;
  const L = lotsOf(p);
  while(need > 0 && L.length){
    const l = L[0], take = Math.min(num(l.q), need);
    cost += take * num(l.c);
    l.q = num(l.q) - take; need -= take;
    if(l.q <= 1e-9) L.shift();
  }
  if(need > 0) cost += need * (num(p.cost)||0);
  lotSync(p);
  return Math.round(cost*100)/100;
}
/* คืนของกลับหน้าแถว (ยกเลิก/แก้เอกสาร) ด้วยทุนเฉลี่ยของยอดที่คืน */
function lotReturn(p, qty, totalCost){
  qty = num(qty); if(qty <= 0) return;
  const c = num(totalCost) > 0 ? num(totalCost)/qty : (num(p.cost)||0);
  lotsOf(p).unshift({q:qty, c:c, d:today()});
  lotSync(p);
}
function lotValue(p){ return lotsOf(p).reduce((s,l)=>s+num(l.q)*num(l.c),0); }
/* ตั้งยอดคงเหลือตรง (แก้มือ/นำเข้า Excel) — ปรับส่วนต่างผ่านล็อต */
function lotSet(p, qty, cost){
  const cur = lotsOf(p).reduce((s,l)=>s+num(l.q),0), target = num(qty);
  if(target > cur) lotAdd(p, target-cur, cost!==undefined?cost:p.cost, today());
  else if(target < cur) lotConsume(p, cur-target);
  lotSync(p);
}

/* =====================================================================
   สมุดความเคลื่อนไหวสินค้า
   ---------------------------------------------------------------------
   ประวัติส่วนใหญ่ "คำนวณสด" จากเอกสาร เพราะทุกเอกสารเก็บยอดที่ลงสต๊อกจริง
   ไว้ใน stockApplied อยู่แล้ว ตัวเลขจึงไม่มีทางหลุดจากเอกสาร และของเก่า
   ที่บันทึกไว้ก่อนหน้านี้ก็มีประวัติให้ดูทันทีโดยไม่ต้องย้ายข้อมูล
   DB.moves เก็บเฉพาะรายการที่ "ไม่มีเอกสารรองรับ" — เบิก/รับด้วยมือ
   นำเข้าจากไฟล์ และการตั้งยอดคงเหลือตรง ๆ
   ===================================================================== */
const MOVE_KIND_LABEL = {manual:'บันทึกด้วยมือ', import:'นำเข้าจากไฟล์', set:'ตั้งยอดคงเหลือ',
                         count:'ปรับตามการตรวจนับ', use:'เบิกใช้ในอู่'};

function recordMove(pid, dir, qty, o){
  o = o || {};
  if(!pid || num(qty) <= 0) return;
  (DB.moves = DB.moves || []).push({
    id:uid(), pid:pid, dir:dir,              /* in = รับเข้า · out = ตัดออก */
    qty:num(qty), cost:num(o.cost),
    date:o.date || today(), at:new Date().toISOString(),
    note:o.note || '', by:userLabel(), kind:o.kind || 'manual'
  });
}

/* รวมความเคลื่อนไหวทั้งหมดของสินค้าหนึ่งตัว เรียงเก่า→ใหม่ พร้อมยอดคงเหลือสะสม */
function movesOf(p){
  const out = [], pid = p.id;
  const push = m => { if(num(m.qty) > 0) out.push(m); };
  const voidDate = d => (d.void && String(d.void.at||'').slice(0,10)) || d.date;

  /* ใบซื้อ — รับเข้า */
  (DB.purchases||[]).forEach(d=>{
    appliedStock(d, d.received).forEach(a=>{
      if(a.pid !== pid) return;
      const inCost = num(a.cost) > 0 ? num(a.cost) : num(p.cost);
      push({date:d.date, dir:'in', qty:num(a.qty), cost:inCost, approx:!(num(a.cost) > 0), doc:d.no,
            party:d.vendorName||'-', label:'รับเข้าตามใบซื้อ', voided:!!d.void});
      if(d.void) push({date:voidDate(d), dir:'out', qty:num(a.qty), cost:inCost, doc:d.no,
            party:d.vendorName||'-', label:'ตัดคืนเพราะยกเลิกใบซื้อ', reversal:true});
    });
  });

  /* ใบส่งมอบ / ใบเสร็จ — ตัดออก */
  [['ใบส่งมอบ', DB.invoices], ['ใบเสร็จ', DB.receipts]].forEach(function(pair){
    const kindName = pair[0], arr = pair[1];
    (arr||[]).forEach(d=>{
      appliedStock(d, d.deducted).forEach(a=>{
        if(a.pid !== pid) return;
        /* เอกสารรุ่นก่อนระบบ FIFO ไม่ได้เก็บต้นทุนตอนตัด ใช้ต้นทุนปัจจุบันโดยประมาณแทน */
        const known = num(a.cogs) > 0 && num(a.qty) > 0;
        const unit = known ? num(a.cogs)/num(a.qty) : num(p.cost);
        push({date:d.date, dir:'out', qty:num(a.qty), cost:unit, approx:!known, doc:d.no,
              party:d.name||'-', label:'ตัดออกตาม'+kindName, voided:!!d.void});
        if(d.void) push({date:voidDate(d), dir:'in', qty:num(a.qty), cost:unit, approx:!known, doc:d.no,
              party:d.name||'-', label:'คืนเข้าเพราะยกเลิก'+kindName, reversal:true});
      });
    });
  });

  /* ใบเคลม — ตัดออก (ใบเคลมไม่มี stockApplied จึงอ่านจากรายการในใบ) */
  (DB.claims||[]).forEach(c=>{
    if(!c.deducted) return;
    (c.items||[]).forEach(it=>{
      if(it.pid !== pid) return;
      const q = num(it.qty), kn = num(it.cogs) > 0 && q > 0;
      push({date:c.date, dir:'out', qty:q, cost: kn ? num(it.cogs)/q : (num(it.cost)||num(p.cost)),
            approx:!kn, doc:c.no, party:c.name || c.byWhom || '-',
            label: claimSideOf(c)==='vendor' ? 'ส่งคืนผู้ขายตามใบเคลม' : 'ตัดออกตามใบเคลมลูกค้า'});
    });
  });

  /* รายการที่ไม่มีเอกสารรองรับ */
  (DB.moves||[]).forEach(m=>{
    if(m.pid !== pid) return;
    push({date:m.date, dir:m.dir, qty:num(m.qty), cost:num(m.cost), doc:'—',
          party:m.by||'-', label:MOVE_KIND_LABEL[m.kind]||'บันทึกด้วยมือ',
          note:m.note, at:m.at, manual:true});
  });

  out.sort((a,b)=> a.date === b.date
    ? String(a.at||'').localeCompare(String(b.at||''))
    : String(a.date).localeCompare(String(b.date)));

  /* ยอดที่มีอยู่ก่อนเอกสารใบแรก (ตั้งต้นตอนลงทะเบียน/นำเข้า) — ใส่ไว้บรรทัดแรก
     เพื่อให้ยอดคงเหลือสะสมของตารางไปจบตรงกับยอดจริงในทะเบียนเสมอ */
  const net = out.reduce((sum,m)=> sum + (m.dir==='in' ? m.qty : -m.qty), 0);
  const open = Math.round((num(p.qty) - net)*1000)/1000;
  if(Math.abs(open) > 0.0005){
    out.unshift({date: out.length ? out[0].date : (p.lastMove||today()),
      dir: open>0?'in':'out', qty:Math.abs(open), cost:num(p.cost), doc:'—', party:'-',
      label:'ยอดตั้งต้น — มีอยู่ก่อนที่ระบบจะเริ่มบันทึกเอกสาร', opening:true});
  }

  let bal = 0;
  out.forEach(m=>{ bal += (m.dir==='in' ? m.qty : -m.qty); m.balance = Math.round(bal*1000)/1000; });
  return out;
}

function makeKey(taxId, expIso){
  const p1 = enc32(daysBetween(KEY_EPOCH, expIso), 3);
  const p2 = enc32(fnv(digitsOf(taxId) + p1 + KEY_SALT), 5);
  const raw = p1 + p2;
  return 'DGL-' + raw.slice(0,4) + '-' + raw.slice(4,8);
}
function checkKey(key, taxId){
  let raw = String(key||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(raw.startsWith('DGL')) raw = raw.slice(3);
  if(raw.length !== 8) return null;
  const p1 = raw.slice(0,3), p2 = raw.slice(3,8);
  const d = dec32(p1); if(d < 0) return null;
  if(enc32(fnv(digitsOf(taxId) + p1 + KEY_SALT), 5) !== p2) return null;
  return addDays(KEY_EPOCH, d);
}

function licInit(){
  DB.lic = DB.lic || {};
  if(!DB.lic.installedAt) DB.lic.installedAt = today();
  if(!('key' in DB.lic)) DB.lic.key = '';
  if(!('expires' in DB.lic)) DB.lic.expires = '';
}
function licStatus(){
  const L = DB.lic || {};
  if(L.expires){
    const left = daysBetween(today(), L.expires);
    return left >= 0 ? {mode:'active', left, until:L.expires} : {mode:'expired', left:0, until:L.expires, wasLicensed:true};
  }
  const until = addDays(L.installedAt || today(), TRIAL_DAYS);
  const left = daysBetween(today(), until);
  return left >= 0 ? {mode:'trial', left, until} : {mode:'expired', left:0, until};
}
/* ปิดเฉพาะการบันทึกรายการใหม่ — การดู การพิมพ์เอกสารเดิม และการสำรองข้อมูล ยังทำได้เสมอ */

/* บันทึกข้อมูล 3 ชั้น — ที่เก็บของระบบ / ที่เก็บของเบราว์เซอร์ / หน่วยความจำชั่วคราว */
const mem = {};
let STORAGE_MODE = 'memory';
function detectStorage(){
  try{ localStorage.setItem('__dgl__','1'); localStorage.removeItem('__dgl__'); return 'browser'; }catch(e){}
  try{ if(window.storage && typeof window.storage.set === 'function') return 'host'; }catch(e){}
  return 'memory';
}
const store = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r && r.value) return JSON.parse(r.value); }catch(e){}
    try{ const v = localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
    return (k in mem) ? mem[k] : null;
  },
  async set(k,v){
    mem[k]=v;
    const str = JSON.stringify(v);
    let saved = false, why = '';
    try{ await window.storage.set(k, str); saved = true; }catch(e){ why = e.message || String(e); }
    try{ localStorage.setItem(k, str); saved = true; }
    catch(e){ why = /quota|exceeded/i.test(e.name+e.message) ? 'พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม' : (e.message || String(e)); }
    /* เก็บไว้ในหน่วยความจำได้เสมอ แต่ถ้าเขียนลงที่เก็บถาวรไม่สำเร็จ
       ข้อมูลจะหายเมื่อปิดหน้าต่าง — ต้องบอกผู้ใช้ทันที ไม่ปล่อยเงียบ */
    if(!saved) storeFailed(why);
    else storeOK();
    return saved;
  }
};

/* ---------- แจ้งเตือนเมื่อบันทึกข้อมูลไม่สำเร็จ ----------
   ตอนนี้ใช้กับที่เก็บของเบราว์เซอร์ เมื่อย้ายขึ้นคลาวด์ให้เรียกฟังก์ชันเดียวกันนี้
   ตอนเชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ผู้ใช้จะได้รู้ทันทีว่างานที่ทำยังไม่ถูกบันทึก */
let STORE_FAILED = false;
function storeFailed(why){
  STORE_FAILED = true;
  const el = document.getElementById('saveerr'); if(!el) return;
  document.getElementById('saveerrMsg').textContent =
    (why ? why + ' — ' : '') + 'ข้อมูลที่เพิ่งทำจะหายเมื่อปิดหน้าต่าง กรุณาสำรองข้อมูลเป็นไฟล์ทันทีที่เมนูตั้งค่าร้าน';
  el.classList.add('on');
}
function storeOK(){
  if(!STORE_FAILED) return;
  STORE_FAILED = false;
  const el = document.getElementById('saveerr'); if(el) el.classList.remove('on');
}

async function migratePicsToLibrary(){
  let moved = 0;
  for(const p of DB.products){
    const arr = picsOf(p);
    if(!arr.length) continue;
    if(String(arr[0]).startsWith('data:')){
      const id = 'p:' + uid();
      await PICDB.set(id, arr[0]);          /* เก็บรูปแรก — สินค้าละ 1 รูป */
      p.pics = [id]; moved++;
    } else if(arr.length > MAX_PICS){
      arr.slice(MAX_PICS).forEach(x=>PICDB.del(x));
      p.pics = arr.slice(0, MAX_PICS);
    }
  }
  if(moved){ await saveDB(); }
  return moved;
}

async function loadDB(){
  await loadPrefs();
  /* รูปแบบใหม่ — แยกคลังละคีย์ */
  const meta = await store.get(META_KEY);
  let d = null;
  if(meta && typeof meta === 'object'){
    d = Object.assign({}, meta);
    for(const c of DB_COLS){
      const arr = await store.get(COL_KEY(c));
      if(Array.isArray(arr)) d[c] = arr;
    }
  } else {
    /* รูปแบบเดิม — ข้อมูลก้อนเดียว อ่านแล้วย้ายไปรูปแบบใหม่ให้ */
    d = await store.get('garage_db');
    /* จบ loadDB จะบันทึกกลับเป็นรูปแบบใหม่ให้อัตโนมัติ */
  }
  if(d && d.products){ DB = Object.assign(DB, d); }
  /* ย้ายการตั้งค่าหน้าจอที่เคยปนอยู่ในข้อมูลธุรกิจออกมา */
  if(DB.ui && Array.isArray(DB.ui.stockHide) && !PREFS.stockHide.length){
    PREFS.stockHide = DB.ui.stockHide.slice(); savePrefs();
  }
  delete DB.ui;
  if(!DB.shop) DB.shop = Object.assign({}, DEFAULT_SHOP);
  if(!DB.customers) DB.customers = [];

  /* ชุดข้อมูลทดสอบรุ่นใหม่ — สร้างทับให้อัตโนมัติหนึ่งครั้ง
     เว้นแต่ผู้ใช้เคยกดเริ่มบันทึกข้อมูลจริงไว้แล้ว
     ข้อมูลก่อนทับถูกสำรองไว้ กู้คืนได้ที่เมนูตั้งค่าร้าน */
  if(!DB.demoDismissed && DB.demoVersion !== DEMO_VERSION){
    if(d && (DB.products.length || DB.customers.length || DB.quotes.length ||
             DB.receipts.length || DB.purchases.length)){
      try{ localStorage.setItem(BACKUP_KEY, JSON.stringify({savedAt:today(), db:d})); }catch(e){}
      DB.demoReplaced = true;
    }
    seedDemo();
  }
  licInit();
  if(!DB.users) DB.users = [];
  DB.users.forEach(migrateUserPerms);
  if(!DB.categories || !DB.categories.length) DB.categories = seedCategories();
  DB.products.forEach(p=>{ if(p.cat === undefined) p.cat = ''; });
  /* ย้ายทะเบียนผู้ขายเดิมเข้าทะเบียนผู้ติดต่อชุดเดียวกัน */
  DB.customers.forEach(c=>{ if(!c.kind) c.kind = 'customer'; });
  if(Array.isArray(DB.vendors) && DB.vendors.length){
    DB.vendors.forEach(v=>{
      if(DB.customers.some(c=>c.id===v.id)) return;
      DB.customers.push({id:v.id, code:v.code || nextCustCode('vendor'), kind:'vendor', type:'company',
        prefix:'', firstName:'', lastName:'', orgName:v.name||'', taxId:v.taxId||'',
        addr:{no:'',village:'',moo:'',soi:'',road:'',subdistrict:'',district:'',province:'',zip:''},
        addrText:v.addr||'', tel:v.tel||'', tel2:'', email:'', note:'',
        creditDays:num(v.creditDays), created:v.created||today(), vehicles:[]});
    });
  }
  DB.vendors = [];
  if(!DB.purchases) DB.purchases = [];
  if(!DB.expenses) DB.expenses = [];
  if(!DB.invoices) DB.invoices = [];
  if(!DB.claims) DB.claims = [];
  if(!DB.billnotes) DB.billnotes = [];
  if(!DB.ignoredItems) DB.ignoredItems = [];
  DB.customers.forEach(c=>(c.vehicles||[]).forEach(v=>{
    if(v.engineNo === undefined) v.engineNo = '';
    if(v.chassisNo === undefined) v.chassisNo = '';
  }));
  DB.receipts.forEach(r=>{ if(!r.kind) r.kind = 'RC'; });
  DB.invoices.forEach(r=>{ if(!r.kind) r.kind = 'IVT'; });
  /* เอกสารรุ่นก่อนใช้เงื่อนไข cash/credit — แปลงเป็นสถานะชำระเงินแล้ว */
  DB.purchases.concat(DB.expenses).forEach(x=>{
    if(x.paidNow === undefined) x.paidNow = (x.terms === 'cash');
    if(!x.payMethod) x.payMethod = 'เงินสด';
    if(x.payRef === undefined) x.payRef = '';
    if(x.payDate === undefined) x.payDate = '';
  });
  DB.seq = Object.assign({q:0,r:0,c:0,p:0,v:0,e:0,iv:0,ivt:0,cl:0,bn:0}, DB.seq);
  await saveDB();
  await migratePicsToLibrary();
}
/* =====================================================================
   ชั้นเก็บข้อมูล — แยกเป็นคลังละคีย์ เพื่อให้บันทึกเฉพาะส่วนที่เปลี่ยน
   บันทึกใบเสร็จหนึ่งใบจะเขียนเฉพาะคลังใบเสร็จ ไม่ใช่ข้อมูลทั้งก้อน
   โครงนี้ตรงกับการเรียก API รายตารางตอนย้ายขึ้นคลาวด์
   ===================================================================== */
const DB_COLS = ['products','customers','quotes','invoices','receipts',
                 'purchases','expenses','billnotes','claims','moves','counts'];
/* ทุกอย่างที่ไม่ใช่คลังใหญ่ เก็บรวมไว้ก้อนเดียว เพราะเล็กและเปลี่ยนไม่บ่อย */
function metaOf(){
  const m = {};
  Object.keys(DB).forEach(k=>{ if(DB_COLS.indexOf(k) < 0) m[k] = DB[k]; });
  return m;
}
const COL_KEY  = c => 'dgl_col_' + c;
const META_KEY = 'dgl_meta';

async function saveCol(){
  const names = [].slice.call(arguments);
  for(const c of names){
    if(DB_COLS.indexOf(c) < 0) continue;
    await store.set(COL_KEY(c), DB[c] || []);
  }
}
async function saveMeta(){ await store.set(META_KEY, metaOf()); }
/* บันทึกคลังที่ระบุพร้อมข้อมูลส่วนกลาง — ใช้ตอนบันทึกเอกสารที่แตะเลขที่รันหรือสถานะอื่น */
async function saveSome(){
  await saveCol.apply(null, [].slice.call(arguments));
  await saveMeta();
}
/* บันทึกทั้งหมด — ใช้เฉพาะตอนนำเข้า กู้คืน สร้างข้อมูลทดสอบ หรือล้างข้อมูล */
async function saveDB(){
  await saveMeta();
  await saveCol.apply(null, DB_COLS);
}

/* ---------- การตั้งค่าหน้าจอ — เก็บแยกในเครื่อง ไม่ปนกับข้อมูลธุรกิจ ---------- */
const PREFS_KEY = 'dgl_prefs';
let PREFS = {stockHide:[]};
async function loadPrefs(){
  const p = await store.get(PREFS_KEY);
  if(p && typeof p === 'object') PREFS = Object.assign(PREFS, p);

/* =====================================================================
   นำเข้า / ส่งออกรายการสินค้าด้วยไฟล์ CSV (เปิดใน Excel ได้)
   ===================================================================== */
const PRODUCT_CSV_FIELDS = [
  {field:'code',     aliases:['รหัสสินค้า','code']},
  {field:'oem',      aliases:['รหัสอ้างอิง','oem']},
  {field:'name',     aliases:['ชื่อสินค้า','name']},
  {field:'cat',      aliases:['หมวดหมู่','หมวด','category','cat']},
  {field:'unit',     aliases:['หน่วยนับ','หน่วย','unit']},
  {field:'cost',     aliases:['ต้นทุน','cost']},
  {field:'pA',       aliases:['ราคาขายa','ราคาa','pa']},
  {field:'pB',       aliases:['ราคาขายb','ราคาb','pb']},
  {field:'pC',       aliases:['ราคาขายc','ราคาc','pc']},
  {field:'qty',      aliases:['คงเหลือ','qty']},
  {field:'min',      aliases:['min']},
  {field:'max',      aliases:['max']},
  {field:'lastMove', aliases:['วันที่เคลื่อนไหวล่าสุด','lastmove']}
];
function normHeader(h){ return String(h||'').replace(/\(.*?\)/g,'').trim().toLowerCase(); }
function mapCSVHeaders(headerRow){
  return headerRow.map(h=>{
    const n = normHeader(h);
    const hit = PRODUCT_CSV_FIELDS.find(f=>f.aliases.some(a=>normHeader(a)===n));
    return hit ? hit.field : null;
  });
}
function csvField(v){
  v = String(v??'');
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCSV(rows){ return rows.map(r=>r.map(csvField).join(',')).join('\r\n'); }
function parseCSV(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    }
    else if(c==='"') inQuotes=true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c==='\r'){ /* ข้ามไป จัดการที่ \n */ }
    else field+=c;
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
const CSV_HEADERS = ['รหัสสินค้า(อู่)','รหัสอ้างอิง(OEM)','ชื่อสินค้า','หมวดหมู่','หน่วยนับ','ต้นทุน',
  'ราคาขายA','ราคาขายB','ราคาขายC','คงเหลือ','Min','Max','วันที่เคลื่อนไหวล่าสุด(YYYY-MM-DD)'];

function downloadProductTemplate(){

function exportProductsCsv(){
  if(blockExportTab('stock','list')) return;
  const rows = [CSV_HEADERS].concat(DB.products.map(p=>
    [p.code, p.oem||'', p.name, p.cat||'', p.unit||'', p.cost, p.pA, p.pB, p.pC, p.qty, p.min, p.max, p.lastMove||'']));

function handleProductCSVImport(e){
  const file = e.target.files[0]; if(!file) return;
  if(!requireLicense()){ e.target.value=''; return; }
  if(blockEdit('stock','list','ทะเบียนสินค้า')){ e.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      let text = String(rd.result);
      if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
      const rows = parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));
      if(rows.length<2) throw new Error('ไม่พบข้อมูลในไฟล์');
      const fields = mapCSVHeaders(rows[0]);
      if(!fields.includes('code') || !fields.includes('name'))
        throw new Error('ไม่พบคอลัมน์ รหัสสินค้า หรือ ชื่อสินค้า — ใช้ฟอร์มที่ดาวน์โหลดจากปุ่ม ฟอร์ม Excel');
      let added=0, updated=0, skipped=0, full=false;
      const newCats=[];
      for(let i=1;i<rows.length;i++){
        const r = rows[i], rec = {};
        fields.forEach((f,idx)=>{ if(f) rec[f] = r[idx]!==undefined ? String(r[idx]).trim() : ''; });
        if(!rec.code || !rec.name){ skipped++; continue; }
        const prod = {
          code:rec.code, oem:rec.oem||'', name:rec.name, cat:rec.cat||'', unit:rec.unit||'ชิ้น',
          cost:num(rec.cost), pA:num(rec.pA), pB:num(rec.pB), pC:num(rec.pC),
          qty:num(rec.qty), min:num(rec.min), max:num(rec.max),
          lastMove: /^\d{4}-\d{2}-\d{2}$/.test(rec.lastMove) ? rec.lastMove : today()
        };
        if(prod.cat && !DB.categories.includes(prod.cat) && !newCats.includes(prod.cat)) newCats.push(prod.cat);
        const existing = DB.products.find(x=>x.code===prod.code);
        if(existing){ Object.assign(existing, prod, {id:existing.id});
          existing.lots = num(prod.qty)>0 ? [{q:num(prod.qty), c:num(prod.cost)||0, d:prod.lastMove}] : []; updated++; }
        else {
          if(DB.products.length >= MAX_PRODUCTS){ skipped++; full=true; continue; }
          DB.products.push(Object.assign({id:uid()}, prod)); added++;
        }
      }
      if(newCats.length) DB.categories.push(...newCats);
      saveSome('products'); renderStock();
      toast(`นำเข้าเสร็จ — เพิ่มใหม่ ${added} · ปรับปรุง ${updated}`
        + (skipped? ` · ข้าม ${skipped} แถว` : '')
        + (full? ` (ทะเบียนเต็ม ${MAX_PRODUCTS.toLocaleString()} รายการ)` : '')
        + (newCats.length? ` · เพิ่มหมวดใหม่ ${newCats.length}` : ''));
    }catch(err){ toast('นำเข้าไม่สำเร็จ: '+err.message); }
    e.target.value='';
  };
  rd.readAsText(file, 'UTF-8');
}

/* =====================================================================
   ตัวกรองและแบ่งหน้าของรายการเอกสาร (ใช้ร่วมกันทุกเมนู)
   ===================================================================== */
const docFilters = {};
function docFilter(key){
  if(!docFilters[key]) docFilters[key] =
    {page:1, pageSize:5, mode:'all', q:'', date:'', from:'', to:'', months:[], year:+today().slice(0,4)};
  return docFilters[key];
}
/* กุญแจเรียงลำดับ — เอกสารที่บันทึกผ่านระบบมีเวลาจริง จึงมาก่อนเอกสารที่มีแต่วันที่ */
function docTouchKey(d){
  const ed = d.edits && d.edits.length ? d.edits[d.edits.length-1].at : '';
  return ed ? '2:'+ed : '1:'+(d.date || d.created || '');
}
/* เลขหน้าที่จะแสดง — อยู่ต้น ๆ โชว์ 1-5 แล้ว … หน้าสุดท้าย
   อยู่กลางโชว์หน้ารอบ ๆ ตัวเอง · อยู่ท้าย ๆ โชว์ห้าหน้าสุดท้าย */
function pageNumbers(cur, total){
  const out = []; const range = (a,b)=>{ for(let i=a;i<=b;i++) out.push(i); };
  if(total <= 8){ range(1, total); return out; }
  if(cur <= 4){ range(1, 5); out.push('…'); out.push(total); return out; }
  if(cur >= total - 3){ out.push(1); out.push('…'); range(total-4, total); return out; }
  out.push(1); out.push('…');
  range(cur-1, cur+1);
  out.push('…'); out.push(total);
  return out;
}
function applyDocFilter(key, arr, keepOrder){
  const f = docFilter(key);
  let list = arr.slice();
  if(f.mode==='today')      list = list.filter(x=>x.date===today());
  else if(f.mode==='date')  { if(f.date) list = list.filter(x=>x.date===f.date); }
  else if(f.mode==='range') {
    if(f.from) list = list.filter(x=>x.date>=f.from);
    if(f.to)   list = list.filter(x=>x.date<=f.to);
  }
  else if(f.mode==='month') {
    if(f.months.length) list = list.filter(x=>
      +x.date.slice(0,4)===f.year && f.months.includes(+x.date.slice(5,7)));
  }
  if(f.q && f.q.trim()){
    const k = f.q.trim().toLowerCase();
    list = list.filter(x=>[x.no, x.name, x.vendorName, x.payeeName, x.invNo, x.quoteNo,
        x.veh && x.veh.plateA, x.veh && x.veh.plateB]
      .some(v=>String(v||'').toLowerCase().includes(k)));
  }
  if(!keepOrder){
    /* เรียงตามเวลาที่ทำงานกับเอกสารล่าสุด — ใบที่เพิ่งบันทึก/แก้ไขจะอยู่บนสุดเสมอ
       ใบที่ยังไม่มีประวัติการบันทึก (ข้อมูลเดิม/นำเข้า) เรียงตามวันที่เอกสารไว้ด้านล่าง */
    const order = new Map(list.map((d,i)=>[d,i]));
    list = list.slice().sort((a,b)=>{
      const ka = docTouchKey(a), kb = docTouchKey(b);
      if(ka !== kb) return kb.localeCompare(ka);
      return order.get(b) - order.get(a);
    });
  }
  const totalPages = Math.max(1, Math.ceil(list.length/f.pageSize));
  if(f.page>totalPages) f.page = totalPages;
  if(f.page<1) f.page = 1;
  const start = (f.page-1)*f.pageSize;
  return {list, pageList:list.slice(start, start+f.pageSize), totalPages};
}

/* ---------- ช่องค้นหาในทะเบียน — หน่วงไว้ให้พิมพ์จบก่อนค่อยกรอง ----------
   ลดภาระการกรองจากทุกตัวอักษรเหลือครั้งเดียวต่อคำ และเมื่อย้ายขึ้นคลาวด์
   จะลดจำนวนคำสั่งที่วิ่งไปฐานข้อมูลลงตามกัน · กด Enter เพื่อค้นทันที */
const SEARCH_DELAY = 450;
function bindSearchInput(el, apply){
  if(!el) return;
  let timer = null;
  const fire = ()=>{ clearTimeout(timer); apply(el.value, el.selectionStart); };
  el.oninput = ()=>{ clearTimeout(timer); timer = setTimeout(fire, SEARCH_DELAY); };
  el.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); fire(); }
                      else if(e.key === 'Escape'){ clearTimeout(timer); el.value=''; fire(); } };
  el.onblur = ()=>{ if(timer){ fire(); } };
}

   pos = 'top' สำหรับแถวบน (อยู่ใต้ช่องแสดงต่อหน้า) · เว้นว่างสำหรับแถวล่าง */
function pageBoxes(cur, totalPages, mkAttr){
  return `<button class="pg" ${mkAttr('prev')}${cur<=1?' disabled':''} title="หน้าก่อนหน้า">‹</button>` +
    pageNumbers(cur, totalPages).map(p=>p==='…'
      ? `<span class="pg dots">…</span>`
      : `<button class="pg" ${mkAttr(p)} aria-current="${p===cur}">${p}</button>`).join('') +
    `<button class="pg" ${mkAttr('next')}${cur>=totalPages?' disabled':''} title="หน้าถัดไป">›</button>`;
}
function pagerBar(key, totalPages, pos){
  const f = docFilter(key);
  if(totalPages<=1) return '';
  return `<div class="pager${pos==='top'?' top':''}">
    ${pos==='top' ? '' : `<span class="pgnote">หน้า ${f.page} จาก ${totalPages}</span>`}
    ${pageBoxes(f.page, totalPages, v=>`data-fpage="${key}:${v}"`)}
  </div>`;
}
function bindDocFilter(key, rerender){
  const f = docFilter(key);
  const go = ()=>{ rerender(); };
  const bar = $(`[data-fmode="${key}"]`);
  if(bar) $$('button', bar).forEach(b=>b.onclick=()=>{ f.mode=b.dataset.m; f.page=1; go(); });
  const sz = $(`[data-fsize="${key}"]`);
  if(sz) $$('button', sz).forEach(b=>b.onclick=()=>{ f.pageSize=num(b.dataset.n); f.page=1; go(); });
  const d=$(`[data-fdate="${key}"]`);  if(d) d.onchange = e=>{ f.date=e.target.value; f.page=1; go(); };
  const fr=$(`[data-ffrom="${key}"]`); if(fr) fr.onchange = e=>{ f.from=e.target.value; f.page=1; go(); };
  const to=$(`[data-fto="${key}"]`);   if(to) to.onchange = e=>{ f.to=e.target.value; f.page=1; go(); };
  const yr=$(`[data-fyear="${key}"]`); if(yr) yr.onchange = e=>{ f.year=num(e.target.value); f.page=1; go(); };
  const mo=$(`[data-fmonths="${key}"]`);
  if(mo) $$('input[data-mn]', mo).forEach(cb=>cb.onchange=()=>{
    const mn = num(cb.dataset.mn);
    if(cb.checked){ if(!f.months.includes(mn)) f.months.push(mn); }
    else f.months = f.months.filter(x=>x!==mn);
    f.page=1;
    const open = mo.open; go();
    const again = $(`[data-fmonths="${key}"]`); if(again) again.open = open;
  });
  bindSearchInput($(`[data-fq="${key}"]`), (v, pos)=>{
    if(f.q === v) return;
    f.q = v; f.page = 1; go();
    const el = $(`[data-fq="${key}"]`);
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
  });
  const cl=$(`[data-fclear="${key}"]`);
  if(cl) cl.onclick = ()=>{ Object.assign(f, {mode:'all', date:'', from:'', to:'', months:[], page:1}); go(); };
  $$(`[data-fpage^="${key}:"]`).forEach(b=>b.onclick=()=>{
    const v = b.dataset.fpage.split(':')[1];
    f.page = v==='prev' ? Math.max(1, f.page-1) : v==='next' ? f.page+1 : num(v);
    go();
  });
}

    used.add(name);

    const cost = Math.round((num(cmin) + rand()*(num(cmax)-num(cmin))) / 5) * 5;
    const mA = 1.62 + rand()*0.5;                       /* อัตรากำไรระดับ A */
    const pA = Math.round(cost*mA/10)*10;
    const out_ = {
      id: uid(),
      code: `${prefix}-${String(101 + out.length).padStart(3,'0')}`,
      oem: `${String(10000 + Math.floor(rand()*89999))}-${String(Math.floor(rand()*9000)+1000)}`,
      name, cat, unit, cost,
      pA, pB: Math.round(pA*0.92/10)*10, pC: Math.round(pA*0.85/10)*10,
      qty:0, min:0, max:0, lastMove: today()
    };
    out.push(out_);
    n++;
  }

  /* กำหนดปริมาณและจุดเตือน ให้ครบทุกสถานะสีที่ระบบรองรับ
     ~14% ถึงจุดสั่งซื้อ · ~8% เกินระดับสูงสุด · ~10% ไม่เคลื่อนไหวเกิน 6 เดือน */
  out.forEach((p, i)=>{
    const mn = 2 + Math.floor(rand()*8);
    const mx = mn * (3 + Math.floor(rand()*4));
    p.min = mn; p.max = mx;
    const r = i % 25;
    if(r < 3)       p.qty = Math.max(0, mn - Math.floor(rand()*3));      /* ถึง Min */
    else if(r < 5)  p.qty = mx + 1 + Math.floor(rand()*8);               /* เกิน Max */
    else            p.qty = mn + 1 + Math.floor(rand()*(mx-mn));         /* ปกติ */

    const d = new Date();
    if(i % 10 === 7) d.setMonth(d.getMonth() - (6 + Math.floor(rand()*10)));   /* ค้างสต๊อก */
    else             d.setDate(d.getDate() - Math.floor(rand()*150));
    p.lastMove = iso(d);
  });
  return out;
}

  DB.invoices = []; DB.seq.iv = 0; DB.seq.ivt = 0;
  for(let i=0;i<DEMO_SIZE.sales;i++) makeSale(i);

    const c = pick(custs, i);
    const veh = (c.vehicles||[])[i % Math.max(1,(c.vehicles||[]).length)] || {};
    const date = addDays(today(), -(360 - Math.floor(i*1.5)));

    const tier = pick(['A','B','C'], i);
    const tierKey = {A:'pA',B:'pB',C:'pC'}[tier];
    const items = [];
    const nPart = 1 + Math.floor(rand()*4);
    for(let k=0;k<nPart;k++){
      const pr = DB.products[Math.floor(rand()*DB.products.length)];
      if(items.some(x=>x.pid===pr.id)) continue;

    /* บางใบพิมพ์ชื่อของเองโดยไม่ได้ดึงจากทะเบียน — จะไปขึ้นในรายการค้างทำ */
    if(i % 9 === 4){
      const free = pick(FREE_ITEMS, i);
      items.push({pid:null, code:'-', oem:'', name:free[0], unit:free[1], qty:1+Math.floor(rand()*2), price:free[2]});

    const q = {id:uid(), no:`QT-${ym}-${String(i+1).padStart(3,'0')}`, date, tier, status:'billed',

      veh:{brand:veh.brand||'', model:veh.model||'', year:veh.year||'', color:veh.color||'',
           plateA:veh.plateA||'', plateB:veh.plateB||'', plateProv:veh.plateProv||'',
        engineNo:veh.engineNo||'', chassisNo:veh.chassisNo||'', mileage:veh.mileage||''},
      complaints:[pick(DEMO_SYMPTOM, i), i%2? pick(DEMO_SYMPTOM, i+5) : '', i%3===0? pick(DEMO_SYMPTOM, i+9) : ''],
      findings:[pick(DEMO_FINDING, i), i%2? pick(DEMO_FINDING, i+4) : '', i%3===0? pick(DEMO_FINDING, i+8) : ''],
      items:JSON.parse(JSON.stringify(items)), discount: i%5===0 ? 150 : 0, vatMode:'ex',
      approver:custName(c), proposer: DB.shop.proposerName || 'ช่างใหญ่'};
    DB.seq.q = i+1;
    DB.quotes.push(q);

    const credit = i % 3 === 0;
    const split  = i % 7 === 3;          /* ลูกค้าจ่ายบางส่วนหน้าร้าน ที่เหลือเป็นเครดิต */
    const r = {id:uid(), no:`RC-${ym}-${String(i+1).padStart(3,'0')}`, date:addDays(date, 2),

      veh:JSON.parse(JSON.stringify(q.veh)), items:JSON.parse(JSON.stringify(items)),
      discount:q.discount, vatMode:'ex',
      whtRate: c.type==='company' ? 3 : 0,
      pay:{cash:false, cashAmt:0, transfer:false, transferAmt:0, credit:false, days:30, due:'', ref:''},
      receivedBy:'ฝ่ายการเงิน', deducted:true, payments:[]};
    const t = recTotals(r);
    if(split){                                   /* จ่ายเงินสดบางส่วน ที่เหลือเป็นเครดิต */
      r.pay.cashAmt = Math.round(t.payable*(0.3+rand()*0.3)/10)*10;
    } else if(!credit){                          /* รับครบหน้าร้าน */
      r.pay.cashAmt = t.payable;
    }                                            /* credit ล้วน = ไม่รับเงินวันนี้ */
    syncIssuePayments(r);
    if(credit && !split && i % 6 === 0){         /* เครดิตที่ตามเก็บได้บางส่วนภายหลัง */
      r.payments.push({id:uid(), date:addDays(r.date, 12), amount:Math.round(t.payable*0.5*100)/100,
        method:'เงินโอน', ref:'รับชำระบางส่วน'});
    }
    /* เส้นทางเอกสาร — ลูกค้านิติบุคคลบางส่วนออกใบส่งมอบ/ใบแจ้งหนี้ก่อน
       flow A ออกใบเสร็จตรง · flow B ผ่านใบส่งมอบแล้วเก็บเงินแล้ว · flow C ใบส่งมอบที่ยังไม่เก็บเงิน */
    const viaInv = c.type === 'company' && i % 3 !== 2;
    const unpaidInv = viaInv && i % 9 === 4;

/* วันที่แบบ YYYY-MM-DD ตามเวลาท้องถิ่นของเครื่อง
   ห้ามใช้ toISOString() เพราะมันแปลงเป็นเวลามาตรฐานสากลก่อนเสมอ
   เครื่องที่อยู่โซนไทย (+7) จะได้วันที่ถอยไปหนึ่งวันในช่วงเที่ยงคืนถึงเกือบเจ็ดโมงเช้า
   ซึ่งทำให้เอกสารลงวันที่ผิด ช่วงเดือนเลื่อน และวันครบกำหนดชำระเร็วไปหนึ่งวัน */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = ()=> iso(new Date());
const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                   "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_MON_ABBR = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function thDate(s){
  if(!s) return '-';
  const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return `${d.getDate()} ${TH_MON_ABBR[d.getMonth()]} ${d.getFullYear()+543}`;
}
/* วันที่แบบเต็ม — วัน เดือน ปี พ.ศ. ใช้บนเอกสาร */
function thDateLong(s){
  if(!s) return '-';
  const d = new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return `${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}

/* วันที่แบบย่อ วว/ดด/ปป สำหรับตารางที่มีคอลัมน์แคบ */
function numDate(s){
  if(!s) return '-';
  const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()+543).slice(-2)}`;
}
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+num(n)); return iso(d); }
function monthsSince(s){
  if(!s) return 999;
  const d=new Date(s+'T00:00:00'), n=new Date();
  return (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth()) - (n.getDate()<d.getDate()?1:0);
}
function toast(msg){

/* ช่องกรอกที่พิมพ์เองได้ พร้อมรายการแนะนำสูงสุด 8 รายการ
   ใช้กับยี่ห้อรถและจังหวัด ซึ่งมีรายการมาตรฐานแต่ต้องเผื่อค่าที่ไม่มีในรายการ */
const COMBO_MAX = 8;
function comboSuggest(src, kw){
  const q = String(kw||'').trim().toLowerCase();
  if(!q) return src.slice(0, COMBO_MAX);
  const starts = src.filter(v=>String(v).toLowerCase().startsWith(q));
  const has    = src.filter(v=>!starts.includes(v) && String(v).toLowerCase().includes(q));
  return starts.concat(has).slice(0, COMBO_MAX);
}

    <datalist id="${list}">${comboSuggest(window[srcName]||[], value).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;

function bahttext(n){
  n = Math.round(num(n)*100)/100;
  if(n===0) return "ศูนย์บาทถ้วน";
  const T=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], P=["","สิบ","ร้อย","พัน","หมื่น","แสน","ล้าน"];
  function chunk(s){
    let out=""; const L=s.length;
    for(let i=0;i<L;i++){
      const d=+s[i], pos=L-i-1;
      if(d===0) continue;
      if(pos===0 && d===1 && L>1) out+="เอ็ด";
      else if(pos===1 && d===1) out+="สิบ";
      else if(pos===1 && d===2) out+="ยี่สิบ";
      else out+=T[d]+P[pos];
    }
    return out;
  }
  function whole(s){
    s=String(s);
    if(s.length>6){ return whole(s.slice(0,s.length-6))+"ล้าน"+(+s.slice(-6)? chunk(s.slice(-6)) : ""); }
    return chunk(s);
  }
  const b=Math.floor(n), st=Math.round((n-b)*100);
  return (b?whole(b):"ศูนย์")+"บาท"+(st? chunk(String(st))+"สตางค์" : "ถ้วน");
}

function flagsOf(p){

  if(num(p.qty) >  num(p.max)) f.push('max');
  if(monthsSince(p.lastMove) >= 6) f.push('dead');
  return f;
}

function tagHTML(p){
  const f = flagsOf(p);
  const cls = f.includes('min')?'min': f.includes('max')?'max': f.includes('dead')?'dead':'';
  const dots = f.length>1 ? `<span class="dots">${f.map(x=>`<span class="dot ${x}" title="${FLAG_LABEL[x]}"></span>`).join('')}</span>` : '';
  const title = f.length? f.map(x=>FLAG_LABEL[x]).join(' · ') : 'ปกติ';
  return `<span class="tag ${cls}" title="${title}">${esc(p.code)}</span>${dots}`;
}

const CUSTOMER_TABS = [

/* หน้าจอเริ่มต้นของผู้ใช้ที่ถูกจำกัดไว้ที่เมนูย่อยเดียว */
function firstAllowedSub(menuKey){
  if(!CURRENT_USER) return null;
  const L = permTabsOf(menuKey);
  if(!L) return null;
  const cur = ({customer:custFilter.kind, income:incomeTab, expense:expenseTab,
                stock:stockTab, finance:finTab, settings:settingsTab})[menuKey];
  if(canSub(menuKey, cur)) return null;          /* แท็บปัจจุบันเข้าได้ ไม่ต้องสลับ */
  const first = L.find(t=>canSub(menuKey, t[0]));
  return first ? first[0] : null;
}

/* สิทธิ์ระดับเมนูย่อย — ผู้ใช้ที่ถูกจำกัดจะเห็นเฉพาะเมนูย่อยที่อนุญาต */
function canSub(menuKey, subKey){
  if(!CURRENT_USER) return true;
  if(!can(menuKey)) return false;
  /* งบกำไรขาดทุนแสดงต้นทุนขายเป็นหลัก ผู้ที่ถูกซ่อนต้นทุนจึงเข้าไม่ได้ */
  if(menuKey === 'finance' && subKey === 'pl' && !canCost()) return false;
  const tabs = (CURRENT_USER.perms || {}).tabs;
  if(tabs && Object.keys(tabs).some(k=>k.startsWith(menuKey + '.')))
    return !!tabs[menuKey + '.' + subKey];       /* ติ๊กละเอียด: ว่าง = ห้ามเข้า */
  const only = (CURRENT_USER.perms || {}).sub;   /* รูปแบบเก่า */
  if(!only || !only[menuKey]) return true;
  return only[menuKey] === subKey;
}

                  finance:'finance', settings:'settings', license:'settings'})[v];
    /* หน้าแรกเปิดให้ทุกคนเห็นเสมอ */
    const show = (!key || can(key)) ? '' : 'none';
    const box = b.closest('.mi');
    if(box) box.style.display = show; else b.style.display = show;
    b.style.display = box ? '' : show;
  });
  const u = $('#userChip');
  if(u) u.innerHTML = `<b>${esc(userLabel())}</b>${CURRENT_USER?'กดเพื่อสลับผู้ใช้':'สิทธิ์เต็มทุกเมนู'}`;
}

let settingsUserId = null;

/* =====================================================================
   หน้า 01 — สต๊อกอะไหล่
   ===================================================================== */
let stockFilter = {q:'', flag:'all', cat:'all', page:1, pageSize:50};

/* คอลัมน์ที่ซ่อนได้ — ตั้งแต่ราคา B จนถึงเคลื่อนไหวล่าสุด */
const STOCK_COLS = [
  ['cost', 'ต้นทุน'],
  ['pB',   'ราคา B'],
  ['pC',   'ราคา C'],
  ['qty',  'คงเหลือ'],
  ['min',  'Min'],
  ['max',  'Max'],
  ['move', 'เคลื่อนไหวล่าสุด']
];
function hiddenCols(){
  if(!Array.isArray(PREFS.stockHide)) PREFS.stockHide = [];
  return PREFS.stockHide;
}
/* สิทธิ์เห็นต้นทุน — เจ้าของกิจการเห็นเสมอ พนักงานตามติ๊กของแต่ละคน */
/* เห็นรายงานสรุปในหน้าแรกหรือไม่ — ปิดแล้วเหลือแต่การ์ดเมนู */
function canHomeReport(){
  if(!CURRENT_USER) return true;
  return CURRENT_USER.perms && CURRENT_USER.perms.homeReport !== false;
}
function canCost(){
  if(!CURRENT_USER) return true;
  return CURRENT_USER.perms && CURRENT_USER.perms.cost !== false;
}
/* สิทธิ์ส่งออกข้อมูลออกนอกระบบ — ครอบคลุมทุกปุ่มที่ทำให้ได้ไฟล์ข้อมูลจริงติดมือออกไป
   ไม่รวมการดาวน์โหลดแบบฟอร์มเปล่า เพราะไม่มีข้อมูลของร้านอยู่ในนั้น */
/* สิทธิ์พิมพ์หรือส่งออกข้อมูลรายเมนูย่อย
   ผู้ใช้ที่ตั้งค่าไว้ด้วยรุ่นก่อนใช้สวิตช์รวม exportData ตัวเดียว จึงต้องรองรับทั้งสองแบบ */
function canExportTab(menuKey, subKey){
  if(!CURRENT_USER) return true;
  const p = CURRENT_USER.perms || {};
  const e = p.exportTabs;
  if(!e) return p.exportData !== false;          /* รูปแบบเดิม */
  return e[menuKey + '.' + subKey] !== false;
}
/* มีสิทธิ์ส่งออกอย่างน้อยหนึ่งเมนูไหม — ใช้กับปุ่มที่ไม่ผูกกับเมนูย่อยใดโดยตรง */
function canExport(){
  if(!CURRENT_USER) return true;
  const p = CURRENT_USER.perms || {};
  if(!p.exportTabs) return p.exportData !== false;
  return Object.keys(p.exportTabs).some(k=>p.exportTabs[k] !== false);
}
function blockExportTab(menuKey, subKey){
  if(canExportTab(menuKey, subKey)) return false;
  toast('บัญชีของคุณไม่มีสิทธิ์พิมพ์หรือส่งออกข้อมูลส่วนนี้ — ติดต่อเจ้าของกิจการ');
  return true;
}
/* สิทธิ์แก้ไขข้อมูลรายเมนูย่อย — เข้าดูได้กับแก้ไขได้เป็นคนละเรื่องกัน
   ผู้ใช้เดิมที่ยังไม่เคยตั้งค่านี้ถือว่าแก้ได้เหมือนเดิม จะได้ไม่ถูกตัดสิทธิ์กะทันหัน */
function canEditTab(menuKey, subKey){
  if(!CURRENT_USER) return true;
  const e = (CURRENT_USER.perms || {}).editTabs;
  if(!e) return true;
  return e[menuKey + '.' + subKey] !== false;
}
function blockEdit(menuKey, subKey, what){
  if(canEditTab(menuKey, subKey)) return false;
  toast('บัญชีของคุณเปิดดูส่วนนี้ได้อย่างเดียว แก้ไข' + (what || 'ข้อมูล') + 'ไม่ได้ — ติดต่อเจ้าของกิจการ');
  return true;
}
function blockExport(){
  if(canExport()) return false;
  toast('บัญชีของคุณไม่มีสิทธิ์ส่งออกข้อมูล — ติดต่อเจ้าของกิจการ');
  return true;
}
/* แสดงจำนวนเงินที่เป็นต้นทุน — ผู้ที่ไม่มีสิทธิ์จะเห็นเป็นขีดแทนตัวเลข */
function costMoney(n){ return canCost() ? money(n) : '•••••'; }
const colOn  = k => (k === 'cost' && !canCost()) ? false : !hiddenCols().includes(k);
function toggleCol(k, hide){
  const h = hiddenCols();
  const i = h.indexOf(k);
  if(hide && i < 0) h.push(k);
  if(!hide && i >= 0) h.splice(i, 1);
  savePrefs();
}
function colPickerHtml(){
  const n = hiddenCols().length;
  return `
    <details class="mchk" id="stkCols">

        ${n ? `<span class="cnt">${n}</span>` : ''}

          border-bottom:1px solid var(--line-2);margin-bottom:5px">
          ติ๊กถูก = <b>ปิด</b> ไม่แสดงคอลัมน์นั้น<br>ติ๊กออก = <b>เปิด</b> แสดงกลับมา</div>
        ${STOCK_COLS.filter(([k])=>k!=='cost' || canCost()).map(([k,l])=>

function renderStock(){
  if(!$('#view-stocklist')) return;
  /* ของที่เพิ่งเพิ่มหรือเพิ่งแก้ต้องอยู่บนสุด จะได้เห็นทันทีว่าที่ทำไปเข้าระบบจริง
     รายการเก่าที่ไม่มีประวัติการบันทึกเรียงตามลำดับที่อยู่ในทะเบียน โดยตัวท้ายขึ้นก่อน */
  const pOrder = new Map(DB.products.map((p,i)=>[p, i]));
  const list = DB.products.filter(p=>{
    const q = stockFilter.q.trim().toLowerCase();
    const hit = !q || [p.code,p.oem,p.name,p.cat].some(v=>String(v||'').toLowerCase().includes(q));
    if(!hit) return false;
    if(stockFilter.cat!=='all' && (p.cat||'')!==stockFilter.cat) return false;
    if(stockFilter.flag==='all') return true;
    return flagsOf(p).includes(stockFilter.flag);
  }).sort((a,b)=>{
    const ka = docTouchKey(a), kb = docTouchKey(b);
    if(ka !== kb) return kb.localeCompare(ka);
    return pOrder.get(b) - pOrder.get(a);
  });
  const cnt = {min:0,max:0,dead:0};
  DB.products.forEach(p=>flagsOf(p).forEach(f=>cnt[f]++));
  const value = DB.products.reduce((s,p)=>s+lotValue(p),0);

  /* แบ่งหน้า — ตารางที่มีหลายพันแถวจะวาดช้าจนใช้งานไม่ทัน */
  const stkPages = Math.max(1, Math.ceil(list.length / stockFilter.pageSize));
  if(stockFilter.page > stkPages) stockFilter.page = stkPages;
  if(stockFilter.page < 1) stockFilter.page = 1;
  const stkStart = (stockFilter.page - 1) * stockFilter.pageSize;
  const pageList = list.slice(stkStart, stkStart + stockFilter.pageSize);

  $('#view-stocklist').innerHTML = `
    ${demoInviteHtml('stock')}
    ${pendingCount() ? `<div class="pendbar">
      <div class="txt"><b>มีรายการสินค้าค้างทำ ${pendingCount()} รายการ</b>
        เป็นชื่อสินค้าที่พิมพ์ลงในเอกสารเองโดยไม่ได้ดึงจากทะเบียน จึงยังไม่ถูกตัดสต๊อกและไม่นับในมูลค่าสต๊อก</div>
      <button class="btn" id="stkGoPending">ไปจัดการ</button>
    </div>` : ''}
    <div class="stat" style="margin-bottom:16px">
      <div><span>รายการทั้งหมด</span><b${DB.products.length>=MAX_PRODUCTS?' style="color:var(--danger)"':DB.products.length>=MAX_PRODUCTS*0.9?' style="color:var(--warn)"':''}>${DB.products.length.toLocaleString()}<span style="font-size:12px;color:var(--ink-3);font-weight:400"> / ${MAX_PRODUCTS.toLocaleString()}</span></b></div>
      <div><span>ถึงจุดสั่งซื้อ</span><b style="color:var(--warn)">${cnt.min}</b></div>
      <div><span>เกิน Max</span><b style="color:var(--danger)">${cnt.max}</b></div>
      <div><span>ไม่เคลื่อนไหว ≥6 เดือน</span><b style="color:var(--flag-dead-ink)">${cnt.dead}</b></div>
      ${colOn('cost')
        ? `<div><span>มูลค่าสต๊อกตามต้นทุน</span><b>${costMoney(value)}</b></div>`
        : `<div><span>มูลค่าสต๊อก</span><b style="color:var(--ink-3);font-size:15px">ซ่อนไว้</b></div>`}
    </div>

    ${DB.products.length>=MAX_PRODUCTS*0.9 ? `<div style="margin-bottom:14px;padding:11px 15px;border-radius:6px;font-size:13px;line-height:1.7;
      background:${DB.products.length>=MAX_PRODUCTS?'#FCF1F0':'#FCF3E2'};border:1px solid ${DB.products.length>=MAX_PRODUCTS?'#EFCFCB':'#EEDBB4'};
      color:${DB.products.length>=MAX_PRODUCTS?'var(--danger)':'var(--warn)'}">
      ${DB.products.length>=MAX_PRODUCTS
        ? `<b>ทะเบียนอะไหล่เต็มแล้ว (${MAX_PRODUCTS.toLocaleString()} รายการ)</b> — เพิ่มรายการใหม่ไม่ได้จนกว่าจะลบรายการที่เลิกใช้ออกก่อน แนะนำให้กรองดูรายการที่ไม่เคลื่อนไหวเกิน 6 เดือนเพื่อพิจารณาลบ`
        : `<b>ทะเบียนอะไหล่ใกล้เต็ม</b> — ใช้ไปแล้ว ${DB.products.length.toLocaleString()} จาก ${MAX_PRODUCTS.toLocaleString()} รายการ เหลืออีก ${(MAX_PRODUCTS-DB.products.length).toLocaleString()} รายการ`}
      </div>` : ''}

    <div class="card">
      <header>
        <div class="search" style="width:270px"><input class="in" id="stkSearch" placeholder="รหัส / OEM / ชื่อสินค้า / หมวดหมู่" value="${esc(stockFilter.q)}"></div>

          ${DB.products.some(p=>!p.cat)?`<option value=""${stockFilter.cat===''?' selected':''}>ไม่ระบุหมวด</option>`:''}
        </select>
        <div class="spacer"></div>
        ${colPickerHtml()}
        ${canExportTab('stock','list')? `<button class="btn sm" id="stkPrint">พิมพ์รายการสต๊อก</button>` : ``}
        <div class="legend">
          <span><i style="background:var(--flag-min-bg)"></i>ถึง Min</span>
          <span><i style="background:var(--flag-max-bg)"></i>เกิน Max</span>
          <span><i style="background:var(--flag-dead-bg)"></i>ไม่เคลื่อนไหว ≥6 เดือน</span>
        </div>

            <th style="width:118px" data-hide="md">หมวดหมู่</th>
            ${colOn('cost')?`<th class="num" style="width:92px" data-hide="sm">ต้นทุน</th>`:''}
            <th class="num" style="width:88px">ราคา A</th>
            ${colOn('pB')?`<th class="num" style="width:88px" data-hide="md">ราคา B</th>`:''}

/* ---------- รูปสินค้า ---------- */
const MAX_PICS = 1;          /* รูปต่อสินค้าหนึ่งรายการ */
const PIC_LIMIT = 3000;      /* เพดานคลังรูป — รองรับสินค้า 3,000 รายการ */
const PIC_EDGE = 800;        /* ด้านยาวสุดหลังย่อ (พิกเซล) — ขนาดปานกลาง ชัดพอโดยไม่กินที่ */
const PIC_Q    = 0.62;       /* คุณภาพ JPEG */
const STORE_CAP = 4.6 * 1024 * 1024;   /* พื้นที่ที่ประมาณว่าใช้ได้จริง */

function picsOf(p){ return Array.isArray(p && p.pics) ? p.pics : []; }
function dbBytes(){ try{ return JSON.stringify(DB).length; }catch(e){ return 0; } }
/* ประมาณว่ายังใส่รูปได้อีกกี่รูป — คิดจากขนาดรูปเฉลี่ยที่มีอยู่จริง ถ้ายังไม่มีใช้ 30 KB */
function picRoomLeft(){ return Math.max(0, PIC_LIMIT - picCount()); }
/* ---- คลังรูปสินค้า: เก็บรายชิ้นใน IndexedDB ----
   ฐานเอกสารเก็บแค่รหัสรูป (เช่น "p:abc123") การบันทึกเอกสารจึงไม่แบก
   รูปไปด้วย และคลังรองรับพื้นที่ระดับ GB — สภาพแวดล้อมที่ไม่มี IndexedDB
   ถอยไปใช้หน่วยความจำชั่วคราวโดยอัตโนมัติ */
const PIC_MEM = {};                        /* แคช + สำรองในหน่วยความจำ */
const PICDB = {
  _db: null,
  open(){
    return new Promise((res, rej)=>{
      if(this._db) return res(this._db);
      if(typeof indexedDB === 'undefined') return rej(new Error('no idb'));
      const rq = indexedDB.open('dgl_pics', 1);
      rq.onupgradeneeded = ()=>{ rq.result.createObjectStore('pics'); };
      rq.onsuccess = ()=>{ this._db = rq.result; res(this._db); };
      rq.onerror = ()=>rej(rq.error);
    });
  },
  async get(id){
    if(PIC_MEM[id]) return PIC_MEM[id];
    try{
      const db = await this.open();
      const v = await new Promise((res, rej)=>{
        const r = db.transaction('pics').objectStore('pics').get(id);
        r.onsuccess = ()=>res(r.result || null); r.onerror = ()=>rej(r.error);
      });
      if(v) PIC_MEM[id] = v;
      return v;
    }catch(e){ return null; }
  },
  async set(id, data){
    PIC_MEM[id] = data;
    try{
      const db = await this.open();
      await new Promise((res, rej)=>{
        const t = db.transaction('pics', 'readwrite');
        t.objectStore('pics').put(data, id);
        t.oncomplete = res; t.onerror = ()=>rej(t.error);
      });
    }catch(e){}
  },
  async del(id){
    delete PIC_MEM[id];
    try{
      const db = await this.open();
      await new Promise((res, rej)=>{
        const t = db.transaction('pics', 'readwrite');
        t.objectStore('pics').delete(id);
        t.oncomplete = res; t.onerror = ()=>rej(t.error);
      });
    }catch(e){}
  },
  async all(){
    try{
      const db = await this.open();
      return await new Promise((res, rej)=>{
        const out = {};
        const r = db.transaction('pics').objectStore('pics').openCursor();
        r.onsuccess = ()=>{ const c = r.result;
          if(c){ out[c.key] = c.value; c.continue(); } else res(out); };
        r.onerror = ()=>rej(r.error);
      });
    }catch(e){ return Object.assign({}, PIC_MEM); }
  }
};

/* รหัสรูปทั้งหมดที่ฐานอ้างถึง */
function picIdsInUse(){ return DB.products.reduce((a,p)=>a.concat(picsOf(p)), []); }
/* จำนวนรูปในคลัง (นับจากที่ฐานอ้าง) */
function picCount(){ return picIdsInUse().length; }
/* รูปพร้อมแสดงจากแคชหรือยัง — คืน src ทันทีถ้ามี */
function picSrc(id){ return PIC_MEM[id] || ''; }
/* เติมรูปที่ยังไม่โหลดให้ทุก <img data-picid> บนหน้า */
function hydratePics(){
  $$('img[data-picid]').forEach(im=>{
    if(im.getAttribute('src')) return;
    const id = im.dataset.picid;
    PICDB.get(id).then(v=>{ if(v && im.isConnected) im.src = v; });
  });
}

/* ย่อรูปก่อนเก็บ — รูปจากมือถือใบละหลาย MB เก็บตรง ๆ ไม่ได้ */
function shrinkImage(file){
  return new Promise((resolve, reject)=>{
    if(!/^image\//.test(file.type)) return reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>reject(new Error('เปิดรูปไม่สำเร็จ'));
      im.onload = ()=>{
        let {width:w, height:h} = im;
        const k = Math.min(1, PIC_EDGE / Math.max(w, h));
        w = Math.max(1, Math.round(w*k)); h = Math.max(1, Math.round(h*k));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
        cx.drawImage(im, 0, 0, w, h);
        try{ resolve(cv.toDataURL('image/jpeg', PIC_Q)); }
        catch(e){ reject(new Error('ย่อรูปไม่สำเร็จ')); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* แผงเลือกรูปในหน้าต่างสินค้า */
function picsPanelHtml(pics){
  const used = picCount(), pct = Math.min(100, Math.round(used/PIC_LIMIT*100));
  const cls = pct >= 90 ? 'full' : pct >= 70 ? 'warn' : '';
  return `
    <div class="pics">
      ${Array.from({length:MAX_PICS}).map((_,i)=>{
        const src = pics[i];
        return `<div class="pic ${src?'has':''}" data-pic="${i}">
          <span class="no">${i+1}</span>
          ${src ? `<img src="${picSrc(src)}" data-picid="${src}" alt="รูปสินค้า">
                  <button class="rm" data-picrm="${i}" title="ลบรูปนี้">×</button>`
                : `<span class="ph"><b>+</b>เพิ่มรูป</span>`}
        </div>`;
      }).join('')}
    </div>
    <div class="picbar">
      <span>ใช้ไป ${used.toLocaleString()} จาก ${PIC_LIMIT.toLocaleString()} รูป</span>
      <span class="gauge"><i class="${cls}" style="width:${pct}%"></i></span>
      <span>${pct}%</span>
    </div>
    <div style="font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.65">
      <b>สกุลไฟล์ที่รองรับ:</b> JPG · PNG · WebP &nbsp;·&nbsp;
      <b>ขนาดที่เหมาะสม:</b> ด้านยาว ${PIC_EDGE}–1,600 พิกเซล · ไฟล์ไม่เกิน 10 MB<br>
      กด "+ เพิ่มรูป" บนมือถือ<b>ถ่ายจากกล้องได้ทันที</b> ·
      ระบบย่อรูปให้อัตโนมัติเหลือด้านยาว ${PIC_EDGE} พิกเซล (~50 KB) แล้วเก็บใน
      <b>คลังรูปแยก</b>จากฐานเอกสาร — โปรแกรมจึงเร็วเท่าเดิมแม้ใส่รูปครบทุกรายการ<br>
      ใส่รูปได้อีก <b>${picRoomLeft().toLocaleString()}</b> รูป
      (สินค้า 1 รายการต่อ 1 รูป · รองรับ ${PIC_LIMIT.toLocaleString()} รายการ)
      ${pct >= 70 ? `<br><b style="color:var(--${pct>=90?'danger':'warn'})">พื้นที่ใกล้เต็มแล้ว</b>
        — คลังรูปใกล้เพดาน ${PIC_LIMIT.toLocaleString()} รูป
        แนะนำลบรูปสินค้าที่เลิกขายออกก่อนเพิ่มใหม่` : ''}
    </div>
    <input type="file" id="picFile" accept="image/jpeg,image/png,image/webp" style="display:none">
    <input type="file" id="picCam" accept="image/*" capture="environment" style="display:none">`;
}

/* ดูรูปขนาดใหญ่ */
function viewPicsModal(prod, start){
  const pics = picsOf(prod);
  if(!pics.length) return;
  let cur = Math.min(start||0, pics.length-1);
  const draw = ()=>`
    <div class="picview"><img src="${picSrc(pics[cur])}" data-picid="${pics[cur]}" alt="${esc(prod.name)}"></div>
    ${pics.length>1 ? `<div class="picstrip">${pics.map((p,i)=>
      `<button data-pv="${i}" aria-pressed="${i===cur}"><img src="${picSrc(p)}" data-picid="${p}" alt=""></button>`).join('')}</div>` : ''}
    <div style="text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:8px">
      ${esc(prod.code)} · ${esc(prod.name)} · รูปที่ ${cur+1} จาก ${pics.length}</div>`;
  const bind = ()=>$$('[data-pv]').forEach(b=>b.onclick=()=>{
    cur = +b.dataset.pv; $('#mBody').innerHTML = draw(); bind(); hydratePics(); });
  openModal('รูปสินค้า', draw(), [{label:'ปิด', cls:'btn primary', act:closeModal}]);
  bind(); hydratePics();
}

      const touch = matchMedia('(pointer:coarse)').matches;
      if(!touch){ $('#picFile').value = ''; return $('#picFile').click(); }
      /* จอสัมผัส: แผงลอยอิสระ — ไม่ทับหน้าต่างสินค้า ช่องรับไฟล์ยังอยู่ครบ */
      const sh = document.createElement('div');
      sh.className = 'picsheet';
      sh.innerHTML = `<div class="sh">
        <b style="font-size:15px">เพิ่มรูปสินค้า</b>
        <button class="btn primary" id="picGoCam">📷 ถ่ายรูปด้วยกล้อง</button>
        <button class="btn" id="picGoFile">🖼 เลือกรูปจากเครื่อง</button>
        <div class="note">รองรับ JPG · PNG · WebP ไฟล์ไม่เกิน 10 MB —
          ถ่ายให้เห็นชิ้นส่วนชัดเต็มกรอบ ระบบย่อรูปให้เองอัตโนมัติ</div>
        <button class="btn" id="picGoX">ปิด</button>
      </div>`;
      document.body.appendChild(sh);
      const shut = ()=>sh.remove();
      sh.onclick = e=>{ if(e.target === sh) shut(); };
      sh.querySelector('#picGoX').onclick   = shut;
      sh.querySelector('#picGoCam').onclick = ()=>{ shut(); $('#picCam').value = '';  $('#picCam').click(); };
      sh.querySelector('#picGoFile').onclick= ()=>{ shut(); $('#picFile').value = ''; $('#picFile').click(); };
    });
    $$('#picsBox [data-picrm]').forEach(b=>b.onclick = e=>{
      e.stopPropagation();
      const i = +b.dataset.picrm;
      const gone = picsOf(p)[i];
      if(gone) PICDB.del(gone);
      p.pics = picsOf(p).filter((_,k)=>k!==i);
      redrawPics(); toast('ลบรูปแล้ว');
    });
    const onPicked = async e=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      if(f.size > 10*1024*1024){ e.target.value='';
        return toast(`ไฟล์ใหญ่ ${Math.round(f.size/1024/1024)} MB เกิน 10 MB — เลือกรูปที่เล็กกว่านี้`); }
      toast('กำลังย่อรูป…');
      try{
        const dim = await new Promise((res,rej)=>{
          const fr=new FileReader();
          fr.onload=()=>{ const im=new Image();
            im.onload=()=>res({w:im.width,h:im.height}); im.onerror=()=>rej(new Error('เปิดรูปไม่สำเร็จ'));
            im.src=fr.result; };
          fr.onerror=()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ')); fr.readAsDataURL(f);
        });
        if(Math.max(dim.w, dim.h) < 300)
          toast(`รูปต้นฉบับเล็กมาก (${dim.w}×${dim.h}) — อาจไม่คมชัด แนะนำด้านยาวอย่างน้อย ${PIC_EDGE} พิกเซล`);
        const data = await shrinkImage(f);
        const picId = 'p:' + uid();
        await PICDB.set(picId, data);
        picsOf(p).forEach(old=>PICDB.del(old));   /* สินค้าละ 1 รูป — แทนรูปเดิม */
        if(dbBytes() + data.length > STORE_CAP)
          return toast('พื้นที่เก็บข้อมูลไม่พอ — ลบรูปเก่าออกก่อน');
        p.pics = [picId];
        redrawPics();
        toast(`เพิ่มรูปแล้ว · ${Math.round(data.length/1024)} KB (จากไฟล์ ${Math.round(f.size/1024)} KB)`);
      }catch(err){ toast(err.message || 'เพิ่มรูปไม่สำเร็จ'); }
    };
    $('#picFile').onchange = onPicked;
    $('#picCam').onchange  = onPicked;
  }
  bindPics();

  $('#bcGen').onclick = async ()=>{
    if($('#f_barcode').value.trim() && !await confirmPop('มีบาร์โค้ดอยู่แล้ว — สร้างรหัสใหม่ทับหรือไม่')) return;
    $('#f_barcode').value = genBarcode();
    toast('สร้างรหัสบาร์โค้ดแล้ว — บันทึกสินค้าเพื่อเก็บรหัสนี้');
  };
  $('#bcPrint').onclick = ()=>{
    const bc = $('#f_barcode').value.trim().toUpperCase();
    if(!bc) return toast('ยังไม่มีบาร์โค้ด — กด "สร้างรหัส" หรือยิงจากสินค้าก่อน');
    printBarcodeModal({code:$('#f_code').value.trim(), name:$('#f_name').value.trim(),
      barcode:bc, pA:num($('#f_pA').value)});
  };
  /* เลือก “เพิ่มหมวดหมู่ใหม่” ในรายการดรอปดาวน์ */
  $('#f_cat').onchange = e=>{
    if(e.target.value !== '__new__') return;
    e.target.value = p.cat || '';
    const name = prompt('ชื่อหมวดหมู่ใหม่');
    if(name === null) return;
    const n = name.trim();
    if(!n) return toast('กรอกชื่อหมวดหมู่ก่อน');
    if(!DB.categories.includes(n)) DB.categories.push(n);
    saveMeta();
    e.target.innerHTML = catOptions(n);
    e.target.value = n;
    toast('เพิ่มหมวดหมู่ '+n+' แล้ว');
  };
}

/* ปุ่ม + / − ไม่ปรับสต๊อกเองอีกแล้ว แต่พาไปทำผ่านเอกสารที่มีหลักฐาน
   รับเข้า → ใบซื้อ (ได้ต้นทุนและเจ้าหนี้ที่ถูกต้อง) หรือใบตรวจนับ
   ตัดออก → ใบตรวจนับ เพื่อให้รู้เสมอว่าของหายไปไหนและใครเป็นคนปรับ */
function stockMoveRoute(id, dir){
  const p = DB.products.find(x=>x.id===id); if(!p) return;
  const goCount = ()=>{
    closeModal(); docwinClose();
    go('stock'); stockTab='count'; renderStockMenu();
    if(canEditTab('stock','count')){
      openCount(blankCount());
      /* ใส่สินค้าเข้าใบให้เลย แต่เว้นช่อง "นับได้จริง" ไว้ให้กรอกเอง
         ไม่ใช้ทางเดียวกับปืนยิงบาร์โค้ด เพราะการยิงหมายถึงนับได้ 1 ชิ้น */
      curCount.items.unshift({pid:p.id, code:p.code, name:p.name, unit:p.unit||'',
        sys:num(p.qty), cnt:undefined, cost:num(p.cost)});
      renderCountForm();
      toast(`เปิดใบตรวจนับพร้อม ${p.code} แล้ว — กรอกจำนวนที่นับได้จริง`);
    }
  };
  if(dir === 'out'){
    return openModal('ตัดของออกจากสต๊อก', `
      <p style="line-height:1.9;margin:0 0 12px">
        <b>${esc(p.code)}</b> ${esc(p.name)} · คงเหลือ <b>${qtyTxt(p.qty)} ${esc(p.unit||'')}</b></p>
      <div class="note">
        <b>ถ้าขายออกไป</b> ให้เปิดใบเสร็จหรือใบส่งมอบ สต๊อกจะตัดให้เอง ·
        <b>ถ้าจ่ายให้ลูกค้าฟรี</b> ให้เปิดใบเคลม ·
        <b>ถ้าของหายหรือนับแล้วไม่ตรง</b> ให้ใช้ใบตรวจนับ ซึ่งจะบันทึกส่วนต่างและเหตุผลไว้เป็นหลักฐาน<br>
        <b>ถ้าเป็นวัสดุสิ้นเปลืองที่ใช้ในงานซ่อม</b> เช่น น้ำมันเครื่อง น้ำยาแอร์ ให้กด "เบิกใช้ในอู่"
        — ต้นทุนจะไปเป็นค่าใช้จ่ายในงบกำไรขาดทุน ส่วนเงินที่คิดกับลูกค้าให้ใส่รวมในบรรทัดค่าแรง/ค่าบริการของใบเสนอราคา
      </div>`, [
      {label:'ปิด', cls:'btn', act:closeModal},
      {label:'เบิกใช้ในอู่', cls:'btn', act:()=>{ closeModal();
        /* ถ้าเปิดจากหน้ารายละเอียดสินค้า ให้วาดประวัติใหม่หลังบันทึก */
        moveModal(p.id, 'out', ()=>{ if(PD.id === p.id && $('.docwin.on')) renderProductDetail(); }); }},
      {label:'ไปใบเคลม', cls:'btn', act:()=>{
        closeModal(); docwinClose();
        go('stock'); stockTab='claim'; renderStockMenu();
        if(canEditTab('stock','claim')){
          curClaim = blankClaim();
          curClaim.items.push({pid:p.id, code:p.code, name:p.name, unit:p.unit||'',
            qty:1, cost:num(p.cost)});
          renderClaim(claimSideOf(curClaim));
          toast(`เปิดใบเคลมพร้อม ${p.code} แล้ว — กรอกเหตุผลและจำนวนที่จ่ายออก`);
        }
      }},
      {label:'ไปตรวจนับสต๊อก', cls:'btn primary', act:goCount}
    ]);
  }
  openModal('รับของเข้าสต๊อก', `
    <p style="line-height:1.9;margin:0 0 12px">
      <b>${esc(p.code)}</b> ${esc(p.name)} · คงเหลือ <b>${qtyTxt(p.qty)} ${esc(p.unit||'')}</b></p>
    <div class="note">
      <b>ซื้อของเข้ามาใหม่</b> ให้เปิดใบซื้อ ระบบจะรับเข้าสต๊อก คิดต้นทุนใหม่ และตั้งเจ้าหนี้ให้ครบในทีเดียว<br>
      <b>นับแล้วมีมากกว่าที่ระบบบอก</b> ให้ใช้ใบตรวจนับ ระบบจะปรับยอดขึ้นพร้อมบันทึกส่วนต่างไว้
    </div>`, [
    {label:'ปิด', cls:'btn', act:closeModal},
    {label:'ไปตรวจนับสต๊อก', cls:'btn', act:goCount},
    {label:'เปิดใบซื้อ', cls:'btn primary', act:()=>{
      closeModal(); docwinClose();
      go('expense'); expenseTab='purchase'; renderExpense();
      if(canEditTab('expense','purchase')){
        curPo = blankPurchase(); renderPoRecord();
        toast(`เปิดใบซื้อใหม่แล้ว — กด “ดึงสินค้าจากทะเบียน” เพื่อเพิ่ม ${p.code}`);
      }
    }}
  ]);
}

/* กล่องเบิกใช้ในอู่ — ทางเดียวที่ตัดสต๊อกโดยไม่มีเอกสาร ใช้กับวัสดุสิ้นเปลือง
   ที่คิดเงินลูกค้ารวมไปในค่าแรง/ค่าบริการ ต้นทุนที่ตัดจะไปขึ้นเป็นค่าใช้จ่าย
   บรรทัด "วัสดุสิ้นเปลืองและของเบิกใช้ในอู่" ในงบกำไรขาดทุน */
function moveModal(id, dir, after){
  if(blockEdit('stock','list','จำนวนสินค้าในสต๊อก')) return;
  const p = DB.products.find(x=>x.id===id);
  openModal(dir==='in'?'รับสินค้าเข้าสต๊อก':'เบิกใช้ในอู่ — '+esc(p.code), `
    <div style="margin-bottom:12px">${tagHTML(p)} <b style="margin-left:8px">${esc(p.name)}</b>
      <div style="color:var(--ink-3);font-size:12px;margin-top:4px">คงเหลือปัจจุบัน ${num(p.qty)} ${esc(p.unit)} · Min ${num(p.min)} · Max ${num(p.max)}</div></div>
    <div class="grid g2">
      <div><label class="f">จำนวน</label><input class="in mono" id="mvQty" value="1"></div>
      <div><label class="f">วันที่</label><input type="date" class="in" id="mvDate" value="${today()}"></div>
    </div>
    <div style="margin-top:12px"><label class="f">หมายเหตุ — เบิกไปใช้กับงานไหน</label><input class="in" id="mvNote" placeholder="${dir==='in'?'เช่น รับจากร้านอะไหล่ ใบส่งของเลขที่...':'เช่น เติมน้ำมันเครื่อง รถทะเบียน กข 1234'}"></div>
    ${dir==='out'?`<div class="note" style="margin-top:10px">ต้นทุนที่ตัด (ตามทุนจริงแบบ FIFO) จะไปเป็นค่าใช้จ่ายในงบกำไรขาดทุน
      บรรทัด "วัสดุสิ้นเปลืองและของเบิกใช้ในอู่" — เงินที่คิดกับลูกค้าให้รวมในบรรทัดค่าแรง/ค่าบริการของเอกสารขาย</div>`:''}
  `, [
    {label:'ยกเลิก', cls:'btn', act:closeModal},
    {label:'บันทึกการเคลื่อนไหว', cls:'btn primary', act:async ()=>{
      if(!requireLicense()) return closeModal();
      const q = num($('#mvQty').value);
      if(q<=0) return toast('ระบุจำนวนมากกว่า 0');
      const mvDate = $('#mvDate').value || today();
      /* เบิกออกย้อนกลับเองไม่ได้ จึงทวนตัวเลขให้ดูก่อนหนึ่งจังหวะ กันนิ้วลั่น
         ต้นทุนที่โชว์คำนวณแบบเดียวกับตอนตัดจริง (FIFO) แต่ยังไม่แตะสต๊อก */
      if(dir==='out'){
        let peekCost = 0, left = q;
        lotsOf(p).forEach(l=>{ if(left<=0) return;
          const take = Math.min(left, num(l.q)); peekCost += take*num(l.c); left -= take; });
        peekCost += left*num(p.cost);         /* ส่วนที่เกินกว่าของในคลัง ตีตามทุนปัจจุบัน */
        const remain = num(p.qty) - q;
        /* confirmPop แสดงเป็นข้อความล้วน จึงไม่ต้อง esc() */
        const ok = await confirmPop(`เบิก ${p.code} ${p.name}\n\n` +
          `จำนวน ${qtyTxt(q)} ${p.unit||''} · ต้นทุนประมาณ ${money(peekCost)} บาท\n` +
          `คงเหลือหลังเบิก ${qtyTxt(remain)} ${p.unit||''}` +
          (remain < 0 ? '\n\n⚠ จำนวนที่เบิกมากกว่าของที่มีในระบบ — สต๊อกจะติดลบ' : '') +
          `\n\nต้นทุนจะไปเป็นค่าใช้จ่ายในงบกำไรขาดทุนทันที และย้อนกลับเองไม่ได้`);
        if(!ok) return;
      }
      let unitCost = num(p.cost);
      if(dir==='in') lotAdd(p, q, unitCost, mvDate);
      else { const c = lotConsume(p, q); unitCost = q > 0 ? c/q : unitCost; }
      /* บันทึกลงสมุดความเคลื่อนไหว พร้อมหมายเหตุที่พิมพ์ไว้ */
      /* เบิกออก = 'use' ให้งบแยกเป็นวัสดุสิ้นเปลือง · รับเข้า = 'manual' ตามเดิม */
      recordMove(p.id, dir, q, {cost:unitCost, date:mvDate, note:$('#mvNote').value.trim(),
        kind: dir==='out' ? 'use' : 'manual'});
      p.lastMove = mvDate;
      saveCol('products','moves'); closeModal(); renderStock(); if(after) after();
      const f = flagsOf(p);
      toast(f.includes('min') ? `บันทึกแล้ว — ${p.code} ถึงจุดสั่งซื้อ` : f.includes('max') ? `บันทึกแล้ว — ${p.code} เกินระดับ Max` : 'บันทึกการเคลื่อนไหวแล้ว');
    }}
  ]);
}

/* =====================================================================
   หน้ารายละเอียดสินค้า — ข้อมูลสรุป + ประวัติความเคลื่อนไหวย้อนหลัง
   เปิดจากปุ่ม "ประวัติ" ในทะเบียนสินค้า 05.1
   ===================================================================== */
let PD = {id:null, filter:'all', page:1, pageSize:20};
const qtyTxt = n => (Math.round(num(n)*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3});

function productDetail(id){
  const p = DB.products.find(x=>x.id===id); if(!p) return;
  PD = {id:id, filter:'all', page:1, pageSize:20};
  docwinOpen(`${p.code} — ${p.name}`, 'รายละเอียดสินค้าและประวัติการเคลื่อนไหว');
  renderProductDetail();
}

function renderProductDetail(){
  const p = DB.products.find(x=>x.id===PD.id);
  if(!p) return docwinClose();
  const all   = movesOf(p);
  const list  = PD.filter === 'all' ? all : all.filter(m=>m.dir === PD.filter);
  const ordered = list.slice().reverse();        /* ใหม่สุดอยู่บนสุด */
  const pages = Math.max(1, Math.ceil(ordered.length / PD.pageSize));
  if(PD.page > pages) PD.page = pages;
  if(PD.page < 1) PD.page = 1;
  const start = (PD.page - 1) * PD.pageSize;
  const shown = ordered.slice(start, start + PD.pageSize);
  const sumIn  = all.filter(m=>m.dir==='in' ).reduce((s,m)=>s+m.qty, 0);
  const sumOut = all.filter(m=>m.dir==='out').reduce((s,m)=>s+m.qty, 0);
  const unit = esc(p.unit||'ชิ้น');
  const cnt = {all:all.length, in:all.filter(m=>m.dir==='in').length, out:all.filter(m=>m.dir==='out').length};

  $('#dwBody').innerHTML = `
    <div class="card" style="padding:16px 18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="min-width:220px">
          <div style="font-size:17px;font-weight:700;line-height:1.35">${esc(p.name)}</div>
          <div style="margin-top:5px">${tagHTML(p)}
            <span class="hint" style="margin-left:6px">${esc(p.cat||'ไม่ระบุหมวด')} · หน่วยนับ ${unit}${
              p.oem ? ` · OEM ${esc(p.oem)}` : ''}</span></div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${canEditTab('stock','list')? `
          <button class="btn sm" id="pdIn">รับเข้า</button>
          <button class="btn sm" id="pdOut">ตัดออก</button>
          <button class="btn sm ghost" id="pdEdit">แก้ไขสินค้า</button>` : ``}
          <button class="btn" id="pdClose">ปิดหน้าต่าง</button>
        </div>
      </div>
      <div class="stat" style="margin-top:15px">
        <div><span>จำนวนคงเหลือ</span><b>${qtyTxt(p.qty)}<span style="font-size:12px;color:var(--ink-3);font-weight:400"> ${unit}</span></b></div>
        <div><span>ต้นทุนเฉลี่ยต่อหน่วย</span><b>${costMoney(p.cost)}</b></div>
        <div><span>ราคาขาย A</span><b>${money(p.pA)}</b></div>
        <div><span>มูลค่าคงเหลือ</span><b>${costMoney(lotValue(p))}</b></div>
        <div><span>Min / Max</span><b style="font-size:15px">${qtyTxt(p.min)} / ${qtyTxt(p.max)}</b></div>
      </div>
    </div>

    <div class="card" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div>
          <h3 style="margin:0;font-size:15.5px">ความเคลื่อนไหวสินค้า</h3>
          <span class="hint">รับเข้ารวม ${qtyTxt(sumIn)} · ตัดออกรวม ${qtyTxt(sumOut)} ${unit} — เรียงใหม่สุดอยู่บน</span>
        </div>
        <span class="pill-tabs" id="pdFilter">
          <button data-f="all" aria-pressed="${PD.filter==='all'}">ทั้งหมด (${cnt.all})</button>
          <button data-f="in"  aria-pressed="${PD.filter==='in'}">รับเข้า (${cnt.in})</button>
          <button data-f="out" aria-pressed="${PD.filter==='out'}">ตัดออก (${cnt.out})</button>
        </span>
      </div>
      <div class="tablewrap" style="border:1px solid var(--line);border-radius:6px">

/* ---------- กดหัวตารางเพื่อเรียงข้อมูล — ใช้ได้ทุกตารางทะเบียน ---------- */
function sortCellVal(td){
  const t = td.textContent.trim();
  const n = t.replace(/[,฿%\s]/g,'');
  if(n !== '' && !isNaN(n)) return {n:parseFloat(n)};
  const m = t.match(/^(\d{1,2})\s+(\S+\.?)\s+(\d{4})/);
  if(m && typeof TH_MON_ABBR !== 'undefined'){
    const mi = TH_MON_ABBR.indexOf(m[2]);
    if(mi >= 0) return {n:(+m[3])*10000 + (mi+1)*100 + (+m[1])};
  }
  return {s:t.toLowerCase()};
}
document.addEventListener('click', e=>{
  const th = e.target.closest('table.tbl thead th');
  if(!th || e.target.closest('button,input,select,a')) return;
  const table = th.closest('table');
  if(table.closest('.paper') || table.closest('#printroot')) return;
  const tb = table.tBodies[0]; if(!tb) return;
  const rows = [...tb.rows].filter(r=>!r.querySelector('td.empty') && r.cells.length > 1);
  if(rows.length < 2) return;
  const idx = [...th.parentNode.children].indexOf(th);
  const dir = th.dataset.sort === 'asc' ? -1 : 1;
  table.querySelectorAll('thead th').forEach(h=>h.removeAttribute('data-sort'));
  th.dataset.sort = dir === 1 ? 'asc' : 'desc';
  rows.map(r=>({r, v:sortCellVal(r.cells[Math.min(idx, r.cells.length-1)])}))
    .sort((a,b)=>{
      if(a.v.n !== undefined && b.v.n !== undefined) return (a.v.n - b.v.n) * dir;
      if(a.v.n !== undefined) return -dir;
      if(b.v.n !== undefined) return dir;
      return a.v.s.localeCompare(b.v.s, 'th') * dir;
    })
    .forEach(x=>tb.appendChild(x.r));
});

/* =====================================================================
   ภาษีมูลค่าเพิ่ม — เครดิตภาษีซื้อยกไปเดือนถัดไป
   ===================================================================== */
function vatMonthKeys(){
  const ks = new Set();
  salesDocs().forEach(r=>ks.add(r.date.slice(0,7)));
  livePurchases().forEach(p=>ks.add(p.date.slice(0,7)));
  liveExpenses().forEach(e=>ks.add(e.date.slice(0,7)));
  return [...ks].sort();
}
function vatOfMonth(k){
  const out = salesDocs().filter(r=>r.date.slice(0,7)===k).reduce((s,r)=>s+recTotals(r).vat, 0);
  const inn = livePurchases().filter(p=>p.date.slice(0,7)===k).reduce((s,p)=>s+poTotals(p).vat, 0)
            + liveExpenses().filter(e=>e.date.slice(0,7)===k).reduce((s,e)=>s+exTotals(e).vat, 0);
  return {out:Math.round(out*100)/100, in:Math.round(inn*100)/100};
}
/* ไล่คำนวณทีละเดือนตามลำดับเวลา — เดือนใดภาษีซื้อมากกว่าภาษีขาย
   ส่วนเกินจะกลายเป็นเครดิตยกไปหักในเดือนถัดไป */
function vatChain(){
  let carry = 0;
  return vatMonthKeys().map(k=>{
    const v = vatOfMonth(k);
    const carryIn = carry;
    const net = Math.round((v.out - v.in - carryIn)*100)/100;
    const payable  = net > 0 ? net : 0;
    const carryOut = net < 0 ? -net : 0;
    carry = carryOut;
    return {key:k, out:v.out, in:v.in, carryIn, payable, carryOut};
  });
}
/* เครดิตที่ยกมา ณ ต้นงวดที่เลือก */
function vatCarryInto(fromKey){
  if(!fromKey) return 0;
  let carry = 0;
  vatChain().forEach(m=>{ if(m.key < fromKey) carry = m.carryOut; });
  return carry;
}

let homePick = null;         /* {y, m} เดือนที่เลือกเอง (m = 0-11) */

function monthSpan(y, m){
  return {from: iso(new Date(y, m, 1)), to: iso(new Date(y, m+1, 0)),
          label: `${TH_MONTHS[m]} ${y+543}`};
}
function homePeriod(){
  const d = new Date(), y = d.getFullYear();
  if(homeRange==='month') return monthSpan(y, d.getMonth());
  if(homeRange==='prev'){
    const p = new Date(y, d.getMonth()-1, 1);
    return monthSpan(p.getFullYear(), p.getMonth());
  }
  if(homeRange==='year')  return {from:`${y}-01-01`, to:`${y}-12-31`, label:`ปี ${y+543}`};
  if(homeRange==='pick' && homePick) return monthSpan(homePick.y, homePick.m);
  return {from:'', to:'', label:'ทั้งหมด'};
}

function renderHome(){
  if(!$('#view-home')) return;
  const P = homePeriod();
  const inP = x => (!P.from || x.date >= P.from) && (!P.to || x.date <= P.to);
  const rs = salesDocs().filter(inP);
  const pOnly = livePurchases().filter(inP);
  const eOnly = liveExpenses().filter(inP);
  const ps = pOnly.concat(eOnly);

  /* ---- ยอดขาย / ยอดซื้อ ---- */
  const sales   = rs.reduce((s,r)=>s+recTotals(r).payable, 0);
  const salesIn = rs.reduce((s,r)=>s+paidOf(r), 0);
  const buys    = pOnly.reduce((s,p)=>s+poTotals(p).payable, 0);
  const exps    = eOnly.reduce((s,e)=>s+exTotals(e).payable, 0);
  const spend   = buys + exps;
  const avgSale = rs.length ? sales/rs.length : 0;

  /* ---- ลูกหนี้ / เจ้าหนี้ (ดูทั้งระบบ ไม่จำกัดช่วงเวลา เพราะเป็นยอดคงค้างจริง) ---- */
  const arOpen = salesDocs().filter(r=>arDue(r) > 0.004);
  const apOpen = apAllDocs().filter(p=>apDue(p) > 0.004);
  const arSum  = arOpen.reduce((s,r)=>s+arDue(r), 0);
  const apSum  = apOpen.reduce((s,p)=>s+apDue(p), 0);
  const arLate = arOpen.filter(r=>{ const d = r.pay.credit? dueDate(r) : r.date; return daysBetween(today(), d) < 0; });
  const apLate = apOpen.filter(p=>daysBetween(today(), apDueDate(p)) < 0);
  const arLateSum = arLate.reduce((s,r)=>s+arDue(r), 0);
  const apLateSum = apLate.reduce((s,p)=>s+apDue(p), 0);

  /* รวมยอดค้างต่อคู่ค้า แล้วเรียงจากมากไปน้อย */
  const byParty = (list, keyFn, nameFn, dueFn) => {
    const m = {};
    list.forEach(x=>{ const k = keyFn(x) || nameFn(x);
      if(!m[k]) m[k] = {name:nameFn(x), amt:0, n:0};
      m[k].amt += dueFn(x); m[k].n++; });
    return Object.values(m).sort((a,b)=>b.amt-a.amt);
  };
  const arTop = byParty(arOpen, r=>r.custId, r=>r.name||'-', arDue).slice(0,5);
  const apTop = byParty(apOpen, p=>p.vendorId||p.payeeId, p=>apPartyOf(p), apDue).slice(0,5);

  /* ---- สินค้าที่ถึงจุดสั่งซื้อ ---- */
  const reorder = DB.products.filter(p=>flagsOf(p).includes('min'))
    .map(p=>Object.assign({}, p, {need: Math.max(1, num(p.max) - num(p.qty))}))
    .sort((a,b)=> (num(a.qty)-num(a.min)) - (num(b.qty)-num(b.min)));
  const reorderCost = reorder.reduce((s,p)=>s+p.need*num(p.cost), 0);

  /* ---- ภาษี ---- */
  const vatOut = rs.reduce((s,r)=>s+recTotals(r).vat, 0);       /* ภาษีขาย */
  const vatIn  = pOnly.reduce((s,p)=>s+poTotals(p).vat, 0)
               + eOnly.reduce((s,e)=>s+exTotals(e).vat, 0);      /* ภาษีซื้อ */
  const whtPay = eOnly.reduce((s,e)=>s+exTotals(e).wht, 0);      /* ภาษีที่อู่หักไว้และต้องนำส่ง */
  /* เครดิตภาษีซื้อที่ยกมาจากงวดก่อน */
  const carryKey  = homeRange==='month' ? (P.from||'').slice(0,7)
                  : homeRange==='year'  ? `${new Date().getFullYear()}-01` : '';
  const vatCarry  = vatCarryInto(carryKey);
  const vatResult = Math.round((vatOut - vatIn - vatCarry)*100)/100;
  const vatChainRows = vatChain().slice(-6);
  const vatNet = Math.round((vatOut - vatIn)*100)/100;   /* ผลต่างของงวดนี้ ยังไม่รวมเครดิตยกมา */
  const whtList = rs.filter(r=>recTotals(r).wht > 0.004);
  const whtSum  = whtList.reduce((s,r)=>s+recTotals(r).wht, 0);
  const whtByRate = {};
  whtList.forEach(r=>{ const k = num(r.whtRate);
    if(!whtByRate[k]) whtByRate[k] = {n:0, base:0, amt:0};
    whtByRate[k].n++; whtByRate[k].base += recTotals(r).net; whtByRate[k].amt += recTotals(r).wht; });

  /* ---- ยอดขาย 6 เดือนล่าสุด ---- */
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const amt = salesDocs().filter(r=>r.date.slice(0,7)===key).reduce((s,r)=>s+recTotals(r).payable, 0);

const PREFIXES = ["นาย","นาง","นางสาว","ด.ช.","ด.ญ.","ว่าที่ ร.ต.","ร.ต.","ร.ท.","ร.อ.","พ.ต.","พ.ท.","พ.อ.","ดร.","อื่น ๆ"];

const KIND_LABEL = {customer:'ลูกค้า', vendor:'ผู้ขาย', both:'ลูกค้าและผู้ขาย'};
const KIND_CHIP  = {customer:'ok', vendor:'warn', both:'dead'};
function isCust(c){ return c.kind !== 'vendor'; }
function isVend(c){ return c.kind === 'vendor' || c.kind === 'both'; }
function vendorList(){ return DB.customers.filter(isVend); }
function contactAddr(c){ return c.addrText || (addrLine(c.addr)==='-' ? '' : addrLine(c.addr)); }

function nextCustCode(kind){
  DB.seq = DB.seq || {q:0,r:0,c:0,p:0,v:0};
  if(kind === 'vendor'){ DB.seq.v = (DB.seq.v||0)+1; return 'VEN-'+String(DB.seq.v).padStart(4,'0'); }
  DB.seq.c = (DB.seq.c||0)+1;
  return 'CUS-'+String(DB.seq.c).padStart(4,'0');
}
function custName(c){
  if(!c) return '';
  return c.type==='company' ? (c.orgName||'') : [c.prefix,c.firstName,c.lastName].filter(Boolean).join(' ');
}
function blankVehicle(){ return {id:uid(), brand:'', model:'', year:'', color:'',
  plateA:'', plateB:'', plateProv:'', engineNo:'', chassisNo:'', mileage:'', lastService:''}; }

function blankCustomer(kind){
  return {id:uid(), code:'', kind:kind||'customer', type:'person', prefix:'นาย', firstName:'', lastName:'', orgName:'', taxId:'',
    addr:{no:'',village:'',moo:'',soi:'',road:'',subdistrict:'',district:'',province:'',zip:''},
    addrText:'', tel:'', tel2:'', email:'', note:'', creditDays:0, created:today(), vehicles:[blankVehicle()]};
}
function plateOf(v){ return [v.plateA,v.plateB].filter(Boolean).join(' ') || '-'; }
function vendHistory(c){
  const ps = livePurchases().filter(p=>p.vendorId===c.id);
  const spent = ps.reduce((s,p)=>s+poTotals(p).payable, 0);
  const owe = ps.reduce((s,p)=>s+Math.max(0, poTotals(p).payable - paidOf(p)), 0);
  const last = ps.map(p=>p.date).sort().slice(-1)[0] || '';
  return {purchases:ps, spent, owe, last};
}
function custHistory(c){
  const qs = live(DB.quotes).filter(q=>q.custId===c.id);
  const rs = salesDocs().filter(r=>r.custId===c.id ||
    DB.quotes.some(q=>q.id===r.quoteId && q.custId===c.id));
  const spent = rs.reduce((s,r)=>s+recTotals(r).payable,0);
  const owe = rs.reduce((s,r)=>s+Math.max(0, recTotals(r).payable - paidOf(r)), 0);
  const last = qs.map(q=>q.date).sort().slice(-1)[0] || '';
  return {quotes:qs, receipts:rs, spent, owe, last};
}

function customerModalRebind(c, body, renderVeh, readAll){
  const redraw = ()=>{ readAll(); $('#mBody').innerHTML = body(); renderVeh(); customerModalRebind(c, body, renderVeh, readAll); };
  $('#c_type').onchange = redraw;

    const k = $('#c_kind').value;
    if(k !== 'customer' && !c.orgName && !c.firstName && !c.lastName) c.type = 'company';
    redraw();
  };
}

/* นำข้อมูลลูกค้าจากทะเบียนมาใส่ในใบเสนอราคา */
function applyCustomer(c, v){
  const q = curQuote;
  q.custId = c.id; q.custType = c.type; q.taxId = c.taxId; q.name = custName(c);
  q.addr = JSON.parse(JSON.stringify(c.addr));
  q.tel = c.tel; q.tel2 = c.tel2; q.email = c.email;
  if(v){
    q.vehId = v.id;
    q.veh = {brand:v.brand, model:v.model, year:v.year, color:v.color,
             plateA:v.plateA, plateB:v.plateB, plateProv:v.plateProv,
             engineNo:v.engineNo||'', chassisNo:v.chassisNo||'', mileage:v.mileage};
  }
}
