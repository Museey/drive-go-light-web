/* บันทึกลูกค้าที่กรอกในใบเสนอราคาเข้าทะเบียน */
function saveQuoteCustomer(){
  if(!requireLicense()) return;
  if(blockEdit('customer','customer','ทะเบียนลูกค้า')) return;
  collectQuote();
  const q = curQuote;
  if(!q.name) return toast('กรอกชื่อลูกค้าก่อน');
  let c = q.custId ? DB.customers.find(x=>x.id===q.custId) : null;
  const isNew = !c;
  if(isNew){ c = blankCustomer('customer'); c.code = nextCustCode('customer'); c.vehicles = []; }
  c.type = q.custType; c.taxId = q.taxId; c.tel = q.tel; c.tel2 = q.tel2; c.email = q.email;
  c.addr = JSON.parse(JSON.stringify(q.addr));
  if(q.custType==='company'){ c.orgName = q.name; }
  else {
    const p = q.name.trim().split(/\s+/);
    const pre = PREFIXES.includes(p[0]) ? p.shift() : (c.prefix||'');
    c.prefix = pre; c.firstName = p.shift()||''; c.lastName = p.join(' ');
  }
  const V = q.veh;
  if(V.brand || V.model || V.plateB){
    let v = q.vehId ? (c.vehicles||[]).find(x=>x.id===q.vehId) : null;
    if(!v){ v = blankVehicle(); c.vehicles = c.vehicles||[]; c.vehicles.push(v); q.vehId = v.id; }
    Object.assign(v, {brand:V.brand, model:V.model, year:V.year, color:V.color,
      plateA:V.plateA, plateB:V.plateB, plateProv:V.plateProv,
      engineNo:V.engineNo||'', chassisNo:V.chassisNo||'',
      mileage:V.mileage, lastService:q.date});
  }
  stampEdit(c);
  if(isNew) DB.customers.push(c);
  custFilter.page = 1;
  q.custId = c.id;
  saveSome('customers'); renderQuote();
  toast(isNew? 'เพิ่มลูกค้า '+c.code+' เข้าทะเบียนแล้ว' : 'ปรับปรุงข้อมูลลูกค้า '+c.code+' แล้ว');
}

function nextPoNo(){
  const d=new Date(), ym=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
  DB.seq.p = (DB.seq.p||0)+1;
  return `PO-${ym}-${String(DB.seq.p).padStart(3,'0')}`;
}

function blankPurchase(){
  return {id:uid(), no:nextPoNo(), date:today(), invNo:'',
    vendorId:null, vendorName:'', vendorTaxId:'', vendorTel:'', vendorAddr:'',
    items:[], discount:0, vatMode:defaultVatMode(),
    terms:'credit', creditDays:30, note:'', received:false, payments:[],
    paidNow:false, payMethod:'เงินสด', payRef:'', payDate:''};
}
/* ยอดของใบซื้อ — ฝั่งซื้อไม่มีการหักภาษี ณ ที่จ่าย ยอดที่ต้องจ่ายจึงเท่ากับยอดรวมทั้งสิ้น */
function poTotals(p){
  const t = totalsOf(p);
  return Object.assign(t, {wht:0, payable: t.grand});
}
function poDue(p){ return p.terms==='credit' ? addDays(p.date, p.creditDays) : p.date; }

/* ช่องทางการชำระเงินที่ระบบรองรับ */
const PAY_METHODS = ['เงินสด', 'เงินโอน', 'บัตรเครดิต'];

/* จำนวนเงินที่ชำระไปแล้วจากเมนูบัญชี/การเงิน (ไม่นับที่บันทึกตอนออกเอกสาร) */
function laterPaidOf(doc){
  return Math.round((doc.payments||[]).filter(x=>!x.atIssue)
    .reduce((s,x)=>s+num(x.amount), 0) * 100) / 100;
}
/* ปรับรายการชำระให้ตรงกับสถานะ "ชำระเงินแล้ว" ของเอกสาร */
function syncDocPayment(doc, totalFn, label){
  const total = totalFn(doc);
  const later = laterPaidOf(doc);
  doc.payments = (doc.payments||[]).filter(x=>!x.atIssue);
  if(doc.paidNow){
    const amt = Math.round((total - later)*100)/100;
    if(amt > 0.004)
      doc.payments.unshift({id:uid(), date:doc.payDate||doc.date, amount:amt,
        method:doc.payMethod||'เงินสด', ref:doc.payRef||label, atIssue:true});
  }
  doc.terms = doc.paidNow ? 'cash' : 'credit';
  return doc;
}
const syncPoPayment = p => syncDocPayment(p, x=>poTotals(x).payable, 'ชำระเมื่อบันทึกใบซื้อ');
const syncExPayment = e => syncDocPayment(e, x=>exTotals(x).payable, 'ชำระเมื่อบันทึกรายการ');

}
function paidOf(doc){ return Math.round((doc.payments||[]).reduce((s,x)=>s+num(x.amount),0)*100)/100; }
function payState(total, paid){
  if(paid <= 0.004) return 'unpaid';
  return paid + 0.004 < total ? 'partial' : 'paid';
}
const STATE_LABEL = {unpaid:'ค้างชำระ', partial:'ตัดชำระบางส่วน', paid:'ชำระแล้ว'};
const STATE_CHIP  = {unpaid:'max', partial:'warn', paid:'ok'};
function stateChip(total, paid){
  const st = payState(total, paid);
  return `<span class="chip ${STATE_CHIP[st]}">${STATE_LABEL[st]}</span>`;
}

/* ---------- บันทึกซื้อสินค้า ---------- */
function renderPoRecord(){
  if(!$('#view-purchase')) return;
  const all = DB.purchases;
  const livePo = live(all);

function collectPo(){
  const p = curPo; if(!$('#po_vname')) return;
  p.vendorName=$('#po_vname').value.trim(); p.vendorTaxId=$('#po_vtax').value.trim();
  p.vendorTel=$('#po_vtel').value.trim(); p.vendorAddr=$('#po_vaddr').value.trim();
  p.date=$('#po_date').value||today(); p.invNo=$('#po_inv').value.trim();
  p.paidNow = $('#po_paid').checked;
  if($('#po_method'))  p.payMethod = $('#po_method').value;
  if($('#po_payDate')) p.payDate   = $('#po_payDate').value;
  if($('#po_ref'))     p.payRef    = $('#po_ref').value.trim();
  if($('#po_days'))    p.creditDays = num($('#po_days').value)||0;
  p.terms = p.paidNow ? 'cash' : 'credit';
  p.note=$('#po_note').value.trim();
  const d=$('#po_discount'), v=$('#po_vatMode');
  if(d) p.discount=num(d.value); if(v) p.vatMode=v.value;
}

function pickPoItemModal(){
  collectPo();
  const st = {kw:'', cat:'all'};

  const render = ()=>{
    const q = st.kw.toLowerCase();
    const list = SRC.filter(x=>{
      if(st.cat!=='all' && (x.cat||'') !== (st.cat==='__none__' ? '' : st.cat)) return false;
      return !q || [x.code,x.oem,x.name,x.barcode,x.cat].some(v=>String(v||'').toLowerCase().includes(q));
    });
    return `
      <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
        <div class="search" style="flex:1;min-width:220px"><input class="in" id="poQ" placeholder="รหัส / OEM / ชื่อสินค้า" value="${esc(st.kw)}"></div>
        <select class="in" id="poCat" style="width:200px;flex:none">
          <option value="all">ทุกหมวดสินค้า</option>
          ${(DB.categories||[]).map(c=>`<option value="${esc(c)}"${st.cat===c?' selected':''}>${esc(c)}</option>`).join('')}
          ${SRC.some(p=>!p.cat)?`<option value="__none__"${st.cat==='__none__'?' selected':''}>ไม่ระบุหมวด</option>`:''}
        </select>
      </div>
      <div class="tablewrap" style="max-height:calc(52vh/var(--z));border:1px solid var(--line);border-radius:6px">
        <table class="tbl"><thead><tr><th>รหัสสินค้า</th><th style="width:110px">OEM</th>
          <th style="width:150px">หมวดสินค้า</th><th>ชื่อสินค้า</th>
          <th class="num">คงเหลือ</th>${canCost()?'<th class="num">ต้นทุนล่าสุด</th>':''}<th></th></tr></thead><tbody>
        ${list.length? list.map(x=>`<tr>
          <td>${tagHTML(x)}</td><td class="mono" style="font-size:12px;color:var(--ink-3)">${esc(x.oem||'-')}</td>
          <td style="font-size:12.5px;color:${x.cat?'var(--ink-2)':'var(--ink-3)'}">${esc(x.cat||'—')}</td>
          <td>${esc(x.name)}</td><td class="num mono">${num(x.qty)}</td>${canCost()?`<td class="num mono">${money(x.cost)}</td>`:''}
          <td style="text-align:right"><button class="btn sm primary" data-poadd="${x.id}">เพิ่ม</button></td></tr>`).join('')
          : `<tr><td colspan="7" class="empty">ไม่พบสินค้าที่ค้นหา — เพิ่มได้ที่แท็บ “เพิ่มรายการสินค้า”</td></tr>`}
        </tbody></table></div>`;
  };
  const bind = ()=>{
    $('#poQ').oninput = e=>{ st.kw=e.target.value; $('#mBody').innerHTML = render();
      const el=$('#poQ'); el.focus(); el.setSelectionRange(st.kw.length, st.kw.length); bind(); };
    $('#poCat').onchange = e=>{ st.cat=e.target.value; $('#mBody').innerHTML = render(); bind(); };
    $$('[data-poadd]').forEach(b=>b.onclick=()=>{
      const x = DB.products.find(y=>y.id===b.dataset.poadd);

      renderPoItemTable(); toast(`เพิ่ม ${x.code} แล้ว`);

  $('#scrim .modal').classList.add('wide');

function savePoVendor(){
  if(!requireLicense()) return;
  if(blockEdit('customer','vendor','ทะเบียนผู้ขาย')) return;
  collectPo();
  const p = curPo;
  if(!p.vendorName) return toast('กรอกชื่อผู้ขายก่อน');
  let v = p.vendorId ? DB.customers.find(x=>x.id===p.vendorId) : null;
  const isNew = !v;
  if(isNew){ v = blankCustomer('vendor'); v.code = nextCustCode('vendor'); v.vehicles = []; }
  if(v.kind === 'customer') v.kind = 'both';
  v.type = 'company';
  v.orgName = p.vendorName;
  Object.assign(v, {taxId:p.vendorTaxId, tel:p.vendorTel, addrText:p.vendorAddr,
    creditDays: p.terms==='credit' ? p.creditDays : num(v.creditDays)});
  stampEdit(v);
  if(isNew) DB.customers.push(v);
  custFilter.page = 1;
  p.vendorId = v.id;
  saveSome('customers'); renderPoRecord();
  toast(isNew? 'เพิ่มผู้ขาย '+v.code+' เข้าทะเบียนแล้ว' : 'ปรับปรุงข้อมูลผู้ขาย '+v.code+' แล้ว');
}

function savePurchase(){
  if(!requireLicense()) return;
  if(blockEdit('expense','purchase','ใบซื้อ')) return;
  collectPo();
  const p = curPo;
  if(blockIfVoid('purchase', p.id)) return;
  if(!p.vendorName) return toast('กรอกชื่อผู้ขายก่อนบันทึก');
  if(!p.items.length) return toast('เพิ่มรายการสินค้าอย่างน้อยหนึ่งรายการ');
  if(p.items.some(it=>!String(it.name||'').trim())) return toast('กรอกชื่อรายการให้ครบทุกบรรทัด');

  /* ติ๊กชำระเงินแล้ว = ตัดเจ้าหนี้ให้ทันที · ไม่ติ๊ก = ตั้งเป็นเจ้าหนี้ค้างชำระ */
  const t = poTotals(p);
  syncPoPayment(p);
  /* ตรวจครบแล้วจึงแตะสต๊อก — คืนของยอดเดิมแล้วรับเข้าตามยอดใหม่ทุกครั้งที่บันทึก */
  const wantRecv = $('#po_recv') ? $('#po_recv').checked : !!p.received;
  const got = syncPoStock(p, wantRecv);
  const recv = got > 0;

  const i = DB.purchases.findIndex(x=>x.id===p.id);
  const copy = JSON.parse(JSON.stringify(p));
  if(i>=0) DB.purchases[i]=copy; else DB.purchases.push(copy);
  curPo = copy;
  saveSome('purchases', 'products', 'customers'); renderExpense(); renderStock();
  const owe = Math.max(0, poTotals(copy).payable - paidOf(copy));
  toast('บันทึกใบซื้อ '+copy.no+' แล้ว' + (recv?` และรับเข้าสต๊อก ${got} ชิ้นเรียบร้อย`:'')
    + (copy.paidNow && owe<=0.004 ? ` · ชำระด้วย${copy.payMethod||'เงินสด'}แล้ว ตัดเจ้าหนี้เรียบร้อย`
      : ` · ตั้งเป็นเจ้าหนี้ค้างจ่าย ${money(owe)}`));
}

function nextExNo(){
  const d=new Date(), ym=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
  DB.seq.e = (DB.seq.e||0)+1;
  return `EX-${ym}-${String(DB.seq.e).padStart(3,'0')}`;
}
function blankExpense(cat){
  return {id:uid(), no:nextExNo(), date:today(), cat:cat||'rent', invNo:'',
    payeeId:null, payeeName:'', payeeTaxId:'', payeeTel:'', payeeAddr:'',
    items:[{name:'', qty:1, price:0}], discount:0, vatMode:'none',
    whtRate:catWht(cat||'rent'), terms:'cash', creditDays:30, note:'',
    assetLife:5, payments:[], paidNow:true, payMethod:'เงินสด', payRef:'', payDate:''};
}
/* ค่าใช้จ่ายมีการหักภาษี ณ ที่จ่าย เพราะอู่เป็นผู้จ่ายเงินและมีหน้าที่หักนำส่ง */
function exTotals(e){
  const t = totalsOf(e);
  const wht = Math.round(t.net * num(e.whtRate)) / 100;
  return Object.assign(t, {wht, payable: Math.round((t.grand - wht)*100)/100});
}
function exDue(e){ return e.terms==='credit' ? addDays(e.date, e.creditDays) : e.date; }
function exOutstanding(e){ return Math.round((exTotals(e).payable - paidOf(e))*100)/100; }

function saveExpense(){
  if(!requireLicense()) return;
  if(blockEdit('expense','expense','ค่าใช้จ่าย')) return;
  collectEx();
  const e = curEx;
  if(blockIfVoid('expense', e.id)) return;
  if(!e.payeeName) return toast('กรอกชื่อผู้รับเงินก่อนบันทึก');
  if(!e.items.some(it=>String(it.name||'').trim() && num(it.price)>0))
    return toast('กรอกรายละเอียดและจำนวนเงินอย่างน้อยหนึ่งบรรทัด');
  e.items = e.items.filter(it=>String(it.name||'').trim() || num(it.price)>0);

  const t = exTotals(e);
  syncExPayment(e);

  const i = DB.expenses.findIndex(x=>x.id===e.id);
  const copy = JSON.parse(JSON.stringify(e));
  if(i>=0) DB.expenses[i]=copy; else DB.expenses.push(copy);
  curEx = copy;
  saveSome('expenses', 'customers'); renderExpense();
  const owe = Math.max(0, exTotals(copy).payable - paidOf(copy));
  toast('บันทึก '+copy.no+' แล้ว'
    + (copy.paidNow && owe<=0.004 ? ` · จ่ายด้วย${copy.payMethod||'เงินสด'}แล้ว` : ` · ตั้งเป็นเจ้าหนี้ค้างจ่าย ${money(owe)}`)
    + (t.wht>0.004 ? ` · หักภาษี ณ ที่จ่ายไว้ ${money(t.wht)}` : ''));
}

const FINDING_LINES = 3;
const QUOTE_ROWS = 8;      /* จำนวนบรรทัดในตารางรายการของใบเสนอราคาที่พิมพ์ */
/* เอกสารรุ่นก่อนเก็บช่องตรวจพบไว้ 10 ช่อง — ย่อให้เหลือ 3 บรรทัดโดยไม่ทิ้งข้อความเดิม */
function normFindings(arr){
  const filled = (arr||[]).map(x=>String(x||'').trim()).filter(Boolean);
  const out = filled.slice(0, FINDING_LINES);
  if(filled.length > FINDING_LINES)
    out[FINDING_LINES-1] = filled.slice(FINDING_LINES-1).join(' · ');
  while(out.length < FINDING_LINES) out.push('');
  return out;
}

function collectQuote(){
  const q=curQuote; if(!$('#q_name')) return;
  q.custType=$('#q_custType').value; q.taxId=$('#q_taxId').value.trim(); q.name=$('#q_name').value.trim();
  ['no','village','moo','soi','road','subdistrict','district','province','zip'].forEach(k=>q.addr[k]=$('#a_'+k).value.trim());
  q.tel=$('#q_tel').value.trim(); q.tel2=$('#q_tel2').value.trim(); q.email=$('#q_email').value.trim();
  ['brand','model','year','color','plateA','plateB','plateProv','engineNo','chassisNo','mileage']
    .forEach(k=>{ const el=$('#v_'+k); if(el) q.veh[k]=el.value.trim(); });
  q.complaints=q.complaints.map((_,i)=>$('#c_'+i).value.trim());
  q.findings=q.findings.map((_,i)=>$('#d_'+i).value.trim());
  q.proposer=$('#q_proposer').value.trim(); q.approver=$('#q_approver').value.trim(); q.date=$('#q_date').value||today();
  const d=$('#q_discount'), v=$('#q_vatMode');
  if(d) q.discount=num(d.value); if(v) q.vatMode=v.value;
}
function repriceItems(){
  const key = {A:'pA',B:'pB',C:'pC'}[curQuote.tier];
  curQuote.items.forEach(it=>{ if(it.pid){ const p=DB.products.find(x=>x.id===it.pid); if(p) it.price=num(p[key]); } });
}
function totalsOf(q){
  const sub = q.items.reduce((s,it)=>s+num(it.qty)*num(it.price),0);
  const disc = num(q.discount);
  const base = Math.max(0, sub - disc);
  const rate = num(DB.shop.vatRate)/100;
  let net=base, vat=0, grand=base;
  if(q.vatMode==='ex'){ vat = base*rate; grand = base+vat; }
  else if(q.vatMode==='in'){ net = base/(1+rate); vat = base-net; grand = base; }
  return {sub, disc, base, net:Math.round(net*100)/100, vat:Math.round(vat*100)/100, grand:Math.round(grand*100)/100};
}

function saveQuote(){
  if(!requireLicense()) return;
  if(blockEdit('income','quote','ใบเสนอราคา')) return;
  if(blockIfVoid('quote', curQuote.id)) return;
  collectQuote();
  if(!curQuote.name) return toast('กรอกชื่อลูกค้าก่อนบันทึก');
  if(curQuote.custId && curQuote.vehId){
    const c = DB.customers.find(x=>x.id===curQuote.custId);
    const v = c && (c.vehicles||[]).find(x=>x.id===curQuote.vehId);
    if(v && curQuote.veh.mileage){ v.mileage = curQuote.veh.mileage; v.lastService = curQuote.date; }

/* บรรทัดใดเป็นค่าแรง/ค่าบริการ — ใช้เป็นฐานคำนวณภาษีหัก ณ ที่จ่าย */
function isServiceItem(it){
  if(it.svc !== undefined) return !!it.svc;
  return it.code === 'LAB';          /* เอกสารรุ่นก่อนใช้รหัส LAB แทนค่าแรง */
}
/* ฐานภาษีหัก ณ ที่จ่าย = มูลค่าค่าแรงก่อนภาษีมูลค่าเพิ่ม หลังเฉลี่ยส่วนลดแล้ว */
function whtBaseOf(r){
  const sub = r.items.reduce((s,it)=>s+num(it.qty)*num(it.price), 0);
  const svc = r.items.filter(isServiceItem).reduce((s,it)=>s+num(it.qty)*num(it.price), 0);
  if(svc <= 0 || sub <= 0) return 0;
  const share = svc / sub;                       /* เฉลี่ยส่วนลดตามสัดส่วน */
  let base = Math.max(0, svc - num(r.discount) * share);
  if(r.vatMode === 'in') base = base / (1 + num(DB.shop.vatRate)/100);
  return Math.round(base*100)/100;
}
function recTotals(r){
  const t = totalsOf(r);
  const whtBase = whtBaseOf(r);
  const wht = Math.round(whtBase * num(r.whtRate)) / 100;
  return Object.assign(t, {whtBase, wht, payable: Math.round((t.grand - wht)*100)/100});
}
function dueDate(r){
  if(isInvoice(r)) return addDays(r.date, num(r.creditDays)||0);
  return r.pay.credit ? addDays(r.date, r.pay.days) : '';
}

/* ---------- การแบ่งชำระ ณ วันที่ออกใบเสร็จ ----------
   pay.cashAmt / pay.transferAmt = จำนวนที่รับจริงหน้าร้าน
   ส่วนที่เหลือจากยอดสุทธิ ถือเป็นเครดิต (ลูกหนี้) โดยอัตโนมัติ */
function payAtIssue(r){
  const p = r.pay || {};
  const total = recTotals(r).payable;
  /* เอกสารรุ่นก่อนเก็บแค่การติ๊ก ไม่มีจำนวนเงิน — ตีความให้เหมือนเดิม */
  if(p.cashAmt === undefined && p.transferAmt === undefined){
    if(p.credit) return {cash:0, transfer:0, card:0, paid:0, remain:total};
    const cash = p.cash ? total : 0;
    const tr   = (!p.cash && p.transfer) ? total : 0;
    return {cash, transfer:tr, card:0, paid:cash+tr, remain:0};
  }
  let cash = Math.max(0, num(p.cashAmt));
  let tr   = Math.max(0, num(p.transferAmt));
  let card = Math.max(0, num(p.cardAmt));
  /* กันกรอกเกินยอด — ตัดตามลำดับ เงินสด · เงินโอน · บัตรเครดิต */
  if(cash > total) cash = total;
  if(cash + tr > total) tr = Math.max(0, total - cash);
  if(cash + tr + card > total) card = Math.max(0, total - cash - tr);
  const paid = Math.round((cash + tr + card)*100)/100;
  return {cash, transfer:tr, card, paid, remain: Math.round((total - paid)*100)/100};
}
function syncIssuePayments(r){
  const a = payAtIssue(r);
  r.payments = (r.payments || []).filter(x=>!x.atIssue);   /* เขียนทับเฉพาะรายการ ณ วันออกใบ */
  if(a.cash > 0.004)
    r.payments.unshift({id:uid(), date:r.date, amount:a.cash, method:'เงินสด', ref:'รับชำระเมื่อออกใบเสร็จ', atIssue:true});
  if(a.transfer > 0.004)
    r.payments.unshift({id:uid(), date:r.date, amount:a.transfer, method:'เงินโอน',
      ref:(r.pay.ref||'รับชำระเมื่อออกใบเสร็จ'), atIssue:true});
  if(a.card > 0.004)
    r.payments.unshift({id:uid(), date:r.date, amount:a.card, method:'บัตรเครดิต',
      ref:(r.pay.cardRef||'รับชำระเมื่อออกใบเสร็จ'), atIssue:true});
  r.pay.credit = a.remain > 0.004;
  r.pay.cash = a.cash > 0.004;
  r.pay.transfer = a.transfer > 0.004;
  r.pay.card = a.card > 0.004;
  r.pay.due = dueDate(r);
  return a;
}

          ${pageNumbers(st.page, totalPages).map(pg=>pg==='…'

      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap">
        ${totalPages>1 ? `
          <button class="btn sm ghost" data-mpg="prev"${st.page<=1?' disabled':''}>‹ ก่อนหน้า</button>
          ${pageNumbers(st.page, totalPages).map(pg=>pg==='…'
            ? `<span class="hint" style="padding:0 4px">…</span>`
            : `<button class="btn sm ${pg===st.page?'primary':'ghost'}" data-mpg="${pg}">${pg}</button>`).join('')}

function payLabel(r){
  const A = payAtIssue(r), a = [];
  if(A.cash > 0.004)     a.push(`เงินสด ${money(A.cash)}`);
  if(A.transfer > 0.004) a.push(`เงินโอน ${money(A.transfer)}`);
  if(A.card > 0.004)     a.push(`บัตรเครดิต ${money(A.card)}`);
  if(A.remain > 0.004)   a.push(`เครดิต ${money(A.remain)} · ครบ ${thDate(addDays(r.date, r.pay.days))}`);
  return a.join(' · ') || '-';
}

  host.innerHTML = `
    <div class="paperbar">
      <b>${esc(opt.title)}</b> เลขที่ <b class="mono">${esc(doc.no)}</b>
      <span>· นี่คือหน้าตาเอกสารจริงที่จะพิมพ์ออกมา</span>

      ${isVoid(doc) ? `<span class="voidmark">ยกเลิกแล้ว</span>

      : opt.noEdit ? `<span style="font-size:12px;color:var(--ink-3)">เอกสารนี้แก้ไขไม่ได้ — ถ้าผิดให้ยกเลิกแล้วออกใบใหม่</span>`
      : `<span style="font-size:12px;color:var(--ink-3)">ต้องการแก้ไขข้อมูล กดปุ่ม “แก้ไขเอกสาร”</span>`}
    </div>

      <button class="btn danger" id="pvClose">ปิดเอกสาร</button>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;text-align:center">
        บันทึกแล้ว<br>${thDateLong(doc.date)}</div>`);
  if($('#pvHist')) $('#pvHist').onclick = ()=>editHistoryModal(doc);
  if($('#pvEdit')) $('#pvEdit').onclick = ()=>{ docView='form'; opt.rerender(); };
  $('#pvPrint').onclick = opt.print;
  $('#pvClose').onclick = ()=>{ docView='form'; opt.close(); };
  if($('#pvNew')) $('#pvNew').onclick = ()=>{ docView='form'; opt.newDoc(); };
  if(opt.bindExtra) opt.bindExtra();
}

      ${miss.length ? `<div style="background:#FCF3E2;border:1px solid #EEDBB4;border-radius:6px;
        padding:9px 13px;margin:0 0 10px;font-size:12.5px;color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>ข้อมูลไม่ครบ</b><span style="color:var(--ink-2)">${esc(miss.join(' · '))}</span>
        ${!r.custId ? '<button class="btn sm" id="rcLink" style="margin-left:auto">ผูกกับทะเบียนลูกค้า</button>' : ''}
      </div>` : ''}

      <div class="fs-box">
        <h4>${K.party}</h4>
        <div class="fs-row"><b>ชื่อ:</b><input class="fs-in" id="rc_name" value="${esc(r.name)}">
          <b>ประเภท:</b>
          <select class="fs-in md" id="rc_ctype">
            <option value="person"${r.custType==='person'?' selected':''}>บุคคลธรรมดา</option>
            <option value="company"${r.custType==='company'?' selected':''}>นิติบุคคล</option>
          </select></div>
        <div class="fs-row"><b>ที่อยู่:</b><input class="fs-in" id="rc_addr" value="${esc(addrLine(r.addr)==='-'?'':addrLine(r.addr))}"></div>
        <div class="fs-row"><b>เลขประจำตัวผู้เสียภาษี:</b><input class="fs-in md mono" id="rc_taxId" value="${esc(r.taxId)}" maxlength="17">
          <b>โทร:</b><input class="fs-in sm mono" id="rc_tel" value="${esc(r.tel||'')}">
          <b>อีเมล:</b><input class="fs-in md" id="rc_email" value="${esc(r.email||'')}"></div>
        <div class="fs-row"><b>รถยนต์:</b><input class="fs-in lg" id="rc_veh"
            value="${esc([V.brand,V.model,V.color].filter(Boolean).join(' '))}" placeholder="ยี่ห้อ รุ่น สี">
          <b>ทะเบียน:</b><input class="fs-in sm mono" id="rc_plate"
            value="${esc([V.plateA,V.plateB].filter(Boolean).join(' '))}">
          <b>เลขไมล์:</b><input class="fs-in xs mono num" id="rc_mile" value="${esc(V.mileage||'')}"></div>
        <div class="fs-row"><b>เลขเครื่องยนต์:</b><input class="fs-in md mono" id="rc_engine" value="${esc(V.engineNo||'')}">
          <b>เลขตัวถัง:</b><input class="fs-in lg mono" id="rc_chassis" value="${esc(V.chassisNo||'')}"></div>
      </div>

      <div class="fs-wrap"><table class="fs-t">
        <thead><tr><th style="width:34px">ลำดับ</th><th style="width:104px">รหัสสินค้า</th><th>รายการ</th>
          <th style="width:58px" title="ติ๊กถ้าบรรทัดนี้เป็นค่าบริการหรือค่าแรง ใช้เป็นฐานคำนวณภาษีหัก ณ ที่จ่าย">ค่าบริการ</th>
          <th style="width:62px">จำนวน</th><th style="width:88px">ราคา/หน่วย</th>
          <th style="width:98px">จำนวนเงิน</th><th style="width:32px"></th></tr></thead>
        <tbody>
          ${r.items.map((it,i)=>`<tr>
            <td style="text-align:center">${i+1}</td>
            <td class="mono" style="font-size:12px">${pendMark(it)}${esc(it.code||'-')}</td>
            <td><input data-ri="${i}" data-k="name" value="${esc(it.name)}" placeholder="ชื่อรายการ"></td>
            <td style="text-align:center"><input type="checkbox" data-svc="${i}" ${isServiceItem(it)?'checked':''}
              title="ค่าบริการ / ค่าแรง — ใช้คิดภาษีหัก ณ ที่จ่าย"></td>
            <td><input class="num" data-ri="${i}" data-k="qty" value="${it.qty}"></td>
            <td><input class="num" data-ri="${i}" data-k="price" value="${it.price}"></td>
            <td class="calc">${money(num(it.qty)*num(it.price))}</td>
            <td style="text-align:center"><button class="btn sm ghost" data-rrm="${i}" style="padding:1px 5px">✕</button></td></tr>`).join('')}
          ${Array.from({length:blanks}).map(()=>`<tr class="blank"><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}
        </tbody>
      </table></div>

      <div class="fs-foot">
        <div class="fs-pay">
          <h4 style="margin:0 0 7px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
            border-bottom:1px solid var(--line);padding-bottom:4px;color:var(--ink-2)">${isInvoice(r)?'เงื่อนไขการชำระเงิน':'วิธีการชำระเงิน'}</h4>
          ${isInvoice(r) ? `
            <div style="font-size:12.5px;line-height:1.9">
              เครดิต <b>${num(r.creditDays)}</b> วัน · ครบกำหนดชำระ <b>${thDateLong(addDays(r.date, num(r.creditDays)))}</b><br>
              <span style="color:var(--ink-3)">เอกสารนี้ตั้งเป็นลูกหนี้ให้อัตโนมัติ เมื่อรับเงินแล้วให้ออกใบเสร็จรับเงินอ้างอิงเลขที่นี้</span>
            </div>
            <div style="margin-top:8px;border-top:1px dotted var(--line);padding-top:6px;font-size:12px">
              จำนวนเงิน (ตัวอักษร) <b>${bahttext(t.payable)}</b></div>
          </div><div class="fs-hidden-pay" style="display:none">` : ''}

          <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
            <label style="margin:0"><input type="checkbox" id="p_cash" ${A.cash>0.004?'checked':''}> เงินสด
              <input class="fs-in mono num" id="p_cashAmt" value="${A.cash? A.cash : ''}" placeholder="0.00" style="width:86px"> บาท</label>
            <label style="margin:0"><input type="checkbox" id="p_transfer" ${A.transfer>0.004?'checked':''}> เงินโอน
              <input class="fs-in mono num" id="p_transferAmt" value="${A.transfer? A.transfer : ''}" placeholder="0.00" style="width:86px"> บาท</label>
            <input class="fs-in" id="p_ref" value="${esc(r.pay.ref)}" placeholder="ธนาคาร / เลขที่อ้างอิงการโอน" style="flex:1;min-width:140px">
          </div>

          <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:2px">
            <label style="margin:0"><input type="checkbox" id="p_card" ${A.card>0.004?'checked':''}> บัตรเครดิต
              <input class="fs-in mono num" id="p_cardAmt" value="${A.card? A.card : ''}" placeholder="0.00" style="width:86px"> บาท</label>
            <input class="fs-in" id="p_cardRef" value="${esc(r.pay.cardRef||'')}" placeholder="ธนาคาร / 4 ตัวท้ายบัตร / เลขอนุมัติ" style="flex:1;min-width:140px">
          </div>

          <label style="align-items:flex-start"><input type="checkbox" id="p_credit" ${A.remain>0.004?'checked':''} disabled>
            <span>เครดิต <input class="fs-in sm mono num" id="p_days" value="${r.pay.days}" style="width:46px"> วัน
              &nbsp;ครบกำหนด <b>${A.remain>0.004 ? thDate(addDays(r.date, r.pay.days)) : '................'}</b></span></label>

          <div style="margin-top:7px;padding:8px 10px;border-radius:6px;
            background:${A.remain>0.004 ? '#FCF3E2' : '#E7F4EF'};
            border:1px solid ${A.remain>0.004 ? '#EEDBB4' : '#BFE3D6'};font-size:12.5px;line-height:1.7">
            <div style="display:flex;justify-content:space-between"><span>ยอดสุทธิที่ต้องชำระ</span>
              <b class="mono">${money(t.payable)}</b></div>
            <div style="display:flex;justify-content:space-between"><span>รับชำระวันนี้</span>
              <b class="mono" style="color:var(--ok)">${money(A.paid)}</b></div>
            ${[['เงินสด',A.cash],['เงินโอน',A.transfer],['บัตรเครดิต',A.card]]
              .filter(([,v])=>v>0.004).length > 1
              ? [['เงินสด',A.cash],['เงินโอน',A.transfer],['บัตรเครดิต',A.card]].filter(([,v])=>v>0.004).map(([n,v])=>
                `<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)">
                   <span style="padding-left:10px">· ${n}</span><span class="mono">${money(v)}</span></div>`).join('')
              : ''}
            <div style="display:flex;justify-content:space-between;border-top:1px dotted #B9A87A;margin-top:4px;padding-top:4px">
              <b>${A.remain>0.004 ? 'คงเหลือเป็นเครดิต (ตั้งเป็นลูกหนี้)' : 'รับชำระครบถ้วน'}</b>
              <b class="mono" style="color:${A.remain>0.004?'var(--danger)':'var(--ok)'}">${money(A.remain)}</b></div>
          </div>

          <div style="margin-top:8px;border-top:1px dotted var(--line);padding-top:6px;font-size:12px">
            จำนวนเงิน (ตัวอักษร) <b>${bahttext(t.payable)}</b></div>
        </div>
        <table class="fs-sum">
          ${K.vat==='free' ? `
          <tr><td>ประเภทใบเสร็จ
            <select id="rc_taxkind">
              <option value="full"${recTaxKind(r)==='full'?' selected':''}>มี VAT + หัก ณ ที่จ่าย</option>
              <option value="wht"${recTaxKind(r)==='wht'?' selected':''}>ไม่มี VAT มีหัก ณ ที่จ่าย</option>
              <option value="non"${recTaxKind(r)==='non'?' selected':''}>NON-TAX ไม่มีภาษีเลย</option>
            </select></td><td>—</td></tr>` : ''}
          <tr><td>รวมเป็นเงิน</td><td>${money(t.sub)}</td></tr>
          <tr><td>ส่วนลด</td><td><input id="rc_disc" value="${r.discount}"></td></tr>
          ${r.vatMode==='none' ? '' : `
          <tr><td>ภาษีมูลค่าเพิ่ม
            ${K.vat==='free' ? `<select id="rc_vat">
              <option value="none"${r.vatMode==='none'?' selected':''}>ไม่คิด</option>
              <option value="ex"${r.vatMode==='ex'?' selected':''}>แยกนอก</option>
              <option value="in"${r.vatMode==='in'?' selected':''}>รวมแล้ว</option>
            </select>` : `<span style="font-size:11.5px;color:var(--ink-3)">${DB.shop.vatRate}% แยกนอก</span>`}
            </td><td>${money(t.vat)}</td></tr>
          <tr><td>มูลค่าก่อนภาษี</td><td>${money(t.net)}</td></tr>`}
          ${r.vatMode==='none' && K.vat==='free' ? `
          <tr><td>ภาษีมูลค่าเพิ่ม
            <select id="rc_vat">
              <option value="none" selected>ไม่คิด</option>
              <option value="ex">แยกนอก</option>
              <option value="in">รวมแล้ว</option>
            </select></td><td>—</td></tr>` : ''}
          <tr><td><b>รวมทั้งสิ้น</b></td><td><b>${money(t.grand)}</b></td></tr>
          <tr class="wht" ${K.vat==='free' && recTaxKind(r)==='non' ? 'style="display:none"' : ''}><td>หักภาษี ณ ที่จ่าย
            <select id="rc_wht">${[0,1,1.5,2,3,5].map(v=>`<option value="${v}"${num(r.whtRate)===v?' selected':''}>${v}%</option>`).join('')}</select>
            <div style="font-size:10.5px;color:var(--ink-3);line-height:1.4;margin-top:1px">
              ${num(r.whtRate)>0
                ? (t.whtBase>0 ? `คิดจากค่าบริการ ${money(t.whtBase)}` : 'ยังไม่มีบรรทัดที่ติ๊กว่าค่าบริการ')
                : 'คิดจากค่าบริการเท่านั้น'}</div>
            </td><td>−${money(t.wht)}</td></tr>
          <tr class="total"><td>${K.totalLabel}</td><td>${money(t.payable)}</td></tr>
        </table>
      </div>

      <div class="fs-box" style="margin-top:10px">
        <h4>เงื่อนไขการรับประกัน</h4>
        <textarea class="fs-in" id="rc_warranty" rows="3"
          placeholder="กรอกเงื่อนไขการรับประกันของงานนี้ เช่น รับประกันงานซ่อม 3 เดือน หรือ 5,000 กม. แล้วแต่อย่างใดถึงก่อน · ไม่รวมความเสียหายจากการใช้งานผิดวิธี"
          style="width:100%;resize:vertical;min-height:52px;line-height:1.7">${esc(r.warranty||'')}</textarea>
      </div>

      <div class="fs-sign">
        <div><div class="ln"></div>
          <input class="fs-in" id="rc_by" value="${esc(r.receivedBy)}" placeholder="ชื่อ${K.signer}" style="text-align:center">
          <div style="margin-top:3px">${K.signer}</div></div>
        <div><div class="ln"></div>
          <div style="font-size:12px;color:var(--ink-3);padding:3px 0">( ${esc(r.name||'.'.repeat(22))} )</div>
          <div>${K.payer}</div></div>
      </div>

      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
        border-top:1px solid var(--line);padding-top:12px">
        <label style="display:flex;gap:8px;align-items:center;font-size:12.5px">
          <input type="checkbox" id="rc_deduct" ${r.invId?'checked disabled':(r.deducted?'checked':(inDb?'':'checked'))}>
          ${r.invId ? 'ตัดสต๊อกไปแล้วตอนออกใบส่งมอบ '+esc(r.invNo||'') : 'ตัดสต๊อกอัตโนมัติเมื่อบันทึก'}</label>
        <span style="font-size:12px;color:var(--ink-3)">
          ${isInvoice(r) ? 'เอกสารนี้ตั้งเป็นลูกหนี้ทั้งจำนวน เมื่อรับเงินให้ออกใบเสร็จรับเงินอ้างอิงเลขที่นี้'
            : r.pay.credit ? 'ติ๊กเครดิตไว้ ระบบจะตั้งเป็นลูกหนี้ให้ ตัดชำระได้ที่เมนูบัญชี/การเงิน'
                           : 'ไม่ได้ติ๊กเครดิต ระบบจะถือว่ารับเงินครบแล้วเมื่อบันทึก'}</span>
      </div>

      <div class="fs-bottom">
        <span class="note-left">${inDb
          ? 'เอกสารนี้บันทึกแล้ว — แก้ไขได้และกดบันทึกซ้ำ'
          : 'กรอกข้อมูลครบแล้วกดบันทึกได้เลย'}</span>
        <button class="btn primary" id="rcSaveB">บันทึก${esc(K.title.split(' / ')[0])}</button>
        <button class="btn" id="rcPrintB">พิมพ์${esc(K.title.split(' / ')[0])}</button>
        <button class="btn danger" id="rcCloseB">ปิดเอกสาร</button>
      </div>
    </div>`;

  /* ปุ่มทำงานทั้งหมดอยู่แถบซ้ายมือ เรียงตามลำดับการใช้งานจริง */
  /* ปุ่มท้ายฟอร์มทำงานเหมือนปุ่มแถบบน */
  [['rcSaveB','rcSave'],['rcPrintB','rcPrint'],['rcCloseB','rcClose']].forEach(([b,t])=>{
    if($('#'+b)) $('#'+b).onclick = ()=>{ const el = $('#'+t); if(el) el.click(); };
  });
  /* ใบส่งมอบไม่ใช้กล่องรับชำระของใบเสร็จ — ถอดออกจาก DOM ไม่ให้ id ซ้ำ */
  if(isInvoice(r)){
    const host = $('#'+salesHost);
    if(host) host.querySelectorAll('.fs-hidden-pay').forEach(el=>el.remove());
  }

  mountActions(salesSide, salesHost, `
      <button class="btn primary" id="rcAddPart">+ ดึงอะไหล่จากสต๊อก</button>
      <button class="btn primary" id="rcSave" style="margin-top:6px">บันทึก${K.short.replace(' (ไม่มี VAT)','').replace(' + ใบกำกับภาษี','')}</button>
      <button class="btn" id="rcPrint">พิมพ์${K.title.split(' / ')[0]}</button>
      <button class="btn danger" id="rcClose">ปิดเอกสาร</button>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;text-align:center">
        ${inDb ? 'เอกสารนี้บันทึกแล้ว<br>แก้ไขได้และกดบันทึกซ้ำ' : 'ยังไม่ได้บันทึก'}
      </div>`);

  const sync = ()=>{
    r.date = $('#rc_date').value || today();
    r.quoteNo = $('#rc_ref').value.trim();
    r.name = $('#rc_name').value.trim();
    r.custType = $('#rc_ctype').value;
    r.addrText = $('#rc_addr').value.trim();
    r.taxId = $('#rc_taxId').value.trim();
    r.tel = $('#rc_tel').value.trim();
    r.email = $('#rc_email').value.trim();
    r.veh = r.veh || {};
    r.veh.freeText = $('#rc_veh').value.trim();
    const pl = $('#rc_plate').value.trim().split(/\s+/);
    r.veh.plateA = pl[0]||''; r.veh.plateB = pl.slice(1).join(' ');
    r.veh.mileage = $('#rc_mile').value.trim();
    if($('#rc_engine'))  r.veh.engineNo  = $('#rc_engine').value.trim();
    if($('#rc_chassis')) r.veh.chassisNo = $('#rc_chassis').value.trim();
    /* ใบส่งมอบไม่มีกล่องรับชำระ — ข้ามการเก็บค่าส่วนนี้ */
    if($('#p_cash')){
      r.pay.cashAmt     = $('#p_cash').checked     ? num($('#p_cashAmt').value)     : 0;
      r.pay.transferAmt = $('#p_transfer').checked ? num($('#p_transferAmt').value) : 0;
      r.pay.cardAmt     = $('#p_card') && $('#p_card').checked ? num($('#p_cardAmt').value) : 0;
      r.pay.days = num($('#p_days').value);
      r.pay.ref  = $('#p_ref').value.trim();
      if($('#p_cardRef')) r.pay.cardRef = $('#p_cardRef').value.trim();
    }
    const a = payAtIssue(r);
    r.pay.cash = a.cash > 0.004; r.pay.transfer = a.transfer > 0.004;
    r.pay.credit = a.remain > 0.004; r.pay.due = dueDate(r);
    if($('#rc_disc')) r.discount = num($('#rc_disc').value);
    /* ผู้ใช้เพิ่งเปลี่ยนประเภทใบเสร็จ — ตั้งค่าตามประเภท และห้ามค่าเดิมบนจอมาทับ */
    let tkJust = false;
    if($('#rc_taxkind')){
      const tk = $('#rc_taxkind').value;
      if(tk !== recTaxKind(r)){
        tkJust = true;
        r.taxKind = tk;
        if(tk === 'full'){ if(r.vatMode === 'none') r.vatMode = 'ex'; }
        else { r.vatMode = 'none'; if(tk === 'non') r.whtRate = 0; }
      } else r.taxKind = tk;
    }
    if(!tkJust && $('#rc_vat')) r.vatMode = $('#rc_vat').value;
    /* ผู้ใช้แก้ VAT เองในตาราง = ประเภทเปลี่ยนตามให้สอดคล้อง */
    if(!tkJust && r.taxKind){
      if(r.taxKind === 'full' && r.vatMode === 'none') r.taxKind = num(r.whtRate)>0 ? 'wht' : 'non';
      if((r.taxKind === 'wht' || r.taxKind === 'non') && r.vatMode !== 'none') r.taxKind = 'full';
    }
    enforceVat(r);
    if(!tkJust && $('#rc_wht')) r.whtRate = num($('#rc_wht').value);
    if($('#rc_by'))   r.receivedBy = $('#rc_by').value.trim();
    if($('#rc_warranty')) r.warranty = $('#rc_warranty').value;
    if($('#rc_credit'))   r.creditDays = num($('#rc_credit').value);
  };

  $$('[data-ri]').forEach(el=>{
    el.oninput = ()=>{ const it = r.items[+el.dataset.ri];
      it[el.dataset.k] = el.dataset.k==='name' ? el.value : num(el.value); };
    el.onchange = ()=>{ sync(); renderRecForm(); };
  });
  $$('[data-svc]').forEach(cb=>cb.onchange=()=>{
    sync(); r.items[+cb.dataset.svc].svc = cb.checked; renderRecForm();
  });
  $$('[data-rrm]').forEach(b=>b.onclick=()=>{ sync(); r.items.splice(+b.dataset.rrm,1); renderRecForm(); });
  ['rc_date','rc_ref','rc_name','rc_ctype','rc_addr','rc_taxId','rc_tel','rc_email','rc_veh','rc_plate','rc_mile',
   'rc_engine','rc_chassis','p_cardRef','p_days','p_ref','rc_disc','rc_vat','rc_wht','rc_by','rc_taxkind',
   'rc_warranty','rc_credit'].forEach(id=>{
    const el = $('#'+id); if(el) el.addEventListener('change', ()=>{ sync(); renderRecForm(); });
  });

  /* ติ๊กช่องทาง = เติมยอดคงเหลือให้ทันที · เอาติ๊กออก = ล้างยอดของช่องทางนั้น */
  /* ---------- รับชำระหลายช่องทางในใบเดียว ----------
     ช่องที่ผู้ใช้พิมพ์ล่าสุดถือเป็นหลัก ระบบลดยอดช่องทางอื่นให้พอดียอดสุทธิ */
  const PAY_FIELDS = [['p_cash','p_cashAmt'], ['p_transfer','p_transferAmt'], ['p_card','p_cardAmt']];
  const amtIds = PAY_FIELDS.map(x=>x[1]).filter(id=>$('#'+id));
  const readAmt = id => $('#'+id) ? num($('#'+id).value) : 0;
  const otherPaid = skip => amtIds.filter(x=>x!==skip).reduce((s,x)=>s+readAmt(x), 0);

  /* ทำให้ยอดรวมไม่เกินยอดสุทธิ โดยไม่แตะช่องที่กำลังแก้ */
  const balance = (keepId)=>{
    const total = recTotals(r).payable;
    const val = {}; amtIds.forEach(id=>val[id] = readAmt(id));
    let over = Math.round((amtIds.reduce((s,id)=>s+val[id],0) - total)*100)/100;
    if(over <= 0.004) return;
    /* ลดจากช่องทางอื่นก่อน เริ่มจากช่องล่างสุดขึ้นมา */
    for(const id of amtIds.slice().reverse()){
      if(id === keepId || over <= 0.004) continue;
      const cut = Math.min(val[id], over);
      val[id] = Math.round((val[id]-cut)*100)/100;
      over = Math.round((over-cut)*100)/100;
    }
    /* ถ้ายังเกิน แปลว่าช่องที่แก้เองมากกว่ายอดสุทธิ */
    if(over > 0.004 && keepId) val[keepId] = Math.max(0, Math.round((val[keepId]-over)*100)/100);
    amtIds.forEach(id=>{
      $('#'+id).value = val[id] ? val[id] : '';
      const cb = PAY_FIELDS.find(f=>f[1]===id)[0];
      if($('#'+cb)) $('#'+cb).checked = val[id] > 0.004;
    });
  };

  PAY_FIELDS.forEach(([cb, amt])=>{
    if(!$('#'+cb)) return;
    $('#'+cb).onchange = e=>{
      if(!e.target.checked){ $('#'+amt).value = ''; sync(); renderRecForm(); return; }
      const total = recTotals(r).payable;
      const left = Math.max(0, Math.round((total - otherPaid(amt))*100)/100);
      $('#'+amt).value = left ? left : '';
      if(!left){
        /* ยอดถูกช่องทางอื่นรับไปหมดแล้ว — ให้ผู้ใช้พิมพ์ยอดของช่องนี้ ระบบจะหักช่องอื่นให้เอง */
        toast('กรอกยอดที่รับทางช่องทางนี้ ระบบจะหักออกจากช่องทางอื่นให้อัตโนมัติ');
        $('#'+amt).focus();
        sync(); return;
      }
      sync(); renderRecForm();
    };
    if($('#'+amt)) $('#'+amt).onchange = ()=>{ balance(amt); sync(); renderRecForm(); };
  });

  /* ใบส่งมอบและใบเสร็จเพิ่มบรรทัดค่าบริการหรือรายการอื่นเองไม่ได้แล้ว
     รายการต้องมาจากใบเสนอราคาเท่านั้น ถ้าจะแก้ต้องกลับไปแก้ที่ใบเสนอราคา */
  $('#rcAddPart').onclick = ()=>{ sync(); pickRecPartModal(); };

  $('#rcSave').onclick = async ()=>{
    if(!requireLicense()) return;
    const K = isInvoice(r) ? 'invoice' : 'receipt';
    if(blockEdit('income', K, K==='invoice'?'ใบส่งมอบ':'ใบเสร็จ')) return;
    sync();
    if(blockIfVoid(K, r.id)) return;
    if(!r.name) return toast('กรอกชื่อลูกค้าก่อนบันทึก');
    if(!r.items.length) return toast('เพิ่มรายการอย่างน้อยหนึ่งรายการ');
    /* บันทึกยอดที่รับจริงหน้าร้าน ส่วนที่เหลือตั้งเป็นลูกหนี้ */
    const tt = recTotals(r);
    const laterPaid = (r.payments||[]).filter(x=>!x.atIssue).reduce((s,x)=>s+num(x.amount), 0);
    const A2 = payAtIssue(r);
    if(A2.paid + laterPaid > tt.payable + 0.004)
      return toast(`ยอดที่รับรวมกัน ${money(A2.paid + laterPaid)} เกินยอดสุทธิ ${money(tt.payable)} — ตรวจสอบจำนวนเงินอีกครั้ง`);
    syncIssuePayments(r);
    /* ผูกกับทะเบียนลูกค้าก่อนบันทึก */
    const link = await linkSalesCustomer(r);
    /* ตรวจครบทุกอย่างและผู้ใช้ยืนยันแล้ว จึงค่อยแตะสต๊อกเป็นขั้นสุดท้าย
       ทุกครั้งที่บันทึกจะคืนของยอดเดิมแล้วหักตามยอดใหม่ สต๊อกจึงตรงกับเอกสารเสมอ */
    /* ใบเสร็จที่อ้างอิงใบส่งมอบ — สต๊อกเป็นของใบส่งมอบ ห้ามตัดซ้ำ */
    const wantDeduct = r.invId ? false
                     : ($('#rc_deduct') ? $('#rc_deduct').checked : !!r.deducted);
    const cut = syncSalesStock(r, wantDeduct);
    const deduct = cut > 0;

    stampEdit(r);
    const store = salesStore(r);
    const i = store.findIndex(x=>x.id===r.id);
    const copy = JSON.parse(JSON.stringify(r));
    if(i>=0) store[i]=copy; else store.push(copy);
    const q = DB.quotes.find(x=>x.id===r.quoteId); if(q) q.status='billed';

    /* ใบเสร็จที่ออกจากใบส่งมอบ — ปิดยอดลูกหนี้ของใบส่งมอบต้นทาง */
    if(r.invId){
      const inv = DB.invoices.find(x=>x.id===r.invId);
      if(inv){
        inv.receiptId = copy.id; inv.receiptNo = copy.no;
        inv.payments = (inv.payments||[]).filter(p=>p.fromReceipt!==copy.id);
        const paid = paidOf(copy);
        if(paid > 0.004) inv.payments.push({id:uid(), date:copy.date, amount:paid,
          method:(num(copy.pay.transferAmt)>0?'เงินโอน':'เงินสด'),
          ref:'รับชำระตามใบเสร็จ '+copy.no, fromReceipt:copy.id});
      }
    }
    saveSome(isInvoice(r)?'invoices':'receipts', 'quotes', 'products', 'customers');
    docView='paper'; renderRecForm(); renderStock();
    if(link && link.startsWith('created')) toast('เพิ่ม '+r.name+' เข้าทะเบียนลูกค้าแล้ว '+link.split(':')[1]);
    const A3 = payAtIssue(r);
    toast('บันทึก'+salesKind(r).title.split(' / ')[0]+' '+r.no+' แล้ว' + (deduct?` และตัดสต๊อก ${cut} ชิ้นเรียบร้อย`:'')
      + (A3.remain>0.004 ? ` · รับแล้ว ${money(A3.paid)} คงค้าง ${money(A3.remain)} ตั้งเป็นลูกหนี้` : ' · รับชำระครบถ้วน'));
  };
  $('#rcPrint').onclick = ()=>{ sync(); printReceipt(r); };
  if($('#rcLink')) $('#rcLink').onclick = async ()=>{
    sync();
    const res = await linkSalesCustomer(r);
    if(res === 'noname') return toast('กรอกชื่อลูกค้าก่อน');
    if(res === 'skipped') return;
    saveSome('customers'); renderRecForm(); renderCustomer();
    toast(res.startsWith('created') ? 'เพิ่มเข้าทะเบียนลูกค้าแล้ว '+res.split(':')[1] : 'ผูกกับทะเบียนลูกค้าแล้ว');
  };
  $('#rcClose').onclick = ()=>{ sync();
    closeDraft(r, ['name','tel','email'], DB.receipts.some(x=>x.id===r.id), ()=>{ curRec=null; }, renderIncome); };
}

    $('#rpQCat').onchange = e=>{ st.cat=e.target.value; $('#mBody').innerHTML = render(); bind(); };
    $$('[data-radd]').forEach(b=>b.onclick=()=>{
      const p = DB.products.find(x=>x.id===b.dataset.radd);
      const ex = r.items.find(i=>i.pid===p.id);
      if(ex) ex.qty = num(ex.qty)+1;
      else r.items.push({pid:p.id, code:p.code, oem:p.oem, name:p.name, unit:p.unit, qty:1, price:num(p[key])});
      renderRecForm(); toast(`เพิ่ม ${p.code} แล้ว`);
    });
  };
  openModal('ดึงอะไหล่จากสต๊อก', render(), [{label:'ปิด', cls:'btn primary', act:closeModal}]);
  $('#scrim .modal').classList.add('wide');
  bind();

/* =====================================================================
   หน้า 06 — บัญชี / การเงิน
   ===================================================================== */
let finTab = 'sales';        /* sales · ar · ap · pl */

/* ---- เอกสารขายที่ใช้คิดรายได้และลูกหนี้ ---- */
function salesDocs(){
  return live(DB.invoices).concat(live(DB.receipts).filter(r=>!r.invId));
}
/* ---- ตัวช่วยฝั่งลูกหนี้ (เอกสารขาย) ---- */
function arTotal(r){ return recTotals(r).payable; }
function arDue(r){ return Math.round((arTotal(r) - paidOf(r))*100)/100; }
function arDueDate(r){
  if(isInvoice(r)) return addDays(r.date, num(r.creditDays)||0);
  return r.pay.credit ? dueDate(r) : r.date;
}
/* ---- ตัวช่วยฝั่งเจ้าหนี้ (ใบซื้อ + ค่าใช้จ่าย) ---- */
function apTotal(p){ return apTotalOf(p); }
function apDue(p){ return apDueOf(p); }

/* คำอธิบายช่วงเวลาที่เลือกไว้ในแถบตัวกรองของหมวดบัญชี/การเงิน */
function finRangeLabel(){
  const f = docFilter('fin');
  if(f.mode==='today') return 'วันนี้ ('+thDate(today())+')';
  if(f.mode==='date' && f.date) return thDate(f.date);
  if(f.mode==='range' && (f.from||f.to))
    return `${f.from?thDate(f.from):'เริ่มต้น'} ถึง ${f.to?thDate(f.to):'ปัจจุบัน'}`;
  if(f.mode==='month' && f.months.length)
    return f.months.slice().sort((a,b)=>a-b).map(m=>TH_MON_ABBR[m-1]).join(', ')+' '+(f.year+543);
  return 'ทั้งหมด';
}

const FIN_TABS = [
  ['sales', '06.1', 'ยอดขาย'],
  ['ar',    '06.2', 'ลูกหนี้'],
  ['ap',    '06.3', 'เจ้าหนี้'],
  ['pl',    '06.4', 'กำไรขาดทุน']
];

/* =====================================================================
   พิมพ์ / ส่งออกหมวด 06 — ยึดตามที่แสดงอยู่บนหน้าจอจริง
   ---------------------------------------------------------------------
   ทั้งช่วงเวลาในแถบตัวกรองด้านบนและคำค้นในตารางของแท็บนั้น
   ไม่ใช่ดึงทั้งระบบออกมาเหมือนเดิม
   ===================================================================== */
function finExportData(){
  const kw = k => (docFilter(k).q||'').trim().toLowerCase();
  const money2 = v => Math.round(num(v)*100)/100;

  if(finTab === 'ar' || finTab === 'ap'){
    const isAR = finTab === 'ar';
    const src  = isAR ? salesDocs() : apAllDocs();
    const totalOf = x => isAR ? arTotal(x)   : apTotal(x);
    const dueOf   = x => isAR ? arDue(x)     : apDue(x);
    const dateOf  = x => isAR ? arDueDate(x) : apDueDate(x);
    const nameOf  = x => isAR ? (x.name||'-'): apPartyOf(x);
    const kindOf  = x => isAR ? (x.quoteNo ? 'ใบเสร็จ · อ้าง '+x.quoteNo : 'ใบเสร็จ')
                              : (isExpenseDoc(x) ? catName(x.cat) : 'ซื้อสินค้า');
    const q = (finQ||'').trim().toLowerCase();
    const hit = x => !q || `${x.no} ${nameOf(x)}`.toLowerCase().includes(q);
    const open   = src.filter(x=>dueOf(x) > 0.004 && hit(x)).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
    const closed = src.filter(x=>dueOf(x) <= 0.004 && paidOf(x) > 0.004 && hit(x)).sort((a,b)=>b.date.localeCompare(a.date));
    const row = (x, st)=>{ const d = daysBetween(today(), dateOf(x));
      return [st, x.no, x.date, nameOf(x), kindOf(x), dateOf(x),
               (dueOf(x) > 0.004 && d < 0) ? -d : 0,
        money2(totalOf(x)), money2(paidOf(x)), money2(Math.max(0, dueOf(x)))]; };
    return {title: isAR ? 'ลูกหนี้การค้า' : 'เจ้าหนี้การค้า',
      head: ['สถานะ','เลขที่','วันที่', isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน','ประเภท','ครบกำหนด','เกินกำหนด (วัน)','ยอดเต็ม','ชำระแล้ว','คงค้าง'],
      body: open.map(x=>row(x,'ค้างชำระ')).concat(closed.map(x=>row(x,'ชำระครบแล้ว')))};
  }

  /* 06.1 ยอดขาย และ 06.4 กำไรขาดทุน ใช้เอกสารชุดเดียวกับที่หน้าจอกรองไว้ */
  const rs = applyDocFilter('fin', salesDocs(), true).list;
  const pOnly = applyDocFilter('fin', livePurchases(), true).list;
  const eOnly = applyDocFilter('fin', liveExpenses(), true).list;
  const ks = kw('fin-sales'), kb = kw('fin-buys');
  const sales = rs.filter(r=>!ks || `${r.no} ${r.name||''}`.toLowerCase().includes(ks));
  const buys  = pOnly.concat(eOnly).filter(p=>!kb || `${p.no} ${apPartyOf(p)}`.toLowerCase().includes(kb));

  if(finTab === 'pl'){
    const cogsOf = list => list.reduce((s,r)=>s+(r.items||[]).reduce((a,it)=>{
      if(it.cogs !== undefined) return a + num(it.cogs);
      if(it.pid){ const p = DB.products.find(x=>x.id===it.pid); return a + num(it.qty)*num(p?p.cost:0); }
      return a; },0), 0);
    const revenue = sales.reduce((s,r)=>s+recTotals(r).net, 0);
    const cogs = cogsOf(sales);
    const ops = eOnly.filter(e=>e.cat!=='asset');
    const body = [['รายได้จากการขายและบริการ', money2(revenue)],
                  ['ต้นทุนสินค้าที่ขาย (FIFO)', -money2(cogs)],
                  ['กำไรขั้นต้น', money2(revenue-cogs)]];
    EXPENSE_CATS.filter(([k])=>k!=='asset').forEach(([k,l])=>{
      const v = ops.filter(e=>e.cat===k).reduce((s,e)=>s+exTotals(e).net,0);
      if(v > 0.004) body.push([l, -money2(v)]);
    });
    const opsTotal = ops.reduce((s,e)=>s+exTotals(e).net,0);
    body.push(['รวมค่าใช้จ่ายดำเนินงาน', -money2(opsTotal)]);
    body.push(['กำไรสุทธิ (ก่อนภาษีเงินได้)', money2(revenue-cogs-opsTotal)]);
    return {title:'งบกำไรขาดทุน', head:['รายการ','จำนวนเงิน'], body};
  }

  const body = sales.map(r=>{ const t=recTotals(r), pd=paidOf(r);
    return ['ขาย', r.no, r.date, r.name||'', money2(t.net), money2(t.vat), money2(t.wht),
            money2(t.payable), money2(pd), money2(Math.max(0,arDue(r))),
            isVoid(r)?'ยกเลิกแล้ว':STATE_LABEL[payState(t.payable,pd)]]; })
    .concat(buys.map(p=>{ const ex=isExpenseDoc(p), t=ex?exTotals(p):poTotals(p), pd=paidOf(p);
      return [ex ? 'ค่าใช้จ่าย · '+catName(p.cat) : 'ซื้อ', p.no, p.date, apPartyOf(p),
              money2(t.net), money2(t.vat), money2(t.wht), money2(t.payable), money2(pd),
              money2(Math.max(0,apDue(p))), isVoid(p)?'ยกเลิกแล้ว':STATE_LABEL[payState(t.payable,pd)]]; }));
  return {title:'ยอดขายและรายจ่าย',
    head:['ประเภท','เลขที่','วันที่','คู่ค้า','ก่อนภาษี','VAT','หัก ณ ที่จ่าย','ยอดสุทธิ','ชำระแล้ว','คงค้าง','สถานะ'],
    body};
}

function finExportCsv(D){
  if(!D.body.length) return toast('ไม่มีข้อมูลตามตัวกรองที่เลือก');
  const q = v => typeof v === 'number' ? String(v) : '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines = [D.head.map(q).join(',')].concat(D.body.map(r=>r.map(q).join(',')));
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `drivegolight-${D.title}-${today()}.csv`; a.click();
  toast(`ส่งออก ${D.title} ${D.body.length.toLocaleString()} แถวแล้ว`);
}

function renderFinance(){
  if(!$('#finOuter')) return;
  const onlyFin = firstAllowedSub('finance');
  if(onlyFin && finTab !== onlyFin) finTab = onlyFin;
  if(renderFinance._lastTab !== finTab){ finQ = ''; renderFinance._lastTab = finTab; }
  const rs = applyDocFilter('fin', salesDocs(), true).list;
  const pOnly = applyDocFilter('fin', livePurchases(), true).list;
  const eOnly = applyDocFilter('fin', liveExpenses(), true).list;
  const ps = pOnly.concat(eOnly);

  const sales   = rs.reduce((s,r)=>s+arTotal(r), 0);
  const salesIn = rs.reduce((s,r)=>s+paidOf(r), 0);
  const spend   = ps.reduce((s,p)=>s+apTotal(p), 0);

  /* ยอดค้างคิดจากทั้งระบบ ไม่จำกัดช่วงเวลา เพราะเป็นยอดคงค้างจริง ณ วันนี้ */
  const arOut = salesDocs().reduce((s,r)=>s+Math.max(0,arDue(r)), 0);
  const apOut = apAllDocs().reduce((s,p)=>s+Math.max(0,apDue(p)), 0);

  /* แถบสรุปด้านบนเป็นรายงานภาพรวมของยอดขาย/รายจ่าย จึงแสดงเฉพาะหน้าที่เป็นรายงานจริง
     หน้า 06.2 ลูกหนี้ และ 06.3 เจ้าหนี้ ไม่ต้องแสดง เพราะผู้ที่ถูกปิดสิทธิ์ไม่ให้เห็น 06.1
     ยังเข้าสองหน้านี้ได้ ถ้าโชว์แถบนี้ไว้ก็เท่ากับเห็นยอดขายทั้งร้านอยู่ดี */
  const showSummary = (finTab === 'sales' || finTab === 'pl');

  $('#finTabs').innerHTML = subtabBarM('finance', 'บัญชี / การเงิน', FIN_TABS.filter(t=>canSub('finance', t[0])), finTab,
    (finTab !== 'sales' && canExportTab('finance', finTab))
      ? `<div class="acts">${actCard('finExp', {ic:'printer', c:'#1F5FBF'}, 'พิมพ์ / ส่งออก',
          'PDF / Excel ตามที่แสดงอยู่')}</div>` : ``);
  $('#finOuter').innerHTML = `
    ${!showSummary ? '' : `
    <div class="stat" style="margin-bottom:16px">
      <div><span>ยอดขาย</span><b>${money(sales)}</b></div>
      <div><span>รับชำระแล้ว</span><b style="color:var(--ok)">${money(salesIn)}</b></div>
      <div><span>รายจ่ายรวม</span><b>${money(spend)}</b></div>
      <div><span>ยอดลูกหนี้ค้างรับ</span><b style="color:${arOut>0.004?'var(--warn)':'var(--ink)'}">${money(arOut)}</b></div>
      <div><span>ยอดเจ้าหนี้ค้างจ่าย</span><b style="color:${apOut>0.004?'var(--danger)':'var(--ink)'}">${money(apOut)}</b></div>
    </div>`}

    <div id="finBody"></div>`;

  $$('#finTabs button[data-t]').forEach(b=>b.onclick=()=>{ finTab=b.dataset.t; renderFinance(); });
  if($('#finExp')) $('#finExp').onclick = finExportModal;

  if(finTab==='sales')    renderFinSales(rs, ps, pOnly, eOnly);
  else if(finTab==='ar')  renderFinSide('ar');
  else if(finTab==='ap')  renderFinSide('ap');
  else                    renderFinPL(rs, pOnly, eOnly);
  bindDocFilter('fin', renderFinance);
}

let finQ = '';    /* คำค้นในหน้าลูกหนี้/เจ้าหนี้ */
/* รายการใบที่ติ๊กเลือกไว้เพื่อชำระพร้อมกัน */
let finBulkSel = new Set(), finBulkKind = null;
function renderFinSide(kind){
  if(finBulkKind !== kind){ finBulkSel = new Set(); finBulkKind = kind; }
  if(!docFilters['fin-'+kind]) docFilter('fin-'+kind).pageSize = 20;
  docFilter('fin-'+kind).mode = 'all';
  const isAR = kind==='ar';
  const src  = isAR ? salesDocs() : apAllDocs();
  const totalOf = x => isAR ? arTotal(x) : apTotal(x);
  const dueOf   = x => isAR ? arDue(x)   : apDue(x);
  const dateOf  = x => isAR ? arDueDate(x) : apDueDate(x);
  const nameOf  = x => isAR ? (x.name||'-') : apPartyOf(x);
  const kindOf  = x => isAR ? (x.quoteNo? 'ใบเสร็จ · อ้าง '+x.quoteNo : 'ใบเสร็จ')
                            : (isExpenseDoc(x) ? catName(x.cat) : 'ซื้อสินค้า');

  const kw = finQ.trim().toLowerCase();
  const hit = x => !kw || `${x.no} ${nameOf(x)}`.toLowerCase().includes(kw);
  const open   = src.filter(x=>dueOf(x) > 0.004 && hit(x)).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
  const RO = applyDocFilter('fin-'+kind, open, true);
  const openRows = RO.pageList;
  const closed = src.filter(x=>dueOf(x) <= 0.004 && paidOf(x) > 0.004)
                    .sort((a,b)=>b.date.localeCompare(a.date));
  const sum   = open.reduce((s,x)=>s+dueOf(x), 0);
  const late  = open.filter(x=>daysBetween(today(), dateOf(x)) < 0);
  const lateSum = late.reduce((s,x)=>s+dueOf(x), 0);

  /* รวมยอดค้างต่อคู่ค้า */
  const m = {};
  open.forEach(x=>{ const k = nameOf(x); if(!m[k]) m[k]={name:k, amt:0, n:0}; m[k].amt += dueOf(x); m[k].n++; });
  const byParty = Object.values(m).sort((a,b)=>b.amt-a.amt);

  const title = isAR ? 'ลูกหนี้จากการขาย' : 'เจ้าหนี้การค้า';
  const label = isAR ? 'ยอดลูกหนี้ค้างรับ' : 'ยอดเจ้าหนี้ค้างจ่าย';

  $('#finBody').innerHTML = `
    <div class="stat" style="margin-bottom:16px">
      <div><span>${label}</span><b style="color:${sum>0.004?(isAR?'var(--warn)':'var(--danger)'):'var(--ink)'}">${money(sum)}</b></div>
      <div><span>จำนวนใบที่ค้าง</span><b>${open.length}</b></div>
      <div><span>เกินกำหนดชำระ</span><b style="color:${late.length?'var(--danger)':'var(--ink-3)'}">${late.length}</b></div>
      <div><span>ยอดที่เกินกำหนด</span><b style="color:${lateSum>0.004?'var(--danger)':'var(--ink-3)'}">${money(lateSum)}</b></div>
      <div><span>${isAR?'ลูกค้า':'ผู้ขาย/ผู้รับเงิน'}ที่ค้าง</span><b>${byParty.length} <small style="font-size:13px;font-weight:400;color:var(--ink-2)">ราย</small></b></div>
    </div>

    <div class="card">
      <header>
        <button class="btn sm primary" id="bulkPayBtn"${finBulkSel.size?'':' disabled'}>${isAR?'รับชำระ':'จ่ายชำระ'}ที่เลือก (${finBulkSel.size})</button>
        <span class="hint" data-hide="sm">ติ๊กเลือกหลายใบเพื่อกรอกตัดพร้อมกัน · เรียงตามวันครบกำหนด${kw?` · พบ ${open.length} ใบ`:''}</span>
        <div class="spacer"></div>
        <span class="chip ${sum>0.004?'max':'ok'}">คงค้าง${kw?'ที่พบ':'รวม'} ${money(sum)}</span>
        <div class="search" style="width:29%;min-width:190px;max-width:300px"><input class="in" id="finSearch"
          placeholder="ค้นหา ${isAR?'ชื่อลูกค้า':'ชื่อผู้ขาย'} / เลขที่เอกสาร" value="${esc(finQ)}"></div></header>
      ${docFilterBar('fin', src, {sizeKey:'fin-'+kind})}
      ${pagerBar('fin-'+kind, RO.totalPages, 'top')}
      <div class="tablewrap">
        <table class="tbl rtbl">
          <thead><tr><th style="width:36px;text-align:center"><input type="checkbox" id="bulkAll" title="เลือกทุกใบในหน้านี้"></th>
            <th style="width:136px">เลขที่</th><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
            <th style="width:126px" data-hide="md">ประเภท</th><th style="width:112px">ครบกำหนด</th>
            <th class="num" style="width:104px">ยอดเต็ม</th><th class="num" style="width:104px" data-hide="sm">ชำระแล้ว</th>
            <th class="num" style="width:104px">คงค้าง</th><th style="width:112px"></th></tr></thead>
          <tbody>
          ${openRows.length? openRows.map(x=>{
            const tot=totalOf(x), pd=paidOf(x), du=dueOf(x), dd=dateOf(x);
            const overdue = daysBetween(today(), dd) < 0;
            return `<tr>
              <td style="text-align:center"><input type="checkbox" data-bulksel="${x.id}"${finBulkSel.has(x.id)?' checked':''}></td>
              <td class="mono" data-f="no">${esc(x.no)}</td>
              <td data-f="name">${esc(nameOf(x))}
                <div class="paybar"><i style="width:${Math.min(100, tot>0? pd/tot*100 : 0)}%"></i></div></td>
              <td style="font-size:12px;color:var(--ink-2)" data-hide="md" data-f="kind">${esc(kindOf(x))}</td>
              <td data-f="due" style="font-size:12.5px;color:${overdue?'var(--danger)':'var(--ink-2)'}">${thDate(dd)}
                ${overdue?`<span class="latechip">เกิน ${Math.abs(daysBetween(today(), dd))} วัน</span>`:''}</td>
              <td class="num mono" data-f="total">${money(tot)}</td>
              <td class="num mono" data-hide="sm" data-f="paid" style="color:${pd>0.004?'var(--ok)':'var(--ink-3)'}">${money(pd)}</td>
              <td class="num mono" data-f="dueamt"><b style="color:var(--danger)">${money(du)}</b>
                <div class="statewrap">${stateChip(tot, pd)}</div></td>
              <td data-f="act" style="text-align:right"><button class="btn sm primary" data-pay="${kind}:${x.id}">ชำระเงิน</button></td></tr>`;
          }).join('') : `<tr><td colspan="9" class="empty">${open.length? 'ไม่พบเอกสารตามเงื่อนไขที่เลือก' : 'ไม่มียอดค้างชำระ'}</td></tr>`}
          </tbody>
        </table>
      </div>
      ${pagerBar('fin-'+kind, RO.totalPages)}
    </div>

    <div class="ledger" style="margin-top:16px">
      <div class="card">
        <header><h2>สรุปตาม${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</h2><span class="hint">เรียงจากยอดค้างมากไปน้อย</span></header>
        <div class="tablewrap" style="max-height:300px;overflow:auto">
          <table class="tbl"><thead><tr><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
            <th class="num" style="width:80px">จำนวนใบ</th><th class="num" style="width:120px">ยอดค้าง</th></tr></thead><tbody>
          ${byParty.length? byParty.map(x=>`<tr><td>${esc(x.name)}</td>
            <td class="num mono">${x.n}</td><td class="num mono"><b>${money(x.amt)}</b></td></tr>`).join('')

        <div class="tablewrap" style="max-height:300px;overflow:auto">
          <table class="tbl"><thead><tr><th style="width:132px">เลขที่</th><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
            <th style="width:106px">ชำระครบเมื่อ</th><th class="num" style="width:110px">จำนวนเงิน</th>
            <th style="width:100px"></th></tr></thead><tbody>
          ${closed.length? closed.slice(0,15).map(x=>{
            const last = (x.payments||[]).slice(-1)[0];
            return `<tr><td class="mono">${esc(x.no)}</td><td>${esc(nameOf(x))}</td>
              <td>${thDate(last? last.date : x.date)}</td>
              <td class="num mono">${money(paidOf(x))}</td>

          </tbody></table>
        </div>
      </div>
    </div>`;

  bindSearchInput($('#finSearch'), (v, pos)=>{
    if(finQ === v) return;
    finQ = v; renderFinSide(kind);
    const el = $('#finSearch'); if(el){ el.focus(); el.setSelectionRange(pos, pos); }
  });
  bindDocFilter('fin-'+kind, ()=>renderFinSide(kind));
  /* ---- เลือกหลายใบเพื่อชำระพร้อมกัน ---- */
  const updBulk = ()=>{ const b = $('#bulkPayBtn'); if(!b) return;
    b.textContent = `${isAR?'รับชำระ':'จ่ายชำระ'}ที่เลือก (${finBulkSel.size})`;
    b.disabled = !finBulkSel.size; };
  $$('[data-bulksel]').forEach(cb=>cb.onchange = ()=>{
    if(cb.checked) finBulkSel.add(cb.dataset.bulksel); else finBulkSel.delete(cb.dataset.bulksel);
    updBulk();
  });
  if($('#bulkAll')) $('#bulkAll').onchange = e=>{
    $$('[data-bulksel]').forEach(cb=>{ cb.checked = e.target.checked;
      if(cb.checked) finBulkSel.add(cb.dataset.bulksel); else finBulkSel.delete(cb.dataset.bulksel); });
    updBulk();
  };
  if($('#bulkPayBtn')) $('#bulkPayBtn').onclick = ()=>bulkPayModal(kind);
  $$('[data-pay]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.pay.split(':'); payModal(k, id); });
  $$('[data-hist]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.hist.split(':'); payHistoryModal(k, id); });
}

/* ---------- ชำระหลายใบพร้อมกัน — กรอกยอดตัดทีละใบ ใช้วันที่/ช่องทางร่วมกัน ---------- */
function bulkPayModal(kind){
  const isAR = kind==='ar';
  const dueOf = d => isAR ? arDue(d) : apDue(d);
  const nameOf = d => isAR ? (d.name||'-') : apPartyOf(d);
  const docs = [...finBulkSel].map(id=>findDoc(kind, id)).filter(d=>d && dueOf(d) > 0.004);
  if(!docs.length) return toast('ติ๊กเลือกใบที่จะชำระก่อน');
  openModal(isAR ? `รับชำระหลายใบพร้อมกัน (${docs.length} ใบ)` : `จ่ายชำระหลายใบพร้อมกัน (${docs.length} ใบ)`, `
    <div class="tablewrap" style="max-height:calc(40vh/var(--z));border:1px solid var(--line);border-radius:6px;margin-bottom:12px">
      <table class="tbl ctbl"><thead><tr><th style="width:130px">เลขที่</th><th>${isAR?'ลูกค้า':'ผู้ขาย / ผู้รับเงิน'}</th>
        <th class="num" style="width:110px">คงค้าง</th><th class="num" style="width:140px">จำนวนที่ชำระ</th></tr></thead><tbody>
      ${docs.map(d=>`<tr><td class="mono">${esc(d.no)}</td><td>${esc(nameOf(d))}</td>
        <td class="num mono">${money(dueOf(d))}</td>
        <td><input class="in mono" data-bamt="${d.id}" value="${dueOf(d)}" style="text-align:right;padding:5px 8px"></td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="3" style="text-align:right;font-weight:600;padding:8px 10px">รวมที่จะชำระ</td>
        <td class="num mono" id="bulkTotal" style="font-weight:700;text-align:right;padding:8px 10px">${money(docs.reduce((s,d)=>s+dueOf(d),0))}</td></tr></tfoot>
      </table></div>
    <div class="grid g3">
      <div><label class="f">วันที่ชำระ</label><input type="date" class="in" id="bulkDate" value="${today()}"></div>
      <div><label class="f">ช่องทาง</label>
        <select class="in" id="bulkMethod">
          <option>เงินสด</option><option>เงินโอน</option><option>เช็ค</option><option>บัตรเครดิต</option><option>อื่น ๆ</option>
        </select></div>
      <div><label class="f">เลขอ้างอิง / หมายเหตุ</label><input class="in" id="bulkRef" placeholder="ใช้ร่วมกันทุกใบ"></div>
    </div>
    <div class="hint" style="margin-top:8px">แก้จำนวนเงินรายใบได้ — ใบที่กรอก 0 จะถูกข้าม · ยอดเกินคงค้างจะถูกปรับลงให้พอดี</div>`,
  [
    {label:'ยกเลิก', cls:'btn', act:closeModal},
    {label:isAR?'บันทึกรับชำระทั้งหมด':'บันทึกจ่ายชำระทั้งหมด', cls:'btn primary', act:()=>{
      if(!requireLicense()) return closeModal();
      if(blockEdit('finance', kind, isAR?'การรับชำระ':'การจ่ายชำระ')) return closeModal();
      const date = $('#bulkDate').value || today();
      const method = $('#bulkMethod').value, ref = $('#bulkRef').value.trim();
      let n = 0, total = 0;
      docs.forEach(d=>{
        const el = $(`[data-bamt="${d.id}"]`);
        const amt = Math.min(Math.max(0, num(el ? el.value : 0)), dueOf(d));
        if(amt <= 0.004) return;
        d.payments = d.payments || [];
        d.payments.push({id:uid(), date, amount:Math.round(amt*100)/100, method, ref});
        n++; total += amt;
      });
      if(!n) return toast('ระบุจำนวนเงินอย่างน้อยหนึ่งใบ');
      saveSome('receipts','invoices','purchases','expenses'); closeModal();
      finBulkSel = new Set();
      renderFinance();
      toast(`บันทึกการชำระ ${n} ใบ · รวม ${money(total)}`);
    }}
  ]);
  $('#scrim .modal').classList.add('wide');
  const recalc = ()=>{ $('#bulkTotal').textContent =
    money(docs.reduce((s,d)=>{ const el=$(`[data-bamt="${d.id}"]`);
      return s + Math.min(Math.max(0, num(el?el.value:0)), dueOf(d)); }, 0)); };
  $$('[data-bamt]').forEach(el=>el.oninput = recalc);
}

/* =====================================================================
   06.4 กำไรขาดทุน
   ===================================================================== */
/* =====================================================================
   มูลค่าสินค้าที่ออกจากคลังโดยไม่ผ่านการขาย
   ---------------------------------------------------------------------
   ของที่จ่ายออกทางใบเคลม หรือหายไปจนต้องปรับยอดตอนตรวจนับ ทำให้สต๊อกลดจริง
   ถ้าไม่บันทึกเป็นค่าใช้จ่าย กำไรจะสูงเกินจริงเท่ากับมูลค่าของที่หายไป
   วางไว้ในหมวดค่าใช้จ่ายดำเนินงาน ไม่ใช่ต้นทุนขาย เพื่อให้กำไรขั้นต้น
   ยังบอกได้ตรง ๆ ว่าขายของแล้วได้กำไรกี่เปอร์เซ็นต์
   ===================================================================== */
function claimWriteOff(list){
  return (list||[]).reduce((s,c)=> s + (c.items||[]).reduce((a,it)=>
    a + (num(it.cogs) || num(it.qty)*num(it.cost)), 0), 0);
}
/* ตรวจนับเจอของขาด = ค่าใช้จ่าย · เจอของเกิน = หักกลับ จึงคิดสุทธิ */
function moveWriteOff(list){
  return (list||[]).reduce((s,m)=> s + (m.dir === 'out' ? 1 : -1) * num(m.qty) * num(m.cost), 0);
}
function renderFinPL(rs, pOnly, eOnly){
  /* ใช้มูลค่าก่อนภาษีมูลค่าเพิ่ม เพราะ VAT ไม่ใช่รายได้หรือค่าใช้จ่ายของกิจการ */
  const revenue = rs.reduce((s,r)=>s+recTotals(r).net, 0);
  /* ต้นทุนขายแบบ FIFO: รวมต้นทุนที่บันทึกไว้ตอนตัดสต๊อกของทุกรายการที่ขาย
     เอกสารเก่าก่อนรุ่น FIFO ไม่มีค่านี้ ใช้จำนวน×ทุนปัจจุบันโดยประมาณแทน */
  const cogsOf = list => list.reduce((s,r)=>s+(r.items||[]).reduce((a,it)=>{
    if(it.cogs !== undefined) return a + num(it.cogs);
    if(it.pid){ const p = DB.products.find(x=>x.id===it.pid);
      return a + num(it.qty)*num(p ? p.cost : 0); }
    return a;
  },0), 0);
  const cogs = cogsOf(rs);
  const purchTotal = pOnly.reduce((s,p)=>s+poTotals(p).net, 0);
  const gross   = revenue - cogs;

  /* ของที่ออกจากคลังโดยไม่ผ่านการขาย — กรองด้วยช่วงเวลาเดียวกับเอกสารอื่นในงบ
     แยกสามทาง: ใบเคลม · ส่วนต่างจากการปรับยอด (ตรวจนับ/ตั้งยอด/นำเข้า)
     · เบิกใช้ในอู่ (วัสดุสิ้นเปลือง รวม manual รุ่นเก่าที่ความหมายเดียวกัน) */
  const isUseMove = m => m.kind === 'use' || m.kind === 'manual';
  const claimDocs = applyDocFilter('fin', (DB.claims||[]).filter(c=>c.deducted && !isVoid(c)), true).list;
  const adjMoves  = applyDocFilter('fin', (DB.moves||[]).filter(m=>!isUseMove(m)), true).list;
  const useMoves  = applyDocFilter('fin', (DB.moves||[]).filter(isUseMove), true).list;
  const claimLoss = claimWriteOff(claimDocs);
  const adjLoss   = moveWriteOff(adjMoves);
  const useLoss   = moveWriteOff(useMoves);
  const writeOff  = claimLoss + adjLoss + useLoss;

  const opsCats = EXPENSE_CATS.filter(([k])=>k!=='asset');
  const opsByCat = {};
  opsCats.forEach(([k])=>opsByCat[k] = 0);
  let assetSum = 0;
  eOnly.forEach(e=>{
    const net = exTotals(e).net;
    if(e.cat === 'asset') assetSum += net;
    else opsByCat[e.cat] = (opsByCat[e.cat]||0) + net;
  });
  const opsTotal = Object.values(opsByCat).reduce((a,b)=>a+b, 0);
  const opsAll    = opsTotal + writeOff;          /* ค่าใช้จ่ายดำเนินงานรวมของที่หายจากคลัง */
  const netProfit = gross - opsAll;
  const pct = v => revenue > 0 ? (v/revenue*100).toFixed(1)+'%' : '—';

  /* แยกรายเดือน */
  const keys = [...new Set(rs.map(r=>r.date.slice(0,7))
    .concat(pOnly.map(p=>p.date.slice(0,7)))
    .concat(eOnly.map(e=>e.date.slice(0,7)))
    .concat(claimDocs.map(c=>String(c.date).slice(0,7)))
    .concat(adjMoves.map(m=>String(m.date).slice(0,7)))
    .concat(useMoves.map(m=>String(m.date).slice(0,7))))].sort();
  const monthRows = keys.map(k=>{
    const mrs = rs.filter(r=>r.date.slice(0,7)===k);
    const rv = mrs.reduce((s,r)=>s+recTotals(r).net,0);
    /* ต้นทุนขายต้องใช้สูตรเดียวกับงบด้านบน คือทุนที่บันทึกไว้จริงตอนตัดสต๊อก
       ห้ามใช้ยอดซื้อแทน เพราะของที่ซื้อเข้ามาแล้วยังไม่ได้ขายไม่ใช่ต้นทุน */
    const cg = cogsOf(mrs);
    const bu = pOnly.filter(p=>p.date.slice(0,7)===k).reduce((s,p)=>s+poTotals(p).net,0);
    /* ค่าใช้จ่ายรายเดือนต้องรวมของที่หายจากคลังด้วย ไม่งั้นแถวรวมท้ายตารางจะไม่ตรงกับงบด้านบน */
    const wo = claimWriteOff(claimDocs.filter(c=>String(c.date).slice(0,7)===k))
             + moveWriteOff(adjMoves.filter(x=>String(x.date).slice(0,7)===k))
             + moveWriteOff(useMoves.filter(x=>String(x.date).slice(0,7)===k));
    const op = eOnly.filter(e=>e.date.slice(0,7)===k && e.cat!=='asset').reduce((s,e)=>s+exTotals(e).net,0) + wo;
    const [y,m] = k.split('-').map(Number);
    return {label:`${TH_MONTHS[m-1]} ${y+543}`, rv, cg, bu, op, np: rv-cg-op};
  });

  const line = (label, amount, opt={}) => `
    <div class="taxrow" style="${opt.strong?'font-weight:700;font-size:14.5px;':''}${opt.indent?'padding-left:18px;':''}">
      <span>${label}${opt.pct!==false?` <span style="color:var(--ink-3);font-size:11.5px">${pct(Math.abs(amount))}</span>`:''}</span>
      <b style="${opt.color?`color:${opt.color};`:''}">${opt.minus?'−':''}${money(Math.abs(amount))}</b></div>`;

  $('#finBody').innerHTML = `
    <div class="ledger">
      <div class="card">
        <header><h2>งบกำไรขาดทุน</h2>
          <span class="hint">${finRangeLabel()}</span></header>
        ${docFilterBar('fin', rs.concat(pOnly, eOnly), {noSize:true})}
        <div class="body">
          <div class="sec-title" style="margin-top:0">รายได้</div>
          ${line('รายได้จากการขายและบริการ', revenue, {pct:false})}

          <div class="sec-title">ต้นทุนขาย</div>
          ${line('ต้นทุนสินค้าที่ขาย (FIFO)', cogs, {minus:true, indent:true})}
          ${line('ยอดซื้อสินค้าเข้าระหว่างงวด (อ้างอิง ไม่หักซ้ำ)', purchTotal, {indent:true, pct:false, color:'var(--ink-3)'})}
          <div class="taxsum" style="background:#F6F8F9;border:1px solid var(--line);margin-top:8px">
            <span><b>กำไรขั้นต้น</b></span>
            <b style="color:${gross>=0?'var(--ok)':'var(--danger)'}">${money(gross)} <span style="font-size:12px;font-weight:400;color:var(--ink-3)">${pct(gross)}</span></b>
          </div>

          <div class="sec-title">ค่าใช้จ่ายในการดำเนินงาน</div>
          ${opsCats.map(([k,l])=>line(l, opsByCat[k]||0, {minus:true, indent:true})).join('')}
          ${line('มูลค่าอะไหล่ที่จ่ายออกตามใบเคลม', claimLoss, {minus:claimLoss>=0, indent:true})}
          ${line('ส่วนต่างสินค้าจากการตรวจนับ' + (adjLoss<-0.004?' (นับได้เกิน — หักกลับ)':''), adjLoss, {minus:adjLoss>=0, indent:true, color:adjLoss<-0.004?'var(--ok)':''})}
          ${line('วัสดุสิ้นเปลืองและของเบิกใช้ในอู่', useLoss, {minus:useLoss>=0, indent:true})}
          ${line('รวมค่าใช้จ่ายดำเนินงาน', opsAll, {minus:true, strong:true})}

          <div class="taxsum" style="margin-top:12px;
            background:${netProfit>=0?'#E7F4EF':'#FCF1F0'};
            border:1px solid ${netProfit>=0?'#BFE3D6':'#EFCFCB'};
            color:${netProfit>=0?'var(--ok)':'var(--danger)'}">
            <span><b>${netProfit>=0?'กำไรสุทธิ':'ขาดทุนสุทธิ'} (ก่อนภาษีเงินได้)</b></span>
            <b>${money(Math.abs(netProfit))} <span style="font-size:12px;font-weight:400">${pct(netProfit)}</span></b>
          </div>

          ${assetSum > 0.004 ? `<div class="warn" style="margin-top:14px">
            <b>ไม่ได้นำการซื้อสินทรัพย์ ${money(assetSum)} บาท มารวมเป็นค่าใช้จ่าย</b><br>
            สินทรัพย์เป็นทรัพย์สินถาวร ต้องทยอยคิดเป็นค่าเสื่อมราคาตามอายุการใช้งาน ไม่หักเป็นค่าใช้จ่ายทั้งจำนวนในงวดเดียว
            ระบบยังไม่ได้คำนวณค่าเสื่อมราคาให้ ควรให้ผู้ทำบัญชีคำนวณเพิ่ม
          </div>` : ''}

          <div style="margin-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.8">
            ตัวเลขทั้งหมดเป็นมูลค่าก่อนภาษีมูลค่าเพิ่ม เพราะภาษีมูลค่าเพิ่มไม่ใช่รายได้หรือค่าใช้จ่ายของกิจการ<br>
            คำนวณตามเกณฑ์วันที่ของเอกสารที่บันทึกไว้ ไม่ว่าจะเก็บเงินหรือจ่ายเงินแล้วหรือยัง<br>
            งบนี้ใช้ดูภาพรวมการดำเนินงาน ไม่ใช่งบการเงินตามมาตรฐานบัญชี ควรให้ผู้ทำบัญชีจัดทำงบฉบับจริงเพื่อยื่นภาษี
          </div>
        </div>
      </div>

      <div class="card">
        <header><h2>แยกตามเดือน</h2><span class="hint">${monthRows.length} เดือน</span></header>
        <div class="tablewrap" style="max-height:420px;overflow:auto">
          <table class="tbl">
            <thead><tr><th>เดือน</th><th class="num" style="width:104px">รายได้</th>
              <th class="num" style="width:100px">ต้นทุนขาย</th>
              <th class="num" style="width:100px" data-hide="md" title="ยอดซื้อของเข้าคลังในเดือนนั้น ไม่ได้หักเป็นต้นทุน">ยอดซื้อเข้า</th>
              <th class="num" style="width:104px" data-hide="sm">ค่าใช้จ่าย</th>
              <th class="num" style="width:110px">กำไรสุทธิ</th></tr></thead>
            <tbody>
            ${monthRows.length? monthRows.map(m=>`<tr>
              <td>${m.label}</td>
              <td class="num mono">${money(m.rv)}</td>
              <td class="num mono">${money(m.cg)}</td>
              <td class="num mono" data-hide="md" style="color:var(--ink-3)">${money(m.bu)}</td>
              <td class="num mono" data-hide="sm">${money(m.op)}</td>
              <td class="num mono"><b style="color:${m.np>=0?'var(--ok)':'var(--danger)'}">${money(m.np)}</b></td></tr>`).join('')
            : `<tr><td colspan="6" class="empty">ไม่มีข้อมูลในช่วงเวลานี้</td></tr>`}
            </tbody>
            ${monthRows.length?`<tfoot><tr style="background:#FAFBFC;font-weight:600">
              <td style="text-align:right">รวม</td>
              <td class="num mono">${money(revenue)}</td>
              <td class="num mono">${money(cogs)}</td>
              <td class="num mono" data-hide="md" style="color:var(--ink-3)">${money(purchTotal)}</td>
              <td class="num mono" data-hide="sm">${money(opsAll)}</td>
              <td class="num mono"><b style="color:${netProfit>=0?'var(--ok)':'var(--danger)'}">${money(netProfit)}</b></td></tr></tfoot>`:''}
          </table>
        </div>
        <div class="body" style="padding-top:0">
          <button class="btn sm" id="plPrint">พิมพ์งบกำไรขาดทุน</button>
        </div>
      </div>
    </div>`;

  $('#plPrint').onclick = ()=>printPL({revenue, cogs, gross, opsByCat, opsCats, opsTotal, opsAll,
    claimLoss, adjLoss, useLoss, netProfit, assetSum, monthRows});
}

function printPL(D){
  const pct = v => D.revenue > 0 ? (v/D.revenue*100).toFixed(1)+'%' : '—';
  const row = (label, amt, opt={}) => `<tr>
    <td${opt.indent?' style="padding-left:18px"':''}>${label}</td>
    <td style="text-align:right;width:56px;color:#555">${opt.nopct?'':pct(Math.abs(amt))}</td>
    <td style="text-align:right;width:96px${opt.strong?';font-weight:700':''}">${opt.minus?'(':''}${money(Math.abs(amt))}${opt.minus?')':''}</td></tr>`;
  doPrint(`<div class="paper">
    <div class="doc-head">${shopHead()}
      <div class="doc-meta"><h1>งบกำไรขาดทุน</h1>
        <div style="font-size:11px;letter-spacing:.08em">PROFIT AND LOSS STATEMENT</div>
        <table style="margin-top:4px">
          <tr><td>ช่วงเวลา</td><td style="text-align:right">${finRangeLabel()}</td></tr>
          <tr><td>วันที่พิมพ์</td><td style="text-align:right">${thDate(today())}</td></tr></table></div>
    </div>
    <table class="doc" style="margin-top:10px">
      <thead><tr><th>รายการ</th><th style="width:56px">ร้อยละ</th><th style="width:96px">จำนวนเงิน (บาท)</th></tr></thead>
      <tbody>
        <tr><td colspan="3" style="background:#EDEFF1;font-weight:700">รายได้</td></tr>
