  mountActions('stkSide', 'clForm', `
      <button class="btn primary" id="clSave"${inDb?' disabled':''}>บันทึกใบเคลม</button>
      <button class="btn" id="clPrint">พิมพ์ใบเคลมสินค้า</button>
      <button class="btn danger" id="clClose">ปิดเอกสาร</button>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;text-align:center">
        ${inDb ? 'เอกสารนี้บันทึกแล้ว<br>แก้ไขไม่ได้แล้ว' : 'ยังไม่ได้บันทึก'}
      </div>`);

  const sync = ()=>{
    c.date = $('#cl_date').value || today();
    c.kind = $('#cl_kind').value;
    c.refNo = $('#cl_ref').value.trim();
    c.name = $('#cl_name').value.trim();
    c.tel = $('#cl_tel').value.trim();
    c.reason = $('#cl_reason').value.trim();
    c.byWhom = $('#cl_by').value.trim();
    c.note = $('#cl_note').value.trim();
    c.veh = c.veh || {};
    const vt = $('#cl_veh').value.trim().split(/\s+/);
    c.veh.brand = vt[0]||''; c.veh.model = vt.slice(1).join(' ');
    const pl = $('#cl_plate').value.trim().split(/\s+/);
    c.veh.plateA = pl[0]||''; c.veh.plateB = pl.slice(1).join(' ');
    c.veh.mileage = $('#cl_mile').value.trim();
    $$('[data-ci]').forEach(el=>{
      const it = c.items[+el.dataset.ci], k = el.dataset.k;
      if(!it) return;
      it[k] = (k==='qty'||k==='cost') ? num(el.value) : el.value.trim();
    });
  };
  ['cl_date','cl_kind','cl_ref','cl_name','cl_tel','cl_reason','cl_by','cl_note',
   'cl_veh','cl_plate','cl_mile'].forEach(id=>{
    const el = $('#'+id); if(el) el.onchange = ()=>{ sync(); renderClaimForm(); };
  });
  $$('[data-ci]').forEach(el=>el.onchange = ()=>{ sync(); renderClaimForm(); });
  $$('[data-crm]').forEach(b=>b.onclick = ()=>{ sync(); c.items.splice(+b.dataset.crm,1); renderClaimForm(); });

  $('#clAddFree').onclick = ()=>{ sync();
    c.items.push({pid:null, code:'', name:'', unit:'', qty:1, cost:0}); renderClaimForm(); };
  $('#clAddPart').onclick = ()=>{ sync(); pickClaimPartModal(); };
  /* ปุ่มท้ายฟอร์มทำงานเหมือนปุ่มแถบบน */
  [['clSaveB','clSave'],['clPrintB','clPrint'],['clCloseB','clClose']].forEach(([b,t])=>{
    if($('#'+b)) $('#'+b).onclick = ()=>{ const el = $('#'+t); if(el) el.click(); };
  });
  $('#clPrint').onclick = ()=>{ sync(); printClaim(c); };
  $('#clClose').onclick = async ()=>{ sync();
    if(!inDb && (c.items.length || c.name)){
      if(!await confirmPop('ปิดเอกสารนี้โดยไม่บันทึก?\n\nข้อมูลที่กรอกไว้จะหายไป')) return;
    }
    const sd = stockTab === 'vclaim' ? 'vendor' : 'customer';
    curClaim = null; renderClaim(sd); toast('ปิดเอกสารแล้ว');
  };

  $('#clPickCust').onclick = ()=>{ sync(); pickClaimCustModal(); };

  $('#clSave').onclick = ()=>{
    if(!requireLicense()) return;
    if(blockEdit('stock', CS.tab, CS.title)) return;
    sync();
    if(!c.items.length) return toast('เพิ่มรายการสินค้าอย่างน้อยหนึ่งรายการ');
    if(!c.reason) return toast('กรอกเหตุผลในการเคลมก่อนบันทึก');

    const old = (DB.claims||[]).find(x=>x.id===c.id);
    /* คืนสต๊อกของยอดเดิมก่อน แล้วหักตามยอดใหม่ — แก้ไขแล้วบันทึกซ้ำได้ */
    if(old && old.deducted) old.items.forEach(it=>{ if(it.pid){
      const p = DB.products.find(x=>x.id===it.pid);
      if(p) lotReturn(p, num(it.qty), num(it.cogs)||num(it.qty)*num(it.cost));
    }});
    let cut = 0;
    c.items.forEach(it=>{ if(it.pid){
      const p = DB.products.find(x=>x.id===it.pid);
      if(p){ it.cogs = lotConsume(p, num(it.qty)); p.lastMove = c.date; cut += num(it.qty); }
    }});
    c.deducted = true;

    const copy = JSON.parse(JSON.stringify(c));
    const i = (DB.claims||[]).findIndex(x=>x.id===c.id);
    if(i>=0) DB.claims[i] = copy; else (DB.claims = DB.claims||[]).push(copy);
    saveSome('claims', 'products'); renderClaimForm(); renderStock();
    const noPid = c.items.filter(it=>!it.pid).length;
    toast(`บันทึกใบเคลม ${c.no} แล้ว · ตัดสต๊อก ${cut} ชิ้น` +
      (noPid ? ` (${noPid} รายการไม่ได้ผูกทะเบียนสินค้า จึงไม่ตัดสต๊อก)` : ''));
  };
}

/* ดึงสินค้าจากทะเบียนเข้าใบเคลม */
function pickClaimPartModal(){
  const st = {kw:'', cat:'all'};
  const SRC = refList('products');   /* สำเนารายการสินค้า โหลดครั้งเดียวตอนเปิด */
  const render = ()=>{
    const q = st.kw.toLowerCase();
    const list = SRC.filter(p=>{
      if(st.cat!=='all' && (p.cat||'') !== (st.cat==='__none__' ? '' : st.cat)) return false;
      return !q || [p.code,p.oem,p.name,p.barcode,p.cat].some(v=>String(v||'').toLowerCase().includes(q));
    });
    return `
      <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
        <div class="search" style="flex:1;min-width:220px"><input class="in" id="cpQ" placeholder="รหัสสินค้า / รหัสอ้างอิง / ชื่อสินค้า" value="${esc(st.kw)}"></div>
        <select class="in" id="cpQCat" style="width:200px;flex:none">
          <option value="all">ทุกหมวดสินค้า</option>
          ${(DB.categories||[]).map(c=>`<option value="${esc(c)}"${st.cat===c?' selected':''}>${esc(c)}</option>`).join('')}
          ${SRC.some(p=>!p.cat)?`<option value="__none__"${st.cat==='__none__'?' selected':''}>ไม่ระบุหมวด</option>`:''}
        </select>
      </div>
      <div class="tablewrap" style="max-height:calc(52vh/var(--z));border:1px solid var(--line);border-radius:6px">
        <table class="tbl"><thead><tr><th>รหัสสินค้า</th><th style="width:110px">OEM</th>
          <th style="width:150px">หมวดสินค้า</th><th>ชื่อสินค้า</th>
          <th class="num" style="width:80px">คงเหลือ</th>${canCost()?'<th class="num" style="width:96px">ต้นทุน</th>':''}
          <th style="width:76px"></th></tr></thead><tbody>
        ${list.length ? list.map(p=>`<tr>
          <td>${tagHTML(p)}</td><td class="mono" style="font-size:12px;color:var(--ink-3)">${esc(p.oem||'-')}</td>
          <td style="font-size:12.5px;color:${p.cat?'var(--ink-2)':'var(--ink-3)'}">${esc(p.cat||'—')}</td>
          <td>${esc(p.name)}</td>
          <td class="num mono" style="color:${num(p.qty)<=0?'var(--danger)':'var(--ink)'}">${num(p.qty)}</td>
          ${canCost()?`<td class="num mono">${money(p.cost)}</td>`:''}
          <td style="text-align:right"><button class="btn sm primary" data-cadd="${p.id}">เพิ่ม</button></td></tr>`).join('')
          : `<tr><td colspan="${canCost()?7:6}" class="empty">ไม่พบสินค้าที่ตรงกับการค้นหา</td></tr>`}
        </tbody></table></div>`;
  };
  const bind = ()=>{
    $('#cpQ').oninput = e=>{ st.kw=e.target.value; $('#mBody').innerHTML = render();
      const el=$('#cpQ'); el.focus(); el.setSelectionRange(st.kw.length, st.kw.length); bind(); };
    $('#cpQCat').onchange = e=>{ st.cat=e.target.value; $('#mBody').innerHTML = render(); bind(); };
    $$('[data-cadd]').forEach(b=>b.onclick=()=>{
      const p = DB.products.find(x=>x.id===b.dataset.cadd);
      const ex = curClaim.items.find(it=>it.pid===p.id);
      if(ex) ex.qty = num(ex.qty)+1;
      else curClaim.items.push({pid:p.id, code:p.code, name:p.name, unit:p.unit||'', qty:1, cost:num(p.cost)});
      renderClaimForm(); toast('เพิ่ม '+p.name+' แล้ว');
    });
  };
  openModal('ดึงสินค้าจากทะเบียน', render(), [{label:'ปิด', cls:'btn', act:closeModal}]);
  $('#scrim .modal').classList.add('wide');
  bind();
}

/* ดึงลูกค้าเข้าใบเคลม */
function pickClaimCustModal(){
  const vend = claimSideOf(curClaim) === 'vendor';
  /* refList('customers') กรองเหลือเฉพาะลูกค้าไปแล้ว ฝั่งผู้ขายจึงต้องดึงอีกชุด */
  const SRC = vend ? refList('vendors') : refList('customers');
  const render = (kw='')=>{
    const k = kw.toLowerCase();
    const list = SRC.filter(c=>
      (!k || `${c.code} ${custName(c)} ${c.tel||''}`.toLowerCase().includes(k))).slice(0,60);
    return `
      <div class="search" style="margin-bottom:10px"><input class="in" id="ccQ" value="${esc(kw)}"
        placeholder="ชื่อ / รหัส / โทรศัพท์ / ทะเบียนรถ"></div>
      <div class="tablewrap" style="max-height:360px;overflow:auto">
        <table class="tbl"><thead><tr><th style="width:90px">รหัส</th><th>ชื่อ</th>
          <th style="width:150px">${vend?'โทรศัพท์':'รถ'}</th><th style="width:76px"></th></tr></thead><tbody>
        ${list.length ? list.map(c=>{
          const v = (c.vehicles||[])[0];
          return `<tr><td class="mono">${esc(c.code)}</td><td>${esc(custName(c))}</td>
          <td style="font-size:12px">${vend ? esc(c.tel||'-')
            : (v?esc([v.brand,v.model].filter(Boolean).join(' ')):'-')}</td>

/* =====================================================================
   05.5 ตรวจนับสต๊อก — ทะเบียนใบตรวจนับ
   ---------------------------------------------------------------------
   ใบซื้อที่รับของเข้าสต๊อกแล้วยกเลิกไม่ได้ ถ้าจำนวนไม่ตรงกับของจริง
   ให้เปิดใบตรวจนับ เลือกเฉพาะรายการที่จะนับ กรอกจำนวนที่นับได้ แล้วกดปรับยอด
   ใบที่ยังไม่ปรับยอดเก็บเป็นร่าง เปิดกลับมานับต่อวันหลังได้
   ทุกการปรับถูกบันทึกลงประวัติความเคลื่อนไหวของสินค้าพร้อมเลขที่ใบตรวจนับ
   ===================================================================== */
let curCount = null;
let ctScanVal = '';        /* ข้อความที่ค้างในช่องยิง — เก็บไว้เฉพาะตอนหาไม่เจอ */
let ctScanMsg = null;      /* ผลการยิงครั้งล่าสุด แสดงใต้ช่อง */
let ctFocusScan = false;   /* วาดใหม่แล้วให้เคอร์เซอร์กลับไปที่ช่องยิง รอยิงชิ้นถัดไป */

/* ยิงบาร์โค้ดหรือพิมพ์รหัสแล้วกด Enter — หาสินค้าแล้วดันขึ้นบนสุดของใบทันที
   ยิงซ้ำตัวเดิมคือนับเพิ่มทีละ 1 ตามจำนวนชิ้นที่ยิงจริง */
function countScan(v){
  const c = curCount;
  if(!c || c.applied) return;
  v = String(v||'').trim();
  if(!v) return;
  const V = v.toUpperCase();
  let p = DB.products.find(x=>String(x.barcode||'').toUpperCase() === V)
       || DB.products.find(x=>String(x.code||'').toUpperCase()    === V)
       || DB.products.find(x=>String(x.oem||'').toUpperCase()     === V);
  if(!p){
    const hits = DB.products.filter(x=>[x.code,x.oem,x.name,x.barcode]
      .some(y=>String(y||'').toUpperCase().includes(V)));
    if(hits.length === 1) p = hits[0];
    else if(hits.length > 1){
      ctScanVal = v; ctScanMsg = {t:'many', v:v, n:hits.length};
      ctFocusScan = true; renderCountForm(); return;
    }
  }
  if(!p){
    ctScanVal = v; ctScanMsg = {t:'none', v:v};
    ctFocusScan = true; renderCountForm(); return;
  }
  c.items = c.items || [];
  const i = c.items.findIndex(x=>x.pid === p.id);
  let it;
  if(i < 0){
    it = {pid:p.id, code:p.code, name:p.name, unit:p.unit||'',
          sys:num(p.qty), cnt:'1', cost:num(p.cost)};
    ctScanMsg = {t:'add', code:p.code, name:p.name, n:1, unit:p.unit||''};
  } else {
    it = c.items.splice(i,1)[0];
    it.cnt = String(Math.round((num(it.cnt) + 1)*1000)/1000);
    ctScanMsg = {t:'inc', code:p.code, name:p.name, n:num(it.cnt), unit:p.unit||''};
  }
  c.items.unshift(it);          /* ตัวที่เพิ่งยิงอยู่แถวแรกเสมอ จะได้เห็นทันทีไม่ต้องเลื่อนหา */
  ctScanVal = ''; ctFocusScan = true;
  renderCountForm();
}
function ctScanBar(){
  const m = ctScanMsg;
  if(!m) return '';
  const box = (bg, bd, col, html) => `<div style="margin:-4px 0 12px;padding:8px 13px;border-radius:7px;
    background:${bg};border:1px solid ${bd};color:${col};font-size:13px">${html}</div>`;
  if(m.t === 'none')
    return box('#FBE9E7','#F0C0B8','var(--danger)',
      `ไม่พบสินค้าที่บาร์โค้ดหรือรหัส <b class="mono">${esc(m.v)}</b> — ตรวจว่าลงทะเบียนบาร์โค้ดไว้แล้วหรือยัง ที่หน้า 05.1`);
  if(m.t === 'many')
    return box('#FCF3E2','#EEDBB4','var(--warn)',
      `พบ ${m.n} รายการที่ตรงกับ <b class="mono">${esc(m.v)}</b> — กด “ดึงสินค้ามาตรวจนับ” เพื่อเลือกให้ชัด`);
  return box('#E7F4EF','#BFE3D6','var(--ok)',
    `${m.t === 'add' ? 'เพิ่ม' : 'นับเพิ่ม'} <b class="mono">${esc(m.code)}</b> ${esc(m.name)}
     — นับได้จริงตอนนี้ <b>${qtyTxt(m.n)} ${esc(m.unit||'')}</b>`);
}

/* ส่วนต่าง = จำนวนที่นับได้ − จำนวนที่ระบบว่ามี · คืน null ถ้ายังไม่ได้กรอก */
const ctDiff  = it => (it.cnt === undefined || String(it.cnt).trim() === '') ? null
                    : Math.round((num(it.cnt) - num(it.sys))*1000)/1000;
const ctDone  = c => (c.items||[]).filter(it => ctDiff(it) !== null);
const ctOff   = c => (c.items||[]).filter(it => { const d = ctDiff(it); return d !== null && Math.abs(d) > 0.0005; });
const ctValue = c => ctOff(c).reduce((s,it)=>s + ctDiff(it)*num(it.cost), 0);

async function saveCount(tell){
  const c = curCount; if(!c) return;
  if(!requireLicense()) return;
  if(blockEdit('stock','count','ใบตรวจนับ')) return;
  if(!(c.items||[]).length) return toast('ยังไม่มีรายการในใบตรวจนับ');
  c.by = c.by || userLabel();
  stampEdit(c);
  const copy = JSON.parse(JSON.stringify(c));
  DB.counts = DB.counts || [];
  const i = DB.counts.findIndex(x=>x.id===c.id);
  if(i>=0) DB.counts[i] = copy; else DB.counts.push(copy);
  await saveSome('counts');
  renderCount();
  if(tell) savedPop(`บันทึกใบตรวจนับ ${c.no} แล้ว — กรอกแล้ว ${ctDone(c).length} จาก ${c.items.length} รายการ`);
}

async function applyCount(){
  const c = curCount; if(!c) return;
  if(!requireLicense()) return;
  if(blockEdit('stock','count','ใบตรวจนับ')) return;
  const off = ctOff(c);
  if(!off.length) return toast('ยังไม่มีรายการที่นับได้ต่างจากระบบ');
  const val  = ctValue(c);
  const up   = off.filter(it=>ctDiff(it) > 0).length;
  const ok = await confirmPop(
    `ปรับยอดสินค้า ${off.length} รายการตามใบตรวจนับ ${c.no}?\n\n` +
    `รับเข้าเพิ่ม ${up} รายการ · ตัดออก ${off.length-up} รายการ\n` +
    (canCost() ? `มูลค่าส่วนต่างรวม ${val<0?'−':''}${money(Math.abs(val))} บาท\n` : '') +
    `\nสต๊อกจะถูกปรับให้ตรงกับจำนวนที่นับได้ ทุกรายการบันทึกลงประวัติความเคลื่อนไหว และย้อนกลับเองไม่ได้`);
  if(!ok) return;

  const d = c.date || today();
  const note = `ใบตรวจนับ ${c.no}` + (String(c.note||'').trim() ? ' — ' + String(c.note).trim() : '');
  off.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.pid); if(!p) return;
    it.sys = num(p.qty);                                   /* ตรึงยอดระบบ ณ เวลาที่ปรับจริง */
    const diff = Math.round((num(it.cnt) - num(p.qty))*1000)/1000;
    if(Math.abs(diff) < 0.0005) return;
    if(diff > 0) lotAdd(p, diff, num(p.cost), d); else lotConsume(p, -diff);
    recordMove(p.id, diff > 0 ? 'in' : 'out', Math.abs(diff),
      {cost:num(p.cost), date:d, kind:'count', note:note});
    p.lastMove = d;
  });
  c.applied = true;
  c.by = c.by || userLabel();
  stampEdit(c);
  const copy = JSON.parse(JSON.stringify(c));
  DB.counts = DB.counts || [];
  const i = DB.counts.findIndex(x=>x.id===c.id);
  if(i>=0) DB.counts[i] = copy; else DB.counts.push(copy);
  await saveSome('counts', 'products', 'moves');
  curCount = copy;
  renderCountForm(); renderCount();
  savedPop(`ปรับยอด ${off.length} รายการตามใบตรวจนับ ${c.no} แล้ว` +
    (canCost() ? ` · ส่วนต่างรวม ${val<0?'−':''}${money(Math.abs(val))} บาท` : ''));
}

  const render = ()=>{
    const q = st.kw.toLowerCase();
    const list = SRC.filter(p=>{
      if(st.cat!=='all' && (p.cat||'') !== (st.cat==='__none__' ? '' : st.cat)) return false;

    });
    return `
      <div style="display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
        <div class="search" style="flex:1;min-width:220px"><input class="in" id="ctpQ" placeholder="รหัสสินค้า / OEM / ชื่อสินค้า" value="${esc(st.kw)}"></div>

          ${SRC.some(p=>!p.cat)?`<option value="__none__"${st.cat==='__none__'?' selected':''}>ไม่ระบุหมวด</option>`:''}
        </select>
        <button class="btn primary" id="ctpAll">เพิ่มทั้งหมดที่เห็น (${list.length})</button>
      </div>
      <div class="tablewrap" style="max-height:calc(50vh/var(--z));border:1px solid var(--line);border-radius:6px">
        <table class="tbl"><thead><tr><th style="width:124px">รหัสสินค้า</th>
          <th style="width:150px">หมวดสินค้า</th><th>ชื่อสินค้า</th>
          <th class="num" style="width:86px">คงเหลือ</th>
          <th style="width:80px"></th></tr></thead><tbody>
        ${list.length ? list.map(p=>`<tr>
          <td>${tagHTML(p)}</td>
          <td style="font-size:12.5px;color:${p.cat?'var(--ink-2)':'var(--ink-3)'}">${esc(p.cat||'—')}</td>
          <td>${esc(p.name)}<span style="color:var(--ink-3);font-size:12px"> · ${esc(p.unit||'ชิ้น')}</span></td>
          <td class="num mono">${qtyTxt(p.qty)}</td>
          <td style="text-align:right">${has(p.id)
            ? '<span class="chip ok">เลือกแล้ว</span>'
            : `<button class="btn sm primary" data-ctadd="${p.id}">เพิ่ม</button>`}</td></tr>`).join('')
          : `<tr><td colspan="5" class="empty">ไม่พบสินค้าที่ตรงกับการค้นหา</td></tr>`}
        </tbody></table></div>`;
  };
  const bind = ()=>{
    $('#ctpQ').oninput = e=>{ st.kw = e.target.value; $('#mBody').innerHTML = render();
      const el = $('#ctpQ'); el.focus(); el.setSelectionRange(st.kw.length, st.kw.length); bind(); };
    /* ยิงบาร์โค้ดหรือพิมพ์รหัสแล้วกด Enter ในหน้าต่างนี้ก็เพิ่มได้เลย
       เพิ่มเสร็จล้างคำค้นให้ รายการกลับมาเต็ม พร้อมรับชิ้นถัดไปทันที */
    $('#ctpQ').onkeydown = e=>{
      if(e.key !== 'Enter') return;
      e.preventDefault(); e.stopPropagation();
      const v = st.kw.trim(); if(!v) return;
      const V = v.toUpperCase();
      const hit = SRC.find(p=>String(p.barcode||'').toUpperCase() === V)
               || SRC.find(p=>String(p.code||'').toUpperCase()    === V)
               || (()=>{ const h = SRC.filter(p=>[p.code,p.oem,p.name,p.barcode]
                     .some(y=>String(y||'').toUpperCase().includes(V)));
                   return h.length === 1 ? h[0] : null; })();
      if(!hit) return toast('ไม่พบสินค้าที่ตรงกับ ' + v + ' — พิมพ์ให้ตรงขึ้นหรือเลือกจากรายการ');
      const p = DB.products.find(x=>x.id===hit.id) || hit;
      const fresh = addOne(p);
      renderCountForm();
      st.kw = ''; $('#mBody').innerHTML = render(); bind();
      const el = $('#ctpQ'); if(el) el.focus();
      toast(fresh ? 'เพิ่ม ' + p.code + ' ' + p.name + ' แล้ว' : p.code + ' อยู่ในใบตรวจนับอยู่แล้ว');
    };
    $('#ctpCat').onchange = e=>{ st.cat = e.target.value; $('#mBody').innerHTML = render(); bind(); };

      const q = st.kw.toLowerCase();

        if(st.cat!=='all' && (p.cat||'') !== (st.cat==='__none__' ? '' : st.cat)) return false;
        return !q || [p.code,p.oem,p.name,p.barcode,p.cat].some(v=>String(v||'').toLowerCase().includes(q));
      });
      let n = 0; list.forEach(p=>{ if(addOne(DB.products.find(x=>x.id===p.id) || p)) n++; });
      renderCountForm(); $('#mBody').innerHTML = render(); bind();
      toast(n ? `เพิ่ม ${n} รายการเข้าใบตรวจนับแล้ว` : 'รายการที่เห็นถูกเลือกไว้หมดแล้ว');
    };
    $$('[data-ctadd]').forEach(b=>b.onclick = ()=>{
      const p = DB.products.find(x=>x.id===b.dataset.ctadd); if(!p) return;
      addOne(p); renderCountForm(); $('#mBody').innerHTML = render(); bind();
      toast('เพิ่ม '+p.name+' แล้ว');
    });
  };
  openModal('ดึงสินค้ามาตรวจนับ', render(), [{label:'เสร็จแล้ว', cls:'btn primary', act:closeModal}]);
  $('#scrim .modal').classList.add('wide');
  bind();
}

function renderStockMenu(){

  const onlyStk = firstAllowedSub('stock');
  if(onlyStk && stockTab !== onlyStk) stockTab = onlyStk;
  const n = pendingCount();
  $('#stkTabs').innerHTML = subtabBarM('stock', 'สินค้า',
    STOCK_TABS.filter(t=>canSub('stock', t[0])).map(([k,no,l])=>
      [k, no, k==='pending' && n ? `${l}<span class="badge">${n}</span>` : l]),
    stockTab,
    stockTab==='list' ? `
      ${canEditTab('stock','list')? actCard('addProd',   {ic:'addBox', c:'#2E8B3D'}, '+ เพิ่มสินค้า',        'ลงทะเบียนอะไหล่ใหม่', 'go') : ''}
      ${canEditTab('stock','list')? actCard('prodTools',  {ic:'tools',  c:'#5A6B76'}, 'จัดการข้อมูลสินค้า',   'หมวดหมู่สินค้า') : ''}
      ${canExportTab('stock','list')? actCard('prodPrint', {ic:'printer', c:'#1F5FBF'}, 'พิมพ์ใบตรวจนับ', 'PDF / Excel ถือไปเดินนับ') : ''}
      <input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">` : '');
  $$('#stkTabs button[data-t]').forEach(b=>b.onclick=()=>{ stockTab=b.dataset.t; renderStockMenu(); });
  $('#view-stocklist').style.display = stockTab==='list'    ? '' : 'none';
  $('#view-pending').style.display   = stockTab==='pending' ? '' : 'none';
  if($('#view-claim'))  $('#view-claim').style.display  = stockTab==='claim'  ? '' : 'none';
  if($('#view-vclaim')) $('#view-vclaim').style.display = stockTab==='vclaim' ? '' : 'none';
  if($('#view-count'))  $('#view-count').style.display  = stockTab==='count'  ? '' : 'none';
  if(stockTab==='count'){ renderCount(); return; }
  if(stockTab==='claim')  return renderClaim('customer');
  if(stockTab==='vclaim') return renderClaim('vendor');
  if(stockTab==='list'){
    renderStock();
    if($('#prodTools')) $('#prodTools').onclick = productToolsModal;
    if($('#prodPrint')) $('#prodPrint').onclick = printSheetModal;
    $('#csvFile').onchange  = handleProductCSVImport;
    if($('#addProd')) $('#addProd').onclick = ()=>{
      if(DB.products.length >= MAX_PRODUCTS)
        return toast(`ทะเบียนสินค้าเต็มแล้ว ${MAX_PRODUCTS.toLocaleString()} รายการ — ลบรายการที่เลิกใช้ก่อน`);
      productModal(null);
    };
  } else renderPending();
}

/* สร้างการ์ดหนึ่งใบ */
function menuCard(o){
  const g = o.icon || {ic:'box', c:'#5A6B76'};
  return `<button class="mcard" ${o.attr||''} aria-pressed="${!!o.on}" title="${esc(o.t2||o.t1)}">
    ${o.no?`<span class="no">${o.no}</span>`:''}
    ${o.badge?`<span class="bdg">${o.badge}</span>`:''}
    <span class="ico">${IC[g.ic](g.c)}</span>
    <span class="t1">${o.t1}</span>
    ${o.t2?`<span class="t2">${o.t2}</span>`:''}
  </button>`;
}

/* แถบเมนูย่อย — การ์ดพร้อมไอคอนประจำเมนู */
function subtabBar(title, tabs, cur, extra, menuKey){
  return `<div class="ttl">${title}</div>` +
    tabs.map(([k,no,label])=>{
      const g = SUB_ICON[(menuKey||'')+':'+k];
      return `<button data-t="${k}" aria-pressed="${cur===k}">
        ${g ? `<span class="si">${IC[g.ic](g.c)}</span>` : ''}
        <span class="sw"><u>${no}</u><span class="sl">${label}</span></span>
      </button>`;
    }).join('') +
    (extra ? `<div class="acts">${extra}</div>` : '');
}

/* เรียก subtabBar พร้อมระบุเมนูหลัก เพื่อให้เลือกไอคอนได้ */
/* ตารางที่ติดคลาส ctbl จะกลายเป็นการ์ดบนจอเล็ก
   CSS อ่านชื่อคอลัมน์จาก data-lb ของแต่ละช่อง จึงต้องติดป้ายให้ก่อนด้วย JS
   ทำครั้งเดียวหลังหน้าจอวาดเสร็จ แล้วเฝ้าดูการเปลี่ยนแปลงต่อไปเอง */
function cardLabels(root){
  (root || document).querySelectorAll('table.ctbl').forEach(t=>{
    const hs = [...t.querySelectorAll('thead th')].map(h=>h.textContent.replace(/\s+/g,' ').trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.cells].forEach((td,i)=>{
        if(td.dataset.lb !== undefined) return;
        const lb = hs[i] || '';
        if(lb) td.dataset.lb = lb;
      });
    });
  });
}
let cardTimer = null;
new MutationObserver(()=>{ clearTimeout(cardTimer); cardTimer = setTimeout(cardLabels, 60); })
  .observe(document.documentElement, {childList:true, subtree:true});

function subtabBarM(menuKey, title, tabs, cur, extra){
  return subtabBar(title, tabs, cur, extra, menuKey);
}

/* การ์ดปุ่มทำงานในแถบข้าง */
function actCard(id, icon, label, desc, cls, attr){
  const g = icon || {ic:'gear', c:'#5A6B76'};
  return `<button class="actcard ${cls||''}" id="${id}" ${attr||''}>
    <span class="si">${IC[g.ic](g.c)}</span>
    <span class="sw"><span class="sl">${label}</span>${desc?`<span class="sd">${desc}</span>`:''}</span>
  </button>`;
}

function renderIncome(){
  if(!$('#incTabs')) return;
  const onlyInc = firstAllowedSub('income');
  if(onlyInc && incomeTab !== onlyInc){ incomeTab = onlyInc; curRec = null; }
  salesHost = incomeTab==='invoice' ? 'invForm' : 'rcForm';
  salesSide = 'rcSide';
  $('#incTabs').innerHTML = subtabBarM('income', 'รายรับ', INCOME_TABS.filter(t=>canSub('income', t[0])), incomeTab, '');
  $$('#incTabs button[data-t]').forEach(b=>b.onclick=()=>{
    if(b.dataset.t!==incomeTab) curRec = null;
    incomeTab = b.dataset.t; renderIncome();
  });
  if($('#blankForm')) $('#blankForm').onclick = e=>blankFormModal(e.currentTarget.dataset.bf);
  ['quote','invoice','receipt','billing'].forEach(k=>{
    const el = $('#view-'+k); if(!el) return;
    el.style.display = incomeTab===k ? '' : 'none';
  });
  if(incomeTab==='quote')        renderQuote();
  else if(incomeTab==='invoice') renderInvoice();
  else if(incomeTab==='receipt') renderReceipt();
  else                           renderBilling();
}

  if($('#blankForm')) $('#blankForm').onclick = e=>blankFormModal(e.currentTarget.dataset.bf);
  $('#view-purchase').style.display    = expenseTab==='purchase' ? '' : 'none';
  $('#view-expenselist').style.display = expenseTab==='expense'  ? '' : 'none';
  if(expenseTab==='purchase') renderPoRecord();
  else                        renderExpenseList();
}

/* =====================================================================
   ตัวควบคุมหน้าจอ
   ===================================================================== */
const VIEWS = {
  home:    {title:'หน้าแรก', sub:'สรุปยอดขาย ลูกหนี้ เจ้าหนี้ สินค้าที่ต้องสั่งซื้อ และภาษี', render:renderHome, actions:''},
  stock:   {title:'สินค้า', sub:'ทะเบียนสินค้าและสต๊อก พร้อมรายการที่ยังไม่ได้ลงทะเบียน', render:renderStockMenu, actions:''},
  customer:{title:'ข้อมูลลูกค้า / ผู้ขาย', sub:'ทะเบียนผู้ติดต่อทั้งฝั่งลูกค้าและผู้ขาย พร้อมรถที่ดูแล ประวัติซื้อขาย และยอดค้าง', render:renderCustomer,
            actions: ''},

  income:  {title:'รายรับ', sub:'ใบเสนอราคา ใบอนุมัติซ่อม และใบเสร็จรับเงิน', render:renderIncome, actions:''},
  expense: {title:'รายจ่าย', sub:'ซื้อสินค้าเข้าร้าน และบันทึกค่าใช้จ่ายของกิจการ', render:renderExpense, actions:''},
  finance: {title:'บัญชี / การเงิน', sub:'ยอดขาย ลูกหนี้ เจ้าหนี้ และงบกำไรขาดทุน', render:renderFinance, actions:''},
  settings:{title:'ตั้งค่าร้าน', sub:'ข้อมูลที่ใช้พิมพ์บนหัวเอกสารทุกฉบับ', render:renderSettings, actions:''},
  license: {title:'ลิขสิทธิ์การใช้งาน', sub:`ทดลองใช้ฟรี ${TRIAL_DAYS} วัน จากนั้นค่าบริการปีละ ${PRICE_YEAR.toLocaleString()} บาท (ยังไม่รวม VAT 7%)`, render:renderLicense, actions:''}
};
/* ---------- เมนูย่อยแบบกางจากเมนูหลัก ---------- */
const DROP_MENUS = {
  income:  {title:'รายรับ',            tabs:()=>INCOME_TABS,  cur:()=>incomeTab,  set:v=>{ incomeTab=v; }},
  expense: {title:'รายจ่าย',           tabs:()=>EXPENSE_TABS, cur:()=>expenseTab, set:v=>{ expenseTab=v; }},
  stock:   {title:'สินค้า',            tabs:()=>STOCK_TABS,   cur:()=>stockTab,   set:v=>{ stockTab=v; }},
  finance: {title:'บัญชี / การเงิน',   tabs:()=>FIN_TABS,     cur:()=>finTab,     set:v=>{ finTab=v; }},
  settings:{title:'ตั้งค่าร้าน',        tabs:()=>SETTINGS_TABS, cur:()=>settingsTab, set:v=>{ settingsTab=v; }},
};
function closeDrops(except){
  $$('.mi').forEach(el=>{ if(el !== except) el.classList.remove('open'); });
}
function paintDrop(key){
  const host = $(`.mi[data-mi="${key}"] .mmenu`); if(!host) return;
  host.classList.add('cards');
  const M = DROP_MENUS[key], cur = M.cur();
  host.innerHTML = `<div class="mhd">${M.title}</div><div class="mcards">` +
    M.tabs().filter(t=>canSub(key, t[0])).map(([k,no,label])=>{
      const n = (key==='stock' && k==='pending') ? pendingCount() : 0;
      return menuCard({t1:label, t2:SUB_DESC[key+':'+k]||'', no, badge:n,
        icon:SUB_ICON[key+':'+k], on:cur===k, attr:`data-sub="${k}"`});
    }).join('') + `</div>`;
  $$(`.mi[data-mi="${key}"] .mmenu button`).forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    closeDrops();
    M.set(b.dataset.sub);
    go(key);
  });
}
/* วางกรอบให้อยู่ใต้ปุ่ม และดันกลับเข้าจอถ้าล้นขอบขวา */
function placeDrop(el){
  const menu = el.querySelector('.mmenu'); if(!menu) return;
  const r = el.querySelector('.navbtn').getBoundingClientRect();
  menu.style.top = (r.bottom + 7) + 'px';
  menu.style.left = '0px';
  const w = menu.getBoundingClientRect().width;
  const pad = 10;
  let left = r.left;
  if(left + w > window.innerWidth - pad) left = Math.max(pad, window.innerWidth - pad - w);
  if(window.innerWidth < 640){ left = pad; menu.style.width = (window.innerWidth - pad*2) + 'px'; }
  menu.style.left = left + 'px';
  menu.style.setProperty('--arrow', Math.max(12, Math.min(r.left - left + r.width/2 - 5, w - 24)) + 'px');
}

function bindDrops(){
  $$('.mi').forEach(el=>{
    const key = el.dataset.mi;
    el.querySelector('.navbtn').onclick = e=>{
      e.stopPropagation();
      const wasOpen = el.classList.contains('open');
      closeDrops();
      if(wasOpen){ go(key); return; }        /* กดซ้ำ = เข้าเมนูนั้นเลย */
      paintDrop(key);
      el.classList.add('open');
      placeDrop(el);
    };
  });
  document.addEventListener('click', ()=>closeDrops());
  window.addEventListener('resize', ()=>closeDrops());
  window.addEventListener('scroll', ()=>closeDrops(), true);
}

/* ---------- ประวัติหน้าที่เปิด ---------- */
const NAV = [];                 /* กองซ้อน — ตัวท้ายคือหน้าปัจจุบัน */
let navLock = false;            /* กันบันทึกซ้ำตอนกดย้อนกลับ */

/* จุดที่อยู่ปัจจุบันของผู้ใช้ ใช้เทียบว่าเปลี่ยนหน้าจริงหรือไม่ */
function navSpot(){
  const v = ($$('.view').find(x=>x.classList.contains('on')) || {}).id || '';
  const sub = ({'view-income':incomeTab, 'view-expense':expenseTab,
                'view-stock':stockTab, 'view-finance':finTab})[v] || '';
  return {v, sub};
}
function navLabel(sp){
  const M = {'view-home':'หน้าแรก', 'view-custbody':'ข้อมูลลูกค้า', 'view-customer':'ข้อมูลลูกค้า',
             'view-settings':'ตั้งค่าร้าน', 'view-license':'ลิขสิทธิ์'};
  if(M[sp.v]) return M[sp.v];
  const key = ({'view-income':'income','view-expense':'expense',
                'view-stock':'stock','view-finance':'finance'})[sp.v];
  if(key){
    const t = (subTabsOf(key)||[]).find(x=>x[0]===sp.sub);
    return t ? t[2] : (PERMS.find(p=>p[0]===key)||[])[1] || '';
  }
  return 'หน้าก่อนหน้า';
}
function navPush(){
  if(navLock) return;
  const sp = navSpot();
  if(!sp.v) return;
  const last = NAV[NAV.length-1];
  if(last && last.v === sp.v && last.sub === sp.sub) return;   /* หน้าเดิม ไม่ต้องบันทึก */
  NAV.push(sp);
  if(NAV.length > 40) NAV.shift();
  paintBackFab();
}
function paintBackFab(){
  const fab = $('#backFab'); if(!fab) return;
  const prev = NAV[NAV.length-2];
  const modal = $('#scrim').classList.contains('on');
  fab.hidden = false;                       /* แสดงเสมอตามที่ผู้ใช้ต้องการ */
  fab.classList.toggle('idle', !prev && !modal);
  fab.title = modal ? 'ปิดหน้าต่างนี้'
            : prev ? 'กลับไปยัง ' + navLabel(prev)
                   : 'ไม่มีหน้าก่อนหน้า — กดเพื่อกลับหน้าแรก';
  const w = $('#backWhere');
  if(w) w.textContent = modal ? 'ปิดหน้าต่าง' : prev ? navLabel(prev) : 'หน้าแรก';
}
/* กลับไปยังจุดที่บันทึกไว้ */
function navTo(sp){
  navLock = true;
  try{
    const key = ({'view-income':'income','view-expense':'expense',
                  'view-stock':'stock','view-finance':'finance'})[sp.v];
    if(key && sp.sub){
      if(key==='income'){ incomeTab = sp.sub; curRec = null; }
      if(key==='expense'){ expenseTab = sp.sub; curPo = null; curEx = null; }
      if(key==='stock'){ stockTab = sp.sub; curClaim = null; }
      if(key==='finance') finTab = sp.sub;
    }
    go(({'view-home':'home', 'view-custbody':'customer', 'view-customer':'customer',
         'view-settings':'settings', 'view-license':'license',
         'view-income':'income', 'view-expense':'expense',
         'view-stock':'stock', 'view-finance':'finance'})[sp.v] || 'home');
  } finally { navLock = false; }
  paintBackFab();
}
function navBack(){
  /* มีหน้าต่างเปิดอยู่ → ปิดหน้าต่างก่อน */
  if($('#scrim').classList.contains('on')){ closeModal(); paintBackFab(); return; }
  if(NAV.length < 2) return toast('อยู่ที่หน้าแรกสุดแล้ว');
  NAV.pop();
  navTo(NAV[NAV.length-1]);
}

function go(v){
  closeDrops();
  setTimeout(()=>bindCombos(), 0);
  /* ชื่อหน้าเดิมยังใช้เรียกได้ ระบบจะพาไปยังแท็บย่อยที่ถูกต้อง */
  if(v==='claim'){ stockTab = 'claim'; v = 'stock'; }
  if(v==='import'){ settingsTab = 'import'; v = 'settings'; }
  if(['quote','receipt','invoice','billing'].includes(v)){ incomeTab = v; v = 'income'; }
  else if(v==='invlist'){ incomeTab = 'invoice'; v = 'income'; }
  else if(v==='receiptlist'){ incomeTab = 'receipt'; v = 'income'; }
  else if(v==='purchase'){ expenseTab = 'purchase'; v = 'expense'; }
  else if(v==='polist'){ expenseTab = 'purchase'; v = 'expense'; }
  else if(v==='expenselist'){ expenseTab = 'expense'; v = 'expense'; }
  else if(v==='exlist'){ expenseTab = 'expense'; v = 'expense'; }
  $$('.view').forEach(s=>s.classList.remove('on'));
  $('#view-'+v).classList.add('on');
  $$('.navbtn').forEach(b=>b.setAttribute('aria-current', String(b.dataset.view===v)));
  $('#viewTitle').textContent = VIEWS[v].title;
  $('#viewSub').textContent = VIEWS[v].sub;
  $('#topActions').innerHTML = VIEWS[v].actions;
  VIEWS[v].render();

  if($('#blankForm')) $('#blankForm').onclick = e=>blankFormModal(e.currentTarget.dataset.bf||'quote');
  paintLicBadge();
  applyPerms();
  navPush();
}
$$('.navbtn').forEach(b=>{ if(!b.closest('.mi')) b.onclick=()=>go(b.dataset.view); });
bindDrops();
/* ยอมย้อนกลับเฉพาะการกดที่เริ่มต้นบนปุ่มนี้จริง —
   กันเหตุการณ์กดที่ browser ส่งตกมาโดนหลังหน้าจอเพิ่งวาดใหม่ */
(function(){
  const fab = $('#backFab');
  let armed = false;

  /* จอสัมผัส: นับว่า "โดนปุ่ม" เฉพาะจุดแตะในรัศมีลูกศรกลางปุ่มเท่านั้น
     เมาส์/ปากกาชี้แม่น กดได้ทั้งปุ่ม · Enter จากแป้นพิมพ์ใช้ได้เสมอ */
  function onArrow(e){
    if(e.detail === 0 && e.type === 'click') return true;      /* แป้นพิมพ์ */
    if(e.pointerType && e.pointerType !== 'touch') return true; /* เมาส์/ปากกา */
    if(typeof e.clientX !== 'number') return false;
    const rc = fab.getBoundingClientRect();
    const dx = e.clientX - (rc.left + rc.width/2);
    const dy = e.clientY - (rc.top + rc.height/2);
    const r  = 17;                                              /* รัศมีลูกศร */
    return (dx*dx + dy*dy) <= r*r;
  }

  fab.addEventListener('pointerdown', e=>{ armed = onArrow(e); });
  document.addEventListener('pointerdown', e=>{
    if(!e.target.closest('#backFab')) armed = false;
  }, true);
  fab.onclick = e=>{
    if(!armed || !onArrow(e)) { armed = false; return; }
    armed = false; navBack();
  };
  /* กำลังเลื่อนหน้า = หลบให้ปุ่มเนื้อหากดได้ก่อน หยุดนิ่งครู่หนึ่งค่อยกลับมา */
  let idleT = null;
  window.addEventListener('scroll', ()=>{
    fab.classList.add('dodge');
    clearTimeout(idleT);
    idleT = setTimeout(()=>fab.classList.remove('dodge'), 850);
  }, {passive:true});
})();
document.addEventListener('keydown', e=>{
  if(e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); navBack(); }
});

(async function init(){
  STORAGE_MODE = detectStorage();
  await loadDB();

    `<button class="licbadge" id="userChip" onclick="switchUserModal()" style="background:rgba(255,255,255,.06)"></button>` +
    `<button class="licbadge" id="licBadge" onclick="go('license')"></button>`;
  go('home');
  paintLicBadge();
  applyPerms();
  const st = licStatus();
  if(st.mode==='expired') go('license');
  else if(st.mode==='trial' && st.left<=3) toast(`ทดลองใช้เหลืออีก ${st.left} วัน — ต่ออายุได้ที่เมนูลิขสิทธิ์การใช้งาน`);
})();
