<style>
:root{
  --ink:#16202B;
  --ink-2:#43535F;
  --ink-3:#7C8B96;
  --line:#D5DDE2;
  --line-2:#E9EEF1;
  --surface:#F3F7F5;
  --panel:#FFFFFF;
  --steel:#1D8A5F;            /* เขียวหลักของระบบ */
  --steel-dk:#0F5C3E;         /* เขียวเข้ม */
  --steel-soft:#E9F8F0;       /* เขียวสว่าง — พื้นตอนชี้เมาส์/ถูกเลือก */
  --navy:#1B2A4A;             /* สีกรมท่า — กรอบการ์ดตอนปกติ */
  --grn-hi:#D8F5E6;           /* เขียวสว่างเน้น */

  --brand-green:#37B554;
  --brand-yellow:#FFEF5B;

  --flag-min-bg:#F6D264;      /* ถึงจุดสั่งซื้อ (Min) */
  --flag-min-ink:#5E4400;
  --flag-max-bg:#F6B7B2;      /* เกิน Max */
  --flag-max-ink:#7E251D;
  --flag-dead-bg:#D9BE9C;     /* ไม่เคลื่อนไหว > 6 เดือน */
  --flag-dead-ink:#5F4222;

  --ok:#1D7A5F;
  --warn:#B4720B;
  --danger:#B3382C;
  --void-bg:#FADBD6;         /* แถวเอกสารที่ยกเลิก — ทาแดงทั้งแถว */
  --void-bg-hi:#F5C9C2;      /* ตอนชี้เมาส์ */
  --void-ink:#8E2A20;
  --void-line:#EDB2A8;
  --r:6px;
  --shadow:0 1px 2px rgba(22,32,43,.08), 0 8px 24px -16px rgba(22,32,43,.35);
}
*{box-sizing:border-box}
:root{--z:1}
/* ขยายการแสดงผลตามขนาดจอ — จอกว้างขยายมาก จอแคบขยายน้อย เพื่อให้เมนูบนแสดงครบ */
@media screen and (min-width:1000px) and (max-width:1399px){ :root{--z:1.05} body{zoom:1.05} }
@media screen and (min-width:1400px){ :root{--z:1.15} body{zoom:1.15} }

html,body{margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  background:var(--surface); color:var(--ink); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  font-weight:400;
}
b,strong,th{font-weight:600}
h1,h2,h3,h4{font-weight:700}
.mono,input.mono,td.num,th.num{font-family:inherit;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
table,td,th{font-family:inherit}
a{color:var(--steel)}

/* ---------- โครงหน้าจอ ---------- */
.app{display:block;min-height:100vh}
.rail{
  background:linear-gradient(180deg,#0F5C3E 0%,#0B4A32 100%); color:#D7EEE2; padding:9px 16px; position:sticky; top:0; z-index:40; height:auto;
  display:flex; flex-direction:row; align-items:center; gap:5px;
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  box-shadow:0 2px 12px rgba(0,0,0,.22);
}
.rail::-webkit-scrollbar{display:none}
.rail .brand{display:flex;gap:9px;align-items:center;padding:0 16px 0 2px;border:0;margin:0;flex:none}
.rail .brand b{color:#fff;font-size:14.5px;letter-spacing:.2px;display:block;line-height:1.2}
.rail .brand span{font-size:10px;color:#8FA3B0;letter-spacing:.12em;text-transform:uppercase}
.rail .brand img.logo{width:34px;height:34px;flex:none;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rail .brand b{letter-spacing:-.1px}
.rail .brand b em{font-style:normal;color:var(--brand-green)}
.rail .brand .shop{display:block;font-size:11.5px;color:#8FA3B0;letter-spacing:0;text-transform:none;line-height:1.35;margin-top:2px}
.rail .foot a{color:#8FA3B0;text-decoration:none}
.rail .foot a:hover{color:#fff}
.memwarn{display:none}
.licbadge{display:block;width:auto;text-align:left;border:0;border-radius:99px;padding:6px 12px;margin:0;
  cursor:pointer;font-size:0;line-height:1.3;white-space:nowrap;background:rgba(255,255,255,.08);color:#C9D6DE}
.licbadge:hover{background:rgba(255,255,255,.14)}
.licbadge b{display:inline;color:#fff;font-size:12px;margin:0}
.licbadge.trial{background:#3C4A16;color:#E5EFC4}
.licbadge.trial b{color:var(--brand-yellow)}
.licbadge.warn{background:#6B4A08;color:#FBE7BE}
.licbadge.warn b{color:#FFD469}
.licbadge.expired{background:#7A2018;color:#FBD7D3}
.licbadge.expired b{color:#FFB4AB}
.licbadge.active{background:#14432A;color:#BFE3CE}
.licbadge.active b{color:#6FE39A}
.pricebox{border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:#FAFCFD}
.pricebox .amt{font-size:30px;font-weight:600;line-height:1.1}
.pricebox .amt small{font-size:14px;color:var(--ink-3);font-weight:400}
.keyin{font-size:19px;letter-spacing:.12em;text-align:center;text-transform:uppercase}
.logodrop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;display:flex;gap:14px;align-items:center;background:#FAFBFC}
.logodrop img{width:74px;height:74px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none}
.logodrop .ph{width:74px;height:74px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;
  color:var(--ink-3);font-size:11px;background:#fff;flex:none;text-align:center;line-height:1.4}
.cred{background:var(--ink);color:#fff;border-radius:8px;padding:14px 16px;margin-top:12px}
.cred .row{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
.cred .row div span{display:block;font-size:10.5px;color:#8FA3B0;letter-spacing:.08em;text-transform:uppercase}
.cred .row div b{font-size:17px;color:var(--brand-yellow);letter-spacing:.06em}
.permsub{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;margin-top:8px;background:#FBFDFC}
.permsub>b{font-size:12.5px;display:block;margin-bottom:6px}
.permgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px;margin-top:4px}
.permgrid label{display:flex;gap:7px;align-items:center;font-size:12.5px;border:1px solid var(--line);
  border-radius:5px;padding:8px 10px;background:#fff;cursor:pointer;line-height:1.4}
.permgrid label input{flex:none}
.permgrid label .lb{min-width:0}
.permgrid label:has(input:checked){border-color:var(--steel);background:var(--steel-soft)}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 16px;cursor:pointer;
  font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.subtabs button:hover{border-color:var(--ink-3)}
.subtabs button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:600}
.subtabs button u{font-size:10px;opacity:.7;text-decoration:none}

/* ---------- เมนูย่อยแนวตั้งชิดซ้าย ---------- */
.subwrap{display:grid;grid-template-columns:206px 1fr;gap:18px;align-items:start}
.subnav{position:sticky;top:118px;display:flex;flex-direction:column;gap:5px}
.subnav .ttl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:0 4px 6px}
.subnav button[data-t]{
  border:1.5px solid var(--navy);background:#fff;border-radius:10px;padding:11px 12px;
  cursor:pointer;font-size:13.5px;color:var(--ink);display:flex;gap:10px;align-items:center;
  text-align:left;width:100%;box-shadow:0 1px 2px rgba(22,32,43,.06);position:relative;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease
}
.subnav button[data-t]:hover{border-color:var(--steel);transform:translateX(2px);
  background:var(--steel-soft);box-shadow:0 6px 14px -8px rgba(15,92,62,.35)}
.subnav button[data-t][aria-pressed="true"]{
  border-color:var(--steel);border-width:2px;padding:10px 11px;
  background:var(--steel-soft);font-weight:600}
.subnav button[data-t][aria-pressed="true"] .sl{color:var(--steel-dk)}
.subnav button[data-t] .si{width:30px;height:30px;flex:none;display:grid;place-items:center}
.subnav button[data-t] .si svg{width:28px;height:28px;display:block}
.subnav button[data-t] .sw{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.subnav button[data-t] .sl{font-size:13px;line-height:1.35;color:var(--ink)}
.subnav button[data-t] u{font-size:9.5px;color:var(--ink-3);
  text-decoration:none;letter-spacing:.04em}
.subnav button[data-t] .badge{margin-left:5px;background:var(--danger);color:#fff;
  border-radius:99px;min-width:18px;height:18px;padding:0 5px;font-size:10.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.subnav .acts{display:flex;flex-direction:column;gap:7px;margin-top:13px;
  border-top:1px solid var(--line);padding-top:13px}
.subnav .acts .btn{width:100%;justify-content:center}
/* การ์ดปุ่มทำงาน */
.subnav .acts .actcard{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1.5px solid var(--navy);background:#fff;border-radius:10px;padding:11px 12px;
  cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink);
  box-shadow:0 1px 2px rgba(22,32,43,.06);
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease
}
.subnav .acts .actcard:hover{border-color:var(--steel);transform:translateX(2px);
  background:var(--steel-soft);box-shadow:0 6px 14px -8px rgba(15,92,62,.35)}
/* ไอคอนในการ์ดต้องคงขนาดเสมอ ไม่ยืดตามกล่องแม่ */
.actcard .si{width:30px;min-width:30px;max-width:30px;height:30px;min-height:30px;max-height:30px;
  flex:0 0 30px;display:grid;place-items:center;overflow:hidden}
.actcard .si svg{width:28px;height:28px;max-width:28px;max-height:28px;display:block;flex:none}
.subnav .acts .actcard .sw{display:flex;flex-direction:column;gap:1px;min-width:0}
.subnav .acts .actcard .sl{font-weight:600;line-height:1.35}
.subnav .acts .actcard .sd{font-size:11px;color:var(--ink-3);line-height:1.4}
.subnav .acts .actcard.go{border-color:#BFE3D6;background:#F4FBF8}
.subnav .acts .actcard.go .sl{color:var(--ok)}
.subnav button .si{width:26px;min-width:26px;max-width:26px;height:26px;min-height:26px;max-height:26px;
  flex:0 0 26px;display:grid;place-items:center;overflow:hidden}
.subnav button .si svg{width:24px;height:24px;max-width:24px;max-height:24px;display:block;flex:none}

/* ---------- แผงเลือกในหน้าข้อมูลผู้ติดต่อ ---------- */
.cusgate{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cusgate .mcard{padding:20px 14px 17px}
.cusgate .mcard .ico{width:56px;height:56px}
.cusgate .mcard .ico svg{width:52px;height:52px}
.cusgate .mcard .t1{font-size:16px}
@media(max-width:640px){ .cusgate{grid-template-columns:1fr} }

/* ---------- ปุ่มย้อนกลับลอยมุมขวาล่าง ---------- */
#backFab.idle{opacity:.55}
#backFab.idle:hover{opacity:1}
#backFab{
  position:fixed;right:22px;bottom:22px;z-index:150;
  display:flex;align-items:center;gap:9px;
  border:1.5px solid var(--navy);border-radius:99px;background:#fff;
  width:168px;height:54px;justify-content:flex-start;
  padding:0 14px;cursor:pointer;font-family:inherit;font-size:14px;
  font-weight:600;color:var(--ink);
  box-shadow:0 8px 24px -6px rgba(11,26,38,.38), 0 2px 6px rgba(11,26,38,.14);
  transition:transform .13s ease, box-shadow .13s ease, opacity .18s ease
}
#backFab:hover{transform:translateY(-2px);box-shadow:0 14px 30px -8px rgba(11,26,38,.46)}
#backFab:active{transform:translateY(0)}
#backFab svg{width:22px;height:22px;flex:none}
#backFab .lb{white-space:nowrap;min-width:0;text-align:left}
#backFab .wh{font-size:11px;font-weight:400;color:var(--ink-3);display:block;line-height:1.3;
  max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#backFab[hidden]{display:none}
/* ขณะผู้ใช้กำลังเลื่อนหน้า ปุ่มจางลงและไม่รับสัมผัสชั่วคราว
   เพื่อให้ปุ่มเนื้อหาที่อยู่ตำแหน่งเดียวกันกดได้เสมอ */
#backFab.dodge{opacity:.28;pointer-events:none;transform:scale(.92)}
@media(max-width:640px){
  /* มือถือ: ปุ่มกลมขนาดคงที่ ไอคอนอย่างเดียว ไม่บังเนื้อหา */
  .main{padding-bottom:120px}          /* เผื่อสูงกว่าปุ่มย้อนกลับเสมอ */
  #backFab{right:12px;bottom:12px;width:52px;height:52px;border-radius:99px;
    justify-content:center;padding:0;gap:0}
  #backFab .lb{display:none}
  #backFab svg{width:24px;height:24px}
}
@media print{#backFab{display:none !important}}
/* ---------- แท็บเล็ต ---------- */
@media(max-width:1180px){
  .mcards.wide{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hgrid{grid-template-columns:1fr}
}
@media(max-width:980px){
  .subwrap{grid-template-columns:1fr;gap:12px}
  .subnav{position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .subnav .ttl{display:none}
  .subnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .subnav button[data-t]{width:100%;height:100%}
  .subnav .acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;margin:0;border:0;padding:0}
  .subnav .acts .btn{width:100%}
  .subnav .acts .actcard{width:100%;height:100%}
  .subnav .acts .actcard .sd{display:none}
  .subnav > div{grid-column:1/-1;min-width:0}
  .subnav .acts > div{grid-column:1/-1;min-width:0}
  .subnav .side-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .subnav .side-actions .btn{width:100%;justify-content:center;margin:0 !important}
  .subnav .side-actions > div:not(.btn){grid-column:1/-1}
}
@media(min-width:0px){
/* การ์ดในแถบบนของหน้า — ขนาดพอดีเนื้อหา ไม่ยืดเต็มแถบ */
#topActions .actcard{width:auto;flex:0 0 auto;max-width:280px;padding:8px 13px}
#topActions .actcard .si{width:26px;height:26px}
#topActions .actcard .si svg{width:24px;height:24px}
#topActions .actcard .sl{font-size:13px}
#topActions .actcard .sd{font-size:11px}
}
/* ดอกจันเตือนรายการที่ยังไม่ได้ลงทะเบียนสินค้า */
@keyframes pendblink{0%,100%{opacity:1}50%{opacity:.2}}
.pend{color:var(--danger);font-weight:800;font-size:15px;line-height:1;cursor:help;
  animation:pendblink 1.1s ease-in-out infinite;margin-right:3px}
.pendbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FCF1F0;
  border:1px solid #EFCFCB;border-left:4px solid var(--danger);border-radius:8px;
  padding:13px 17px;margin-bottom:16px}
.pendbar .txt{flex:1;min-width:250px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.pendbar .txt b{display:block;color:var(--danger);font-size:14.5px;margin-bottom:2px}
.subtabs button .badge{background:var(--danger);color:#fff;border-radius:99px;
  min-width:19px;height:19px;padding:0 6px;font-size:11.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;margin-left:3px}
.subtabs button[aria-pressed="true"] .badge{background:#fff;color:var(--danger)}
@media print{.pend{display:none}}
@media (prefers-reduced-motion:reduce){.pend{animation:none}}

.mchk{position:relative;display:inline-block}
.mchk>summary{list-style:none;cursor:pointer}
.mchk>summary::-webkit-details-marker{display:none}
.mchk>summary::after{content:"▾";margin-left:6px;font-size:10px;color:var(--ink-3)}
.mchk-panel{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);padding:8px;z-index:30;display:grid;
  grid-template-columns:repeat(3,1fr);gap:2px 10px;min-width:230px}
.mchk-panel label{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 6px;
  border-radius:4px;cursor:pointer;white-space:nowrap}
.mchk-panel label:hover{background:var(--steel-soft)}
.filterbar{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:#F5F9F7;border-radius:12px 12px 0 0}
/* การ์ดที่มีแถบตัวกรองเป็นหัว — โค้งรับกัน */
.card>.filterbar:first-child{margin:0}
/* ---------- ตัวแบ่งหน้า — กล่องตัวเลขติดกัน ชิดขวา ---------- */
.pager{display:flex;justify-content:flex-end;align-items:center;gap:0;padding:10px 16px;
  border-top:1px solid var(--line-2);flex-wrap:wrap}
.pager.top{border-top:0;border-bottom:1px solid var(--line-2);padding:8px 16px 10px}
.pager .pg{
  min-width:38px;height:34px;padding:0 11px;border:1px solid var(--line);margin-left:-1px;
  background:#fff;color:var(--steel);cursor:pointer;font-family:inherit;font-size:13.5px;
  font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s ease,color .12s ease;
}
.pager .pg:first-child{border-radius:7px 0 0 7px;margin-left:0}
.pager .pg:last-child{border-radius:0 7px 7px 0}
.pager .pg:hover:not(:disabled):not([aria-current="true"]){background:var(--steel-soft)}
.pager .pg[aria-current="true"]{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:600;position:relative;z-index:1}
.pager .pg:disabled{color:var(--ink-3);opacity:.5;cursor:not-allowed}
.pager .pg.dots{cursor:default;color:var(--ink-3);pointer-events:none}
.pager .pgnote{margin-right:auto;font-size:12.5px;color:var(--ink-3)}
@media (max-width:520px){ .pager{justify-content:center} .pager .pgnote{margin-right:0;width:100%;text-align:center;margin-bottom:6px} }
.invite{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--steel-soft);
  border:1px solid #BBD8E2;border-left:4px solid var(--steel);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.invite .txt{flex:1;min-width:260px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.invite .txt b{display:block;font-size:15px;color:var(--ink);margin-bottom:3px}
.invite .act{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- หน้าแรก ---------- */
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:980px){.hgrid{grid-template-columns:1fr}}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.hcard>header{padding:13px 17px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.hcard>header h2{margin:0;font-size:14px;font-weight:700}
.hcard .body{padding:16px 17px 18px;flex:1}
.hcard .go{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;color:var(--steel-dk);
  background:var(--steel-soft);border:1px solid #BFE3D6;border-radius:7px;
  padding:6px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .13s ease, border-color .13s ease, color .13s ease, box-shadow .13s ease
}
.hcard .go:hover{background:var(--steel);border-color:var(--steel);color:#fff;
  box-shadow:0 3px 9px -4px rgba(15,92,62,.55)}
.hcard .go:active{background:var(--steel-dk);border-color:var(--steel-dk);box-shadow:none}
/* ลูกศรขยับตอนชี้เมาส์ — บอกทิศทางโดยไม่ต้องมีไอคอนกระพริบ */
.ar{display:inline-block;transition:transform .15s ease}
.hcard .go:hover .ar,.clickme:hover .ar{transform:translateX(3px)}

/* ---------- แผงเลือกเดือน ---------- */
.filterbar{position:relative}
.mpick{
  position:absolute;z-index:120;
  background:#fff;border:1.5px solid var(--navy);border-radius:12px;padding:12px;
  box-shadow:0 16px 36px -12px rgba(11,26,38,.4);width:308px
}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mp-head b{font-size:15px;color:var(--ink)}
.mp-nav{
  width:32px;height:32px;border:1.5px solid var(--navy);border-radius:8px;background:#fff;
  font-size:17px;line-height:1;cursor:pointer;color:var(--ink);
  transition:background .12s ease, border-color .12s ease
}
.mp-nav:hover{background:var(--steel-soft);border-color:var(--steel)}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mp-grid button{
  border:1.5px solid var(--navy);background:#fff;border-radius:8px;padding:10px 4px;
  font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);
  transition:background .12s ease, border-color .12s ease
}
.mp-grid button:hover{background:var(--steel-soft);border-color:var(--steel)}
.mp-grid button[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);
  border-width:2px;font-weight:600;color:var(--steel-dk)}
.mp-grid button.now{position:relative}
.mp-grid button.now::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;
  border-radius:99px;background:var(--steel)}
.mp-grid button:disabled{opacity:.35;cursor:default;background:#fff;border-color:var(--line)}
@media print{.mpick{display:none !important}}
.big{font-size:27px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.big small{font-size:13px;color:var(--ink-3);font-weight:400;margin-left:5px}
.kpi{display:flex;gap:16px 28px;flex-wrap:wrap}
.kpi>div{min-width:120px}
.kpi span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-bottom:4px;line-height:1.4}
.kpi b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:7px;height:104px;margin-top:14px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .bar{width:100%;background:var(--steel);border-radius:4px 4px 0 0;min-height:2px;transition:background .14s ease}
.bars .col.dim .bar{background:#D8E2E8}
.bars .col:hover .bar{background:var(--steel-dk)}
.bars .lb{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.bars .vl{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.split{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-top:14px;background:#FCFDFD}
.split div{flex:1;padding:11px 14px;border-right:1px solid var(--line-2)}
.split div:last-child{border-right:0}
.split span{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px;line-height:1.4}
.split b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.minirow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.minirow:last-child{border-bottom:0}
.minirow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minirow .vl{white-space:nowrap;font-variant-numeric:tabular-nums}
.taxrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.taxrow:last-child{border-bottom:0}

}

.finbtns button[aria-pressed="true"] span{color:#9BAAB5}
.finbtns button[aria-pressed="true"] b{color:#fff}
.finbtns button u{display:block;font-size:11.5px;color:var(--ink-3);text-decoration:none;margin-top:2px;letter-spacing:0;text-transform:none}
.finbtns button[aria-pressed="true"] u{color:#8FA3B0}

/* ---------- ฟอร์มเอกสารบนหน้าจอ (หน้าตาเหมือนกระดาษที่จะพิมพ์) ---------- */
.formsheet{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  padding:26px 30px;max-width:900px;margin:0 auto}
.fs-head{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px}
.fs-head img.lg{width:58px;height:58px;object-fit:contain;flex:none}
.fs-head .co b{font-size:16px;display:block}
.fs-head .co div{font-size:12px;color:var(--ink-2);line-height:1.5}
.fs-head .meta{margin-left:auto;text-align:right;min-width:232px}
.fs-head .meta h3{margin:0;font-size:19px}
.fs-head .meta .en{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.fs-head .meta table{width:100%;font-size:12.5px;margin-top:6px}
.fs-head .meta td{padding:2px 0}
.fs-head .meta td:last-child{text-align:right}
.fs-box{border:1px solid var(--ink);border-radius:4px;padding:7px 11px;margin-top:8px}
.fs-box h4{margin:0 0 7px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:4px;color:var(--ink-2)}
.fs-row{display:flex;gap:8px;align-items:center;padding:1px 0;font-size:12.5px}
.fs-row b{font-weight:600;color:var(--ink-2);white-space:nowrap;font-size:12.5px}
.fs-in{border:0;border-bottom:1px dotted #97A4AC;background:transparent;padding:1px 3px;
  font:inherit;font-size:12.5px;color:var(--ink);flex:1;min-width:0}
.fs-in.xs{flex:none;width:74px}
.fs-in.lg{flex:none;width:250px}

/* ---------- ตัวอย่างเอกสารขนาดจริง ---------- */
.paperview{background:#DFE6EA;border-radius:8px;padding:20px;overflow:auto;border:1px solid var(--line)}
.paperview .paper{margin:0 auto;box-shadow:0 6px 26px -8px rgba(0,0,0,.4);border:0}
.paperbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--steel-soft);
  border:1px solid #BBD8E2;border-radius:8px;padding:11px 15px;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
.paperbar b{color:var(--ink)}
@media(max-width:900px){
  .paperview{padding:10px}
  .paperview .paper{transform:scale(.52);transform-origin:top left;margin:0}
  .paperview{height:640px}
}
.fs-in:focus{outline:0;border-bottom:1.5px solid var(--steel);background:#F5FAFC}
.fs-in.sm{flex:none;width:112px}
.fs-in.md{flex:none;width:156px}
.fs-in.num{text-align:right}
table.fs-t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
table.fs-t th{border:1px solid var(--ink);padding:5px 7px;background:#EDEFF1;font-size:11px;font-weight:600}
table.fs-t td{border:1px solid #8A9AA3;padding:2px 5px}
table.fs-t td input{width:100%;border:0;background:transparent;font:inherit;font-size:12.5px;padding:3px;color:var(--ink)}
table.fs-t td input:focus{outline:0;background:#F5FAFC}
table.fs-t td input.num{text-align:right}
table.fs-t td.calc{text-align:right;background:#FAFBFC}
table.fs-t tr.blank td{color:var(--ink-3)}
.fs-foot{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
.fs-pay{flex:1;border:1px solid var(--ink);border-radius:4px;padding:9px 12px;font-size:12.5px}
.fs-pay label{display:flex;gap:8px;align-items:center;padding:4px 0}
.fs-sum{width:330px;flex:none;border-collapse:collapse;font-size:12.5px}
.fs-sum td{border:1px solid #8A9AA3;padding:4px 8px}
.fs-sum td:last-child{text-align:right;width:118px}
.fs-sum tr.total td{background:#EDEFF1;font-weight:700;font-size:13.5px}
.fs-sum tr.wht td{color:var(--danger)}
.fs-sum input{width:100%;border:0;background:transparent;font:inherit;text-align:right;
  padding:1px 0;color:var(--ink)}
.fs-sum input:focus{outline:0;background:#F5FAFC}
.fs-sum select{border:1px solid var(--line);border-radius:4px;padding:1px 3px;font:inherit;font-size:11.5px;margin-left:5px}
.fs-sign{display:flex;gap:26px;margin-top:20px}
.fs-sign div{flex:1;text-align:center;font-size:12px}
.fs-sign .ln{border-bottom:1px dotted var(--ink);height:30px;margin-bottom:5px}
.fs-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start;margin:0 0 14px}
/* แถวปุ่มท้ายฟอร์มที่อยู่ในตารางกริด — ขึ้นบรรทัดใหม่ได้เมื่อที่ไม่พอ */
.fbtns{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
@media(max-width:820px){.formsheet{padding:18px 16px}.fs-foot{flex-direction:column}.fs-sum{width:100%}}
.navbtn{
  display:flex;align-items:center;gap:7px;width:auto;flex:none;white-space:nowrap;
  text-align:left;background:none;border:0;color:#D7EEE2;
  padding:9px 13px;border-radius:var(--r);cursor:pointer;font-size:14px
}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn[aria-current="true"]{background:#fff;color:var(--steel-dk);font-weight:600}
.navbtn:hover:not([aria-current="true"]){background:rgba(255,255,255,.14)}
.navbtn .k{font-size:10px;color:#7E93A1;width:14px;flex:none}
.navbtn[aria-current="true"] .k{color:var(--steel)}
/* จอเล็ก แถบเมนูบนเลื่อนซ้ายขวาได้ ปุ่มหน้าแรกจึงถูกตรึงไว้ซ้ายสุดตลอด
   กดกลับหน้าแรกเพื่อไปเมนูอื่นได้ทันที ไม่ต้องเลื่อนแถบย้อนกลับมาเอง
   ปุ่มกินความสูงเต็มแถบและทึบแสง เมนูที่เลื่อนผ่านด้านหลังจึงไม่โผล่ */
@media(max-width:1000px){
  .rail .navbtn[data-view="home"]{
    position:sticky;left:0;z-index:3;align-self:stretch;border-radius:0;
    margin:-9px 0;padding-top:9px;padding-bottom:9px;
    background:linear-gradient(180deg,#0F5C3E 0%,#0B4A32 100%);
    box-shadow:11px 0 13px -9px rgba(0,0,0,.6)
  }
  /* ปิดช่องว่างเท่าระยะขอบซ้ายของแถบ ไม่ให้เมนูที่เลื่อนผ่านโผล่แทรกด้านซ้ายของปุ่ม */
  .rail .navbtn[data-view="home"]::before{
    content:"";position:absolute;top:0;bottom:0;right:100%;width:20px;background:inherit
  }
  .rail .navbtn[data-view="home"]:hover{background:linear-gradient(180deg,#146B49 0%,#0E5438 100%);color:#fff}
  .rail .navbtn[data-view="home"][aria-current="true"]{
    background:linear-gradient(180deg,#15734F 0%,#0F5C3E 100%);color:#fff;font-weight:600;
    box-shadow:inset 0 -3px 0 var(--brand-yellow), 11px 0 13px -9px rgba(0,0,0,.6)
  }
}

/* ---------- เมนูหลักแบบกรอบ มีเมนูย่อยกางลงมา ---------- */
.navwrap .mi{position:relative;flex:none}
.navbtn .car{font-size:8px;opacity:.65;margin-left:1px;transition:transform .18s ease;display:inline-block}
.mi.open .navbtn{background:#fff;color:var(--steel-dk)}
.mi.open .navbtn .car{transform:rotate(180deg);opacity:1}
.mmenu{
  position:fixed;min-width:270px;z-index:200;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;
  box-shadow:0 14px 34px -10px rgba(11,26,38,.42);display:none
}
.mi.open .mmenu{display:block}
.mmenu::before{
  content:"";position:absolute;top:-6px;left:var(--arrow,20px);width:11px;height:11px;background:#fff;
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)
}
.mmenu .mhd{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:5px 10px 7px;border-bottom:1px solid var(--line-2);margin-bottom:5px}
.mmenu button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;
  padding:9px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink);
  font-family:inherit
}
.mmenu button:hover{background:var(--steel-soft)}
.mmenu .mcard{border-width:1.5px}
.mmenu button[aria-pressed="true"]{background:var(--steel-soft);color:var(--steel-dk);font-weight:600}
.mmenu button u{font-size:10px;opacity:.65;
  text-decoration:none;flex:none;min-width:24px}
.mmenu button .bdg{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;
  min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center}
.mmenu button[aria-pressed="true"] .bdg{background:var(--danger);color:#fff}

/* ---------- การ์ดไอคอนเมนู ---------- */
.mcards{display:grid;grid-template-columns:repeat(2,minmax(148px,1fr));gap:8px;padding:2px}
.mcards.wide{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1080px){.mcards.wide{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.mcards.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mcard{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 12px 15px;
  cursor:pointer;text-align:center;position:relative;font-family:inherit;
  transition:border-color .14s ease, background .14s ease
}
.mcard:hover{border-color:var(--steel);background:var(--steel-soft)}
.mcard:active{background:var(--grn-hi)}
.mcard .ico{width:46px;height:46px;flex:none;display:grid;place-items:center}
.mcard .ico svg{width:42px;height:42px;display:block}
.mcard .t1{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35}
.mcard .t2{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin-top:-4px}
.mcard .no{position:absolute;top:8px;left:10px;
  font-size:10px;color:var(--ink-3);opacity:.75}
/* ---------- รูปสินค้า ---------- */
.pics{display:grid;grid-template-columns:minmax(180px,240px);gap:10px}
.pic{
  position:relative;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:9px;
  background:#F7F9FA;display:grid;place-items:center;cursor:pointer;overflow:hidden;
  transition:border-color .13s ease, background .13s ease
}
.pic:hover{border-color:var(--steel);background:var(--steel-soft)}
.pic.has{border-style:solid;border-color:var(--line);background:#fff;cursor:default}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .ph{text-align:center;color:var(--ink-3);font-size:12px;line-height:1.6;padding:6px}
.pic .ph b{display:block;font-size:22px;color:var(--line);font-weight:400;line-height:1}
.pic .no{position:absolute;top:5px;left:7px;
  font-size:10px;color:var(--ink-3);background:rgba(255,255,255,.85);border-radius:4px;padding:0 4px}
.pic .rm{
  position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:6px;border:0;
  background:rgba(179,56,44,.92);color:#fff;font-size:15px;line-height:1;cursor:pointer;
  display:none;align-items:center;justify-content:center;padding:0
}
.pic.has .rm{display:flex}
.pic .rm:hover{background:var(--danger)}
.picbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;
  font-size:12px;color:var(--ink-3)}
.picbar .gauge{flex:1;min-width:130px;height:7px;border-radius:99px;background:var(--line-2);overflow:hidden}
.picbar .gauge i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
.picbar .gauge i.warn{background:var(--warn)} .picbar .gauge i.full{background:var(--danger)}
.thumbcell{display:flex;align-items:center;gap:8px}
.thumbcell img{width:34px;height:26px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:none}
.picview{background:#0E1A22;border-radius:10px;padding:12px;text-align:center}
.picview img{max-width:100%;max-height:calc(64vh/var(--z));border-radius:6px}
.picstrip{display:flex;gap:8px;justify-content:center;margin-top:10px}
.picstrip button{width:58px;height:44px;border-radius:6px;border:2px solid transparent;
  background:none;padding:0;cursor:pointer;overflow:hidden}
.picstrip button[aria-pressed="true"]{border-color:var(--gold,#F6D264)}
.picstrip img{width:100%;height:100%;object-fit:cover;display:block}

.mcard .bdg{position:absolute;top:7px;right:8px;background:var(--danger);color:#fff;
  border-radius:99px;min-width:19px;height:19px;padding:0 5px;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center}
.mcard[aria-pressed="true"]{border-color:var(--steel);border-width:2px;padding:14px 10px 12px;
  background:var(--steel-soft)}
.mcard[aria-pressed="true"] .t1{color:var(--steel-dk)}
.mcards.wide .mcard{padding:18px 12px 15px}
.mcards.wide .mcard .ico{width:54px;height:54px}
.mcards.wide .mcard .ico svg{width:50px;height:50px}
.mcards.wide .mcard .t1{font-size:15px}
.mmenu.cards{min-width:330px;padding:9px}
@media(max-width:900px){
  .mcards.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mmenu.cards{min-width:0}
}
/* ---------- มือถือ ---------- */
@media(max-width:640px){
  .wrap, .page{padding-left:10px;padding-right:10px}
  .mcards, .mcards.wide{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mcards.wide .mcard{padding:13px 8px 11px}
  .mcards.wide .mcard .ico{width:42px;height:42px}
  .mcards.wide .mcard .ico svg{width:38px;height:38px}
  .mcards.wide .mcard .t1{font-size:13.5px}
  .mcard .t2{font-size:10.5px}
  .cusgate{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .cusgate .mcard{padding:13px 8px 11px}
  .cusgate .mcard .ico{width:44px;height:44px}
  .cusgate .mcard .ico svg{width:40px;height:40px}
  .cusgate .mcard .t1{font-size:14px}
  .stat>div{flex:1 1 46%;border-top:1px solid var(--line-2)}
  .filterbar{padding:10px 10px}
  .card header{flex-wrap:wrap;row-gap:6px}
  .fs-head{flex-direction:column;gap:10px}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr 1fr}
  /* ปกติช่องในกริดจะไม่ยอมแคบกว่าเนื้อหาข้างใน ทำให้แถวปุ่มดันจนล้นการ์ดแล้วโดนตัดหาย
     บนจอแคบจึงให้หดได้ และให้แถวปุ่มกินเต็มแถวของตัวเอง */
  .grid > *{min-width:0}
  .fbtns{grid-column:1/-1}
  .fbtns .btn{flex:1 1 auto;justify-content:center}
  .pics{grid-template-columns:1fr;gap:6px}
  .mp-grid button{padding:12px 4px}
}
@media(max-width:400px){
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
}

.additem{display:flex;gap:8px;margin-bottom:10px}

.picsheet{position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:400;
  display:flex;align-items:flex-end;justify-content:center}
.picsheet .sh{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;
  padding:18px 18px 22px;display:grid;gap:10px}
.picsheet .btn{justify-content:center;padding:14px;font-size:15px}

@media(min-width:641px){ .picsheet{align-items:center} .picsheet .sh{border-radius:16px} }

.permblk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff}
.permblk.off{opacity:.55}
.permblk .mainrow{display:flex;align-items:center;gap:9px;font-size:14px;flex-wrap:wrap}
.permblk .mainrow .cnt{font-size:11.5px;color:var(--ink-3)}
.permblk .mainrow .quick{margin-left:auto;display:flex;gap:6px}
.permblk .subgrid{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2)}
/* แถวเมนูย่อย — ช่องซ้ายคือเข้าได้ ช่องขวาคือแก้ไขได้ อ่านจบในบรรทัดเดียว */
.permtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.permtbl th{background:#F2F5F7;font-weight:600;font-size:11.5px;color:var(--ink-2);
  padding:7px 10px;border:1px solid var(--line);text-align:left;line-height:1.35}
.permtbl th.c,.permtbl td.c{text-align:center;width:104px}
.permtbl td{padding:6px 10px;border:1px solid var(--line-2);vertical-align:middle}
.permtbl tbody tr:nth-child(even) td{background:#FAFCFD}

@media(max-width:640px){ .permtbl th.c,.permtbl td.c{width:62px} .permtbl th{font-size:10.5px;padding:6px 4px} }

.permsave{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;
  padding:12px 14px;border:1px solid #BFE3D6;background:#F1FAF6;border-radius:8px}

/* ป้ายวันเกินกำหนด — ใช้ทั้งตารางและการ์ด */
.latechip{display:inline-block;margin-left:6px;background:#FBEAE8;color:var(--danger);
  border-radius:99px;padding:1px 8px;font-size:10.5px;font-weight:600;white-space:nowrap}
@media(min-width:701px){ td[data-f="due"] .latechip{display:block;margin:2px 0 0;width:fit-content} }

/* ---------- ตารางคอลัมน์เยอะ กลายเป็นการ์ดบนจอเล็ก ----------
   ใช้หัวคอลัมน์เป็นป้ายกำกับหน้าแต่ละค่า อ่านเป็นคู่ ป้าย–ค่า ไม่ต้องเลื่อนซ้ายขวา */
/* แท็บเล็ตแนวตั้งส่วนใหญ่กว้าง 768–834 จึงเผื่อถึง 860
   ตารางคอลัมน์เยอะบนความกว้างเท่านี้ยังต้องเลื่อนซ้ายขวา อ่านเป็นการ์ดง่ายกว่า */
@media(max-width:860px){
  table.ctbl, table.ctbl tbody{display:block;width:100%}
  table.ctbl thead{display:none}
  table.ctbl tr{
    display:block;border:1px solid var(--line);border-radius:12px;background:#fff;
    padding:13px 15px;margin:0 0 11px;box-shadow:0 1px 2px rgba(22,32,43,.06)
  }
  table.ctbl tr:nth-child(even){background:#fff}
  table.ctbl td{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    border:0;border-bottom:1px dotted var(--line-2);padding:6px 0;
    text-align:right;font-size:13.5px;background:none !important
  }
  table.ctbl td::before{
    content:attr(data-lb);flex:none;max-width:46%;text-align:left;
    color:var(--ink-3);font-size:12px;font-weight:400;line-height:1.5
  }
  table.ctbl td:last-child{border-bottom:0;padding-bottom:0}
  /* ช่องแรกเป็นหัวการ์ด — ตัวใหญ่ ไม่มีป้าย */
  table.ctbl td:first-child{
    font-size:15.5px;font-weight:700;justify-content:flex-start;text-align:left;
    border-bottom:1px solid var(--line);padding:0 0 9px;margin-bottom:5px
  }
  table.ctbl td:first-child::before{display:none}
  /* ช่องปุ่มจัดการ — เรียงเป็นตารางช่องเท่ากัน กดง่ายด้วยนิ้ว */
  table.ctbl td:last-child:has(button){
    display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:7px;
    padding-top:12px;margin-top:6px;border-top:1px solid var(--line)
  }
  table.ctbl td:last-child:has(button)::before{display:none}
  table.ctbl td:last-child button{
    width:100%;min-height:38px;font-size:13px;
    border:1px solid var(--line);background:#fff;color:var(--ink)
  }
  table.ctbl td:last-child button.primary{border-color:var(--steel);background:var(--steel);color:#fff}
  table.ctbl td:last-child button.danger{border-color:#EFC0B8;color:var(--danger)}
  table.ctbl td.empty{display:block;text-align:center}
  table.ctbl td.empty::before{display:none}
}

/* ---------- ลูกหนี้/เจ้าหนี้เป็นการ์ดรายใบบนจอเล็ก ---------- */
@media(max-width:700px){
  table.rtbl, table.rtbl tbody{display:block;width:100%}
  table.rtbl thead{display:none}
  table.rtbl tr{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "no    date"
      "name  amt"
      "due   amt"
      "status status"
      "st2a  st2b"
      "money money"
      "act   act";
    gap:3px 12px;align-items:start;
    border:1.5px solid var(--navy);border-radius:12px;background:#fff;
    padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px rgba(22,32,43,.07)
  }
  table.rtbl td{display:block;border:0;padding:0;background:none !important;text-align:left}
  table.rtbl td[data-f="no"]{grid-area:no;font-size:11.5px;color:var(--ink-3)}
  table.rtbl td[data-f="no"] span{display:inline}
  table.rtbl td[data-f="date"]{grid-area:date;font-size:11.5px;color:var(--ink-3);
    justify-self:end;text-align:right}
  table.rtbl td[data-f="name"]{grid-area:name;font-size:15px;font-weight:600;line-height:1.4}
  table.rtbl td[data-f="name"] .paybar{margin-top:7px}
  table.rtbl td[data-f="kind"]{display:none}
  table.rtbl td[data-f="due"]{grid-area:due;font-size:12.5px;margin-top:2px}
  table.rtbl td[data-f="due"]::before{content:"กำหนด ";color:var(--ink-3)}
  table.rtbl td[data-f="status"]{grid-area:status;margin-top:2px}
  table.rtbl td[data-f="status"] .chip{font-size:11px}
  table.rtbl td[data-f="status"] .todo, table.rtbl td[data-f="status"] .donechip{width:100%}
  table.rtbl td[data-f="st2"]:nth-of-type(5){grid-area:st2a}
  table.rtbl td[data-f="st2"]:nth-of-type(6){grid-area:st2b}
  table.rtbl td[data-f="st2"]{margin-top:5px;min-width:0}
  table.rtbl td[data-f="st2"] .todo, table.rtbl td[data-f="st2"] .donechip{width:100%;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.rtbl td[data-f="st2"]::before{display:block;font-size:10px;color:var(--ink-3);margin-bottom:2px}
  table.rtbl td[data-f="st2"]:nth-of-type(5)::before{content:"ใบส่งมอบ / แจ้งหนี้"}
  table.rtbl td[data-f="st2"]:nth-of-type(6)::before{content:"ใบเสร็จรับเงิน"}
  table.rtbl td[data-f="total"]{grid-area:money;font-size:12px;color:var(--ink-2)}
  table.rtbl td[data-f="total"]::before{content:"ยอดเต็ม ";color:var(--ink-3)}
  table.rtbl td[data-f="paid"]{grid-area:money;display:block !important;justify-self:end;font-size:12px}
  table.rtbl td[data-f="paid"]::before{content:"ชำระแล้ว ";color:var(--ink-3)}
  table.rtbl td[data-f="dueamt"]{grid-area:amt;text-align:right;justify-self:end;align-self:start;
    font-size:17px;font-weight:600}
  table.rtbl td[data-f="dueamt"] b{font-size:19px;letter-spacing:-.01em}
  table.rtbl td[data-f="dueamt"] .statewrap{margin-top:4px;display:flex;justify-content:flex-end}
  table.rtbl td[data-f="act"]{grid-area:act;margin-top:9px;display:flex;gap:7px;
    white-space:normal !important}
  table.rtbl td[data-f="act"] .btn{flex:1;justify-content:center;padding:10px 0;font-size:13.5px;
    text-align:center;display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff}
  table.rtbl td[data-f="act"] .btn.primary{border-color:var(--steel);background:var(--steel);color:#fff}
  /* แถบตัวกรองเหนือรายการพับบรรทัดได้ ไม่ล้นขวา */
  .filterbar .pill-tabs{flex-wrap:wrap;max-width:100%}
  .filterbar{row-gap:8px}
  table.rtbl tr td[colspan]{grid-area:auto;grid-column:1/-1;text-align:center}

  /* แถบสรุปการเงินกระชับ */
  .stat>div{padding:10px 12px}
  .stat>div b{font-size:16.5px}
  .stat>div span{font-size:11px}

  /* แถบเลือกช่วงเวลา — วันที่คู่กัน ปุ่มลัดแถวเดียว */
  .filterbar #fnFrom, .filterbar #fnTo{flex:1 1 36%;width:auto !important;min-width:0}
  .filterbar #fnMonth, .filterbar #fnYear, .filterbar #fnAll{flex:1 1 28%}
}
@media(max-width:520px){ .mcards{grid-template-columns:1fr} }
@media print{.mcards{display:none !important}}

/* ---------- ตัวเลือกสิทธิ์ย่อยในหน้าตั้งค่า ---------- */
.permgrid label{align-items:flex-start}
.subperm{display:flex;align-items:center;gap:7px;margin:6px 0 0 26px;font-size:12.5px;color:var(--ink-2)}
.subperm select{font-family:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);max-width:230px}
.subperm select:disabled{background:#F2F5F7;color:var(--ink-3)}
.subperm .lb{white-space:nowrap;color:var(--ink-3)}
@media(max-width:900px){
  .mmenu::before{display:none}
}
@media print{.mmenu{display:none !important}}
.rail .foot{margin:0 0 0 auto;flex:none;display:flex;gap:6px;align-items:center;
  font-size:0;line-height:0;border:0;padding:0 0 0 14px}
.rail .foot br,.rail .foot a,.rail .foot > span{display:none}

.main{min-width:0;padding:0 0 110px}   /* ท้ายหน้าเผื่อสูงกว่าปุ่มย้อนกลับ (54+22+เว้น) */
.topbar{
  position:sticky;top:52px;z-index:20;background:rgba(239,242,244,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:13px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap
}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.1px}
.topbar .sub{font-size:12px;color:var(--ink-3)}
.spacer{margin-left:auto}
.wrap{padding:20px 22px}
.view{display:none;scroll-margin-top:66px}   /* เผื่อแถบเมนูบนตอนเลื่อนถึงฟอร์ม */
#qFormCard, #qPaper{scroll-margin-top:66px}
.view.on{display:block}

/* ---------- ส่วนประกอบ ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card > header{
  padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.card > header h2{margin:0;font-size:14px;font-weight:700}
.card > header .hint{font-size:12px;color:var(--ink-3)}
.card .body{padding:16px}

.btn{
  border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:var(--r);cursor:pointer;
  font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.primary:hover{background:var(--steel-dk);border-color:var(--steel-dk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--steel)}
.btn.ghost:hover{background:var(--steel-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:#EFCFCB}
.btn.danger:hover{background:#FCF1F0}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.in{
  width:100%;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:#fff;
}
.in:focus{outline:2px solid var(--steel);outline-offset:-1px;border-color:var(--steel)}
/* ช่องเลือกวันที่ของเบราว์เซอร์สูงกว่าช่องข้อความอยู่เล็กน้อย
   บังคับความสูงให้เท่ากัน เพื่อให้ช่องในแถวเดียวกันเรียงตรงระดับ */
input[type="date"].in{height:calc(1.65em + 15.74px)}
.in[readonly]{background:#F6F8F9;color:var(--ink-2)}
textarea.in{resize:vertical;min-height:38px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.sec-title{
  font-size:11.5px;letter-spacing:.02em;color:var(--ink-3);font-weight:600;
  display:flex;align-items:center;gap:10px;margin:22px 0 10px
}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}

/* ---------- ตาราง ---------- */
/* ตารางเลื่อนในกรอบตัวเอง — ห้ามดันการ์ดแม่ให้กว้างกว่าจอ */
.tablewrap{overflow-x:auto;overflow-y:auto;max-width:100%;-webkit-overflow-scrolling:touch}
/* กล่องใน grid/flex ต้องยอมหดได้ ไม่งั้นลูกที่กว้างจะดันแม่ */
.subwrap > *, .card, .card .body, .hcard, .view{min-width:0}
html, body{overflow-x:hidden;overflow-x:clip}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#FAFBFC;position:sticky;top:0;z-index:1;white-space:nowrap
}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tbody tr:hover{background:#FAFCFD}
th.num,td.num{text-align:right}
.empty{padding:38px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- ป้ายรหัสสินค้า (signature element) ---------- */
.tag{
  display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 8px;border-radius:3px;
  border:1px solid var(--line);background:#F7F9FA;
  font-size:13px;font-weight:600;letter-spacing:.02em;position:relative;min-width:104px
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.28);flex:none}
.tag.min{background:var(--flag-min-bg);border-color:#DCB53D;color:var(--flag-min-ink)}
.tag.max{background:var(--flag-max-bg);border-color:#E39B94;color:var(--flag-max-ink)}
.tag.dead{background:var(--flag-dead-bg);border-color:#BFA079;color:var(--flag-dead-ink)}
button.tag.linkcode{cursor:pointer;color:var(--steel);border-color:#BBD8E2;background:#EFF7FA}
button.tag.linkcode:hover{background:var(--steel);border-color:var(--steel);color:#fff}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(0,0,0,.22)}
.dot.min{background:var(--flag-min-bg)}
.dot.max{background:var(--flag-max-bg)}
.dot.dead{background:var(--flag-dead-bg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line)}
.chip.ok{background:#E7F4EF;color:var(--ok);border-color:#BFE3D6}
.chip.warn{background:#FCF3E2;color:var(--warn);border-color:#EEDBB4}
.chip.dead{background:#F3EADF;color:var(--flag-dead-ink);border-color:#DCC7AB}
.chip.max{background:#FBE9E7;color:var(--flag-max-ink);border-color:#F0CBC7}

.stat{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;box-shadow:var(--shadow);flex-wrap:wrap}
.stat>div{min-width:0;flex:1 1 130px;background:#FDFEFD}
.stat>div span{color:var(--ink-3)}
.stat>div b{color:var(--ink)}
.stat div{flex:1;padding:12px 16px;border-right:1px solid var(--line-2)}
.stat div:last-child{border-right:0}
.stat b{display:block;font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--ink-3);line-height:1.4}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,32,43,.42);display:none;z-index:60;padding:24px;overflow:auto}
.scrim.on{display:block}
.modal{max-width:860px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.modal.wide{max-width:1100px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center}
.modal header h3{margin:0;font-size:15px}
.modal .body{padding:18px;max-height:calc(70vh/var(--z));overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:90;
  transition:.22s ease;pointer-events:none;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.pill-tabs{display:inline-flex;flex-wrap:wrap;gap:6px;background:none;border:0;padding:0}
.pill-tabs button{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink-2);
  box-shadow:0 1px 2px rgba(22,32,43,.05);
  transition:background .12s ease, border-color .12s ease, color .12s ease
}
.pill-tabs button:hover{border-color:var(--steel);background:var(--steel-soft)}
.pill-tabs button[aria-pressed="true"]{
  background:var(--steel-soft);border:2px solid var(--steel);
  color:var(--steel-dk);font-weight:600;padding:6px 13px}

.search{position:relative;display:flex;align-items:stretch}
.search::before{
  content:"⌕ ค้นหา";display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap;
  background:#E4F4EA;color:#15694C;border:1px solid #A9D9C1;border-right:0;
  border-radius:var(--r) 0 0 var(--r);padding:0 12px;font-size:12.5px;font-weight:600;letter-spacing:.01em
}
.search .in{border-radius:0 var(--r) var(--r) 0;border-left:0;border-color:#A9D9C1;flex:1;min-width:0}
.search .in:focus{outline:2px solid #1D7A5F;outline-offset:-1px;border-color:#1D7A5F}
@media(max-width:600px){.search::before{font-size:0;padding:0 11px}
  .search::before{content:"⌕";font-size:17px}}

/* ---------- สีตารางให้อ่านสบายตา ---------- */
table.tbl thead th{background:#EDF4F9}
table.tbl tbody tr:nth-child(even){background:#F5FAFD}
table.tbl tbody tr:hover{background:#FFF9E3}
table.tbl tbody tr:hover td{border-bottom-color:#E8D9A8}
table.tbl td.num{background:rgba(29,122,95,.035)}
/* เลขที่เอกสาร รหัส และทะเบียน ต้องไม่ตัดขึ้นบรรทัดใหม่ */
table.tbl td.mono,table.tbl td .mono{white-space:nowrap}
.doc-meta td,.fs-head .meta td{white-space:nowrap}
table.tbl tbody tr:hover td.num{background:transparent}

/* ---------- ตัวชี้ชวนให้กด ---------- */
.clickme{cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;
  border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.clickme:hover .big,.clickme:hover b{text-decoration:underline}
.clickme .go-hint{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--steel-dk);background:var(--steel-soft);border:1px solid #BFE3D6;
  border-radius:7px;padding:6px 12px;margin-top:8px;white-space:nowrap;
  transition:background .13s ease, border-color .13s ease, color .13s ease, box-shadow .13s ease}
.clickme:hover .go-hint{background:var(--steel);border-color:var(--steel);color:#fff;
  box-shadow:0 3px 9px -4px rgba(15,92,62,.55)}
.clickme:hover .big{text-decoration:none}

/* ปุ่มเปิดเอกสารใหม่ */
@keyframes tapblink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.16)}}
.btn.newdoc{background:#1D7A5F;border-color:#1D7A5F;color:#fff;font-weight:600}
.btn.newdoc:hover{background:#166149;border-color:#166149}
.btn.vatdoc{background:#1D7A5F;border-color:#1D7A5F;color:#fff;font-weight:600}
.btn.vatdoc:hover{background:#166149;border-color:#166149}
.btn.novat{background:#F6D264;border-color:#DCB53D;color:#5E4400;font-weight:600}
.btn.novat:hover{background:#EFC63F;border-color:#C9A22B}

/* ปุ่มเปิด/ปิดแสดงรายการ — ดรอปดาวน์สีเหลือง */
.btn.drop{background:#F6D264;border-color:#DCB53D;color:#5E4400;font-weight:600;
  display:inline-flex;align-items:center;gap:7px}
.btn.drop:hover{background:#EFC63F;border-color:#C9A22B}
.btn.drop .caret{font-size:10px;line-height:1;transition:transform .18s ease;display:inline-block}
details[open]>.btn.drop .caret{transform:rotate(180deg)}
details[open]>.btn.drop{background:#EFC63F;border-color:#C9A22B}
.btn.drop .cnt{background:#5E4400;color:#F6D264;border-radius:99px;font-size:11px;
  min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;
  }

/* ป้ายสถานะเอกสารถัดไปในรายการใบเสนอราคา */
/* ---------- บล็อกจัดกลุ่มในหน้าต่างกรอกข้อมูล ---------- */
.fblk{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:12px;background:#fff}
.fblk.alt{background:#F4F8FB;border-color:#D3E2EA}
.fblk>.hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 11px;padding-bottom:7px;
  border-bottom:1px solid var(--line-2)}
.fblk>.hd .n{background:var(--steel);color:#fff;border-radius:4px;min-width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.fblk>.hd .note{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0;
  font-size:12px;color:var(--ink-3)}
.card .body>.fblk:last-of-type{margin-bottom:0}
.fblk .sec-title{margin-top:12px}
.fblk .sec-title:first-child{margin-top:0}

/* ---------- การ์ดรถแต่ละคัน ---------- */
.vcard{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:10px;background:#fff}
.vcard:nth-child(even){background:#F4F8FB;border-color:#D3E2EA}
.vcard>.vh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.vcard>.vh b{font-size:13px}
.vcard>.vh .no{background:var(--steel);color:#fff;border-radius:50%;width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;
  flex:none}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 11px}
.vgrid .w2{grid-column:span 2}
@media(max-width:820px){.vgrid{grid-template-columns:repeat(2,1fr)}.vgrid .w2{grid-column:span 2}}
@media(max-width:520px){.vgrid{grid-template-columns:1fr}.vgrid .w2{grid-column:span 1}}

.todo{display:inline-flex;align-items:center;gap:5px;border:1px dashed #D9A441;background:#FDF6E6;
  color:#8A5B00;border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.todo:hover{background:#F6D264;border-style:solid;border-color:#C9A22B;color:#5E4400}
.todo .tap{animation:tapblink 1.05s ease-in-out infinite;font-size:12px}
.donechip{display:inline-flex;align-items:center;gap:5px;background:#E7F4EF;border:1px solid #BFE3D6;
  color:#1D7A5F;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap;
  }
.donechip:hover{background:#1D7A5F;border-color:#1D7A5F;color:#fff}
@media (prefers-reduced-motion:reduce){.todo .tap{animation:none}}
.btn.newdoc .tap{animation:tapblink .85s ease-in-out infinite;font-size:15px;line-height:1}
@media (prefers-reduced-motion:reduce){.btn.newdoc .tap{animation:none}}
@media (prefers-reduced-motion:reduce){.ar{transition:none}}

/* ---------- แถวหัวเรื่อง + ปุ่มสร้าง อยู่เหนือการ์ดทะเบียน ---------- */
.pagehead{display:flex;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.pagehead h2{margin:0;font-size:16.5px;font-weight:700}
/* ปุ่มสร้าง/เปิดเอกสารใหม่ และปุ่มชำระหลายใบ — ขนาดเท่าช่องค้นหา */
.card>header .btn.newdoc,#bulkPayBtn{padding:8px 18px;font-size:14px;font-weight:600}

/* ---------- รายการแนะนำชื่อลูกค้า (ใบวางบิล) — ระบบวาดเอง อ่านง่ายเต็มช่อง ---------- */
.custdrop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:#fff;
  border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 44px -12px rgba(0,0,0,.32);
  max-height:290px;overflow:auto;display:none}
.custdrop.on{display:block}
.custdrop button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 15px;border:0;background:#fff;cursor:pointer;text-align:left;
  border-bottom:1px solid var(--line-2);font-family:inherit}
.custdrop button:last-child{border-bottom:0}
.custdrop button:hover{background:#F2FAF6}
.custdrop button b{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custdrop button span{font-size:12.5px;color:var(--warn);white-space:nowrap;flex:none}

/* ---------- หน้าต่างทำเอกสาร (popup แยกจากหน้าทะเบียน) ---------- */
.docwin{position:fixed;inset:0;background:rgba(22,32,43,.5);display:none;z-index:55;overflow:auto;padding:26px 22px}
.docwin.on{display:block}
.docwin .dwin{max-width:1180px;margin:0 auto;background:var(--surface);border-radius:12px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden}
.docwin .dwhead{display:flex;align-items:center;gap:10px;padding:11px 18px;
  background:linear-gradient(180deg,#0F5C3E 0%,#0B4A32 100%);color:#fff;
  position:sticky;top:0;z-index:6}
.docwin .dwhead h3{margin:0;font-size:15px;font-weight:700;color:#fff}
.docwin .dwhead .hint{color:#BFE3D6;font-size:12px}
.docwin .dwhead #dwX{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;white-space:nowrap}
.docwin .dwhead #dwX:hover{background:rgba(255,255,255,.24)}
.docwin .dwbody{padding:16px 18px 22px}
.docwin .dwbody>.card{margin:0 0 14px}
@media print{.docwin{display:none !important}}
/* มือถือ — หน้าต่างเอกสารเต็มจอ ขอบรอบนอกกินที่ไปมากจนฟอร์มแคบเกินใช้งาน */
@media(max-width:600px){
  .docwin{padding:0}
  .docwin .dwin{border-radius:0;min-height:100vh;max-width:none}
  .docwin .dwhead{padding:10px 12px;position:sticky;top:0;z-index:2}
  .docwin .dwbody{padding:10px 10px 20px}
  .docwin .dwbody>.card{margin:0 0 10px}
}
body.dwopen #backFab{display:none !important}

/* ---------- popup ยืนยันการทำรายการ — ใช้แทน confirm ของเบราว์เซอร์ ---------- */
.confirmpop{position:fixed;inset:0;display:none;place-items:center;z-index:480;background:rgba(22,32,43,.45)}
.confirmpop.on{display:grid}
.confirmpop .inner{background:#fff;border-radius:14px;padding:26px 34px;max-width:480px;min-width:320px;
  text-align:center;box-shadow:0 24px 70px -18px rgba(0,0,0,.55);animation:savedin .18s ease;margin:20px}
.confirmpop .ic{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:#FCF3E2;
  display:grid;place-items:center;font-size:26px;color:#B4720B;font-weight:700}
.confirmpop b.ttl{font-size:17px;font-weight:700;display:block;margin-bottom:6px;line-height:1.5}
.confirmpop p{color:var(--ink-2);font-size:13.5px;line-height:1.75;margin:0 0 18px;white-space:pre-line}
.confirmpop .btns{display:flex;gap:10px;justify-content:center}
.confirmpop .btns .btn{min-width:110px;justify-content:center;padding:9px 18px}

/* ---------- ป้ายยืนยันบันทึกข้อมูลกลางจอ ---------- */
.savedpop{position:fixed;inset:0;display:none;place-items:center;z-index:500;pointer-events:none}
.savedpop.on{display:grid}
.savedpop .inner{background:rgba(20,32,27,.94);color:#fff;border-radius:14px;padding:26px 42px;
  text-align:center;box-shadow:0 24px 70px -18px rgba(0,0,0,.6);animation:savedin .18s ease}
.savedpop .ck{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;background:#1D8A5F;
  display:grid;place-items:center;font-size:28px;color:#fff}
.savedpop b{font-size:18px;font-weight:700;display:block}
.savedpop span{display:block;font-size:13px;color:#BFE3D6;margin-top:5px;max-width:420px}
@keyframes savedin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* ---------- แถบปุ่มบันทึกท้ายฟอร์ม — กรอกจบแล้วกดได้เลยไม่ต้องเลื่อนขึ้น ---------- */
.fs-bottom{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-top:20px;padding-top:16px;border-top:2px solid var(--line);
}
.fs-bottom .note-left{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-right:auto}

/* ---------- หน้านำข้อมูลเข้าระบบ (07.3) ---------- */
.impgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.imppanel{border:1.5px solid var(--navy);border-radius:10px;padding:0 16px 16px;background:#fff;position:relative}
.imppanel > .ttl{
  position:relative;top:-11px;display:inline-block;background:#fff;padding:0 9px;margin-left:-4px;
  font-family:'IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:16px;color:var(--ink);
}
.imppanel .ver{text-align:center;color:#C25A18;font-size:12.5px;margin:-4px 0 12px;font-family:'IBM Plex Mono',monospace}
.imppanel .limit{
  border-left:3px solid #E08A2B;background:#FCF6EC;border-radius:5px;padding:8px 12px;margin-bottom:12px;
}
.imppanel .limit b{color:#B4720B;font-size:12.5px;display:block}
.imppanel .limit span{font-size:12px;color:var(--ink-2)}
.improw{display:grid;gap:10px}
.impbtn{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 13px;
  font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.45;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.impbtn:hover{border-color:var(--steel);box-shadow:0 2px 10px -4px rgba(22,32,43,.25)}
.impbtn:disabled{opacity:.5;cursor:not-allowed}
.impbtn .ic{
  width:42px;height:42px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;
}
.impbtn .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.impbtn .ic.dl{background:linear-gradient(160deg,#12A17B,#0E8A68)}
.impbtn .ic.tpl{background:linear-gradient(160deg,#8E4BC9,#6C33A8)}
.impbtn .ic.up{background:linear-gradient(160deg,#C0397F,#9E2764)}
.impbtn .ic.danger{background:linear-gradient(160deg,#C0504A,#9E332D)}
.impbtn .tx b{display:block;font-weight:600}
.impbtn .tx span{display:block;font-size:12px;color:var(--ink-3)}
.impbtn .tx span.warn{color:#B3382C}

/* ---------- แถบเตือนเมื่อบันทึกข้อมูลไม่สำเร็จ ---------- */
.saveerr{
  position:fixed;left:0;right:0;top:0;z-index:600;display:none;
  background:#B3382C;color:#fff;padding:11px 18px;font-size:14px;line-height:1.6;
  box-shadow:0 4px 18px -4px rgba(0,0,0,.5);
}
.saveerr.on{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.saveerr b{font-weight:700}
.saveerr button{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;
  border-radius:8px;padding:5px 14px;cursor:pointer;font-family:inherit;font-size:13px;margin-left:auto;
}
.saveerr button:hover{background:rgba(255,255,255,.3)}
@media print{.saveerr{display:none !important}}

/* ---------- แถบเลือกผู้ใช้งานในหน้าตั้งค่า ---------- */
.usertabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.usertabs button{
  display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:#fff;
  border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);
  transition:border-color .12s ease,background .12s ease;
}
.usertabs button:hover{border-color:var(--steel)}
.usertabs button[aria-pressed="true"]{border-color:var(--navy);background:var(--steel-soft);font-weight:600}
.usertabs button .uc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);display:block;line-height:1.3}
.usertabs button .un{display:block;line-height:1.35}
.usertabs button .dot{width:8px;height:8px;border-radius:50%;flex:none}
.usertabs button .dot.on{background:var(--ok)}
.usertabs button .dot.off{background:var(--ink-3);opacity:.5}

/* ---------- เอกสารที่ยกเลิกแล้ว ---------- */
table.tbl tbody tr.voided td{background:var(--void-bg);color:var(--void-ink);
  border-bottom-color:var(--void-line)}
table.tbl tbody tr.voided:hover td{background:var(--void-bg-hi)}
/* ช่องตัวเลขมีกฎพื้นหลังของตัวเอง ต้องเขียนซ้ำให้แดงเสมอกับช่องอื่น */
table.tbl tbody tr.voided td.num{background:var(--void-bg)}
table.tbl tbody tr.voided:hover td.num{background:var(--void-bg-hi)}
table.tbl tbody tr.voided td b,table.tbl tbody tr.voided td .mono{color:var(--void-ink)}
.chip.void{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
/* ป้ายในเอกสารที่พิมพ์ยังเป็นแบบอ่อนเหมือนเดิม */
.paper .chip.void{background:#FBE9E7;border-color:#F0C0B8;color:#B3382C;font-weight:400}
.voidmark{display:inline-block;border:2px solid #B3382C;color:#B3382C;border-radius:6px;
  padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.05em;transform:rotate(-4deg)}
.paper .voidstamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);
  border:5px solid #C0392B;color:#C0392B;border-radius:12px;padding:10px 40px;
  font-size:44px;font-weight:700;letter-spacing:.1em;opacity:.28;pointer-events:none}
/* ใบที่ยังไม่ได้กดบันทึก — ประทับลายน้ำไว้กันเอาไปใช้เป็นเอกสารจริง */
.paper .draftstamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);
  border:5px solid #B4720B;color:#B4720B;border-radius:12px;padding:10px 34px;
  font-size:36px;font-weight:700;letter-spacing:.08em;opacity:.26;pointer-events:none;white-space:nowrap}
.paper{position:relative}

/* ---------- หัวตารางกดเรียงข้อมูลได้ ---------- */
.tbl thead th{cursor:pointer;user-select:none}
.tbl thead th[data-sort]::after{font-size:9px;color:var(--ink-3);margin-left:4px}
.tbl thead th[data-sort="asc"]::after{content:"▲"}
.tbl thead th[data-sort="desc"]::after{content:"▼"}

/* ---------- เอกสารสำหรับพิมพ์ (คงฟอนต์เดิม ไม่ใช้ Sarabun) ---------- */
.paper{font-family:'IBM Plex Sans Thai',system-ui,'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;font-weight:300}
.paper h1,.paper h2,.paper h3,.paper h4{font-weight:600}
.paper .mono,.paper input.mono,.paper td.num,.paper th.num{font-family:'IBM Plex Mono','IBM Plex Sans Thai',ui-monospace,monospace}
.paper{
  background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:14mm 14mm 12mm;
  border:1px solid var(--line);box-shadow:var(--shadow);color:#000;font-size:12px;line-height:1.38
}
.paper h1{font-size:17.5px;margin:0;letter-spacing:.02em}
.doc-head{display:flex;gap:14px;border-bottom:2px solid #000;padding-bottom:7px;align-items:flex-start}
.doc-head .lg{width:60px;height:60px;object-fit:contain;flex:none}
.doc-head .co{flex:1}
.doc-head .co b{font-size:15px}
.doc-head .co div{font-size:11px;line-height:1.35}
.doc-meta{text-align:right;font-size:11.5px;min-width:212px}
.doc-meta table{width:100%;font-size:11.5px}
.doc-meta td{padding:0 0 1px}
.box{border:1px solid #000;padding:5px 8px;margin-top:6px}
.box h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #999;padding-bottom:2px}
.kv{display:flex;gap:6px;font-size:11.5px;padding:0 0 1px}
.kv b{font-weight:600;color:#333;white-space:nowrap}
.kv span{border-bottom:1px dotted #999;flex:1;min-width:0}
table.doc{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
table.doc th{border:1px solid #000;padding:3px 6px;background:#EDEFF1;font-size:10.5px}
table.doc td{border:1px solid #000;padding:2px 6px}
.sign{display:flex;gap:26px;margin-top:12px}
.sign div{flex:1;text-align:center;font-size:11.5px}
.sign .line{border-bottom:1px dotted #000;height:26px;margin-bottom:4px}
.note-list{font-size:10.5px;margin:7px 0 0;padding-left:15px;line-height:1.45}
.tick{display:inline-block;width:11px;height:11px;border:1px solid #000;margin-right:5px;vertical-align:-1px;text-align:center;line-height:10px;font-size:10px}
.brandfoot{margin-top:9px;padding-top:4px;border-top:1px solid #CCC;font-size:9px;color:#666;display:flex;justify-content:space-between}
.wl{display:inline-block;border-bottom:1px dotted #666;min-width:60px;flex:1}
.paper .kv span.wl{border-bottom:1px dotted #666}
table.doc td.wr{height:19px}
#printroot{display:none}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app,.scrim,.toast{display:none !important}
  #printroot{display:block}
  .paper{width:auto;min-height:auto;border:0;box-shadow:none;margin:0;padding:12mm 12mm}
  .paper + .paper{page-break-before:always}
}

/* ===================== แท็บเล็ตแนวตั้งและจอเล็ก ===================== */
@media (max-width:1100px){
  .g5,.g6{grid-template-columns:repeat(3,1fr)}
  .stat{flex-wrap:wrap}
  .stat div{min-width:33.33%}
}

@media (max-width:900px){
  .rail{padding:9px 10px}
  .rail .brand{padding:0 10px 0 2px}
  .rail .brand img.logo{width:30px;height:30px}
  .rail .brand b{font-size:13.5px}
  .rail .brand .shop{display:none}
  .navbtn{padding:9px 12px;font-size:13.5px;min-height:40px}
  .navbtn .k{display:none}
  .licbadge b{font-size:11.5px}

  .topbar{padding:11px 14px;top:50px}
  .topbar h1{font-size:15.5px}
  .topbar .sub{display:none}
  .wrap{padding:14px}
  .card>header{padding:11px 13px}
  .card .body{padding:13px}

  .g3,.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}
  .stat div{min-width:50%}
  .ledger{grid-template-columns:1fr}
  .finbtns{flex-direction:row;width:100%}
  .finbtns button{flex:1}
  .finhead .sum{min-width:100%}

  /* ซ่อนคอลัมน์รองบนจอแคบ */
  [data-hide="md"]{display:none}
  .paper{width:auto;padding:10mm}
}

@media (max-width:600px){
  body{font-size:15px}
  .wrap{padding:11px}
  .topbar{padding:10px 12px}
  .g2,.g3,.g4,.g5,.g6{grid-template-columns:1fr}
  .stat{flex-direction:column}
  .stat div{min-width:100%;border-right:0;border-bottom:1px solid var(--line-2);
    display:flex;align-items:baseline;justify-content:space-between;padding:9px 13px}
  .stat div:last-child{border-bottom:0}
  .stat b{font-size:17px}
  .stat span{margin:0}

  /* ปุ่มและช่องกรอกขนาดนิ้วสัมผัส */
  .btn{padding:10px 15px;font-size:14px;min-height:42px}
  .btn.sm{padding:7px 11px;font-size:13px;min-height:36px}
  .in{padding:10px;font-size:15px}
  select.in{min-height:42px}
  input[type="checkbox"]{width:19px;height:19px}
  .navbtn{padding:9px 11px;font-size:13px}

  .card>header{flex-wrap:wrap;gap:8px}

  /* ---- ฟอร์มบันทึกซื้อ/ค่าใช้จ่าย ---- */

  /* ---- กรอบเมนูย่อยและปุ่มทำงาน: สองคอลัมน์กว้างเท่ากันเสมอ ---- */

  .subnav > div{grid-column:1/-1;min-width:0}

  /* ปุ่มชุดของฟอร์ม (บันทึก/พิมพ์/ปิด ฯลฯ) — สองคอลัมน์เท่ากัน */
